ось только улыбаться и знать, толькоблагодарить и знать.Разумеется, я улыбалась поэтому куда чаще, чем обычно. Бывали, конечно, времена, когда мне не хватало сил обратиться к мудрым словам – например, в тот последний день полного отчаяния. Но этот момент радикального принятия стал для меня точкой невозврата. Действительно, я больше не могла жить с грузом боли из прошлого, так что в некотором смысле была права: мою жизнь в том виде, в каком я ее знала, нужно было закончить. Но мне не пришлось умирать физически: умерла только старая я – в духовном плане. Мои прежние представления о себе не пережили яркого света моей собственной любви. Новая жизнь, которая незаметно развивалась внутри меня годами, наконец смогла родиться на свет. Когда я улыбалась и знала, мне казалось: мечты мои реальны. Они все больше становились частью меня. Вот почему возможности широко распахнули передо мной двери, когда мне удалось, наконец, осознать свою ценность. Мечты лишь ждали, пока я позволю им осуществиться. Поэтому с сердцем, полным радости, я открылась потоку жизни, и перемены к лучшему не заставили себя ждать, как в личной сфере, так и в профессиональной. Через некоторое время я получила лучший рождественский подарок в жизни: мои милые, дорогие родители предложили мне отметить Рождество веганским семейным ужином. Больше двадцати лет я даже и не мечтала о таком ужине, поэтому их слова повергли меня в счастливый шок. Веганское рождество оказалось настолько простым и естественным, что мы все согласились: это был один из наших лучших праздников. Пока мы с мамой в четыре руки резали овощи, шутя и смеясь, папа ставил нам музыку. На весь дом звучали песни кантри из 1950-х годов, а мы болтали, хохотали и готовили настоящий пир. Это был радостный и легкий день. Моя карьера продолжает развиваться, принося мне удовлетворение и наслаждение. Хотя любимую работу можно найти и по найму, мне лучше всего подходит работать на себя. В конце концов, именно к этому я всегда и стремилась: жить так, как мне хочется, в том числе в профессиональной сфере. После того, как я вступила в новый период, у меня появилась новая ясность и мотивация, но я не растеряла и полезные старые привычки, включая самодисциплину. У меня завязались новые знакомства, я то и дело ходила на встречи. Вдохновение и идеи лились из меня рекой. Вернувшись в мир, я была переполнена воодушевлением и не покладая рук создавала оригинальные возможности. Через новых знакомых я устроилась вести уроки музыки для бедных. Снова стоять перед классом и быть самой себе хозяйкой – просто замечательно, и, разумеется, преображение учеников было мне огромной наградой. Я слишком долго занималась серьезной и печальной работой, так что теперь пришло время радости. Я сочинила представление для детей до пяти лет. Смотреть, как эти восхитительные, ничем не стесненные маленькие люди танцуют и прыгают под мои новые песни, было чистым наслаждением. На меня также посыпались предложения о написании текстов, и к тому же я создала целый альбом песен для взрослых. Просто поразительно, на что мы оказываемся способны в творческом и физическом плане, когда нас ничего не сдерживает. Популярность моего блога продолжала расти, и через него все больше людей узнавали о моей работе. Я также придумала множество веселых и позитивных надписей для футболок, сумок и наклеек на машины, опираясь на цитаты из своих песен и статей. Все идеи, что приходили мне в голову, сопровождались мотивированными действиями. Сегодня мои осенние ночи согревает замечательный мужчина. Обнимая его, я улыбаюсь тому, как сильно может измениться жизнь. Он прекрасный человек. Нам обоим многое пришлось пережить и отпустить, прежде чем мы нашли друг друга, но мы идеально совпали по времени. Теперь я смотрю на жизнь совершенно по-новому. Я продолжаю помнить о жизненных циклах. Безусловно, я многое узнала о смерти через других людей. Но я кое-что узнала и о собственной смерти, увидев, как умерла прежняя я. Это была смерть духовная, смерть той части личности, что контролирова елать. Удивительно, что многим людям, так же как и мне, сложнее всего не позволить жизни течь своим чередом, а научиться получать от нее дары, поверить в то, что мы их заслуживаем. Большинство чудесных событий, которые происходили со мной, были связаны с другими людьми. Мы куда теснее сопряжены друг с другом, чем нам кажется. Мы играем в жизни друг друга куда более важную роль, чем нам известно. Учиться получать подарки совершенно необходимо, если вы действительно хотите увидеть свои мечты воплощенными в реальность. Любой человек, который по природе лучше умеет отдавать, чем брать, знает, что это громадное удовольствие. Но если вы отдаете, не позволяя себе ничего получать в ответ, вы не только нарушаете равновесие и блокируете естественное течение жизни, но и лишаете других радости вам помочь. Поэтому позволяйте людям что-то делать для вас. Только гордость и низкая самооценка мешают нам принимать помощь; каждый без исключения человек достоин этой радости. Если вы один из тех людей, которые не умеют помогать другим, то продолжайте практиковаться. Просто пробуйте отдавать, ничего не ожидая взамен. Вам понравится. Помогайте просто из удовольствия сделать что-то для других. Если вы помогаете, ожидая чего-то в ответ, или помогаете, а потом в гневе напоминаете об этом людям – это ненастоящая помощь. Ждать, что добро вернется к вам, – тоже неидеально. Отдавать другим что-то просто ради того, чтобы отдавать, будь то любовь, доброта или действия, – вот в чем истинная радость. И да, те, кто отдает что-то другим именно таким образом, получают свое вознаграждение, но не всегда сразу и не всегда так, как им представляется. Изменить мир вокруг возможно. Улучшая собственную жизнь, работая над тем, чтобы жить без сожалений, мы естественным образом улучшаем и жизнь каждого из окружающих.Устранить социальное разделение и враждебность, которые мы породили в обществе, возможно. Быть счастливыми возможно. Работать над тем, чтобы умереть без сожалений, пока мы еще живы и здоровы, – возможно. Мы все бесконечно хрупки, как шары из тонкого стекла. Представьте себе лампу накаливания, окруженную круглым плафоном (современная энергосберегающая лампочка выглядит иначе, но можно представить и ее). Итак, внутри у нас как будто хрупкий стеклянный шар, а из него исходит прекрасный свет, способный рассеять любую тьму. Приходяв этот мир, мы сияем ярко, излучая свет и счастье. Люди поражаются нашей красоте. Мы растем, и вот в нас начинает лететь грязь. Она не имеет к нам отношения, потому что принадлежит тем, кто ее швыряет, но их это не останавливает. Через какое-то время в нас начинает лететь грязь не только от родных, но и от школьных друзей, коллег, общества и просто случайных встречных. На каждого это влияет по-разному: кто-то становится жертвой, кто-то – агрессивным, кто-то надолго впитывает обиды, а другие легко забывают о них. Независимо от того, как мы воспринимаем эту грязь, она мешает нашему естественному свету и доброте сиять в полную силу. Получая удары со всех сторон, мы решаем, что наши обидчики, наверное, правы. Тогда мы присоединяемся к ним, начиная уже сами в себя швырять грязь. Почему бы и нет? Ведь не может быть, чтобы все, кто нас атакует, ошибались. К тому же, если мы замараны, то почему бы нам не замарать других? Пожалуй, так мы и поступим. Время идет, и вот наш свет совсем не просачивается наружу через грязь. Часть ее набросали на вас другие, а часть – вы сами. Затем в один прекрасный день вы вспоминаете, что у вас внутри когда-то сиял прекрасный свет. Но вы уже так давно живете в темноте, что едва помните о нем. Изредка вы ощущаете его, когда остаетесь наедине с собой. Теплое свечение никуда не делось, несмотря на окружающую его тьму. Вы понимаете, что лучше бы вновь засиять. Хотите вспомнить, кем были до того, как к вам пристала чужая грязь – или ваша собственная. Вы говорите, что с вас хватит. Вы больше не позволите никому швырять в себя грязь. Людям это не нравится, но вы настроены решительно. Потихоньку, очень осторожно вы начинаете
