 еще успеть связаться с кем-то из них, чтобы они пообщались хотя бы по телефону. К этому времени никто уже не волновался, что друзья тайно нальют Элизабет выпить – об этом все забыли и думать. Теперь имел значение только ее комфорт, и поскольку отношения в семье наладились и потеплели, родные с радостью ухватились за эту идею. Пару дней спустя я как раз удобно усадила Элизабет в кровати и налила ей чашечку чаю, когда в комнату вошли две красивые и здоровые женщины. Одна из них теперь жила в горах за городом, примерно в часе езды. Вторая прилетела в Мельбурн из Квинсленда, как только узнала о происходящем. Они сели у кровати Элизабет, и все трое долго разговаривали, держась за руки и улыбаясь. Я оставила их наедине друг с другом и вышла из комнаты, незаметно смахивая слезы радости. Я еще успела услышать, как Элизабет попросила у них прощения и они немедленно заверили ее, что давно ее простили. Все это было в прошлом и не имело никакого значения, сказали они. Вместе с мужем Элизабет, Роджером, мы сидели на кухне, оба в слезах, но довольные. Подруги пробыли в гостях пару часов, и под конец Элизабет была одновременно вне себя от радости и совершенно без сил. Как только они уехали, она крепко уснула, и мне не удалось поговорить с ней перед уходом домой. Когда я вернулась в дом после выходных, она была очень слаба, но хотела обсудить произошедшее. – Разве это было не чудесно? Какая радость вновь их увидеть, – восторженно улыбнулась она. Уже не в силах поднять голову с подушки, она смотрела на меня, сидевшую рядом. – Это было замечательно, – сказала я ей. – Никогда не теряй связи с друзьями, которых больше всего ценишь, Бронни. Люди, которые принимают тебя такой, какая ты есть, которые очень хорошо тебя знают, в концежизни ценятся больше всего на свете. Послушай женщину, которая знает, о чем говорит, – мягко настаивала она, улыбаясь мне, несмотря на недомогание. – Не давай жизни вас разлучить. Всегда знай, где их найти, и всегда говори им, как ты им благодарна. И не бойся быть слабой и уязвимой. Я столько времени потеряла, не в силах признаться им, что я совершенная развалина. Элизабет простила себя и смогла перестать себя осуждать. Она обрела покой и своих друзей. В ее последнее утро я увлажнила ей губы – у нее прекратилось слюноотделение, и она не могла говорить, хотя к этому времени у нее и не осталось на это сил. Когда я закончила, она посмотрела на меня с улыбкой, а затем одними губами произнесла «спасибо». Я улыбнулась, благодаря ее в ответ. Затем я поцеловала ее в лоб и ненадолго взяла ее руку в свои – она чуть сжала мою ладонь. Комната Элизабет была полна близких ей людей. Здесь были все ее родные, а также те самые подруги, с которыми я познакомилась двумя днями раньше. Элизабет вовремя впустила любовь обратно в свою жизнь и вспомнила о ценности родных и настоящих друзей. Она оставила этот мир, окруженная любовью, зная, что ее жизнь была для кого-то важна и что она успела сказать друзьям о своей любви. Позволь себе Исходя из особенностей работы, ухаживать за Гарри было одним удовольствием. Во-первых, сам он был чрезвычайно приятным человеком, а во‑вторых, его родные старались как можно больше делать для него сами. Трое из пяти дочерей Гарри жили совсем рядом и почти каждый день приносили ему обед, а один из сыновей сам мыл и переодевал его. Я даже уточнила, действительно ли им нужны мои услуги, но все дети Гарри в один голос сказали, что я им необходима. В уже чистом и опрятном доме, где единственный обитатель не встает с кровати, довольно мало домашней работы, я и проводила основную часть времени за чтением или письмом. Впрочем, мне все же удалось сварить на кухне Гарри несколько вкусных овощных супов. У Гарри были кустистые брови, волосатые уши, красное лицо и гулкий смех. Мы сразу друг другу понравились. В первую же минуту после знакомства мы успели обменяться парой шуток, так что наши отношения с самого начала были легкими и естественными. Совсем иначе обстояло дело с его сыном Брайаном. Это был очень нервозный человек. Много лет назад отец и сын поссорились, и, хотя отношения между ними сохранились, прежнюю близость было уже не вернуть. Остальные дети считали, что в ссоре был виноват Брайан. Я не видела конфликта и ничего не могла об этом сказать, да и не думала об этом. Но было очевидно, что теперь Брайан пытается наверстать упущенное время, взяв на себя все заботы об отце. Брайан вмешивался в любую мою попытку помочь Гарри. К этому времени я уже наловчилась интуитивно находить самое удобное положение для лежащего в кровати пациента – об этом говорили многие, за кем я ухаживала. Но родственники часто перекладывали подушки из самых добрых побуждений, не понимая, что тело больного особенно чувствительно и любая перемена положения лишает его остатков комфорта. Когда Брайан неохотно уходил на работу, всего на несколько часов в день, первым делом я вновь устраивала Гарри поудобней. Если в течение дня у меня появлялась возможность немного поухаживать за ним без того, чтобы Брайан маячил у меня за спиной, Гарри обязательно просил меня по-быстрому переложить подушки. Впрочем, каждый день нам с Гарри выпадало несколько тихих часов перед тем, как вся семья собиралась вместе на ужин. Это было чудесное время, и Гарри ласково называл его «часы затишья». Я ухаживала за ним, мы болтали и смеялись, а потом обычно пили чай и снова болтали. Жена Гарри умерла двадцать лет назад, но он не потерял вкуса к жизни. Он любил свою работу, однако с выходом на пенсию стал еще активней, вступив в пару спортивных клубов и клубов по интересам. До начала смертельной болезни Гарри обладал отменным здоровьем. «Я отдавал должное прекрасному здоровью, которое досталось мне от природы, – говорил мне Гарри, – оставаясь активным и считая, что количество прожитых лет не должно указывать мне, как себя вести. Слишком многие люди добровольно становятся стариками раньше времени». Хотя Гарри умирал, я действительно никогда еще не видела такого крепкого восьмидесятилетнего человека. Болезнь понемногу брала свое, но его хорошая физическая форма по-прежнему была заметна: например, массируя ему ноги, я видела крепкие мускулы. «Когда выходишь на пенсию, а твои дети заняты собственными детьми, друзья становятся особенно важны, – рассказывал Гарри. – Поэтому, когда умерла моя жена, упокойГосподь ее душу, я записался в клуб спортивной гребли. А потом еще в клуб спортивной ходьбы. Не понимаю, как мне раньше вообще хватало времени на работу!» Гарри был убежден, что бабушки и дедушки должны принимать активное участие в жизни внуков и проводить с ними много времени. Внуки навещали его каждый день, и было заметно, что их связывает искренняя любовь. «Семья, конечно, важнее всего, но человеку нужны друзья его возраста. Если бы не друзья, которых я завел в клубах, я был бы очень одиноким стариком. Я не был бы одинок,потому что у меня есть дети и внуки, но я скучал бы по общению с близкими мне по духу ровесниками». Так мы болтали в его комнате, пока солнце не начинало клониться к горизонту, предупреждая, что часы затишья подходят к концу. Вот-вот прибудут родные, но мы до последнего момента продолжали болтать. Гарри говорил, что не понимает, почему многие люди осознают важность дружбы только в последний момент. Хотя он радовался, когда пожилым людям удавалось сохранять любовь и уважение своей семьи, его раздражало, если это происходило в ущерб дружбе. «Когда они это поймут, будет уже поздно, – настаивал он. – И ведь это касается не только моего поколения. Я смотрю на молодежь, и они так заняты, что совершенно не могут найти времени на себя, на то, что делает счастливыми их лично. Они полностью теряют себя. Нужно обязательно проводить время с друзьями, чтобы помнить, кто ты такой, когда ты не мама, не папа, не дедушка и не бабушка. Понимаешь, о чем я?» Я соглашалась: действительно, такое часто бывает, и люди, которые находят немного времени на себя самих, выглядят гораздо счастливей. С ними также куда приятней общаться. «Вот именно! – Гарри хлопнул ладонью по одеялу в знак согласия. – Хорошие друзья нас стимулируют. Красота дружбы в том, что друзья принимают нас такими, какие мы есть, и ценят то, что нас объединяет. Суть дружбы в том, что люди принимают друг друга со всеми недостатками и не пытаются переделать, как это делают муж, жена или другие родственники. Друзей надо обязательно сохранять, моя дорогая девочка». Судя по потоку посетителей, слова у Гарри не расходились с делами. Все его друзья были энергичными и веселыми людьми, и их визиты неизменно проходили в радостной обстановке. Они также уважали его состояние и понимали, что иногда он отдыхает и его нельзя беспокоить. Однажды Гарри спросил меня, как у меня самой обстоят дела с дружбой. Я рассказала ему про своих самых близких друзей и объяснила, что в последнее время понимание дружбы в моей жизни меняется, как меняюсь и я сама. «Что же, это совершенно естественно, – сказал он. – Друзья появляются и исчезают в течение всей жизни. Поэтому мы должны ценить их, пока они рядом. Бывает, что просто закончился тот жизненный урок, который вы должны были пройти вместе, и вам больше нечем поделиться друг с другом. Но кто-то остается рядом навсегда, и когда стоишьв самом конце пути, ваше совместное прошлое и ваше взаимопонимание бесконечно утешают». Мы оба соглашались, что у женщин и мужчин разный подход к дружбе. Женщины ценят эмоциональную сторону дружбы, то есть наши отношения крепнут, когда мы разговариваем о своих переживаниях. Мужчинам тоже нужны друзья для разговоров, говорил Гарри. Но лучше всего им удается общаться за каким-то совместным занятием, таким как игра в теннис, прогулка на велосипеде или еще что-то активное. Мужчины любят таких друзей, с которыми они могут вместе что-то придумывать, решать проблемы, как физические,так и эмоциональные. Нередко это происходит, когда они что-то вместе делают. – Например, строят ограду вокруг пастбища, – предложила я. Гарри расхохотался: – Ну и ну. Можно вывезти девушку из деревни, но нельзя вывести деревню из девушки. Да, пример очень сельский, Бронни, но в точку. Вместе строить забор или еще что-то делать руками, это очень сплачивает мужчин. Хохоча, он добавил, что, если мне когда-нибудь понадобится наладить отношения с симпатичным мужчиной, достаточно помочь ему построить забор. Я пообещала иметь это в виду. Гарри рассказывал мне свои любимые истории о дружбе, подчеркивая, какое это счастье – настоящие друзья. От гостей не было отбою: друзья даже завели график посещений, чтобы все желающие могли повидать Гарри, не утомляя его слишком сильно. Благодаря часам затишья у нас в жизни возникла новая дружба: дружба друг с другом. Гарри пожаловался мне, как ему обидно, что я полдня провожу в другой комнате, вместо того чтобы общаться с ним. Я рассмеялась, соглашаясь. Но мы оба понимали, что Брайан пытается загладить свою вину перед отцом. Гарри не хотел, чтобы после его смерти Брайан остался с чувством вины, хотя и не был уверен, что этого удастся избежать. Поэтому он с радостью подыгрывал сыну, позволяя ему выполнять свой долг в эти последние недели. «Хотя он и не умеет нормально поправлять подушки», – вздыхал он. Гарри относился к своей болезни и грядущей смерти философски. Он прожил насыщенную жизнь и готов был увидеть, что ждет его на той стороне. Хотя иногда мы говорили о его приближающейся смерти, чаще всего Гарри сводил наши беседы к теме дружбы: к ее ценности, к воспоминаниям. Он также хотел слышать мои любимые истории о дружбе. «Расскажи что-нибудь про детство. Хочу узнать о тебе побольше», – попросил он и тут же расхохотался, потому что мой рассказ начался в деревне, в поле пшеницы. Когда мне было двенадцать лет, мы переехали с фермы, где выращивали рогатый скот и люцерну, на ферму, где выращивали овец и пшеницу. Она располагалась за километры от ближайшего городка, под огромным синим небом. Примерно через год после переезда внезапно исчезла моя первая собака. Мы подозревали, что ее укусила змея, потому чтонам так и не удалось ее найти – впрочем, на громадной ферме это было неудивительно. Я была совершенно убита. Несколько месяцев спустя родители купили мне новую собаку: маленькую беленькую болонку, которая наотрез отказалась быть комнатной собачкой и целыми днями гонялась по полям и лугам за рабочими собаками – овчарками, бордер-колли и келпи. Мою лучшую школьную подругу звали Фиона. Она жила в городе, но много времени проводила у нас на ферме. Я тоже бывала у нее в гостях, особенно когда мы немного подросли и заинтересовались мальчиками. Среди прочего нас с Фионой объединяла любовь к пешим прогулкам. Страшно представить, сколько километров мы прошли вместе за десятилетия нашей дружбы: по пляжам, джунглям, городским улицам, чужим странам и лесным дорожкам. Но началось все с прогулок по полям пшеницы. Нас всегда сопровождали моя болонка и еще пара пастушьих собак, а иногда с нами увязывалась и кошка, или даже две. Мы с Фионой шли по дорожке, а собаки носились прямопо полю. Пока пшеница была молодой и невысокой, в этом не было ничего особенного, но, когда она подрастала, маленькая собачка начинала в ней теряться, и мы с Фионой ежедневно наблюдали уморительную сцену. Впереди бежали большие собаки, а позади них колыхалась пшеница: это бежала моя болонка, невидимая в высоких колосьях. То и дело колыхание прекращалось, и над зеленью возникала ее белая головка. Она крутилась, как перископ подводной лодки, пока не находила взглядом других собак, а затем вновь скрывалась в колосьях, прокладывая себе новую дорожку в пшенице. Вскоре движение вновь останавливалось, над колосьями возникала белая головка, находила цель, исчезала и продвигалась дальше. Это продолжалось бесконечно, и под конец прогулки каждый раз, как над пшеницей возникала белая собачья голова, мы с Фионой начинали покатываться от смеха. Мы так хохотали, что у нас ломило щеки и по щекам катились слезы, мы хватались друг за друга, чтобы не упасть, и тут собака вновь выпрыгивала из колосьев, и мы опять складывались пополамот смеха. В конце прогулки мы едва держались на ногах. Поделившись с Гарри этим простым, но дорогим моему сердцу воспоминанием, я тут же заскучала по Фионе, по нашему невинному детству и беззаботному смеху. «А сейчас она где?» – спросил Гарри. Я объяснила, что она переехала в другую страну и мы перестали поддерживать отношения. Жизнь не стояла на месте, и у меня появились новые близкие друзья. На наши отношения с Фионой повлияли и другие факторы, другие люди, но прежде всего дело было в разнице во вкусах и образе жизни. Гарри согласился, что прошлое не вернуть, но возможно, жизнь вновь сведет нас вместе. Я уже повидала достаточно жизненных циклов, чтобы согласиться с ним. Но это было неважно. Я дорожила нашими совместными воспоминаниями и желала Фионе всего самого лучшего. Про себя я поблагодарила ее за прожитые вместе уроки и нашу прежнюю дружбу. Многие из моих лучших воспоминаний были связаны с прогулками, во время которых мы с друзьями болтали и смеялись. В следующие пару недель я рассказала Гарри еще несколько историй про других своих друзей. Он тоже обожал ходить пешком и поведал мне несколько собственных историй: где он гулял с друзьями и какие переживал дорожныеприключения. Я без труда представляла себе, как смех Гарри украшает любую компанию во время прогулки. Он согласился, что на прогулке ему с друзьями всегда находилось над чем посмеяться. Вообще говоря, на следующей неделе мне предстояло на время оставить Гарри, чтобы отправиться в пеший поход. Я не была уверена, что он еще будет жив к моему возвращению. Так что я одновременно с нетерпением ждала возможности вырваться из города и грустила, что покидаю Гарри, возможно, навсегда. Но когда я рассказала Гарри про свои планы, он с энтузиазмом меня поддержал и сказал, что мысленно будет со мной, живой или мертвый. Этот поход проходил далеко в глуши каждый год, и маршрут его постоянно менялся, но неизменно заканчивался у местного озера. В этом году маршрут начинался на ферме усамого устья реки. Нам предстояло шесть дней идти по берегу этой реки, которая во многих местах полностью пересохла, и постепенно добраться до озера. Идея похода была в том, что, идя по тропам, проложенным древними цивилизациями, мы исцеляемся при помощи силы земли. В прежние времена реки были чем-то вроде шоссе или как минимум улиц, по которым бродили древние племена, кочуя с места на место. Нас благословил в путь старейшина-абориген, мы все приняли участие в очистительной курительной церемонии, а затем выдвинулись в дорогу. Нас было около дюжины человек, и все шли в своем темпе. Кто-то шагал в группе, непрерывно болтая по пути. Кто-то постоянно останавливался и все фотографировал, а кто-то шел сам по себе. Вечером подъезжали волонтеры на грузовичке, привозили наше снаряжение, и мы разбивали лагерь. Затем у мирного костра мы готовили общий ужин, и поднебом, полным звезд, завязывались чудесные новые дружбы. С каждым шагом моя связь с Землей становилась все сильнее. Хотя во время привалов я с удовольствием общалась с попутчиками, идти мне больше нравилось одной, к тому же за мной все равно никто не поспевал. Я так привыкла много ходить пешком, что невольно отрывалась от остальных. Впереди меня всегда шел только один человек: женщина, когда-то организовавшая эти походы. Время наедине с собой, когда я просто шла и шла по тропинке, дало мне возможность начистоту пообщаться с собой. Я поняла, что больше не хочу присматривать за чужими домами. Какая-то часть меня вновь начала задумываться о собственной кухне. Бесконечные переезды, которые раньше мне так нравились, теперь меня утомляли. Во мне прорастало что-то новое: тихое внутренне принятие того, что что-то меняется. Я мирно продолжала идти вперед. В современном мире редко удается забраться так далеко в глушь, потому что вся земля кому-то принадлежит. К счастью, маршрут был согласован с владельцами заранее, так что мы беспрепятственно переходили с одного участка на другой. В безумной гонке дней так легко забыть о земле у нас под ногами. Конечно, большинство из нас способны ощутить связь с планетой, остановившись и впитывая красоту природы. Но шестидневная прогулка без помех и отвлечений подарила мне такую сильную связь с землей, какой я даже себе не представляла, несмотря на все время, проведенное с природой наедине. По пути мы останавливались посмотреть на деревья, на которых оставили резьбу древние люди, и восхищались этими гигантскими многовековыми эвкалиптами. Их стволы были покрыты сложными узорами, а местами на них остались углубления там, где из коры когда-то были вырезаны каноэ. Эти следы племен, которые давно перестали существовать, одновременно трогали и вдохновляли. В некоторых местах ощущалась особенно сильная энергия, и я поняла, почему эта тропа считалась целительной. Помимо прочего, местность, по которой мы шли, напоминала мне детство. Даже запах овечьих какашек вызывал во мне бурю воспоминаний, и так приятно было вновь оказаться в сухом пыльном климате, хотя бы ненадолго. С каждым шагом чувствуя себя крепче и подтянутей, я начала мечтать о мире, где люди передвигаются преимущественно пешком. Это казалось мне куда осмысленней, чем спешка и шум современной жизни. Однажды я отбилась от группы и вышла к маленькому озеру. Я разделась и искупалась в его прозрачной освежающей воде, которая очистила не только мое тело, но и дух. Каждая секунда этой недели была настоящим подарком. Каждый день мы шли примерно с восьми утра до пяти вечера, и пейзаж вокруг постоянно менялся. То тут, то там попадались следы прежней жизни: старая повозка, когда-то утонувшая в реке, теперь стояла на суше – вероятно, уже больше ста лет. Каменный домик без крыши говорил о том, что раньше у реки кто-то жил. Но лучшим, что нам встретилось, была резьба по деревьям, уникальный урок истории, наглядно подтвердивший существование тех древних людей, чьей тропой мы следовали. Спустя шесть дней и восемьдесят пройденных километров мы вышли к озеру, усталые, но счастливые. Я с грустью простилась со спутниками, но с еще большей грустью с самим походом. На следующий день я прогуляла еще пять часов вокруг высохшего озера, потому что просто не могла остановиться. Через несколько дней у озера проходил маленький музыкальный фестиваль, и я задержалась, чтобы послушать музыку, и только потом отправилась назад в Мельбурн. К счастью, Гарри был еще жив, и мне удалось провести с ним немного времени. За те десять дней, что меня не было, он сильно ослаб и выглядел совсем изможденным. Мускулистые ноги обмякли, крупное круглое лицо осунулась, кожа обвисла. Но это все еще был прежний Гарри, прекрасный и восхитительный. Брайан теперь ухаживал за отцом с каким-то остервенением. Он старался контролировать все происходящее, и не покидал дом больше чем на час. Я была благодарна за те часы затишья, которые мы с Гарри провели вместе до моего отъезда, потому что теперь они канули в прошлое. Во-первых, над нами все время нависал Брайан, а во‑вторых, Гарри гораздо больше спал. Впрочем, жизнь сложилась так, что однажды утром Брайану внезапно пришлось уехать, и он неохотно передал мне бразды правления. К счастью, у Гарри как раз выдался хороший день. Конечно, хорошим его можно было назвать с большой натяжкой, но во всяком случае, Гарри не спал и мог немного поговорить со мной. По его требованию я подробно рассказала ему о походе. Он расспросил и про моих спутников, и про то, заметили ли мы в себе какие-то положительные изменения. «А что ты делаешь на этой неделе, Бронни? – спросил он слабеющим голосом. – Сколько времени ты выделишь на общение с друзьями? Это все, что я хочу знать». Я рассмеялась его упорству и пообещала, что непременно встречусь с друзьями, а сейчас хочу провести время с ним, который мне тоже друг. «Этого недостаточно, моя дорогая девочка. Ты, наверное, уже поняла, что должна находить время и на себя саму. Найди равновесие и регулярно проводи время с друзьями. Делай это для себя, а не для них. Мы нуждаемся в друзьях», – Гарри смотрел на меня строго, как будто предостерегая, но мы оба знали, что за его словами стоит любовь и забота. Он был прав. Мне нужно было регулярно находить время на встречи с друзьями, а не работать по двенадцать часов и надеяться все успеть когда-нибудь потом. Хотя я оченьлюбила свою работу и иногда от души смеялась с пациентами и их родными, мир, в котором я жила, был довольно печальным. Чтобы постоянно быть рядом с умирающими людьмии их убитыми горем семьями, нужно было регулярно восстанавливать силы за легким и приятным общением с друзьями. В моей жизни не хватало радости, и только сейчас я смогла признаться себе в этом. – Вы правы, Гарри, – согласилась я. Он улыбнулся и протянул ко мне руки. Я наклонилась к нему, и мы обнялись. – Дело не только в том, чтобы не растерять друзей, милая девочка. Нужно еще и наслаждаться их обществом, как прекрасным даром. Ты же понимаешь это? – спросил он. Кивнув, я ответила: – Да, Гарри. Я понимаю. Вскоре он уснул, а я осталась размышлять о его метких словах. Гарри умер тихо и незаметно, во сне, несколько дней спустя. Одна из дочерей позвонила, чтобы рассказать мне об этом и поблагодарить. Я искренне ответила, что Гарри дал мне очень многое и я была счастлива нашему знакомству. «Позволь себе роскошь проводить время с друзьями», – его слова до сих пор стоят у меня в ушах. Слова этого чудесного человека с мохнатыми бровями, красным лицом и широкой улыбкой живы по сей день. Пятое сожаление Жаль, что я не позволяла себе быть счастливей Розмари занимала высокую должность в огромной международной корпорации. Для того времени это было неслыханно: она взлетела по карьерной лестнице задолго до того, как женщины стали занимать руководящие посты. К сожалению, до этого Розмари жила по законам общества, принятым в ее время, и вышла замуж очень рано. Брак оказался неудачным, и ей часто приходилось терпеть брань, оскорбления и побои. Когда однажды муж избил ее до полусмерти, она поняла, что пора спасаться. Хотя избиения были уважительным поводом расторгнуть брак, развод в те дни считался чем-то скандальным. Чтобы уберечь репутацию семьи в родном городе, где их все знали, Розмари уехала оттуда и начала все сначала. Жизнь ожесточила ее сердце и образ мыслей. Благодаря своему успеху в мире мужчин она обрела уверенность в себе и уважение семьи. Строить новую семью ей даже в голову не приходило. Вместо этого Розмари принялась со свирепой решимостью строить карьеру. Благодаря острому уму и невероятному трудолюбию она стала первой женщиной в своем штате, занявшей столь высокую должность. Розмари всю жизнь раздавала другим приказания и получала удовольствие от своей власти и жесткой манеры поведения. Теперь она в этой же манере обращалась с сиделками. Розмари меняла их одну за другой, вечно недовольная, пока не появилась я. Я ей понравилась, потому что когда-то работала в банке, а это в ее глазах гарантировало, что я не дура. Мне, безусловно, этот ход мыслей был не близок, но я решила, что Розмари может думать обо мне все, что ей угодно, – в конце концов, ей было далеко за восемьдесят и она была смертельно больна. И вот Розмари решила, что хочет сделать меня своей основной сиделкой. По утрам с ней бывало особенно тяжело, она ко всему придиралась и постоянно меня шпыняла. Сначала я терпела, но знала, что рано или поздно этому поведению придется положить конец. В один прекрасный день, когда у Розмари было особенно противное настроение и она осыпала меня колкостями, я выставила ей ультиматум: или она станет комне добрей, или я увольняюсь. В ответ она закричала, чтобы я убиралась прочь из ее дома, добавив еще несколько нелестных эпитетов – все это сидя на краешке кровати. Пока она кричала, я подошла к ней и тоже села на кровать. – Давай, убирайся! Проваливай! – вопила она, указывая мне на дверь. Я просто сидела рядом и смотрела на нее, мысленно посылая ей свою любовь, дожидаясь, пока она успокоится. Наконец, наступила тишина. Мы обе еще немного посидели в молчании. – Это все? – спросила я с ласковой улыбкой. – Пока что все, – фыркнула она. Я кивнула, ничего не говоря. Тишина продолжалась. Наконец я просто обняла ее, чмокнула в щеку и отправилась на кухню. Когда через несколько минут я вернулась с чайником чая, Розмари все еще сидела на кровати, как потерянный ребенок. Я помогла ей встать, и мы вместе перебрались на диван. Чайник стоял рядом на маленьком столике. Розмари смотрела на меня снизу вверх с улыбкой, пока я укрывала ей ноги пледом и устраивалась рядом. – Мне страшно и одиноко. Пожалуйста, не бросай меня, – сказала она. – С тобой мне кажется, что я в безопасности. – Я никуда не денусь. Все хорошо. Обращайтесь со мной с уважением, и я буду рядом, – честно ответила я. Розмари улыбнулась, как маленькая девочка, которой нужны любовь и ласка. – Тогда, пожалуйста, останься. Я хочу, чтобы ты осталась. Кивнув, я снова поцеловала ее в щеку, и она просияла. После этого эпизода наши отношения резко улучшились. Розмари рассказывала мне о себе, о том, как она всегда отталкивала от себя людей, и я понемногу начала лучше понимать ее. Этот шаблон поведения был хорошо знаком мне самой, и, поскольку я по себе знала, как полезно от него избавиться, я предложила Розмари попытаться впустить людей в свою жизнь. Она сказала, что не знает, как это сделать, но хочет попробовать стать более приятным человеком. Болезнь развивалась постепенно, но каждый день я замечала ее новые признаки, особенно растущую слабость. Вначале изменения шли медленно, и, хотя я отчетливо их видела, Розмари иногда делала вид, что ничего не происходит. Она в подробностях планировала, как я приведу в порядок ее бумаги и инвестиционные портфели. Я слушала, зная, что до этого не дойдет. Розмари объясняла: когда у нее появятся силы, она вместе со мной сядет и займется делами. Я уже видела подобное с другими пациентами – иногда люди продолжают планировать будущее, хотя их силы с каждым днем убывают. Она также требовала, чтобы я назначала для нее встречи по всему городу, причем заставляла меня звонить с телефона в ее спальне, чтобы слушать разговор и постоянно внего вмешиваться. Потом мне приходилось каждую встречу переносить, но ни в коем случае не отменять. Безусловно, Розмари очень любила контролировать происходящее. Одни ее необязательные поручения я охотно выполняла, а другие нет: например, я отказывалась тратить время и силы, разыскивая вещи, в поисках которых мы уже обыскали весь дом. Каждый день стена, которую Розмари возвела вокруг себя, понемногу разрушалась, а наша близость росла. Ее родные жили далеко, хотя регулярно ей звонили. Довольно часто заходили в гости друзья и бывшие партнеры по бизнесу. Но в основном мы были с ней вдвоем в ее тихом доме с прекрасным садом. Однажды, глядя из своего кресла на колесиках, как я складываю постельное белье, Розмари велела мне перестать напевать. «Меня бесит, что ты постоянно такая счастливая и непрерывно что-то напеваешь», – объявила она капризно. Я закончила с бельем, закрыла дверь шкафа, повернулась и с любопытством уставилась на нее. «Что? Все так и есть. Ты всегда что-то напеваешь, и ты вечно такая счастливая! Хоть бы раз ты пришла ко мне грустная». Это высказывание было так характерно для Розмари, что я ничуть не удивилась. Я вовсе не всегда была счастлива, но, когда приходила в хорошем настроении, Розмари воспринимала это как повод для жалоб. Ничего не отвечая, я посмотрела на нее, сделала пируэт, показала ей язык и, смеясь, вышла из комнаты. Ей это понравилось, и, когда я вскоре вернулась, у нее на губах играла озорная улыбка. Больше она никогда не ругалась на мое хорошее настроение. – Почему ты счастлива? – спросила Розмари как-то утром вскоре после этого. – Не сегодня, а вообще. От чего ты чувствуешь себя счастливой? Я улыбнулась этому вопросу. Немало пришлось мне поработать над собой, чтобы кому-то пришло в голову спросить меня об этом. Вопрос был довольно актуальным с учетом событий, происходивших в моей собственной жизни. – Потому что я приняла решение быть счастливой, Розмари, и стараюсь помнить об этом каждый день. У меня не всегда получается. Моя жизнь совсем не похожа на вашу, но она тоже была непростой. Я пытаюсь не думать слишком много о том, что пошло не так и как мне довелось тяжело, а находить радости или уроки в каждом дне и ценить настоящий момент – насколько это возможно, – сказала я честно. – Мы свободны выбирать, на что обращать внимание. Я стараюсь обращать внимание на положительные моменты, такие как мое знакомство с вами, любимая работа, тот факт, что мне не нужно больше ничего продавать, да и просто то, что я жива. Не сводя с меня глаз, Розмари улыбалась, впитывая каждое слово. Она не знала, что совсем недавно у меня возникли собственные проблемы со здоровьем. Некоторое время назад я перенесла небольшую операцию. Когда мне позвонили рассказать о результатах, врач сказал, что они неоднозначные и мне срочно нужна новая операция, уже более серьезная. Я сказала, что подумаю. «Тут не о чем думать, – заявил он решительно, – если вы не сделаете эту операцию, то можете умереть в течение года». Я повторила, что подумаю. Мое тело уже преподнесло мне немало уроков, что неудивительно, ведь именно в теле хранится наше прошлое. Вся наша боль и радость так или иначе проявляется на уровне организма. Мне уже случалось избавляться от недомоганий, исцеляя разные болезненные эмоции, и я решила попробовать применить свой метод и к этой болезни. Мне было так страшно, что я никому не рассказывала о своей болезни, за исключением одного-двух человек. Я знала, что мне понадобится вся сила, чтобы пережить это испытание и не терять из виду свою главную цель: здоровье. Поэтому я не хотела отвлекаться на чужие мнения или страхи, даже высказанные из любви ко мне. В моем путешествии к исцелению не было места для чужих страхов. Теперь мне стало особенно важно выражать свои эмоции, высвобождать очень глубинные чувства и воспоминания, и какое-то время я пребывала в очень неприятном состоянии. Из глубин моего подсознания поднималось множество тяжелых воспоминаний. В какой-то момент процесс сделался настолько тяжелым и эмоционально болезненным, что меня начала даже привлекать мысль о смерти, и я попросила болезнь забрать меня. Когда мне пришлось всерьез задуматься о своей жизни и принять то, что, несмотря на все усилия, я действительно могу умереть, не дожив до старости, я внезапно ощутила поразительный покой. Я поняла, что уже прожила замечательную жизнь, отважно следуя тем путем, каким вели меня мое сердце и призвание. Так что я смело посмотрела в лицо смерти и заранее приняла любой исход событий. Вместе с этим принятием ко мне пришло восхитительное чувство умиротворения. Продолжая медитировать как обычно, я читала книги про самоисцеление и техники визуализации, а также высвобождала все эмоции, которые стремились наружу. Потихоньку во мне начали происходить перемены. Мне стало казаться, что худшее осталось позади, и я нахожусь на пути к исцелению. Мне как раз предложили присмотреть за чудесным маленьким коттеджем, заросшим вьющимися растениями и скрытым за высоким забором. Он стоял в довольно оживленном районе, но был почти невидим и ужасно мне понравился. Кроме того, я обожаю принимать ванну, а в этом доме ванна была просто громадная. Оказавшись в такой благоприятной обстановке, я решила посидеть на соковой диете, как уже делала много раз, и пару дней провести в молчании и медитации. Мой организм всегда был прекрасным индикатором эмоций. Если у меня возникало какое-то недомогание, я легко могла отследить, какие мысли или переживания в предыдущие дни и недели его вызвали. В результате этого у меня установился очень чистый и честный канал общения со своим телом, я всегда прислушивалась к тому, что оно мне говорит, и старалась исправить ситуацию. Нередко пациенты и друзья признавались мне, что заметили недомогание задолго до того, как начали лечение. Но я много раз видела, как падает уровень жизни, если нас покидает здоровье, и научилась чутко прислушиваться к любым сигналам своего тела и быстро принимать адекватные меры. Здоровье дает нам фантастическую свободу, которую очень легко потерять навсегда. Одна из медитаций, которую я попробовала в этом коттедже, была основана на технике из недавно купленной мной книги. В этой книге говорилось об исцелении на клеточном уровне: о мудрости наших клеток и о том, как они работают сообща. Автор предлагал инструкции, как попросить свои клетки избавить организм от болезни. Однажды утром я села на свою подушку для медитации и погрузилась в глубокий покой. Следуя предложенным визуализациям и запросам, я попросила свои клетки избавить меня от остатков болезни. В следующую секунду я уже мчалась в уборную, где меня долго и мучительно рвало. Рвота шла из самой глубины организма и продолжалась так долго, что мне стало казаться, будто у меня внутри не осталось совсем ничего. Я сидела на полу, прислонившись к ванне, полностью вымотанная, и ждала, не вернется ли приступ. Он вернулся, и не раз. Наконец, рвота закончилась. Я встала, держась за ванну, потому что сил у меня совершенно не осталось, а живот ныл от спазмов. Добравшись до комнаты, я легла на ковер, натянула на себя одеяло, свернулась калачиком и проспала шесть часов подряд. Разбудил меня вечерний холодок. Через окно светили последние лучи солнца. Я лежала под одеялом, любуясь вечерним светом, и чувствовала, что у меня началась новая жизнь. Произнеся благодарственную молитву за то, что мне удалось достичь исцеления, я улыбнулась сама себе. Слабость еще не оставила меня, но, постепенно приходя в себя, я ощутила волну эйфории. Пока я готовила себе легкий ужин, лицо у меня ломило от счастья. Все кончилось. Мое тело выздоровело, и с тех пор болезнь больше не возвращалась. Я бесконечно уважаю право каждого человека выбирать свой собственный метод исцеления, будь то хирургическое вмешательство, западные лекарства, восточная медицина, гомеопатия, остеопатия или траволечение. Я выбрала для себя подходящий метод. Мне пришлось приложить невероятные усилия, чтобы пережить это время, но я справилась. Пациентам я эту историю никогда не рассказывала, потому что мои личные методы исцеления требовали почти сорокалетней жизненной подготовки и многих месяцев работы. Было бы нечестно с моей стороны предлагать им ложную надежду: к моменту нашего знакомства мои пациенты уже были слишком близки к концу своей болезни и жизни. Благодаря опыту исцеления своей болезни я гораздо больше ценила свою жизнь, осознавая, какой это дар. Сознательно быть счастливой стало моей новой привычкой, которую я прививала себе каждый день. Бывали дни, когда мне не удавалось чувствовать себя счастливой, и я принимала это, считая, что только так можно обрести покой. Принимая тяжелые дни, мы соглашаемся, что и в них есть свои уроки и дары, и что тяжелые времена пройдут, и снова наступят счастливые дни. Сознательное решение замечать больше хорошего в жизни определенно помогало мне меняться к лучшему. Розмари спросила, почему я всегда счастливая и напеваю, – настоящая причина крылась в том, что я только что совершила чудо и чувствовала огромную благодарность и силу. Розмари сказала, что тоже хочет быть счастливой, но не знает как. – Попробуйте просто притвориться счастливой, хотя бы на полчасика. Может быть, вам так понравится, что вы действительно почувствуете себя счастливой. Улыбаясь, выменяете свои эмоции, Розмари. Так что вот вам задание: не хмуриться, не жаловаться и не говорить ничего плохого в течение получаса. Говорите только хорошее, думайте о своем саде, но не забывайте улыбаться, – предложила я. Кроме того, я напомнила, что не знала ее прежней, поэтому сейчас она свободна быть какой угодно. Иногда приходится прикладывать сознательные усилия, чтобы быть счастливым. – Понимаешь, мне кажется, я никогда не чувствовала, что заслуживаю быть счастливой. Когда мой брак развалился, это опозорило всю мою семью. Так как же мне быть счастливой? – спросила она с искренностью, от которой у меня сжалось сердце. – Просто позвольте себе быть счастливой. Вы прекрасная женщина и заслуживаете этого. Разрешите себе счастье и примите сознательное решение быть счастливой. Сомнения Розмари были мне хорошо знакомы – я и сама когда-то так рассуждала. Поэтому я напомнила ей, что мнение или репутация ее семьи могут лишить ее счастья, только если она им это позволит, и разрядила обстановку парой шуток. Вначале Розмари колебалась, но постепенно начала разрешать себе быть счастливой. С каждым днем она все больше расслаблялась и часто улыбалась – иногда эта улыбка даже превращалась в смех. Когда на нее находило прежнее сварливое настроение и она грубо приказывала мне что-нибудь сделать, я только смеялась и отвечала: «Пожалуй что нет!» Тогда вместо того чтобы продолжать грубить, она тоже смеялась и повторяла просьбу уже вежливей. Ее здоровье ухудшалось каждый день, и теперь даже сама Розмари не могла этого отрицать. Хотя она продолжала обсуждать, как мы с ней будем разбирать бумаги, ее уже неудивляло, что я не поддерживаю эту идею. Постепенно она стала проводить все больше времени в постели. Ей пришлось согласиться даже мыться в кровати, потому что таскать ее в душ было очень рискованно и для ее здоровья, и для моей спины. Если я слишком надолго покидала ее комнату по хозяйственным делам, она звала меня обратно. Сама Розмари теперь спала на специальной кровати для лежачих больных, а ее прежняя кровать стояла рядом пустая. Без специальной кровати было не обойтись, потому что Розмари больше не могла сама ни вставать, ни садиться, а нам с ночной сиделкой было слишком тяжело ее поднимать. Так что, когда Розмари нужна была не помощь, а только компания, я стала ложиться на ее старую кровать. Розмари удобней всего отдыхалось на боку, так что я укладывалась напротив, и так мы лежали лицом друг к другу и разговаривали. Очень скоро у нас появилась привычка днем дремать на соседних кроватях. На улице в это время суток было совсем тихо, к тому же я была совсем рядом, если Розмари что-то было нужно. Так что я тоже засыпала, уютно устроившись под пледом. Проснувшись, мы рассказывали друг другу сны и продолжали валяться и болтать, пока мне не приходило время вставать и заниматься делами. Это было очень особенное и нежное время для нас обеих. Однажды, когда мы так лежали и разговаривали, Розмари спросила меня, на что похожа смерть, непосредственно умирание. Меня спрашивали об этом и другие пациенты. Примерно так же люди расспрашивают друг друга о разном пережитом опыте: например, беременные женщины расспрашивают рожавших, на что похожи роды. Или люди, собравшиеся в путешествие, расспрашивают других, на что похожа та или другая страна. В случае смерти человек уже не может рассказать, что он испытал, поэтому пациенты часто интересовались моим опытом и мнением. Я всегда рассказывала им, как Стелла умерла, улыбаясь. Я также объясняла, что ни разу не видела долгой смерти: сам переход всегда бывал довольно быстрым. История про Стеллу неизменно успокаивала и моих пациентов, и меня саму. В современном мире почти не уделяется внимания духовному и эмоциональному состоянию больных и умирающих людей. Если им не повезло попасть в медицинский центр, гдезаботятся о таких аспектах жизни, им остается только одиноко размышлять над своими вопросами. Это внушает человеку не только страх, но и потерянность. В нынешнем западном обществе образовался громадный разрыв: лечение направлено на болезни тела, при этом дажене признается их связьс духовным и эмоциональным состоянием. Если бы мы могли восстановить эти связи, людям у последней черты было бы куда проще примириться с происходящим. Наши вечные попытки спрятать смерть от глаз общества в очередной раз обернулись провалом. Умирающие могли бы задать свои вопросы много раньше, если бы каждый загодя задумывался о том, что ему, как и всем остальным в этом мире, предстоит небытие. Тогда нашлось бы время на поиски собственных ответов и умиротворения, и не пришлось бы, как это часто бывает, из чистого страха отрицать свою надвигающуюся смерть. Для Розмари настало время, когда она больше не могла отрицать неизбежное. Иногда она просила меня оставить ее в одиночестве, говоря, что ей «есть над чем подумать». Однажды вечером, когда я вошла к ней в комнату, она объявила: «Как жаль, что я не позволяла себе быть счастливей.Какой же я всю жизнь была несчастной! Я просто думала, что не заслуживаю быть счастливой, но теперь-то я знаю, что это не так. Сегодня утром, когда мы с тобой смеялись,я поняла: мне не должно быть стыдно за то, что мне хорошо». Я присела на край кровати и внимательно слушала. «Это ведь действительно наш собственный выбор. Мы можем мешать себе быть счастливыми под влиянием чужого мнения или потому что считаем, что не заслужили этого. Но чужое мнение – это еще не все, верно? Мы можем быть, кем хотим, главное – себе не мешать. Господи, ну почему я этого раньше не сообразила? Как много времени я потратилазря!» Я с любовью улыбнулась ей: – Я тоже себя за это корила. Но давайте относиться к себе с добротой и состраданием, это куда более здоровый подход. В любом случае теперь вы во всем разобрались и впустили счастье в свою жизнь. Мы очень неплохо провели время вместе. Вспомнив, как часто мы смеялись дружно, Розмари согласилась, и хорошее настроение вернулось к ней. – Мне начинает нравиться эта моя новая сторона, Бронни, более светлая и легкая. Я ответила, что мне тоже она нравится. – Ну и тиранила же я тебя, – хихикнула Розмари, вспомнив наши первые две недели вместе. Впрочем, мы далеко не всегда смеялись. Иногда мы переживали моменты грусти и нежности и вместе плакали, зная, что предстоит Розмари. Но хотя бы в свои последние месяцы она стала немного счастливей. У нее была замечательная улыбка – она до сих пор стоит у меня перед глазами. В последний день Розмари у нее началось воспаление легких, и в горле стояла густая слизь. Приехали несколько родственников и друзей. Нельзя сказать, что смерть Розмари была гладкой, но она была очень быстрой. Моя милая пациентка перешла в иной мир. Через десять минут подоспела участковая медсестра. Пока друзья и родные Розмари разговаривали на кухне, мы с медсестрой помыли ее и переодели в свежую ночную рубашку. Медсестра, которая впервые оказалась здесь, спросила меня, что за человек была покойная. Взглянув на тело своей подруги, на ее мирное лицо, я улыбнулась. Мне вспомнилось, как мы с ней лежали на соседних кроватях, как она смеялась и дразнила меня. «Она была счастливой, – сказала я. – Да, она была счастливой женщиной». Счастье всегда в настоящем Таких любителей порассуждать, как Кэт, среди моих пациентов больше не было. У нее имелось мнение обо всем на свете, причем сформированное не вслепую, а на основе веских фактов. Кэт обожала философию и вообще любые знания, и в пятьдесят один год была необыкновенно образованна и эрудированна. Жила она в том же доме, в котором когда-то родилась. «Здесь родилась и умерла моя мать, и я планирую последовать ее примеру», – заявляла она решительно. Еще Кэт очень любила принимать ванну, поэтому в первые два месяца мы с ней много времени проводили в ванной комнате – она в теплой воде, а я на табуретке рядом. Я и сама любила понежиться в ванне не меньше Кэт, поэтому делала все возможное, чтобы продлить ее удовольствие. К сожалению, она постепенно слабела, и вскоре ей пересталохватать сил, чтобы входить в ванну и потом выходить из нее – даже с моей помощью. Это было слишком рискованно: она могла упасть. Когда Кэт узнала, что принимает ванну последний раз в жизни, она горько расплакалась, и слезы капали прямо в воду. «Все кончается, – плакала она. – Сейчас вот ванна… а скоро я не смогу ходить. Потом я и стоять не смогу, а потом меня и вовсе не станет. Все кончается. Моя жизнь кончается». Плач перешел в ничем не сдерживаемые рыдания. Хотя мне было бесконечно жаль Кэт, я радовалась тому, что она способна так искренне выражать свои эмоции. Выплакав целое море слез, она успокоилась и молча сидела в ванне, обессилевшая от рыданий, глядя в воду невидящими глазами. Затем слезы хлынули вновь, и каждый всхлип был отчаяннее предыдущего. Кэт оплакивала все трагедии в своей жизни, всех, кого она уже потеряла, и всех, кого ей предстояло потерять, покинув этот мир. И конечно же, она оплакивала себя саму. Когда я пыталась выйти, чтобы она побыла наедине с собой, Кэт трясла головой и просила меня остаться. Так что она плакала, а я просто сидела рядом и мысленно посылала ей любовь, ничего не говоря. Смотреть на нее было невероятно грустно, но я понимала, что она переживает целительный процесс смирения с неизбежным. Прошло еще полчаса, и ванна стала остывать. Я предложила подбавить горячей воды, но Кэт отказалась. «Нет, не нужно. Пора», – сказала она, решительно выдернула пробку и обернулась ко мне, чтобы я помогла ей выбраться. Когда через десять минут я выкатила ее в кресле на солнышко, одетую в голубой халат и ярко-красные тапочки, она выглядела совсем успокоившейся. «Послушай, как поет птица», – улыбнулась она. Мы немного посидели в тишине, радуясь птичьим трелям, и заулыбались еще сильнее, когда с соседнего дерева нашей птице ответила подружка. «Знаешь, каждый день – это подарок. Причем так было всегда, но только теперь я достаточно замедлилась, чтобы по-настоящему увидеть, сколько красоты несет в себе каждый день. Мы так многое не ценим! Послушай». С нескольких ближайших деревьев звенели разные птичьи песни. Кэт сказала, что только теперь в полной мере оценила силу благодарности. Мы постоянно хотим от жизни всё большего, пояснила она, и это до какой-то степени нормально,потому что нельзя мечтать и расти, не развиваясь. Но мы никогда не получим всего, чего хотим, и никогда не перестанем расти, поэтому самое важное – не забывать ценить то, что у нас уже есть. Жизнь проходит ужасно быстро, добавила она, независимо, сколько нам суждено пробыть на земле: двадцать, сорок или восемьдесят лет. Кэт была права. Каждый день – это подарок. Настоящий момент – вот все, что у нас есть. Я уже двадцать лет вела дневник благодарности, куда каждый вечер записывала несколько вещей, за которые мне хотелось поблагодарить прошедший день. Иногда, в самые мрачные периоды моей жизни, писать в этот дневник было нелегкой задачей. Я была настолько измучена эмоционально, что мне было трудно найти повод для радости. Но я всегда преодолевала себя и придумывала, за что поблагодарить прошедший день: за воду и еду, крышу над головой, улыбку случайного прохожего или птичье пение. Но даже привыкнув каждый вечер перечислять светлые моменты прошедшего дня, рассказывала я Кэт, я еще долго приучала себя ценить маленькие подарки жизни в тот самый момент, когда она их мне преподносит. Так я выработала привычку про себя произносить благодарственную молитву каждый раз, как происходит что-то хорошее. Легче всего, конечно, было не забывать благодарить природу. Например, когда мое лицо гладил легкий ветерок, я говорила спасибо за то, что мне хватает здоровья выйти на улицу и ощутить его. Но мне хотелось еще больше осознанной благодарности. Хотя дневник помог мне развить это чувство, особенно мне помогло умение жить в моменте. Каждый час происходит что-то, за что можно говорить спасибо, решила я. Именно так мне и удалось выработать у себя стойкую привычку постоянно испытывать благодарность. – Раз ты постоянно благодаришь жизнь, наверняка она все время преподносит тебе подарки? – спросила Кэт. – Да, когда я ей не мешаю: когда помню, что я заслуживаю этих подарков и не блокирую их поток. Безусловно, мне доводилось получать от жизни прекрасные дары. Но иногда для этого мне нужно было не мешать себе – просто «отойти с дороги». Жизнь гораздо щедрее ко мне, когда я нахожусь в состоянии благодарности и потока. Кэт посмеялась над моей теорией, но согласилась: – Да, жизнь сама хочет дарить нам подарки, но без благодарности и открытости мы ей этого не позволяем. Большинство людей даже не понимают, как им повезло. Я, например, долгое время этого не понимала. К счастью, я начала работать над собой еще до болезни, так что мне удалось заранее встать на верный путь. Мы еще посидели на солнышке, пока Кэт не пришло время обедать и отдыхать. На обед были мороженое и компот из фруктов – ничего другого она уже не ела. Все остальное слишком трудно жевать, говорила Кэт, и к тому же безжизненно на вкус. После обеда я устроила ее в кровати и задернула занавески. Недавно Кэт увеличили дозу обезболивающих, и она чувствовала себя лучше, но слабей, так что заснула она почти моментально. Вечерами к нам часто заходила бывшая возлюбленная Кэт. Они расстались больше десяти лет назад, но остались близкими друзьями, их отношения были полны нежности и уважения. Появлялись и другие постоянные гости: старший брат Кэт с женой и детьми, а также ее младший брат. Каждый день заглядывали соседи, да и друзья и коллеги тоже навещали при первой возможности. Кэт многие любили. Судя по рассказам гостей, на работе Кэт была очень целеустремленной, но по-доброму относилась ко всем окружающим. Теперь она, как и все умирающие, хотела как можно больше знать о том, что происходит в жизни ее посетителей, да и вообще в мире за пределами дома. Умирающие люди сами уже не могут жить обычной жизнью и наслаждаются каждой новостью. Часто друзья и родные теряются и не знают, о чем говорить во время посещений. Рассказы о чужой жизни не расстраивают умирающих, а помогают им не терятьсвязи с окружающими и вообще хорошо на них влияют. Так было и с Кэт: она хотела слышать только хорошие новости, и побольше. Но это не всегда легко давалось гостям, горевавшим о предстоящей им потере близкого человека. Поэтому по просьбе подруги Кэт, Сью, я решилась поговорить с ней о чувствах ее посетителей. Сью приходила к нам почти каждый день и очень старалась казаться веселой ради Кэт, но на самом деле больше всего ей хотелось плакать. Перед тем как входить в дом, Сью подолгу сидела в машине и делала себе внушение: оставаться сильной и держать лицо. Через пару часов, выйдя от Кэт, она садилась обратно в машину и рыдала. – Я, в общем-то, это вижу, – призналась Кэт. – Но я просто не знаю, как мне справиться с печалью Сью, когда я еще и со своей толком не справилась. Эта ноша мне не по силам. – Ну и не надо взваливать ее на себя, – предложила я. – Просто дайте Сью высказаться, не меняйте тему разговора каждый раз, как она пытается поговорить о своих чувствах. Ей нужно выговориться, а от вас требуется только дать ей такую возможность. Не считайте это обузой. Она ни о чем вас не просит. Она просто хочет рассказать, как сильно любит вас, но не может этого сделать без своих слез и вашего согласия. Кэт поняла меня, но сказала, что чувствует себя почти неловко, видя, как расстроены ее друзья. – Господи, Кэт, неужели вас все еще беспокоит такая мелочь, как гордость? – спросила я. Она рассмеялась. – Просто разрешите своим близким рассказать вам, как они вас любят. Она улыбнулась и немного помолчала, а потом ответила: – Когда до меня только дошло, насколько серьезно я больна, я решила научиться принимать свои чувства, а не отвергать их. Они возникают, и я позволяю себе их прожить.Вот почему я с такой свободой рыдала в тот день в ванне. Чувства – это всего лишь побочный продукт мыслей. Я знаю, что можно создавать новые чувства, концентрируясь на хорошем. Но те чувства, что у меня уже есть – это часть меня, и их лучше высвобождать, чем держать в себе. Такая у меня теория. Но при этом получается, что я не уважаючувства других, а отвергаю их и мешаю их искреннему выражению! Кэт покачала головой и вздохнула. Чуть подумав, она посмотрела на меня, улыбнулась и добавила: – Похоже, пора мне набраться смелости и дать другим тоже выплакаться вволю. Я согласно кивнула и заметила, что это вовсе не лишит Кэт обычных жизнерадостных посещений. Но прямо сейчас пора дать волю накопившимся эмоциям родных и друзей. Им нужна возможность выразить ей свою любовь – вероятно, даже сквозь слезы. В следующие несколько дней Кэт и ее гости действительно пролили немало слез, но их беседы были наполнены любовью. Они раскрывали друг другу сердца, наполненные болью, и исцеляли их мощным потоком любви. Один день выдался особенно эмоциональным. Последняя посетительница уходила, смеясь сквозь слезы одновременно горя и радости, перешучиваясь с Кэт, пока не скрылась из вида. Проводив ее взглядом, Кэт посмотрела на меня с любовью. «Да, очень важно дать чувствам волю и принять их. И моим друзьям это тоже полезно, – сказала она. – У них останутся только хорошие воспоминания, не омраченные тяжелыми эмоциями». Я согласно кивнула, восхищенная ее анализом ситуации. В тяжелый момент жизни мне тоже не без труда удалось отделить свои чувства от себя и понять, что они лишь эмоциональное выражение моей боли или радости, а не я сама. Как и все люди, я родилась с мудрой душой. Но, чтобы познать эту глубинную божественную мудрость, мне довелось дать волю чувствам, иначе они никогда не позволили бы мне реализовать мой потенциал. Поэтому мне так приятно было слышать, что Кэт пришла к похожему выводу, хотя и сформулировала его по-своему. Кэт и раньше была худой, поэтому от потери веса быстро начала выглядеть больной и изможденной. «Мое время подходит к концу. Невозможно больше закрывать глаза на очевидное», – сказала она мне как-то утром, сидя на переносном туалете. Мне часто доводилось беседовать с пациентами, пока они сидели на горшке, а я рядом. Горшок нам не мешал – он был чем-то привычным, и не было смысла давать туалетным делам мешать интересному разговору. Укладывая Кэт в кровать, я согласилась: действительно, некоторые признаки указывают на то, что ей остается не так уж долго. Удобно устроившись в кровати, она добавила: «Я не жалею о том, как жила, потому что я многому научилась в результате своих поступков. Но если бы я могла что-то изменить, прожить жизнь заново, я бы впустила в нее больше счастья». Это меня удивило. Конечно, я уже слышала подобные слова от других пациентов, но Кэт мне всегда казалась довольно счастливой женщиной – насколько это вообще возможно, когда ты смертельно болен и ужасно себя чувствуешь. Я спросила, что она имеет в виду. Кэт объяснила, что любила свою работу, но слишком много значения придавала результатам. Она занималась программами для трудных подростков и считала, что вклад в общество просто необходим, чтобы чувствовать удовлетворение от жизни. «У каждого из нас есть полезные таланты. Неважно, кем ты работаешь. Важно только, что ты пытаешься внести в общество осознанный вклад, надеешься сделать мир лучше, – рассуждала Кэт. – Единственный шанс спасти ситуацию – это понять, что все люди связаны между собой. Ничего нельзя сделать в одиночку. Как было бы хорошо, если бы мы перестали уже соревноваться и бояться и начали работать вместе ради общего блага». Хотя у Кэт оставалось совсем мало сил и она почти не вставала с кровати, ей все еще было что сказать. Я подозревала, что философ в ней умрет последним (и меня это совершенно устраивало). Пока я натирала ей кремом руки, она продолжала говорить: «Нам всем есть что дать обществу. Я свой долг выполнила. Но пока я искала свое предназначение, я забыла, что можно еще получать удовольствие от жизни. Сначала мне нужен был только результат: я искала смысл жизни. Однако даже найдя любимую работу, которая придала моей жизни смысл, я все равно продолжала думать только о результатах». Эта история была мне знакома – я уже слышала ее от других пациентов. Идя к намеченной цели, мы часто забываем про настоящий момент. Кэт казалось, что ее счастье связано с конечным результатом работы, и она не получала удовольствия от процесса его достижения. Я заметила, что все люди склонны к этой ошибке, в том числе и я сама. Она продолжила: «Да, но при этом я лишила себя возможного счастья. Именно это я имею в виду, когда говорю, что хотела бы кое-что изменить. Конечно, важно найти свое предназначение и внести вклад в общество, каким бы он ни был. Но не нужно считать, что счастье зависит только от конечного результата. Нужно быть благодарной за каждый день – только так можно быть счастливой прямо сейчас, а не когда добьешься цели, выйдешь на пенсию или случится еще что-нибудь». Кэт вздохнула, утомленная этой эмоциональной речью, но довольная, что ее услышали. Выслушав ее и поделившись собственными мыслями на эту тему, я поправила на ней одеяло и отправилась на кухню за чаем. Срезая в саду стебель цитронеллы, я думала о словах Кэт. Мне вспоминались очень похожие слова других пациентов. В деревьях пели птицы, свежезаваренный чай наполнял кухню благоуханием цитронеллы, и было совсем не трудно жить в настоящем и быть благодарной. Высказавшись, Кэт захотела немного отдохнуть и послушать меня, поэтому спросила, где я живу. Со смешком я объяснила, что этот же вопрос мне задают все мои друзья каждый раз, как звонят по телефону: «Где ты сейчас живешь?» Я рассказала Кэт о том, как в молодости постоянно переезжала с места на место, а в последние годы жила в чужих домах, и что только недавно мне перестало хватать сил на этот бродяжнический образ жизни. В Мельбурне у меня было не так много предложений присматривать за домами, как в Сиднее. Мне слегка надоело не знать, где я буду жить на следующей неделе, да и постоянно переезжать тоже. То, что раньше я так любила, теперь казалось утомительным. Недавно я сняла комнату в доме у знакомой, чтобы жить там, когда у меня не было предложений по работе. Я была очень благодарна ей за возможность не переезжать каждыенесколько недель, но все же это была чужая территория, и ощущения собственного дома у меня так и не возникло. Казалось, все специально сложилось так, чтобы мне снова захотелось иметь свой угол, и это желание изо дня в день росло. Прошло почти десять лет с тех пор, как у меня была собственная кухня. Кэт, никогда не переезжавшая из своего дома, сказала, что даже представить себе не может мой образ жизни. Я ответила, что тоже не могу представить себе ее образ жизни: хотя сейчас мне хотелось оседлости, какая-то часть меня всегда будет стремиться к странствиям. В последнее время я обдумывала возможность иметь постоянную базу, куда можно будет возвращаться, вместо того чтобы переезжать со всем хозяйством каждый раз, как захочется сменить обстановку. Годы странствий, в которых я провела половину своей взрослой жизни, во многом сформировали меня. Но теперь что-то изменилось, и у меня не осталось желания или сил поддерживать прежний образ жизни. Все, чего мне хотелось, – это иметь собственную кухню и личное пространство, которое никто не нарушит. Кэт согласилась, что перемены – это единственное, что есть постоянного в жизни. Она добавила, что мы с ней идеально дополняем друг друга: я постоянно меняю свою жизнь, а она пятьдесят один год прожила на одном и том же месте. Мы расхохотались. Наши жизни были действительно очень разными, но нас сплотила общая любовь к философским рассуждениям, и теперь между нами установилась сильная связь. Кэт захотела узнать, как я начала работать паллиативной сиделкой, и поразилась, услышав про годы работы в банке. – Даже представить себе этого не могу, – удивленно сказала она. – Я тоже, слава богу, – рассмеялась я. Вспоминая то время, я с большим трудом могла представить себя в этом мире. Удивительно, сколько событий умещается в одну недолгую жизнь. – Колготки, высокие каблуки и деловые костюмы мне никогда не нравились, Кэт, а с ними и упорядоченный образ жизни. – Глядя, какую жизнь ты ведешь теперь, я не удивлена, – усмехнулась она, а затем внезапно посерьезнела и спросила, сколько еще я планирую заниматься этой работой инет ли у меня других планов. Я не видела смысла от нее что-то скрывать. Я уже знала, как важна честность, и было очень приятно поговорить на эту тему откровенно. В последнее время я много об этом думала, и разговор с Кэт помог мне разобраться в собственных желаниях. Уже год мне не давала покоя мысль о музыкальных курсах для заключенных. Я ничего не знала о тюремной системе, но мысль оказалась настойчивой и прорастала во мне медленно, но верно. Недавно я как раз познакомилась с замечательной женщиной, которая взялась помочь мне найти деньги для осуществления задумки. «Правильно, Бронни, возвращайся в мир живых. Ты замечательно справляешься со своей работой, но наверняка ужасно устала от нее», – настойчиво сказала Кэт. Действительно, прошло почти восемь лет с тех пор, как я начала работать сиделкой. Подумав об этом, я вдруг поняла, что близка к выгоранию. Видеть, как люди обретают душевный покой, любоваться их ростом на закате жизни было невероятной честью. Это была очень благодарная работа, и я ее любила. Но теперь мне хотелось поработать в области, где все же оставалась надежда на хороший исход, где у людей был шанс изменить свою жизнь до того, как они окажутся на пороге смерти. Стремление заниматься творческой работой тоже крепло, вместе с надеждой иногда работать из дома – как только у меня снова будет свой дом. Вслух высказав все эти мысли Кэт, я почувствовала, как они буквально наливаются энергией. Мысли о работе с заключенными теперь не оставляли меня. Похоже, мое время в паллиативном уходе подошло к концу. Так было нужно – я отдала этой сфере почти все, что могла. Незадолго до смерти к Кэт пришло второе дыхание, и пару дней она хорошо себя чувствовала. Я уже видела это с другими пациентами, поэтому обзвонила всех постоянных посетителей и посоветовала им зайти, потому что Кэт вот-вот вступит в заключительную фазу болезни. Придя в гости, некоторые из них усомнились в моих словах, потому что Кэт выглядела намного лучше прежнего и казалась заметно бодрей. Это последний подарок, который жизнь иногда преподносит людям после долгой болезни. Благодаря емумы можем запомнить их с былым огоньком в глазах. Целых два дня в комнате Кэт звенел смех, она была в ясном сознании и прекрасном настроении, шутила и радовалась друзьям и родным. Приехав на работу на следующее утро, я увидела перед собой умирающую женщину, которая уже почти не могла говорить. Тело Кэт совсем ослабло. Она прожила еще три дня, но почти все время спала. Проснувшись, она улыбалась мне, пока я меняла ей подгузник и мыла ее. Даже возможность пользоваться переносным туалетом теперь осталась в прошлом. Друзья приходили и тихо уходили, зная, что в последний раз видели свою любимую Кэт. Под конец третьего дня стало очевидно, что до утра она не доживет. Закончив смену,я не поехала домой, а осталась с Кэт, ее братом и его женой. Ночная сиделка еще никогда не видела мертвого тела, поэтому для нее мое решение было большим облегчением.Вспомнив свой собственный первый опыт смерти пациента, я поняла, что очень многому научилась с тех пор. Тогда я даже представить себе не могла, сколько встречу потрясающих людей на этой работе и сколько мне выпадет бесценных жизненных уроков. Кэт уже несколько дней получала обезболивающие внутривенно, потому что не могла больше глотать таблетки. Вечером приехала паллиативная медсестра с новой порцией лекарств. Кэт была без сознания. «Это последняя доза, – сказала медсестра мне и брату Кэт. – Она все равно не переживет эту ночь». Мы поблагодарили ее, и я пошла ее проводить. На прощание медсестра сказала мне: «Ее не станет в течение часа». В моей работе было столько радости и одновременно печали – печали от необходимости прощаться и радости за то, что кончились мучения Кэт. Это были сложные чувства, и я не сдерживала слез. Кэт не дождалась моего возвращения. Она умерла, пока я шла обратно к дому. Ее дыхание замедлилось, а затем остановилось совсем. Глядя на нее, лежащую в кровати, я улыбнулась сквозь слезы, а в ушах у меня стоял ее голос. «Не отдавай всю жизнь умирающим людям, впусти в нее немного радости», – велела она мне слабым шепотом накануне утром. Слезы хлынули у меня из глаз, и я не скрывала их. «Хорошего вам путешествия, моя дорогая подруга», – произнесла я про себя от всего сердца. Брат Кэт и его жена подошли ко мне, тоже в слезах, и по очереди обняли. Им нужно было идти заниматься формальностями. Я в последний раз взглянула на тело Кэт – тело, которое я так часто мыла и массировала. Кэт в нем уже не было; ее дух отправился дальше. Но она оставалась в моем сердце, и, чуть улыбнувшись, я окончательно простилась с ней и ее семьей. Ночная сиделка тоже простилась и уехала. Выйдя из дома Кэт в последний раз, я закрыла за собой калитку и остановилась на тихой улице, ярко освещенной фонарями. Каждый раз после смерти пациента мир выглядел для меня нереальным. Я все воспринимала и ощущала особенно остро, и мне казалось, что я наблюдаю за всем откуда-то со стороны. Входя в трамвай, я не замечала людей вокруг. Мир жил своей жизнью, а я все думала о Кэт и о проведенном с ней чудесном времени. Трамвай остановился на светофоре, и я увидела, смеющихся людей у двери в ресторан. Стоял мягкий, ласковый вечер, и все прохожие казались веселыми. Мои усталые слезящиеся глаза улыбались, глядя на чужое счастье. Внезапно я услышала разговоры других пассажиров, которых все это время не замечала. Все это были веселые, радостные разговоры. В тот вечер счастье, казалось, было разлито в воздухе. Мне было грустно, но я тоже чувствовала себя счастливой – ведь мне довелось узнать Кэт и подружиться сней. Отзвуки чужого смеха танцевали вокруг, наполняя счастьем и меня. Трамвай двинулся вперед, я посмотрела в окно и задумалась о добрых сердцах людей во всем мире и тех, которые были рядом прямо сейчас. От благодарности у меня на душе стало тепло, и я невольно улыбнулась. Я не думала ни о прошлом, ни о будущем. Счастье всегда в настоящем – там же, где была я. Все дело в точке зрения Ленни был одним из моих последних клиентов, и он оказал на меня глубочайшее и очень благотворное влияние. Я ухаживала за ним в доме престарелых. Надо сказать, что засмены в доме престарелых я по-прежнему бралась неохотно – стоило мне только войти туда, у меня сразу начинало болеть сердце за его обитателей. Так что на эту работуя соглашалась только тогда, когда у меня не было совершенно никаких предложений по уходу на дому. Именно так вышло с Ленни, и я этому очень рада. Когда мы познакомились, Ленни оставалось жить уже совсем недолго. Его дочь наняла меня в качестве дополнительной сиделки, зная, что сотрудники дома престарелых слишком заняты, чтобы уделять ему дополнительное внимание. Ленни спал почти весь день, а когда бодрствовал, соглашался пить чай, но отказывался от еды. Проснувшись, он похлопывал ладонью по кровати, чтобы я села к нему поближе, потому что у него не было сил разговаривать громко. «Я прожил хорошую жизнь, – часто повторял он. – Да, хорошую жизнь». Эти слова каждый раз напоминали мне, что счастливым человека делают не обстоятельства, а точка зрения, потому что жизнь Ленни никак нельзя было назвать даже легкой. Он остался круглой сиротой в четырнадцать лет. В следующие несколько лет все его братья и сестры либо умерли, либо разъехались по миру, потеряв связь друг с другом.Он познакомился с Ритой, любовью всей своей жизни, когда ему исполнилось двадцать два года, и женился на ней «с ураганной скоростью», как он сам выражался. У них родилось четверо детей. Старший сын погиб во время войны во Вьетнаме, что до сих пор заставляло Ленни печально качать головой. Он был яростным противником войны, называя ее безумием. Он не понимал, кому вообще могло прийти в голову, что война способна привести к долгосрочному миру. Я разделяла его мысли о безумном и плачевном состоянии мира и быстро научилась ценить ум и рассуждения этого замечательного человека. Время от времени в комнату заглядывали работники дома престарелых, предлагая Ленни поесть, но он всегда с улыбкой отказывался. Как только дверь закрывалась, шум в коридоре, казалось, затихал, как будто мы вдвоем переносились в отдельное измерение. Старшая дочь Ленни вышла замуж и переехала жить в Канаду. Через девять месяцев она погибла, разбившись на машине в метель. «Наша звездочка, – говорил о ней Ленни. – Она сияла, как звездочка, и теперь она навсегда отправилась на небо». Пока я слушала Ленни, у меня нередко глаза были на мокром месте. Работа сиделки научила меня никогда не пытаться сдерживать слезы. Чем больше я развивалась, тем естественней выражала свои чувства. Общество заставляет нас героическими усилиями соблюдать приличия, и мы платим за это непомерно высокую цену. Искренность моих чувств нередко помогала родным моих пациентов: увидев мои слезы, они тоже начинали плакать. Трудно представить, но некоторые из них не плакали с самого детства. Глядя на это, я только больше убеждалась в том, как важно искренне выражать свои чувства. Младший сын Ленни оказался слишком ранимым для этого мира, и у него развилось психическое заболевание. В то время системы поддержки для подобных людей еще не существовало, и, если семья не справлялась с уходом за больным идеально, его забирали в психиатрическую лечебницу. Ленни и Рита хотели оставить Алистера дома, где они могли бы дать ему любовь и заботу, но врачи им этого не разрешили. Алистер прожил остаток жизни, одурманенный лекарствами, и Ленни больше ни разу не видел, чтобы он улыбнулся. Последняя дочь жила в Дубае, где ее муж работал инженером по контракту. Она звонила в дом престарелых, когда я была на работе, и мы с ней разговаривали. По телефону она казалась мне приятной женщиной, но прилететь к отцу не могла. Рита умерла, не дожив до пятидесятилетия, всего несколько лет спустя после того, как Алистера забрали в психиатрическую лечебницу. Она заболела, и в течение нескольких недель ее не стало. И все равно Ленни утверждал, что прожил хорошую жизнь. Сквозь слезы я спросила его, как это возможно. «Мне выпало счастье любить, и за все прожитые годы эта любовь не ослабевала ни дня», – сказал он. После работы мне не хотелось идти домой, но Ленни все равно пора было отдыхать. Каждый день, возвращаясь в дом престарелых, я молилась, чтобы он был еще жив. Это была непростая ситуация. Я знала, что он хочет умереть, чтобы вновь воссоединиться с Ритой и своими детьми, и в этом отношении я желала ему скорейшего ухода. Но одновременно мне хотелось, чтобы он подольше побыл со мной, ради моего развития и нашей дружбы. Ленни много работал – слишком много, говорил он. Вначале это помогало ему заглушить боль, а как еще справиться со своими потерями, он не знал. В последние годы, по рекомендации своей дочери Роуз, он обратился к психотерапевту и научился говорить о пережитом. Вспоминая свои утраты, он исцелился, и теперь свободно рассказывал мне обо всем. Он также расспрашивал меня о моей жизни. Ему казалось поразительным, что молодая женщина могла распродать почти все свое имущество, сложить остатки в машину и отправиться навстречу новой жизни, не представляя, куда приведет этот путь, – и так не один раз, а много. Я объяснила, что на мою жизнь очень сильно повлияли первые серьезные отношения с мужчиной. Мне тогда еще многое предстояло в себе открыть, но жизнь в постоянном угнетении и страхе привела к тому, что неизведанное манило меня с неодолимой силой. Когда эти отношения, наконец, закончились, я ощутила свободу, которой раньше не знала. С женихом мы встретились, когда я была еще очень молода и не успела по-настоящему узнать свободу взрослой жизни. К концу наших отношений мне было двадцать три, и я наконец начала делать то, что положено делать в этом возрасте: развлекаться и получать удовольствие от жизни. Полгода спустя я села за руль и поехала на свадьбу к подруге. Ехать надо было шесть часов, и по пути я обнаружила в себе нечто новое, но бесконечно родное: тягу к странствиям. Оказалось, что какая-то часть меня всегда мечтала и будет мечтать о постоянных путешествиях. Подолгу сидеть за рулем оказалось для меня самым естественным времяпрепровождением в мире. С тех пор свобода стала одним из главных приоритетов в моей жизни. Большинство решений я принимала на основании того, как они повлияют на мою свободу. Разумеется, свобода доступна нам и при оседлой жизни, ведь это прежде всего состояние ума. Возможность быть собой – вот величайшая свобода, и на нее никак не влияет, в каком городе или районе мы живем. Ленни расспрашивал о моей жизни с неподдельным интересом и слушал очень внимательно, когда я рассказала ему о своих планах оставить работу сиделкой. «Да, – сказалон. – Тебя ждет хорошая жизнь, Бронни, в которой тебе не нужно будет все время проводить в непосредственной близости от смерти. Возвращайся в мир живых». Он был добрейшим человеком, и я улыбнулась его благословению. Дом престарелых принадлежал христианской организации. Ленни перестал ходить в церковь сразу после смерти Риты, но не потому, что утратил веру в Бога. Просто ему было слишком больно находиться в церкви без своей любимой жены, не слышать, как она поет с ним рядом. Ленни говорил, что ему все равно, кому принадлежит дом престарелых – христианам, представителям какой-то другой религии или вовсе атеистам. Его устроила бы любая ситуация. Он собирался вскоре отправиться домой, к Рите, а все остальное было неважно. Но заведение было христианским, и в нем, кроме сотрудников, было немало волонтеров. Одного их них звали Рой, и он каждый день обходил комнаты, чтобы вслух читать их обитателям Библию. Он уже давно предлагал свои услуги и Ленни, который раз за разом вежливо отказывался. Теперь, когда Ленни оставались считанные дни, у него не было сил сопротивляться. Рой воспользовался этим, чтобы каждый день приходить и читать Ленни отрывки из Библии. Читал онподолгу. Даже здоровый человек с искренним интересом к Библии, вероятно, немного уставал бы от этих ежедневных монотонных монологов. Из вежливости я старалась слушать Роя очень внимательно, но то и дело нечаянно начинала клевать носом. Как я уже говорила, он читал подолгу и совершенно без выражения. Но хуже всего было то, что, закончив читать, Рой хотел обсудить прочитанное с Ленни. Я как сиделка должна была заботиться о его комфорте, поэтому мне пришлось мягко объяснить Рою, что Ленни уже не хватает сил разговаривать, и не надо его к этому принуждать. – Я знаю, что ты добрая душа, Бронни, – сказал Ленни мне на ухо однажды после ухода Роя. – И я знаю, что ты стараешься всегда думать о людях лучшее. Но если этот парень снова заявится сюда, я его выпровожу пинком под зад. Мы оба расхохотались, зная, что завтра Рой вернется в то же время. – Если я до сих пор не заслужил царствия небесного, то какой теперь смысл во всей этой религии? – хихикнул Ленни. – Я все равно не могу сосредоточиться на том, что он говорит. У меня нет сил. – У него добрые намерения, Ленни, а это самое главное, – ответила я. Мы оба по-доброму посмеялись. Рой был хорошим человеком, и, хотя намерения у него действительно были самыми чистыми, ситуация приобретала все большую комичность. Каждый день, когда он стучался в дверь, мы оба знали, что нас ожидает. Монотонное, безжизненное чтение Роя вовсе не украшало мудрые слова Библии. «Вы хотя бы можете спать, пока он читает», – смеялась я. Ленни кивал, улыбаясь. Дни тянулись медленно. Мне предложили другую работу, но я отказалась. Я хотела проводить этого замечательного человека до самого конца пути. Кроме того, я стремилась не подвести Роуз. Она наверняка была бы в ужасе, что отец умирает в другой стране и при этом вынужден каждый день иметь дело с новой сиделкой. Я также знала, что ужескоро мне будет не хватать наших тихих разговоров с Ленни, и не желала отказываться от них раньше срока, который пришел очень быстро. Был полдень четверга, и в городе кипела жизнь. Всюду была суета – на дорогах, в магазинах, а затем и в доме престарелых, куда я приехала к Ленни. Работники развозили по коридорам тележки с едой. Врачи обходили пациентов. Перегруженные медсестры носились туда-сюда. Пациентов катили куда-то в креслах, у кого-то из них из уголка рта текла слюна, а остекленевшие глаза смотрели в никуда. Дом престарелых – это всегда ужасно печальное зрелище, и тот четверг не был исключением. Проходя мимо регистратуры, я услышала, как две девушки-администратора жалуются друг другу на третью. Мне было трудно понять, как они ухитряются ежедневно работать в окружении смерти и все равно тратить силы на банальные жалобы. Впрочем, я уже многому научилась на собственном опыте и благодаря своим пациентам. То, на что большинство людей тратят свои силы, в конечном итоге оказывается совершенно неважным. Как всегда, войдя к Ленни, я внезапно будто перенеслась в другой мир. В полутемной комнате царил удивительный покой. Так было с самого начала, и в первый же день работы я сказала об этом Ленни. Он улыбнулся: «А, да, это очень мирное пространство, но не все это видят. Многие сотрудники, которые сюда заходят, такие деловые, что ничего не замечают». Впоследствии я часто это наблюдала, хотя некоторые посетители Ленни тоже ощущали особую атмосферу его комнаты. Пододвинув стул поближе к кровати Ленни, я читала книгу, пока он спал, но продолжала думать о нем. Через некоторое время он заворочался, увидел меня и начал шарить рукой по одеялу в поисках моей руки. Я взяла его ладонь в свои, он улыбнулся и снова уснул. Так проходили часы. Иногда он снова начинал ворочаться, и я давала ему глотокводы или просто целовала его руку. «Я прожил хорошую жизнь», – тихо произнес он, проснувшись в очередной раз. «Хорошую жизнь», – он снова задремал, а я смотрела на него. Мое сердце наполнилось печалью, а к глазам подступили слезы. Иногда моя работа бывала просто невыносимо тяжелой, и я начинала мечтать о какой-то другой карьере, попроще. Но при этом я знала, что никакая другая работа не даст мне столько, сколько мои пациенты. «М-м-м. Хорошую жизнь», – повторил он, открыв усталые глаза и улыбнувшись мне. Увидев, что я плачу, он сжал мою ладонь. – Не волнуйся, милая, я готов, – его голос звучал еле слышно. – Пообещай мне кое-что. Мне хотелось рыдать, но я лишь улыбнулась сквозь слезы. Улыбка вышла фальшивой, как бывает у людей, когда они стараются держать лицо, но это им не удается. – Конечно, Ленни. Что? – Не волнуйся о мелочах. Мелочи – это ерунда. Единственное, что важно, – это любовь. Если будешь помнить о том, что любовь всегда с тобой, то проживешь хорошую жизнь. Его дыхание слабело, и говорить было все сложнее. – Спасибо вам за все, Ленни, – проговорила я, всхлипывая. – Я так рада, что познакомилась с вами. Это прозвучало по-детски, ведь я могла и хотела сказать ему еще многое. Но в конечном итоге, эти слова в точности передавали мои чувства. Наклонившись и поцеловав Ленни в лоб, я увидела, что он снова уснул. Я сидела с ним рядом и рыдала, уже не сдерживаясь. Иногда стоит лишь чуть приоткрыть кран, и слезы начинают литься ручьем. Я плакала и плакала без конца, даже не зная,о чем все эти слезы. Следующие несколько часов Ленни продолжал спать. Он вполне мог уже не проснуться. Когда слезы иссякли, я просто сидела, глядя на него с нежностью. И тут в комнату
