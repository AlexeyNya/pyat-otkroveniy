потому, что они были очень близки. Мы с ними были почти ровесниками, и, глядя на их любовь, я чувствовала одновременно восхищение и бесконечную грусть. Мы часами разговаривали с ними втроем, и эти беседы были глубокими и честными. Среди прочего мы обсуждали и тему принятия смерти в таком молодом возрасте. Нам частокажется, что мы будем жить вечно, но у жизни свои планы. Некоторым людям суждено умереть молодыми. Словно цветы, которые распустились, но не успели превратиться в плоды, они покинут мир, не успев полностью реализовать свой потенциал. Другим суждено дожить до зрелости и умереть в расцвете лет. Третьи переживут расцвет и постепенно состарятся. Мы часто используем выражение «преждевременная смерть», но на самом деле каждый человек уходит в предначертанный ему срок. Миллионам людей не суждено дожить до старости. Мы всегда предполагаем, что будем жить вечно или хотя бы до глубокой старости, поэтому смерть молодого человека вызывает у нас ужас и отчаяние. Но это естественная часть жизни всех биологических видов. Кто-то умирает молодым, кто-то в среднем возрасте, а кто-то в глубокой старости. Конечно, больно видеть, как умирают те, у кого впереди могла бы быть вся жизнь. У меня есть друзья, потерявшие детей, и эта рана никогда не заживает полностью. Но этим детям или молодым людям было просто не суждено прожить долгую жизнь. Они пришли в мир, осветили его своим присутствием и навсегда останутся в нашей памяти благодаря тому, что успели сделать за свое недолгое время. Хотя до сорока лет Джуд была совершенно здорова, было бы естественно поддаться мыслям о том, как несправедливо такой прекрасной женщине умирать всего в сорок четыре года. Но и она, и Эдвард смирились с судьбой, полные благодарности за то, что им довелось встретиться и полюбить друг друга. Кроме того, у них родилась чудесная дочь, и возможность быть рядом с Лайлой в ее первые девять лет приносила Джуд некоторое утешение. Конечно, ее мучило, что она не увидит, как ее девочка превратится во взрослую женщину, и что ее смерть неминуемо причинит дочери глубокую боль. Но ее утешало, что рядом с Лайлой останется любящий отец. Джуд уже полностью утратила независимость и возможность передвигаться, но по-настоящему ее приводила в отчаяние потеря речи. Однажды ночью, когда я переворачивала ее в кровати, она рассказала мне о своем главном страхе. Джуд боялась, что, когда полностью утратит речь, не сможет никому сообщить о том, что ей больно, и ей придется просто лежать и терпеть мучения. Невольно я задумалась о том, какие тяжелые и разные испытания выпадают людям. Какой ужасный конец – провести последние недели илимесяцы в сознании, но без возможности выразить свои мысли и чувства, да еще и страдая от боли, потому что никто о ней не догадывается или не знает, как ее облегчить. Это, должно быть, постоянно происходит с людьми, страдающими такими болезнями как инсульт или повреждения мозга. Какой кошмар. Эта мысль заставила меня взглянуть на собственную жизнь совершенно по-новому. С каждым днем речь Джуд становилась все менее понятной. В хороший день я достаточно успешно разбирала, что она говорит. В плохой день мне удавалось понять ее толькоблагодаря интуиции и опыту. В такие дни Джуд иногда прибегала к помощи специальной компьютерной программы и очков. Эти очки позволяли ей взглядом фокусировать лучлазера на экране компьютера, где был изображен алфавит. Если она достаточно долго задерживала взгляд на какой-то букве, программа печатала эту букву, и она переходила к следующей. После пары букв программа предлагала ей варианты слов, и так далее. Это был медленный способ общаться, но он хоть как-то давал ей высказаться. Я мысленно благодарила людей, разработавших эту программу. Впрочем, Джуд предстояло вскоре потерять и эту возможность: она постепенно теряла способность двигать головой. Поэтому, если нам выпадал хороший день, я очень внимательно слушала Джуд. Поднеся к ее губам сок, я ждала, пока она медленно сделает один глоток, потом другой, чтобы увлажнить горло и говорить дальше. Одну мысль Джуд повторяла особенно часто, считая ее чрезвычайно важной. «Мы не должны бояться говорить о своих чувствах», – говорила она. Мне, учитывая мой собственный жизненный путь, эта мысль тоже была близка. Хотя Джуд лишилась матери, когда выбрала Эдварда, она все равно была счастлива: ей хватило смелости принять верное решение, о котором она ни разу не пожалела. Но сейчас она мечтала рассказать матери о своих чувствах и проститься с ней. Признавая, что ее мечта может не осуществиться, Джуд написала матери письмо, которое теперь ждало своего часа в письменном столе у Эдварда. Мать Джуд знала о ее болезни, но упрямство не давало ей простить и навестить умирающую дочь. «Мы должны говорить о своих чувства прямосейчас, – настаивала Джуд. – Не когда-нибудь потом, когда будет уже поздно. Никто из нас не знает, когда станет слишком поздно. Мы должны говорить людям, что любим их. Должны говорить, что восхищаемся ими. Если они не могут принять эту честность или реагируют не так, как мы надеялись, это ничего не меняет. Важно только то, что мы высказались». Джуд считала, что это одинаково важно и для тех, кто уходит, и для тех, кто остается жить дальше. Умирающие должны знать, что высказали все нужные слова. Это помогает обрести покой, говорила Джуд. А если те, кто остается жить, тоже смогут набраться смелости для откровенного разговора, им не придется до собственной смерти сожалеть об упущенной возможности. Им не придется жить с чувством вины, которое неизбежно возникает, если любимый человек умер, так и не услышав предназначавшихся ему слов. Эта тема была вдвойне важной для Джуд, потому что годом раньше внезапно умерла ее подруга, и эта смерть ее потрясла. Трейси была веселой и доброй женщиной, которая без усилий становилась душой компании на любой вечеринке. Ее многие любили за бесконечную доброту и за то, что она никогда никого не осуждала. «Жизнь стремительно несет нас вперед и мешает уделять время любимым людям, будь то родные или друзья. Но давай вернемся к разговору об отношениях и откровенности. Люди не понимают, насколько это важная тема, пока сами не окажутся на пороге смерти – или не останутся навсегда с чувством вины после смерти близкого человека», – говорила мне Джуд. Чувства вины легко избежать, объясняла она. Достаточно знать, что мы приложили все усилия, чтобы провести побольше времени с любимыми людьми и рассказать им о своих чувствах. Но ни в коем случае нельзя и дальше жить, предполагая, что любимые люди всегда будут рядом. Любая жизнь может оборваться в секунду. Сама Джуд была благодарна, что ей хватило времени попрощаться с близкими, но не всем людям, говорила она, выпадает такая удача. Миллионы гибнут внезапно, так и не успев перед смертью сказать близким о своей любви. Когда Джуд открыто заявила родителям о своей любви к Эдварду, эта откровенность стоила ей отношений с матерью, но она не жалела о своем решении. Она не только познала всю полноту любви, которая и сейчас связывала их с Эдвардом, но и осталась верна своему сердцу. Кроме того, именно после этого разговора она осознала, что раньше была всецело под контролем родителей, особенно матери. Если отношения строятся на контроле, говорила Джуд, разве они могут быть здоровыми? Поскольку никаких других вариантов отношений с матерью ей не предлагалось, она решила, что обойдется совсем без них. Впрочем, Джуд все же умирала без чувства вины, потому что сделала все возможное, чтобы восстановить связь с матерью. Ей хватило смелости высказать свои чувства. К счастью, так же вышло и с Трейси: хотя шок от ее внезапной смерти был огромным, Джуд не мучило чувство вины. Всего за несколько дней до фатального несчастного случая они вместе обедали. На прощание Джуд обняла Трейси и сказала ей, что очень любит ее и ценит их дружбу. К сожалению, другим друзьям и родным Трейси повезло меньше. Она была настолько яркой и живой, что никому и в голову не приходило подумать о ее смерти. Однако внезапная автокатастрофа оборвала ее жизнь, и спустя целый год многие друзья и знакомые Джуд все еще страдали от шока и чувства вины. «Она изменила жизни многих людей, а они так и не сказали ей об этом. Самой Трейси, разумеется, чужое признание было ни к чему. Но эти люди теперь вынуждены жить, зная, что упустили шанс сказать ей спасибо. Я видела, как им отравляет жизнь чувство вины – сознание, что они могли поступить иначе». Мне это, конечно, было понятно. «Кроме того, – добавила Джуд, – хотя похвала Трейси не требовалась, ей было бы так приятно услышать добрые слова. Она была невероятно открытым и щедрым человеком. А теперьее больше нет». Я соглашалась с ней, что открыто и честно выражать свои чувства очень важно. Жизнь уже преподала мне несколько уроков на эту тему, и разговоры с Джуд только укрепляли меня в этом мнении. Она была красивой женщиной, по-прежнему непринужденно элегантной, несмотря на потерю контроля за собственным телом. Иногда у нее изо рта текласлюна, и одежду ей теперь приходилось носить скорее практичную, чем стильную. Но ее сила духа и характера никуда не делась. Улыбнувшись в знак согласия, я поделилась с ней своими мыслями: – Да. Гордость, апатия или страх перед реакцией другого человека заставляет нас многое держать в себе. Но ведь чтобы быть откровенными, требуется немало смелости, Джуд, и нам не всегда хватает на это сил. – Да, это требует смелости, Бронни, – согласилась Джуд. – Ведь я это и пытаюсь сказать. Нужна большая смелость, чтобы раскрыть другому свои чувства, особенно если у тебя проблемы и тебе нужна помощь, или если ты никогда не говорил человеку о своей любви и не знаешь, как он воспримет эти слова. Но чем чаще мы говорим людям о своихчувствах, причем любых, тем лучше становится наша жизнь. Гордость – такая пустая трата времени. Серьезно, ну вот посмотри на меня. Я даже попу вытереть себе не могу. Ну и что? Мы все люди. Нам позволено быть слабыми и уязвимыми. Это часть жизненного процесса. Перед тем, как я устроилась работать к Эдварду и Джуд, у меня в жизни был особенно сложный период. Я решила поделиться этой историей с Джуд, потому что она имела прямое отношение к теме нашего разговора: к тому, как сложно порой бывает говорить людям о своих чувствах. Работы с паллиативными пациентами уже давно было мало. Так случалось регулярно: работы либо был вал, либо нет совсем. Обычно меня это не беспокоило, потому что в периоды затишья я занималась творчеством. Однако спустя два месяца совсем без работы деньги начали заканчиваться, а предложений все не поступало. Все заработанные деньги я обычно вкладывала в творчество, поэтому сбережений у меня не было. Но раньше я уже успешно переживала такие периоды, поэтому они меня не особенно пугали. Предложения присматривать за домами тоже поступали непредсказуемо. Иногда, живя в каком-нибудь доме, я до последнего дня не представляла, куда поеду дальше – знала только, когда возвращаются хозяева. Как правило, новое предложение возникало в самый последний момент. В периоды большего благополучия мне даже нравился этот риск – он вызывал прилив адреналина. Часто все заканчивалось хорошо: кто-нибудь звонил мне в панике, спрашивая, могу ли я присмотреть за его домом, начиная прямо завтра,потому что ему срочно нужно уехать. В результате мы оба оказывались спасены, и все заканчивалось широкими улыбками и вздохами облегчения. Иногда мои клиенты договаривались друг с другом, чтобы не упустить возможность нанять меня присматривать за их домом. Они знали, в какой день я освобожусь, и заранее планировали уехать в отпуск как раз тогда, когда их друзья возвращались. Случалось, что мое расписание было распланировано на месяцы вперед. Это, конечно, было очень удобно и сильно облегчало мне жизнь. Но бывало и так, что мой срок пребывания в одном доме заканчивался, а до начала переезда в следующий оставалось еще несколько дней, неделя или даже две, и мне негде было жить. Тогда я устраивала себе отпуск и уезжала за город, навестить друзей и родных. Если в это время работа сиделкой не отпускала меня из города, я временно селилась у кого-нибудь из друзей. Вначале это давалось мне легко. Но через несколько лет такой жизни мне начало казаться, что я всех утомила своими визитами. Друзья пытались меня переубедить. Они поддерживали меня и понимали, что надолго я все равно не задержусь. Надо сказать, что, когда у меня было собственное жилье, в нем всегда непременно кто-нибудь гостил, но принимать помощь мне всегда было гораздо сложнее, чем оказывать ее другим. Постоянно спрашивая друзей, можно ли мне у них пожить, я почувствовала себя совершенно никчемной и безнадежной. Мне уже удалось успешно проработать многие старые травмы, и благодаря этому я научилась сострадать другим. Но изменить отношение к себе самой мне до сих пор не удавалось. Мне предстояло разобраться с отрицательнымишаблонами мышления, которые накапливались во мне десятилетиями, и этот процесс шел медленно и болезненно. Зерна нового, положительного отношения к себе уже были посеяны и даже дали всходы, по-разному проявляясь в моей жизни. Но мне предстояло еще избавиться от всех прежних, вредных зерен, которые тоже до сих пор прорастали. В тот период, о котором я рассказываю, работы у меня не было давным-давно, деньги почти закончились, и ситуация казалась безнадежной. Я позвонила лучшей подруге и спросила, можно ли у нее остановиться. Но у нее в жизни тоже был непростой период, и она никак не могла меня приютить. Дело было не во мне – просто так сложились обстоятельства. Но из-за своего тогдашнего отношения к себе и общего эмоционального состояния я приняла ее отказ на свой счет. Я неохотно позвонила еще нескольким друзьям, но мне не везло – у одной был полный дом гостей, другой был в отъезде, а третьему нужно было полностью сосредоточиться на работе. У меня не хватало денег, чтобы уехать из города, а просить в долг я не решилась. Мне пришлось смириться с мыслью о том, что я буду спать в машине. Раньше, в годы моих странствий на джипе, это не было проблемой. Я обожала спать на заднем сиденье своей старой машины, где был постелен удобный матрас. Но в «рисинке» это было почти невозможно – ложась, я даже не могла вытянуться в полный рост. К тому же в ней не было занавесок, а на улице стояла зима. Я не знала, к кому еще обратиться за помощью. Хотя мне было страшновато спать прямо на улице, я смирилась с этой мыслью, решив, что в безвыходной ситуации людям иногда приходится так поступать. Вечером, в сумерках, я ездила по городу, подыскивая относительно безопасные и подходящие места для ночевки. Нужно было также позаботиться о доступе к уборной – пугать мирных жителей, писая среди ночи у них перед домом, мне сейчас было совершенно ни к чему. Когда ты бездомный и стараешься привлекать к себе как можно меньше внимания, дни тянутся очень долго. Вставать нужно с восходом солнца, чтобы уехать с места ночевки, а вечером нельзя устраиваться на ночлег, пока все остальные не уйдут с улиц по домам. Да, дни были долгими, а ночи очень холодными и одинокими. Однажды вечером я услышала в кафе музыку и зашла. Я заказала чашку чая и пила ее как можно дольше, чтобы растянуть удовольствие. Мне вспомнился старик из песни Ральфа Мактелла, который пьет одну чашку чая весь вечер, чтобы подольше посидеть в тепле. Какая ирония, подумала я, ведь именно эту песню я одной из самых первых выучилась играть на гитаре. На восходе солнца я приезжала к общественным туалетам возле пляжа и ждала, пока служитель их откроет. Там я могла умыться, почистить зубы и воспользоваться уборной, стоически перенося косые взгляды служителя. Не знаю, что он обо мне думал – сама я думала о себе еще хуже, поэтому мне было все равно. Кроме того, работая с умирающими, я уже научилась не обращать внимания на чужое мнение о себе. Мне хватало проблем с собственными мыслями. В другой раз я ходила к кришнаитам, которые бесплатно кормили всех нуждающихся горячим ужином. Когда у меня бывали деньги, я их не жалела, и, если мне встречались кришнаиты, собиравшие пожертвования на эти самые ужины для бедных, я нередко кидала им в ведерко десять или даже двадцать долларов. Стоя в очереди за тарелкой, я размышляла над иронией своей ситуации. Кришнаиты мне нравились. Они были вегетарианцами, играли жизнерадостную музыку и кормили голодных. Мне этого хватало, чтобы давать им деньги. Но теперь я сама обращалась к ним за помощью, и это был довольно унизительный опыт. Как-то утром я сидела на камне в гавани, молясь о силе, выносливости и чуде. В этот момент подплыла стая дельфинов, и один из них, играя, выпрыгнул из воды. Это вселилов меня некоторую надежду. Внезапно я вспомнила о друзьях, которые могли бы меня приютить, и решила позвонить им и попроситься ночевать. Они наверняка не отказали бымне, но чувство собственной никчемности и безнадежности мешало мне обратиться к ним раньше. Мне не хватало смелости честно выразить свои чувства, хотя я могла бы просто сказать им откровенно: «Слушайте, я в полной заднице. Пожалуйста, можно я приеду и немного у вас поживу?» Твердо решившись на этот звонок, я отправилась погулять по берегу. Но внезапно у меня зазвонил телефон. Это был Эдвард, которому порекомендовали меня в качестве сиделки для Джуд. Он звонил спросить, свободна ли я, и если да, то не могу ли приступить к работе прямо сегодня. Он также добавил, что если мне нужно жилье, то в доме есть для меня прекрасная комната. Той ночью я снова спала в настоящей кровати, растянувшись в полный рост, и меня не мучили холод и затекшие ноги. Я приняла горячую ванну и закуталась в теплое одеяло, а перед этим поужинала здоровой пищей в компании трех замечательных людей, и к тому же у меня снова была работа! Как быстро меняется жизненная ситуация. Вспоминая этот период, я могла бы сказать, что виной всему было отсутствие работы. На поверхностном уровне так и было. Но всю эту ситуацию я создала сама, потому что чувствовала себя никчемной и лелеяла семена старых вредных мыслей. Очевидно, что семена новых, хороших мыслей тоже были посеяны, потому что в другие периоды мне случалось подолгу жить в благополучии и изобилии. Но бороться со старыми шаблонами мышления было тяжело, и я только усложняла себе задачу, отказываясь просить о помощи. Когда через некоторое время у меня снова возник перерыв между клиентами, я первым же делом позвонила друзьям, о которых вспомнила тем утром, глядя на дельфинов. Онис радостью пригласили меня пожить в свободной комнате. Я смогла вновь впустить в свою жизнь доброту. Мне предстояло еще долго учиться выражать свои чувства, но я встала на правильный путь. Я рассказала Джуд о том, как мне приходится учиться открытости, потому что я привыкла никому не говорить о своих чувствах и особенно о своих сложностях. Поэтому мнебыло очень ценно услышать ее мнение и честно обсудить эту тему. «Всем нужно напоминание быть откровенными, Бронни. Мы все держим в себе то, что должно быть сказано – как приятные, так и неприятные слова. Чтобы расти, мы должны говорить о своих чувствах. Это помогает всем, даже если не все это понимают. Честность всегда окупается». Улыбнувшись, я посмотрела в окно, на корабли в гавани, освещенной полной луной. Вид был потрясающий. Джуд снова заговорила о чувстве вины и о том, что мы можем избежать его, если будем честно рассказывать людям, что у нас на сердце. Тогда нам не придется сожалеть об упущенных возможностях, особенно если мы внезапно лишимся близкого человека. Мы также избавимся от ограничений, став свободными, как дети. Мы никогда не должны винить себя за то, что открыли кому-то свои чувства, и никогда не должны внушать другим чувство вины, если им хватило смелости поступить так же. Я провела с Джуд около двух месяцев, прежде чем ее состояние ухудшилось настолько, что ей пришлось переехать в хоспис. У меня снова было много предложений о работе сиделкой, также меня попросили надолго поселиться в одном доме на время отъезда хозяев. Как-то я навестила Джуд в хосписе, где, к своей радости, встретила Эдварда и Лайлу. Кроме того, возле кровати больной сидела женщина, которую я раньше никогда не видела, но ее сходство с Джуд не оставляло никаких сомнений: это была ее мать. Эдвард принял решение передать письмо Джуд ее матери, не дожидаясь ухода любимой. Она уже не могла говорить, но все необходимое было сказано в письме. Джуд написаламатери, что любит ее и всегда любила. Она писала о тех прекрасных вещах, которым научилась у нее, и о совместных счастливых воспоминаниях. В письме не было ни слова упрека или жалобы, потому что Джуд ненавидела чувство вины и хотела, чтобы мать, несмотря на все сложности между ними, знала, как она ее любит. Через несколько дней мать Джуд внезапно пришла в хоспис и с тех пор заходила туда каждый день. Она садилась у кровати и держала дочь за руку, глядя, как ее постепенно покидает жизнь. Немного поговорив с Джуд, я поцеловала ее в щеку, поблагодарила и простилась. «Увидимся на той стороне, Джуд», – сказала я, улыбаясь сквозь слезы. Она хмыкнула мне вответ, и глаза ее улыбались, хотя рот оставался неподвижным. Мы с Эдвардом и Лайлой вместе дошли до «рисинки», держась за руки. Все трое плакали. Но день был наполнен такой искренней любовью, что эти слезы не были горькими. Эдвард рассказал, что мать Джуд много разговаривала с ней, и что он видел, как по щекам Джуд текут слезы, особенно когда мать говорит, что любит ее. Она извинилась за своеотношение к дочери и призналась, что втайне завидовала ей, особенно тому, как смело она пренебрегла мнением общества, – самой ей это так и не удалось. На прощание обняв Эдварда и Лайлу, я от души пожелала им всего самого лучшего. Уезжая, я думала о Джуд, которую держит за руку ее мать, и о силе любви. Сердце мое было полно печали, но одновременно мне было радостно на душе. Пару лет спустя мне неожиданно пришло письмо от Эдварда. Он рассказал, что Лайла провела с бабушкой несколько замечательных месяцев, прежде чем та тоже перешла в мир иной. Он писал, что перед смертью она совершенно изменилась и даже временами напоминала ему любимую Джуд. После похорон Эдвард и Лайла решили уехать из города и поселиться в горах, поближе к его отцу и чистому воздуху. Около года назад он встретил новую любовь, и теперь у Лайлы должна скоро родиться сестричка. Я с радостью ответила на письмо, поздравив Эдварда и желая всем счастья. Я с удовольствием поделилась с ним своими воспоминаниями о Джуд: ее улыбке, терпении в болезни, принятии, о решимости донести до других свою мысль. Чувство вины отравляет. Чтобы жить счастливой жизнью, необходимо говорить о своих чувствах. Я и сейчас помню, как сидела у ее кровати, за окном полная луна освещала залив, а Джуд все говорила и говорила – пока еще у нее была такая возможность, – твердо намеренная быть услышанной. Я ее услышала. Благодаря ей я узнала счастье выражать свои чувства так же искренне, как тот дельфин, что от радости выскочил из воды. Неожиданные дары В домах престарелых мне уже случалось работать с пациентами, страдавшими от болезни Альцгеймера, но Нэнси была моей первой домашней пациенткой с этим заболеванием. До болезни она была доброй и ласковой женщиной, матерью трех детей и бабушкой десяти внуков. Ее муж тоже был жив, но крайне редко заходил к ней в комнату – легко было забыть, что он вообще живет в одном с ней доме. Три сестры и два брата Нэнси по очереди приходили ее навещать. Вначале заглядывали и друзья, но постепенно их визиты становились все реже. Уход за Нэнси был тяжелымизматывающим трудом. Она была беспокойной пациенткой, и уследить за ней было очень трудно: она не желала оставаться на одном месте дольше минуты и бóльшую часть времени мучилась от тревоги и тоски. Спокойные и умиротворенные минуты выпадали Нэнси – а вместе с ней и мне – редко и ненадолго. Со временем ее болезненное беспокойство настолько усилилось, что врач и родственники решили увеличить дозу лекарства. После этого Нэнси стала спать днем. Когда она бодрствовала, все, что она говорила, звучало набором бессмысленных звуков и слогов, как часто бывает у людей с Альцгеймером. В ее речи перемешивались части разных слов. Временами в ней можно было узнать английский язык, но нельзя было разобрать ничего структурированного, формального или понятного. Тем не менее я обращалась с Нэнси точно так же, как со всеми своими пациентами, с любовью и лаской, и много разговаривала с ней. Иногда она замечала мое присутствие, а иногда витала мыслями где-то очень далеко и не обратила бы на меня внимания, даже если бы у меня выросла третья рука. Водить Нэнси в душ входило в обязанности ночной сиделки, хотя иногда этим занималась и я. Мыть ее выпадало мне, если ночь была особенно беспокойной, и в восемь утра, когда я заступала на смену, Нэнси еще спала. Как правило, приходя на работу, я заставала Нэнси в душе. Иногда она улыбалась мне, сидя на специальном табурете, пока ночная сиделка намыливала ее. Так выяснилось, что одна из сиделок использует в работе очень странные методы. Первый тревожный звонок прозвучал однажды холодным зимним утром. Зайдя в комнату Нэнси, я обнаружила ее лежащей на кровати поверх одеяла, совершенно голой и трясущейся от холода. Она только что была в душе, и во время мытья опорожнила кишечник. Это была довольно типичная ситуация – так происходило со многими пациентами, когдаони садились на табуретку для мытья, потому что в ней было отверстие, и они путали ее с сиденьем унитаза. Эту табуретку действительно можно было использовать над унитазом, если пациенту требовалось сиденье выше стандартного. Так что неудивительно, что иногда в душе случались подобные недоразумения. Нэнси была стеснительной женщиной из скромной семьи. Лежать на кровати совершенно голой, не прикрытой даже простыней, было для нее само по себе травматично. Но кроме этого, она дрожала от холода и казалась хрупким маленьким ребенком. Войдя в комнату и обнаружив ее в таком виде, я немедленно схватилась за полотенце, вытерла ее инакрыла теплым одеялом. Другая сиделка в это время убиралась в ванной комнате. Я не удержалась и сделала ей замечание, сказав, что убраться можно и потом, ведь комфорт пациента важнее чистого пола. Ночная сиделка только пожала плечами. Второй тревожный звонок прозвучал, когда я сменяла эту же сиделку несколько недель спустя. Я редко ношу наручные часы и вообще предпочитаю не жить по часам, когда это возможно. Поэтому, если по работе мне нужно следовать строгому расписанию, я предпочитаю во избежание стресса выходить намного раньше. Так я больше удовольствия получаю от дороги, будь она долгой или короткой, и куда больше замечаю по пути. В то утро дороги были на удивление свободными, и я приехала на работу очень рано. После первого неприятного случая в душе ночная сиделка стала мыть Нэнси раньше, так что я больше не заставала их в ванной комнате. Нэнси была не первой нашей совместной пациенткой – за последние несколько лет мы регулярно встречались на пересменке. Вообще-то мы с этой сиделкой нормально ладили, но меня всегда немного смущал ее недостаток эмпатии по отношению к пациентам, из-за которого я сомневалась в ее профессионализме. Мои сомнения возросли, когда я заглянула в ванную комнату поздороваться и увидела, что бедная Нэнси сидит на табурете, синяя от холода, и трясется так, что у нее зуб на зуб не попадает. На вопрос что происходит, ночная сиделка ответила, что ее учили мыть пациентов именно так. Пару минут, сказала она, пациента нужно поливать ледяной водой, потом пару минут теплой, еще пару минут холодной, потом снова теплой, но заканчивается душ всегда холодной водой. Это улучшает циркуляцию крови, пояснила она. Не исключено, что она даже была права – я и сама всегда чувствовала себя особенно бодрой после купания в холодной реке, – но сейчас это не имело значения. Дело в том, что на улице стояла зима, и ветер завывал так, что дрожали окна. Даже в помещении нужно было тепло одеваться, чтобы не замерзнуть. Наша пациентка была смертельно больна. Вряд ли улучшение кровообращения могло ей помочь. Нэнси уже была слишком слаба, и прежде всего нуждалась в тепле и комфорте. Нашей задачей было обеспечивать ее благополучие, в том числе следить, чтобы ей было удобно и хорошо, а не оставлять ее сидеть на табуретке, замерзшую и напуганную. По моему глубокому мнению, больше всего ей был нужен уют и любящий уход. Я совсем не напористый человек, но, если нужно, могу проявить характер, особенно когда вижу жестокость или несправедливость. Я высказала ночной сиделке все, что думаю о ее методах, хотя и в мягких выражениях. Мы договорились, что отныне она будет мыть Нэнси только теплой водой. Дни продолжали течь в привычном распорядке. Эта сиделка надолго уехала в отпуск, и на смену ей вышла другая – тоже моя знакомая, по имени Линда. Я всегда с удовольствием сменяла ее, потому что с ней приятно было поболтать, и мне нравились ее профессионализм и рабочая этика. Я вздохнула с облегчением, радуясь за нашу пациентку. Нэнси продолжала разговаривать так же бессмысленно, как и обычно. Если она не спала, то основную часть времени проводила в тревожном возбуждении. Однако благодаря лекарствам эти приступы тревоги уже не длилась так долго, как раньше. Бортики кровати Нэнси должны были постоянно оставаться поднятыми, но, если она была спокойна, яопускала их, чтобы между нами не было преграды. Иногда Нэнси хорошо реагировала на заботу, например, когда я мазала ей ноги кремом. Но даже в спокойные моменты она разговаривала на собственном, никому не понятном языке. В нем не было ни ясности, ни структуры, только неразборчивые слоги, которые никак не складывались в единое целое. К моменту нашего знакомства она уже несколько месяцев разговаривала только так. Однажды после похода в туалет Нэнси медленно шлепала назад к кровати, держа меня за руку. Я уронила на пол тюбик, который несла в другой руке, и, рассмеявшись, нагнулась его поднять. Я всегда обращалась с Нэнси так же, как со всеми остальными пациентами, даже если она ни на что не реагировала и ничего не понимала. Так что я выпрямилась, продолжая разговаривать с ней, и вдруг, посмотрев мне прямо в глаза, она произнесла совершенно отчетливо: «По-моему, ты очень милая». Я расплылась в улыбке, и некоторое время мы стояли, улыбаясь друг другу. Передо мной была совершенно вменяемая женщина. Она прекрасно сознавала все, что происходит вокруг. Я искренне ответила: «Я тоже считаю, что вы очень милая, Нэнси». Она улыбнулась еще шире, и мы обнялись, а потом вновь улыбнулись друг другу. Это был прекрасныймомент. С равновесием у Нэнси было неважно, поэтому мы пошлепали дальше к кровати, держась за руки. Когда я посадила ее на краешек кровати и начала поднимать ей ноги, Нэнси произнесла длинную и абсолютно бессмысленную фразу на «языке Альцгеймера». Ее сознание вновь затуманилось, но недолгое время она видела и понимала происходящее с полной ясностью. Страдающие болезнью Альцгеймера могут большую часть времени не понимать, что происходит. Но, даже если они не в состоянии четко выражать свои мысли, и нередко эти мысли крайне спутаны, это еще не значит, что они не воспринимают происходящее хотя бы частично. Убедившись в этом на собственном опыте, я навсегда изменила свое мнение об этой болезни. Несколько недель спустя я рассказала об этом эпизоде Линде, ночной сиделке, и она согласилась, что это редкий случай. Однако вскоре и Линда столкнулась с проявлением осознанности у Нэнси, хотя и в менее трогательной форме. В ее обязанности входило ночью каждые четыре часа перекладывать Нэнси с боку на бок, чтобы избежать пролежней. Часто Нэнси при этом глубоко спала, но доктор категорически запрещал нам пропускать эту процедуру. Однажды ночью, около четырех часов, Линда подошла к кровати,и Нэнси совершенно четко сказала ей: – Не смей меня трогать. – Как скажете, Нэнси, – ответила изумленная Линда. – Сладких снов. Родные Нэнси каждый день отпускали меня на полчаса пообедать. Смены были долгими и утомительными, и я с радостью пользовалась передышкой. Дом Нэнси был недалеко отпляжа, так что я спускалась с холма и стояла на скалах, глядя на море. Скалы почти везде были покрыты морскими желудями и лужицами соленой воды, но все равно можно было подойти к самому краю. Вдыхая океанский воздух, я радовалась свежему бризу и бескрайней глади воды. Иногда я встречала на берегу человека, игравшего на саксофоне.Его музыка звучала просто волшебно, паря над океанскими волнами, идеально попадая в такт. Я стояла как зачарованная, впитывая происходящее, пока мне не пора было возвращаться на работу. Воспоминания об услышанной музыке потом поддерживали меня до самого конца смены. Разумеется, вернувшись, я сообщала об этом Нэнси, хотя она и казалась совершенно безучастной. Меня это не смущало. Я хотела лишь сделать ее жизнь немного разнообразней, рассказывая ей о внешнем мире. Ведь весь мир Нэнси теперь сводился к спальне, ванной и гостиной. В течение пары месяцев я рассказывала ей о саксофонисте, не замечая никакой реакции или интереса с ее стороны. Но однажды, вернувшись с перерыва в особенно приподнятом настроении, я попыталась описать мелодию, которую музыкант играл в тот день (как будто музыку можно описать словами). И тут Нэнси посмотрела мне в глаза и улыбнулась. Через несколько минут, убирая в шкаф постиранное белье, я вдруг услышала, что она негромко что-то напевает. В это время суток Нэнси обычно бывала особенно тревожной и беспокойной, но в тот день приступа не было, она просто мурлыкала и мурлыкала какой-то мотив без слов, довольно долго. Затем пение прекратилось так же внезапно, как началось, и Нэнси вновь сделалась отрешенной. Видя эти проблески ясности, я радовалась, что не прекращала разговаривать с Нэнси, несмотря на отсутствие реакции. Даже если человек не реагирует на наши слова так,как нам хочется, это еще не повод жалеть о предпринятой попытке. Реакция других людей – это их выбор, точно так же, как наша собственная реакция – наша ответственность. По мере того, как я кирпичик за кирпичиком разбирала стены вокруг своего сердца, во мне росла потребность самовыражения. Во-первых, я хотела свободно говорить о своих мыслях и чувствах, а во‑вторых, мне стало не так уж важно, что обо мне подумают люди. Гораздо важнее для меня теперь было то, что я думаю о себе сама. В любом случае я решила быть всегда смелой и искренней. Кроме того, чем лучше у меня получалось быть открытой, тем больше мне это нравилось. Я понимала, что меняюсь в лучшую сторону, но это еще не означает, что другие люди охотно примут мои метаморфозы. Я медленно освобождалась от своего прошлого, становясь все сильнее. Окружающие не всегда положительно на это реагировали, но я хотела быть собой, а не тем человеком, которым они привыкли меня видеть. Внутри меня рождался новый человек, и этот человек хотел выйти на свободу и показаться миру. Особенно у меня разладились отношения с одной старой подругой, причем уже давно. Они стали казаться мне «игрой в одни ворота», и наконец я набралась смелости откровенно сказать ей о своих чувствах. Я не критиковала ее, а просто поделилась тем, что мне тяжело брать на себя всю инициативу в наших отношениях. Мы дружили очень давно, и я думала, что честность поможет нам наладить отношения. Но вышло иначе: моя искренность показала, что нас объединяют только привычка и общие воспоминания. Подруга обрушила на меня целую бурю гнева. Я понимала, что виной тому страх и обида, но все равно поразилась, сколько злости она на меня выплеснула. Японяла, что совершенно не знаю этого человека. Когда она полностью порвала со мной отношения, я приняла это спокойно. В любом случае я до сих пор вспоминаю годы нашей дружбы как прекрасный дар. У меня остались о ней только хорошие воспоминания, но отказаться от этой дружбы было относительно легко, потому что, если в отношениях нет честности и равноправия, в них также нет и смысла. Совершенных людей не бывает, и я, безусловно, несовершенна. Я тоже способствовала нашему разладу, осознанно или бессознательно. Но если один человек никогда не высказывает своих истинных чувств, потому что боится ссоры, то это неравные и нездоровые отношения, в которых доминирует кто-то один. И наоборот, честность помогла мне наладить отношения с другой подругой. Я тогда переживала сложный момент, поэтому иногда звонила ей. Но у нее редко находилось время меня выслушать, если только ей самой не было от меня что-нибудь нужно. Наконец, у меня лопнуло терпение, и я откровенно сказала ей, что вообще-то мне сейчас очень нужна поддержка. Эта искренность немедленно сблизила нас, и мы замечательно поговорили. Она тоже многое мне рассказала, и наша дружба только выиграла от взаимного уважения и эмоциональной зрелости. На эту подругу действительно не всегда можно было рассчитывать, и мы обе признали и приняли это. Вместо того чтобы всецело полагаться на поддержку этой подруги, я стала самостоятельней и чаще общалась со старыми друзьями. Теперь я чуть меньше в ней нуждалась, а ей пришлось привыкнуть к тому, что я не всегда готова прийти ей на выручку. У меня иногда не хватало на это сил, да я уже и не чувствовала необходимости играть эту роль. Признав хрупкость друг друга и найдя в себе смелость быть искренними, мы во многом стали гораздо ближе. Сегодня наша дружба полностью свободна от давления с обеих сторон. Это зрелые, честные и радостные отношения. Мы не так часто общаемся, как раньше, и наши жизни не так тесно переплетены, как когда-то. Но ведь все отношения меняются, в том числе дружеские. Несмотря на все, что случилось, сегодня мы ближе, чем были раньше. Мы честны друг с другом и на все сто процентов принимаем друг друга такими, какие мы есть, а не такими, какими хотели бы друг друга видеть. Встречаясь и созваниваясь, мы обе наслаждаемся каждой минутой, проведенной вместе. Искренность стоит дорого, я убедилась в этом с первой подругой. Но зато теперь уверена, что у меня в жизни остались только честные и качественные отношения. Сегоднясамовыражение – одна из моих основных движущих сил. Со временем мне становится все легче быть искренней и раскрываться перед людьми. Хотя мой путь к открытости был долгим, он определенно стоил затраченных усилий. Кроме того, этот путь показал мне, как сложно приходится другим людям, идущим к той же цели. Глядя на то, сколько хорошего я приобрела, искренне говоря о своих чувствах, я всем желаю однажды обрести такую же свободу. Наш короткий разговор с Нэнси, островок взаимопонимания посреди моря бессмысленности, в котором она жила, был одним из прекраснейших моментов в моей жизни. Если быя не разговаривала с ней до этого, раскрывая ей себя и ничего не ожидая взамен, я бы никогда не пережила этого момента. Считать, что другие знают о ваших чувствах, что у вас еще будет время поговорить, – это риск, ведь каждый из нас может погибнуть в любой момент. Мы все порой переживаем тяжелые дни, но всегда можно найти и хорошие мысли, которыми можно поделиться друг с другом. Вот почему обязательно нужно регулярно делиться с людьми своими чувствами и мыслями, а также внимательно слушать, что они говорят. Слишком легко мы позволяем себе погрузиться в собственный маленький мирок и забыть об этом. У известного австралийского певца Мика Томаса есть песня о человеке, который не ценит окружающих. Герой этой песни настолько занят собой, что даже не заметил, что его подруга сменила цвет волос, и вообще невнимателен к ней. Основная мысль песни вынесена в название: «Он забыл, что она прекрасна». Хотя в этой песне говорится о мужчине, который не ценит свою женщину, она применима к любому человеку. Женщины тоже перестают ценить своих мужчин, не замечая их внутренней или внешней красоты; они также не всегда понимают, что мужчины могут выражать свою любовь не словами, а делами. Дети не ценят родителей. Иногда родители не ценят детей. Друзья, братья, сестры, коллеги, бабушки и дедушки, соседи – всех этих людей мы регулярно не ценим. Легко зациклиться на качествах людей, которые нам не нравятся (и которые все равно являются лишь отражением нас самих). Но очень часто мы не говорим и о том, что намнравитсяв других. Да, иногда нужна смелость, чтобы искренне высказать свои чувства, и при этом мы не знаем, как на них отреагируют другие люди. Их потребности тоже требуют уважения. Впрочем, я обнаружила, что честность всегда вознаграждается, хотя и не всегда так, как мы ожидаем. Иногда наградой оказывается уважение к себе, а иногда жизнь без чувства вины после смерти близкого человека. Иногда это исчезновение из жизни нездоровых отношений, а иногда что-то совсем неожиданное. Главное, что, находя в себе смелость открыто говорить о своих чувствах, мы делаем только лучше себе и другим. Чем дольше мы откладываем откровенный разговор, тем дольше носим в себе то, что должно быть сказано и услышано. Нэнси больше ни разу не говорила со мной осмысленно, но это было уже неважно. Та радость, которую подарил мне наш короткий диалог, была достаточной наградой за все усилия. Однажды днем внук Нэнси пел ей песню и заметил, что она вынырнула из забытья, хотя на этот раз она ничего не сказала. Она просто посмотрела ему в глаза и улыбнулась – не как улыбаются люди с болезнью Альцгеймера, а как обычная бабушка, которая гордится талантливым внуком. Мы никогда не знаем заранее, какие дары преподнесетнам жизнь, но я твердо уверена в одном: смелость и честностьвсегдавознаграждаются. Четвертое сожаление Жаль, что я растеряла друзей Иногда, в перерывах между регулярными пациентами, за которыми я ухаживала у них дома, я выходила поработать смену-другую в дом престарелых. Это случалось нечасто –к моей большой радости, потому что я терпеть не могла эти заведения. Не все пациенты в них были паллиативными: многие из них просто нуждались в квалифицированной помощи. Я не ухаживала за каким-то конкретным человеком, а помогала персоналу везде, где было нужно. Если вы хотите и дальше закрывать глаза на состояние нашего общества, никогда не ходите в дома престарелых. Но если однажды вы почувствуете в себе силы узнать правду, загляните в одно из этих заведений. В них живет много одиноких людей – очень много. И любой из нас может к ним присоединиться. Глядя на работников домов престарелых, я испытывала одновременно отчаяние и надежду. Некоторые из них были замечательными людьми, явно нашедшими свое призвание. Это счастье, что в мире есть такие жизнерадостные и добросердечные люди. Но в большинстве домов престарелых нехватка персонала, и этим людям нелегко заражать остальных своим оптимизмом. Много было и таких сотрудников, которые либо устали от своей работы, либо никогда ее не любили. Умение сострадать людям – очень полезный навык, и как раз его катастрофически не хватало в той команде, в которую я попала в ночь своего знакомства с Дорис. Обитатели дома престарелых медленно шаркали в сторону общей столовой, опираясь на свои трости и ходунки. Это были люди из достаточно обеспеченных семей, потому что дом был частный, «класса люкс». Интерьеры в нем действительно были красивыми, садик – ухоженным, везде было чисто, но вот кормили там просто ужасно. Вся еда привозилась уже готовой и разогревалась в микроволновке, лишаясь по пути всякого вкуса и запаха. Я ни разу не видела на кухне свежих и полезных продуктов. Обитатели дома престарелых заранее заказывали еду на всю следующую неделю, и во время обеда сотрудники молча, не здороваясь и не произнося ни единого доброго слова, расставляли перед ними тарелки. Мне поручили разносить тарелки, и, видя мое приветливое лицо, старики касались моей руки, чтобы я задержалась и поговорила с ними. Это были обычные люди с совершенно ясным умом, и им хотелось общаться. Да, их тела состарились и сделались хрупкими, но всего год или два назад эти очаровательные люди были независимы и жили собственной жизнью у себя дома. Вернувшись на кухню за новым подносом тарелок, я увидела косые взгляды других сотрудников. Они были недовольны тем, что, разнося еду, я немного поболтала и посмеялась с пациентами. Я проигнорировала это недовольство. Возвращая одной из сотрудниц тарелку с бараниной, я дружелюбно сказала: – Берни заказывал курицу, а не баранину. Усмехнувшись, она ответила: – Будет есть то, что дают. – Да ладно, – сказала я, – наверняка мы можем найти ему курицу. – Пусть ест баранину, или вообще ничего не получит, – ответила она жестко. Я почти посочувствовала ее очевидной неудовлетворенности в жизни, но мне не понравилось, как она выполняет свои рабочие обязанности. Я вернула баранину Берни, и тут ко мне подошла другая сотрудница, Ребекка: – Не обращай на нее внимания, Бронни. Она всегда такая. Обрадовавшись, что встретила понимающего человека, я улыбнулась: – Она меня совершенно не волнует. Мне просто жаль стариков, которые день за днем вынуждены терпеть такое обращение. Ребекка согласилась: – Меня это тоже сначала расстраивало. А теперь я просто делаю все, что могу, чтобы им лучше жилось, и принимаю то, что нельзя изменить. – Ну и хорошо, – ответила я. Похлопав меня по плечу, она ушла. «Тут есть неравнодушные люди, нас немного, но мы есть». Раздав еду, собрав посуду и прибравшись на кухне, часть персонала отправилась на улицу покурить. Некоторые сотрудники остались в столовой пообщаться с подопечными. Вокруг нас собралось с дюжину человек, мы беспечно болтали и смеялись. Я поражалась хорошему настроению и чувству юмора местных обитателей, удивляясь тому, как хорошо они приспособились к новым условиям жизни. В этом доме престарелых у каждого старика была отдельная комната с ванной и туалетом. Вечерами я обходила их, помогая всем переодеваться в пижамы и ночные рубашки и понемногу узнавая что-то о каждом по убранству комнат: по фотографиям улыбающихся родных, картинам, любимым чашкам и вязаным коврикам. У некоторых на балконах стояли цветы в горшках. Дорис уже переоделась в ночную рубашку, когда я жизнерадостно влетела в ее комнату и представилась. Она только молча улыбнулась и отвела взгляд. Я спросила, все ли у нее в порядке, и в ответ она залилась слезами. Присев рядом с ней на кровать, я молча обнимала ее, пока она всхлипывала, вцепившись в меня обеими руками. Поток слез прекратился так же быстро, как начался, и Дорис потянулась за носовым платком. – Ох, как неловко, – сказала она, вытирая глаза. – Прости, солнышко, я просто глупая старуха. – Что случилось? – спросила я ласково. Дорис вздохнула, а потом рассказала, что она в доме уже четыре месяца и практически ни разу не встретила приветливого лица. Она заплакала, потому что увидела мою улыбку, сказала она, и тут я сама почти расплакалась. Единственная дочь Дорис давно переехала жить в Японию, и, хотя они часто созванивались, былой близости между ними уже не было. «Когда ты мать и укачиваешь на руках свою крошечную малышку, невозможно представить, что ваша близость в один прекрасный день может исчезнуть. Но это случилось. Случилась жизнь. И ведь мы не ссорились, вовсе нет. Просто она живет своей собственной жизнью и очень занята, – рассказывала Дорис. – Да, я родила ее на свет, но наши дети нам не принадлежат. Нам просто выпадает честь помогать им, пока они не расправят крылья и не вылетят из гнезда, – и вот она улетела». Я прониклась теплотой к этой старушке и пообещала вернуться через полчаса и еще поговорить, если она дождется окончания моей смены. Она сказала, что будет счастлива подождать. И вот мы с Дорис сидели у нее в комнате, она в кровати, а я на стуле рядом. Она рассказывала о себе, держа меня за руку и то и дело бессознательно перебирая мои пальцы и кольцо. «Я тут умираю от одиночества, солнышко. Я слышала, что от него на самом деле можно умереть, и теперь я в это верю. Иногда мне так не хватает прикосновений», –сказала она печально. Я была первой, с кем она обнялась за четыре месяца. Она не хотела грузить меня своими проблемами, но я настояла. Мне хотелось узнать ее получше, и она пожаловалась: «Больше всего я скучаю по своим друзьям. Кто-то из них умер. Кто-то попал в дом престарелых, как и я. Кто-то с годами потерялся. Сейчас мне безумножаль, что я растеряла друзей.Нам кажется, что они всегда будут рядом. Но жизнь продолжается, и внезапно мы оказываемся одни, и никто в целом мире не понимает нас и ничего о нас не знает». Я предложила ей попробовать поискать потерянных друзей, но она только покачала головой: – Я даже не знаю, с чего начать. – Давайте я помогу! – воскликнула я и рассказала ей об интернете. Для Дорис это был темный лес, но она очень старалась разобраться. Вначале она отказывалась от помощи, не желая меня затруднять. Но мне удалось убедить ее, что мне это будет даже интересно: я с удовольствием проведу для нее маленькое расследование. В годы работы в банке я некоторое время работала в отделе борьбы с мошенничеством, и мне там очень нравилось. Дорис это сравнение насмешило. – Пожалуйста, позвольте мне помочь, – настаивала я. С печальной улыбкой, полной надежды, она согласилась. У меня было несколько причин предложить Дорис помощь. Во-первых, она мне сразу понравилась, а во‑вторых, я действительно могла ей помочь: у меня было все необходимое, чтобы попытаться разыскать ее друзей. Но главная причина была в том, что я понимала ее боль. Мне тоже случалось страдать от одиночества и чувства, что меня никто не понимает. Когда-то я так устала от боли, что полностью ушла в себя, отгородившись от мира стеной. Мне, как и многим другим людям, казалось: если никого к себе не подпускать, можно избежать страданий. Если никто не сможет ко мне приблизиться, думала я, никто не сможет меня обидеть. Разумеется, единственный настоящий способ исцелить боль – это позволить потоку любви свободно течь через свое сердце, но, чтобы это осознать, иногда уходит много времени. Внешне я казалась вполне дружелюбным человеком, но боль от прошлых ран по-прежнему отягощала меня. Я уже доросла до искреннего сочувствия тем, кто когда-то причинял мне страдания своими негативными словами и эмоциями. Но мне предстояло еще работать и работать над отношением к себе самой. Нужно было разобраться с десятилетиями негативных мыслей, и временами это бывало невыносимо больно. Хотя головой я понимала, что заслуживаю большего, чем привыкла думать, на эмоциональном уровне мне еще многое нужно было исцелить. Моим лейтмотивом стала песня Sunday morning, «Воскресное утро». Я всегда любила Криса Кристофферсона – он оказал сильное влияние на мое собственное творчество, – а эта песня просто идеально выражала мое одиночество. По воскресеньям мне действительно бывало особенно тяжело. Люсинда Уильямс тоже хорошо описала это чувство в песне Ican’t seem to make it through Sunday («Воскресенье мне дается особенно тяжело»). Впрочем, проблема была не только в воскресеньях. Одиночество оставляет в сердце пустоту, которая физически способна нас убить. Боль невыносима, и чем дольше мы ее терпим, тем глубже наше отчаяние. В те годы я вовсе не сидела, запершись дома, но одиночество – это не отсутствие людей рядом. Это отсутствие понимания и принятия. Множество людей испытывают одиночество в толпе народа. Когда человек один в толпе, его одиночество даже обостряется. Совершенно неважно, сколько вас окружает людей. Если рядом нет никого, кто вас понимает, кто принимает вас целиком и полностью, одиночество с готовностью протянет к вам свою ледяную руку. Быть наедине с собой и быть одиноким – совсем не одно и то же; быть наедине с собой я всегда любила. Когда человек один, он может быть одинок, аможет быть совершенно счастлив. Но когда человек одинок, он тоскует по обществу людей, которые его понимают. Иногда чувство одиночества связано с тем, что человек один, но далеко не всегда. Мое одиночество стало таким невыносимым, а боль в сердце настолько мучительной, что я начала задумываться о самоубийстве. Разумеется, я вовсе не хотела умирать. Я хотела жить. Но, чтобы освободиться от боли и ложных представлений о себе и осознать, чего я стою на самом деле, иногда требовалась огромная сила. Порой попытки впустить любовь и счастье обратно в свою жизнь – или хотя бы признать, что я заслуживаю их, – были настолько тяжелы, что самоубийство казалось легким выходом из ситуации. Когда боль и одиночество стали нестерпимыми, меня спасли доброта и понимание. Мне позвонил друг, который знал, что у меня сложный период в жизни, но не знал, что ровно в этот момент я пишу предсмертную записку. Я была готова умереть. У меня просто не было сил жить дальше, превозмогая постоянную боль в сердце. Друг велел мне не говорить ни слова, а только слушать. Сквозь слезы я услышала в телефонной трубке, как он заиграл на гитаре песню Дона Маклина «Винсент». Он пел эту грустную, нежную песню, в которой рассказывается о страданиях Ван Гога, заменяя имя «Винсент» на «Бронни». Слушая его, я плакала все сильнее – над чужой болью и над своей собственной. Когда он закончил играть, ямоглатолько всхлипывать. Мой друг молча ждал, пока я успокоюсь, и наконец я поблагодарила его и положила трубку, продолжая плакать. Больше в тот момент я ничего не могла сказать. Той ночью я уснула совершенно изможденная и опустошенная. Но я знала, что благодаря пониманию и доброте этого друга в моей жизни вновь забрезжил огонек надежды. На следующий вечер внезапно позвонил старый друг из Англии. Мы долго разговаривали по душам, и силы стали понемногу возвращаться ко мне. В другой раз, немного позже, но в тот же одинокий период жизни, я ехала за рулем. Мне было очень тяжело на душе, я молилась о помощи и поддержке, и в этот момент в лобовое стекло врезалась птица. Она была достаточно крупной, и громкого хлопка от удара хватило, чтобы я пришла в себя. Я очень люблю животных, поэтому смерть птицы меня еще больше расстроила, но одновременно и пробудила к жизни. Любой из нас может вот так же в одночасье погибнуть –готовали я к этому? Я поблагодарила птицу за ту роль, которую она сыграла в моей жизни, и поехала дальше, уже осознанно. В этот момент по радио зазвучала классическая музыка, совершенно очаровавшая меня. Невероятно нежные звуки наполнили мое сердце, унося из него боль. Пока играла музыка, я чувствовала только счастье и вдохновение. Тогда я решила, что это и есть главное в жизни: прекрасные мгновения. Да, просто прекрасные мгновения и ничего больше. Мне захотелось жить, чтобы узнать еще много таких мгновений. Вот почему я понимала, через что проходит Дорис, – мне и самой случалось на физическом уровне ощущать боль от печали и одиночества. Она бывала в окружении людей в столовой и других общих помещениях, но ей не хватало понимания и принятия. Дорис скучала по друзьям, потому что только они по-настоящему понимали ее. Раз у меня была возможность облегчить ее страдания, как я могла оставаться в стороне? На следующей неделе я забежала к Дорис и забрала список имен, написанных на листке бумаги ее красивым старомодным почерком. За чаем она рассказала мне все, что могла, о своих четверых друзьях и о том, где они жили, когда она в последний раз с ними общалась. Первую подругу оказалось легко найти, но она пережила инсульт и не могла разговаривать. Узнав об этом, Дорис продиктовала мне записку, которую сын подруги обещал прочесть ей вслух. Хотя новости об инсульте расстроили Дорис, ее утешала мысль, что она может хотя бы передать подруге сообщение. «Милая Элси. Я с большим сожалением узнала о твоей болезни. Годы пролетели так быстро. Элисон все еще живет в Японии. Я продала дом и переехала в дом престарелых. Это письмо пишет за меня одна молодая женщина. Я люблю тебя, Элси. Твоя Дорис». Это было простое письмо, но в нем Дорис высказала все, что хотела. Тем же вечером я позвонила сыну Элси и передала это сообщение. Позже он перезвонил и рассказал, что, слушая его, Элси радостно улыбалась. Я передала это Дорис, которая тоже довольно заулыбалась. В течение нескольких недель я разыскала еще двух подруг, но к несчастью, они обе уже умерли. Дорис лишь кивнула, узнав об этом. Вздохнув, она произнесла: «Ну что же, этого следовало ожидать, солнышко». Я решила непременно отыскать последнюю подругу. Поиски в интернете и звонки долго не приносили никакого результата. Сколько я ни звонила по разным номерам, мне вежливо отвечали: «Извините, фамилия наша, но у нас такой нет». Пока шли поиски, я навещала Дорис два раза в неделю. Как только я садилась рядом, она всегда сразу же брала меня за руку и не отпускала, пока я не уходила. Иногда, волнуясь, что я могла бы получше проводить время, она пыталась скорей со мной проститься или убеждала не приходить вовсе. Когда я в ответ уверяла ее, что тоже получаю от наших встреч массу удовольствия, она с облегчением вздыхала. У стариков можно многому научиться – они столько пережили. Разве я могла не получать удовольствие от наших чудесных бесед? Они меня просто завораживали. Наконец в моих поисках последней подруги Дорис наступил прорыв. Мне перезвонил пожилой мужчина, который когда-то жил по соседству с Лоррейн. Он рассказал, в какой район переехала ее семья, и я тут же ее нашла. Когда я позвонила по найденному номеру, мне ответила сама Лоррейн! Я объяснила, кто я и почему звоню, и она ахнула от радости. Я с удовольствием согласилась передать Дорис ее номер. Разумеется, я сразу же поехала к Дорис. Обняв ее, я с широкой улыбкой протянула ей листок бумаги с именем и номером телефона Лоррейн. Она снова схватила меня в объятия и прижала к себе. Это был незабываемый момент. Я бросилась за телефоном. Перед тем как звонить, я предупредила Дорис, что не хочу подслушивать чужой разговор и выйду из комнаты. Она протестовала, но без особого энтузиазма, и я видела, что она не против: она была слишком взволнована. Впрочем, она попросила меня подождать, пока Лоррейн ответит. Мы заранее обнялись на прощание, а потом я с бьющимся от волнения сердцем набрала номер. Прижав трубку к уху, Дорис просияла от радости, услышав подругу. Хотя голоса обеих женщин выдавали их возраст, можно было подумать, что это болтают две девчонки: ониперебивали друг друга и постоянно хохотали. Я немного прибралась в комнате и слонялась без дела, под впечатлением от этого невероятного счастья. Наконец, я собралаволю в кулак и вышла. В дверях я молча помахала Дорис, лучившейся счастьем. Она на секунду оторвалась от трубки и сказала мне: «Спасибо тебе, солнышко. Спасибо». Я кивнула, улыбнувшись так широко, что у меня заболело лицо. Шагая по коридору, я еще некоторое время слышала смех Дорис, пока дверь ее комнаты не захлопнулась. По дороге домой я не могла стереть с лица счастливую улыбку. Погода стояла чудесная, и мне захотелось пойти поплавать. Все время, что я купалась, наслаждаясь водой, меня не покидало прекрасное настроение. Я вернулась домой вскоре после захода солнца, и тут зазвонил телефон. Это была Ребекка, приятная медсестра из дома престарелых, с которой я познакомилась в тот же день, что и с Дорис. Она звонила сказать, что милая Дорис умерла несколькими часами раньше, во сне. По моим щекам покатились слезы, но я все равно порадовалась за Дорис, ведь она умерла счастливой. Поразительно, как может измениться человеческая жизнь за совсем короткий промежуток времени. Когда я думаю о той одинокой старушке, с которой познакомилась в первую ночь в доме престарелых, и о смеющейся женщине, которую я обняла на прощание в ее последний день, я чувствую такое удовлетворение, какое невозможно купить ни за какие деньги. В домах престарелых по всему миру живут тысячи чудесных, но очень одиноких людей. Есть также немало молодых людей, обреченных на жизнь в стенах домов инвалидов. Молодые или старые, эти люди отчаянно нуждаются в новых друзьях, и всего пара часов общения в неделю способна кардинально изменить последнюю главу их жизни. Конечно, в идеале люди вообще не должны попадать в дома престарелых и дома инвалидов, но к несчастью, это не всегда возможно. В таких заведениях много людей, которых там быть недолжно, – от них просто в некотором смысле избавились. Смотреть на это невыносимо. Но если вы уделите этим людям чуть-чуть времени, вы можете в корне изменить их жизнь. Мне показалось, что Дорис выбрала идеальный момент для ухода. Просто настал ее час, и она как раз была очень счастлива. Мы сыграли в жизни друг друга те роли, которыедолжны были сыграть, и за это я всегда буду ей благодарна. Она была очаровательной женщиной. Вскоре после ухода Дорис я познакомилась и с Лоррейн. Мы сидели в кафе под деревьями и разговаривали о Дорис и вообще о жизни, пока ей не пришло время отправляться домой. Лоррейн рассказала, что в тот памятный день они болтали по телефону битый час и расстались чрезвычайно довольные друг другом. Было безумно приятно познакомиться с лучшей подругой Дорис. И конечно, познакомиться с самой Дорис тоже было большой удачей. Надеюсь, что на той стороне она вновь встретилась со всеми своими подругами. Настоящие друзья Лихорадочный ритм жизни в Сиднее меня немного утомил. Предложений следить за домами как раз не было, так что на месте меня ничего не удерживало, и я перебралась немного южнее: в Мельбурн. Я уже несколько лет там не бывала, и оказалось очень приятно вернуться и вновь окунуться в его творческую атмосферу, а также повидаться со старыми друзьями. Выяснилось, что в Мельбурне уже наслышаны о том, как хорошо я слежу за чужими домами, так что у меня очень быстро появилось несколько предложений. Первый дом, в котором я поселилась, принадлежал Мари, моей бывшей начальнице в сиднейском центре для беременных. Он находился примерно в часе езды от Мельбурна, на живописном полуострове Морнингтон, и был полон энергии Мари, так что я сразу почувствовала себя в нем как дома. Стояла осень, и первые пару недель я провела за долгими прогулками по прибрежным скалам. Гуляя в толстой куртке и теплой шапке под порывами холодного океанского ветра, я очень остро ощущала себя живой. Это было невероятное наслаждение, и я проводила так бóльшую часть дня. Вечерами, сидя у камина в уютной комнате, я писала и играла на гитаре. Я могла бы провести так всю жизнь, но мне нужны были деньги, и вот я вышла работать сиделкой у Элизабет. Ее судьба казалась мне ужасно печальной, но я старалась принимать тот факт, что разным людям выпадают разные жизненные уроки. То, что со стороны кажется трагедией, дает человеку возможность учиться и развиваться. Работая над собственными проблемами, я училась ценить те уроки, которые преподносит мне жизнь, и постепенно пришла к выводу, что в моем прошлом было немало бесценных подарков. Расти я в идеальной семье (если, конечно, они вообще существуют), как бы я научилась смелости, прощению, состраданию и доброте? Так что и в случае с пациентами я решила принять тот факт, что не могу знать их жизненных уроков. Неважно, почему им выпала такая судьба, – спасать их не входило в мои задачи. Я должна была лишь окружить их заботой, дружбой, принятием и лаской в последние недели жизни. Если это помогало им обрести покой, работа приносила мне особенное удовлетворение. Как говорится, чем больше мы отдаем, тем больше получаем, и в этом смысле моя работа была настоящим подарком. Работать с умирающими было большой честью. Их рассказы и воспоминания преображали мою собственную жизнь. Мне довелось в достаточно молодом возрасте услышать о тех открытиях, которые они сделали на пороге смерти – это был удивительный дар. Многие советы моих пациентов я воплотила в жизнь, и мне не пришлось дожидаться, пока я сама окажусь на смертном одре и меня осенит. Входя в дом к новому пациенту, я заново приступала к обучению: каждый раз мне преподавали либо новый урок, либо уже знакомый, но по-новому. Я впитывала знания, как губка. Элизабет была еще не старой женщиной, ей было около пятидесяти пяти. Последние пятнадцать лет она страдала от алкоголизма, и теперь умирала от вызванной им болезни. Утром моего первого рабочего дня она еще спала, когда я приехала, и ее сын ввел меня в курс дела. Он показал мне дом, рассказал о состоянии Элизабет и добавил, что семья решила не говорить ей о скорой смерти. «Ну вот, – подумала я, – снова те же грабли». Мое стремление к самосовершенствованию всегда подталкивало меня стараться присутствовать в настоящем моменте. В случае с Элизабет я сразу поняла: главное – сохранить спокойствие. Когда она спросит меня о своем состоянии, тогда я и буду с этим разбираться, а думать об этом заранее смысла нет. Она может вообще ни о чем не спросить – но, если спросит, я не стану ей врать. От Элизабет исходило смятение и отчаяние. Родные вынесли из дома весь алкоголь и заперли его в шкафчике в гараже. Поскольку Элизабет умирала, они решили совсем лишить ее доступа к спиртному. Это казалось мне излишней жестокостью. Она в любом случае умирала, так зачем было вынуждать ее проходить через боль абстиненции? Но это была не моя жизнь и не мое решение. Алкоголизм я, к сожалению, близко наблюдала еще ребенком. Во время работы в барах и на острове, и за границей я узнала о нем еще больше. Алкоголь никого не украшает. Он не только уничтожает все хорошее в человеке, страдающем алкоголизмом, но и разрушает семьи, отношения и карьеры, а также крадет детство у детей алкоголиков. То же самое можно сказать о любой наркотической зависимости. Единственное, что по-настоящему украшает любого человека, – это любовь. Алкоголизм – это болезнь. Хотя он поддается лечению, больной нуждается в постоянной любви и поддержке, чтобы сломить привычные шаблоны поведения, поверить в себя и свою возможность зажить счастливой жизнью. Лишить хронического алкоголика спиртного безо всякой поддержки, любви или объяснения причин казалось мне довольно жестоким поступком. Все, что я знала про Элизабет, – это то, что она больна. У нее совсем не было сил. Она ничего не могла сделать сама и почти не ела. Ей также мучительно не хватало алкоголя. Родные сообщили ей, что доктор велел «на время» отлучить ее от спиртного. Было тяжело не осуждать их, особенно видя, что сами они регулярно выпивают, хотя отказывают в этом удовольствии умирающей женщине. Но у меня не было никакого права решать, какие уроки приготовила для нее жизнь. Общая физическая слабость не позволяла Элизабет никуда выходить, а родные запретили большинству друзей навещать ее, поскольку те выпивали. Неудивительно, что Элизабет не понимала, что происходит, и горевала, лишившись всех привычных радостей. Запрет на встречу с пьющими друзьями она перенесла с тихой покорностью, хотя он лишил ее не только собутыльников. До болезни Элизабет участвовала в попечительскихсоветах нескольких благотворительных организаций. Эти друзья были ее единственной связью с внешним миром и прежней жизнью. Спустя шесть или семь недель сил у Элизабет стало еще меньше, а потребность в отдыхе возросла. У нее было хорошее, хотя и суховатое чувство юмора. В самые неожиданные моменты от нее можно было услышать весьма едкую шутку. Нередко я вспоминала ее слова дома, уже после смены, и невольно улыбалась. Постепенно мы подружились, и у нас завелись свои маленькие традиции в тех рамках, которые накладывала на жизнь Элизабет болезнь. В наш распорядок дня входило утреннее чаепитие на застекленной террасе. В это время года ярко освещенная солнцем терраса была самым приятным местом в доме. Однажды за чаем наши отношения вышли на новый уровень. – Бронни, как ты думаешь, почему я не поправляюсь? Я не пью, но слабею с каждым днем. У тебя есть идеи? – спросила Элизабет. Я ласково посмотрела ей в глаза и мягко ответила вопросом на вопрос: – А каквыдумаете, почему? Наверняка вы уже об этом задумывались? Я говорила очень осторожно, чтобы выяснить ее собственные мысли на этот счет. – Я боюсь сказать, что я думаю, – вздохнула она. – Это слишком страшно. Но в глубине души я знаю ответ. Мы немного помолчали, глядя в окно на птиц, греясь на солнце. – Если я спрошу тебя, ты мне скажешь правду? Я хочу услышать честный ответ. Я кивнула. – Это то, что я думаю? – спросила она, едва выговорив вопрос. Мысленно посылая ей любовь, я ждала, не скажет ли она что-то еще. Она, действительно, заговорила вновь: – О господи. Да, это оно, – произнесла она, отвечая сама себе. – Я умираю, да? Мне крышка. Я скоро прикажу долго жить. Сыграю в ящик, или как там еще говорят. Умираю! Я умираю. Я права, да? Я медленно кивнула, одновременно страдая с ней вместе и испытывая облегчение от того, что она теперь знает правду. Мы еще посидели в тишине, глядя на птиц, пока Элизабет не смогла снова говорить. На это ушло много времени, но я давно привыкла молчать вместе с пациентами, и меня это не смущало. Им так о многом нужно было подумать, так многое переварить, что порой слова только мешали. В такие минуты не нужно было заполнять паузу. Нужно было подождать, пока они вновь будут готовы разговаривать. Через некоторое время заговорила и Элизабет. Она сказала, что уже давно подозревала истину и что ложь родных ее разочаровала. Отбирать у нее друзей и светскую жизнь было жестоко, добавила она, и я не могла с нейне согласиться. Элизабет понимала, что слишком слаба, чтобы выходить из дома, но сказала, что хочет иногда видеть друзей. Время от времени у нее бывали посетители – одобренные родными знакомые, которые точно не принесут с собой спиртное. Это были приятные люди, объяснила Элизабет, но не близкие друзья. После того как между нами установились доверительные отношения, нашему общению больше ничего не мешало. Времени на секреты не было, и мы с Элизабет с каждым днем получали от своих бесед все больше удовольствия. Я столько лет замыкалась в себе, что теперь поражалась сама себе: мне было легко говорить с ней даже на самые личные темы. Стоя на пороге смерти, Элизабет тоже наслаждалась откровенностью наших разговоров. Вначале она сердилась, что родные не рассказали ей о скорой смерти, но постепенно приняла их решение, поняв, что ими руководил страх. Ей удалось простить свою семью. Однако она не смогла и дальше делать вид, что ничего не знает. В один из моих выходных дней она заговорила о своей смерти с семьей. Это сблизило ее с родными, а они почувствовали облегчение, что им не нужно самим сообщать ей страшную новость. Я тоже была рада, что моя честность не подвела меня под монастырь. Однако в вопросе посещений родные Элизабет стояли на своем: пьющие друзья могут ей звонить, но не могут приходить в дом. Элизабет эволюционировала на глазах и даже смогла согласиться с их решением, причем на этот раз искренне. Она по секрету призналась мне, что, вероятно, их общение держалось только на выпивке. Я рассказала Элизабет, что всего несколько лет назад мой круг друзей радикально изменился, когда я перестала курить марихуану. Очень быстро стало понятно, кто мне действительно друг, а с кем мы просто любили покурить. Оказалось, что некоторым людям, которых я считала друзьями, некомфортно рядом со мной, если я не накуриваюсь с ними вместе. Не то чтобы кто-то из нас был плохим человеком. Но когда я отказалась от этой привычки, то увидела: некоторые мои отношения держались только на курении, а когда я бросила эту привычку, с некоторыми друзьями мы разошлись естественным образом. «Как я жалею, что растеряла своих друзей, настоящих друзей, – произнесла Элизабет слова, которые я уже столько раз слышала до нее. – Из-за своего пьянства я перестала вращаться с ними в одних кругах, а теперь, пятнадцать лет спустя, мне не о чем с ними разговаривать. В любом случае они все переехали». Знакомых, которым позволялось ее навещать, Элизабет не считала настоящими друзьями. Мы обсудили, каким многозначным может быть это слово и как много у дружбы разных уровней. В последнее время я и сама начала думать о некоторых своих «друзьях» скорее как о приятных знакомых. Я не стала меньше их любить или ценить: они по-прежнему были в моей жизни великим даром. Но, пережив довольно смутный и тяжелый период, я научилась понимать, что такое настоящий друг. У меня было полно приятных знакомых, я любила всех этих людей и наше расслабленное, веселое общение. Однако теперь я знала, что в трудный момент рядом с нами остаются совсем немногие, чтобы вместе переживать боль и печаль. Те, кто остаются, и есть наши настоящие друзья. «Наверное, все дело в том, чтобы иметь разных друзей для разных целей, – размышляла Элизабет. – У меня просто нет правильных друзей для той ситуации, в которой я оказалась, для моих последних дней. Понимаешь, о чем я?» Согласившись, я рассказала ей, как однажды тоже осталась без правильных друзей, хотя конечно, мои тогдашние обстоятельства были вовсе не такими тяжелыми, как у нее. Уехав с тропического острова в Европу, я недолгое время проработала в маленькой типографии. Мои новые коллеги были приятными людьми, они многому меня научили, и я благодарна им. Но на острове все же было иначе: весь персонал гостиницы жил одной большой и дружной семьей и, возвращаясь из отпуска, мы радовались воссоединению так, будто вернулись домой В Европе у меня завелись новые друзья, хотя по прошествии лет я скорее назвала бы их приятными знакомыми. Благодаря этим знакомым я с тремя ребятами, своими ровесниками, отправилась в поездку по нескольким соседним странам, в Итальянские Альпы. В горах мы сняли крошечный домик без водопровода и электричества. Вокруг была потрясающая красота, причем природа была совершенно не похожа на мою любимую Австралию, которая по-своему великолепна, но очень сильно отличается от Европы. Альпы показались мне безумно красивыми. Купались и умывались мы в горном ручье. Хотя стояло лето, вода в нем была ледяной: где-то высоко над нами таял снег, и прозрачная холодная вода бежала вниз. Погрузившись в ручей, бурливший вокруг меня со всех сторон, я буквально задыхалась от холода, пока ледяная вода кусала меня, несясь мимо. Но этот холод бодрил, и я не переставала любоваться потрясающим видом. Каждый раз после погружения в ледяную воду, будь то река, океан или пруд, я выхожу из нее в игривом настроении, почти как собака после купания. Понравилось собаке купаться или нет, она все равно носится, как безумная, скачет и бесится. Примерно так же чувствовала себя и я, выходя из ледяного горного ручья: веселой и дурашливой. Так что вытершись, одевшись и вернувшись в домик, я была слегка не в себе и непрерывно тормошила своих новых друзей, рассказывая им глупые анекдоты. Я от души веселилась, и вдруг до меня дошло, что они не понимают моих шуток, ни одной. На лицах у них застыли озабоченные улыбки, как бы говорившие: «Да о чем она вообще?» От этого мне сначала стало только смешнее. Мои спутники были вообще-то веселыми и приятными ребятами, просто мы принадлежали к разным культурам, и юмор у нас был тоже разный. Но внезапно я остро заскучала по своим старым друзьям. Они бы разделили мое веселье, и мы бы вместе хохотали, рассказывая друг другу анекдоты. Тем вечером, после долгой прогулки к вершине горы, мы все сидели при свете фонариков, ужинали и болтали. Это было прекрасно, но очень скоро все, кроме меня, отправились спать. Наша дневная прогулка вышла просто чудесной, и я все еще была в наилучшем расположении духа. Мне вовсе не хотелось ложиться, а хотелось и дальше сидеть в кругу друзей, болтать и смеяться. Однако домик уже стих, мои друзья уснули. Забрав в свою комнатку фонарь, я поставила его на стол и следующие два часа писала в дневнике. Было слышно, как вдалеке звенят колокольчики – это коровы гуляли по лугам. Чувствуя себя совершенно счастливой, я улыбнулась тому, что сижу в этом крошечном домике со своим дневником, при свете фонаря, высоко в Альпийских горах, и слушаю звон коровьих бубенцов вдали. Я была бесконечно далеко от своего привычного мира, и, хотя меня переполнял покой этого момента, мне также ужасно не хватало старых друзей. Это была идеальная ночь, но я провела ее не с теми людьми. Все мои попутчики были прекрасными людьми, все они мне нравились. Но я переживала особенный момент, и мне хотелось разделить его с настоящими друзьями, которые по-настоящему знают меня. Разумеется, это было невозможно, поэтому я впитывала волшебство этой ночи в одиночестве. Благодаря этому случаю Элизабет не нужно было объяснять мне, каково это – скучать по настоящим друзьям. Есть особые люди, которые понимают нас, что бы ни случилось.Именно их мне не хватало той ночью в Альпах, а теперь их не хватало Элизабет, которая начала понемногу принимать, что ей осталось жить совсем недолго. Когда к ней в следующий раз пришел врач, я тихонько спросила его, насколько Элизабет вреден алкоголь в ее теперешнем состоянии. Он покачал головой: «Она в любом случае вышла на финишную прямую. Я сказал ее родным, чтобы не отказывали ей, если она захочет вечером немного бренди. Разве они вам не говорили?» Я помотала головой, и он повторил, что это уже не играет никакой роли. Вечером того дня я подняла эту тему с родными Элизабет, но семья уже приняла решение не давать ей спиртного ни под каким видом. Они объяснили мне причину: похоже, что та Элизабет, которую я знала, и та Элизабет, которую они наблюдали в последние пятнадцать лет, были абсолютно разными людьми. Родственники просто не могли поверить, что вновь видят ее с лучшей стороны. В следующие две недели я понемногу расспрашивала Элизабет о ее пристрастии к алкоголю, если она поднимала эту тему. Она сказала: хотя ее все еще очень тянет выпить, она рада вспомнить, кем была до того, как ее жизнью завладел алкоголь. Дурная привычка началась с малого: за ужином Элизабет всегда выпивала бокал-другой вина, и так продолжалось годами безо всяких проблем. Затем она стала много вращаться в обществе из-за своей благотворительной деятельности. Многие люди, которых она встречала в этих кругах, вовсе не увлекались алкоголем, призналась Элизабет, но ее больше тянуло к тем, кто выпивал. У нее появилось чувство, что дома ее никто не замечает, но зато ей казалось, что новым друзьям она важна и нужна. Теперь, когда у нее немного прояснилось в голове, она поняла: эта компания держалась вместе только потому, что каждый из них был так же не уверен в себе, как и она сама. Элизабет объяснила, что алкоголь придавал ей уверенности – или, во всяком случае, так ей казалось, пока она была пьяна. От спиртного она становилась громкой, откровенной и, в конечном итоге, довольно язвительной и жесткой по отношению к окружающим. Благодаря этому она и лишилась прежних друзей. Они долго пытались помочь ей и донести до нее свою любовь, показать, что она летит в пропасть, но она была с ними высокомерна и оттолкнула их от себя, всех до единого. Ее затуманенному алкоголем мозгу это показалось лишь подтверждением того, как безгранично ее любят новые друзья, которые не осуждают ее пристрастие к алкоголю. Разумеется, они не осуждали ее только потому, что выпивали и сами. Кроме того, у нее появилось новое оправдание для вредной привычки: теперь, говорила она себе, мои родственники наконец стали обращать на меня внимание. Конечно, они смотрели на нее без восхищения или радости, но зато больше не игнорировали, как до появления пагубной привычки. Ее постепенная утрата контроля над собой заставила семью пристально присмотреться к происходящему. Чем менее дееспособной становилась Элизабет, тем чаще родственники вынуждены были помогать ей, и тем хуже она себя чувствовала. Вначале их внимание ей льстило. Но кончилось все тем, что она уже не могла остановиться, и потеря контроля вызывала в ней все бóльшую неуверенность и отвращение к себе. Вначале она еще отдавала себе отчет в том, что пытается привлечь к себе внимание родных, но под конец стала по-настоящему от них зависеть, и это ее ужаснуло. Ее и без того низкая самооценка совсем упала. «Знаешь, Бронни, ведь не всехотятвыздороветь. Я, во всяком случае, долго этого не хотела. Я была больна, и именно так я о себе думала: как о больном человеке. Конечно, при этом я не давала себе шанса избавиться от зависимости. Но зато я получала внимание и врала себе, что так буду счастливей, чем если проявлю смелость и выздоровею». Это признание Элизабет было озарением женщины, которая семимильными шагами приближалась к мудрости. Три месяца без алкоголя и сознание того, что ей недолго осталось жить, преобразили ее. Теперь, зная всю историю о том, как у Элизабет развилась алкогольная зависимость, я стала лучше понимать ее родных. В конечном итоге их жесткое решение помогло ей вновь стать собой. Хотя сама я не стала бы действовать втайне от Элизабет, я прониклась уважением к их попыткам помочь и ей, и себе. Они оказались успешными. Но большуюроль в этом успехе сыграла сама Элизабет. Глядя в лицо смерти, она стала иначе смотреть на жизнь, и ей хватило отваги принять выпавшие ей уроки. В последние две недели отношения Элизабет с родными вышли на новый уровень. Благодаря работе с паллиативными пациентами я привыкла ценить способность людей учиться. Тот покой, который Элизабет обретала у меня на глазах, я уже видела и у других своих пациентов. Это зрелище каждый раз наполняло меня глубокой благодарностью за мою работу. Примерно за неделю до смерти Элизабет я поговорила с ее мужем и сыном о том, как она жалеет, что растеряла старых друзей. Я спросила, нет ли возможности
