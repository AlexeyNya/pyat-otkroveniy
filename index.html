егося. Я все еще водила тот самый джип, на котором путешествовала по всей стране. Водительская дверь в нем плохо закрывалась, поэтому садясь в машину, мне давно уже приходилось сильно ею хлопать. На этот раз, когда я захлопнула дверь, стекло разлетелось на мелкие осколки. Я уже была слегка в ступоре от утренних событий, а теперь и вовсе оцепенела от громкого хлопка, с которым лопнуло стекло. Выглянув в окно, в котором осталось только несколько маленьких кусочков стекла, я решила, что лучше всего мне просто поехать домой. Новое стекло привезли только через три дня. Это время я провела дома и возле гавани, постоянно благодаря Стеллу за то, что она отправила меня домой. Это было лучшее решение – позволить себе просто быть. Пару месяцев спустя мне пришло письмо от Терезы, дочери Стеллы, с которой я особенно сблизилась. На следующий день после смерти Стеллы Тереза шла по улице, думая о своей матери. В эту секунду у нее перед самым лицом пролетел огромный белый какаду, так близко, что она почувствовала дуновение ветра от его крыльев. Стелла была как раз из тех, кто мог бы посылать своим близким знаки, и я радовалась, читая это письмо. Прошло около года, и я приехала в гости к семье Стеллы. Я с нетерпением ждала этого ужина, особенно мне хотелось увидеть милого Джорджа и узнать, как у него дела. Тереза с мужем тоже пришли. Вечер начался очень хорошо, и я с радостью узнала, что Джордж бывает на людях, играет в бридж и встречается с друзьями. Но потом разговор зашел в неприятную мне область. Тереза начала расспрашивать меня, отличалась ли смерть ее мамы от смертей моих предыдущих клиентов. Это была прекрасная возможность очистить свою совесть и рассказать им, что, когда я работала со Стеллой, у меня почти не было опыта. Я искренне думаю, что они бы не возражали, потому что у них не было к моим услугам никаких претензий. Но рассказать им правду я так и не смогла, потому что Джордж радовался мне, как ребенок, и все время повторял, как хорошо, что мы все снова собрались вместе. Это в каком-то смысле возвращало ему Стеллу. Я хотела отвести Терезу в сторону и все ей рассказать, но такой возможности мне не представилось. Жизнь не стояла на месте, и вскоре после этого ужина мы потеряли связь друг с другом. Однако спустя несколько лет мы снова встретились, и у меня появилась возможность рассказать семье о своей неопытности и о том, как мне стыдно было им врать. Они великодушно меня простили, сказав, что отсутствие опыта я с лихвой восполнила эмпатией и сочувствием. Они, как и я сама, с самого начала чувствовали, что я лучше других подходила на роль сиделки их матери. Было очень приятно снова увидеться и вспомнить, что мы пережили вместе. Каждую зиму я по-прежнему ношу кофту Стеллы и вспоминаю ее добрым словом. Прошлой зимой, сидя в этой кофте, я перечитывала книгу, которую она мне подарила, то и дело останавливаясь и улыбаясь своим воспоминаниям. Работа сиделкой действительно познакомила меня со многими потрясающими людьми. Но, как бы там ни было, свой урок я усвоила и решила больше никогда не врать клиентам. Даже если говорить правду порой тяжело, для меня это единственный возможный вариант. Сделав вывод из этого опыта, я смогла простить сама себя, и это главное. Первое сожаление Жаль, что мне не хватало смелости жить так, как хотелось мне, а не так, как от меня ожидали другие Грейс очень быстро стала одной из моих любимых паллиативных пациенток. Это была крошечная женщина с огромным сердцем. Ее доброта передалась и детям, не менее щедрым и открытым людям, чем она сама. Грейс жила в дальней части города, где у нас было мало клиентов. Ее дом стоял на тихой, ничем не примечательной улице, где не было дорогих особняков. Первый раз оказавшись в этом районе, я подумала, что это идеальная декорация для съемок телесериала о жизни обычной семьи, потому что все вокруг источало энергию семейной жизни. Больше всего в самой Грейс и в ее родных мне нравились их здоровая практичность и искреннее радушие. Наши первые дни с Грейс начались так же, как они обычно начинались со всеми пациентами: мы понемногу знакомились, рассказывая друг другу истории из жизни. Звучали хорошо знакомые мне комментарии о том, что Грейс утратила человеческое достоинство и теперь кто-то должен вытирать ей задницу, да еще этой ужасной работой вынуждена заниматься такая симпатичная молодая женщина, как я. Я уже давно привыкла к этой стороне своей работы и всегда пыталась успокоить своих пациентов на этот счет. Болезнь мигом избавляет людей от эго. Когда человек смертельно болен, его личное пространство исчезает на глазах. Принятие ситуации – и того, что кто-то вытирает вам попу, – становится неизбежным по мере того, как болезнь не оставляет вам сил волноваться о таких мелочах. Грейс вышла замуж более полувека назад и всю жизнь была образцовой женой и матерью. Она воспитала чудесных детей и теперь радовалась внукам, уже подросткам. Однакоее муж был настоящим домашним тираном, так что долгое замужество Грейс было весьма неприятным. Для всех, особенно для Грейс, стало большим облегчением его внезапное решение переехать жить в дом престарелых. Всю свою замужнюю жизнь Грейс мечтала о независимости от мужа, о путешествиях, о свободе от его тиранических замашек, да и просто о том, чтобы жить незамысловатой, счастливой жизнью. Когда ее муж перебрался в дом престарелых, ей было уже за восемьдесят, но для своего возраста она была в очень приличной форме и хорошо себя чувствовала. Крепкое здоровье позволяло ей свободно распоряжаться своей жизнью. Однако вскоре после обретения долгожданной свободы Грейс почувствовала сильное недомогание. В течение нескольких дней врачи диагностировали неизлечимую болезнь, причем на поздней стадии. Особенно обидным было то, что заболевание Грейс спровоцировала многолетняя привычка ее мужа курить в доме. Болезнь развивалась стремительно, и уже через полтора месяца Грейс полностью лишилась сил и оказалась прикована к постели. Она могла только медленно доковылять до уборной с чужой помощью, опираясь на ходунки. Тем мечтам, которые она лелеяла всю свою жизнь, не суждено было сбыться. На них не осталось времени. Мысль об этом не оставляла Грейс ни на минуту, причиняя ей ужасные мучения. «Почему я просто не делала, что хотела? Почему я позволяла ему мной командовать? Почему я была такой слабой?» – эти вопросы звучали из уст Грейс регулярно. Она злилась не только на мужа, но и на себя – за то, что не нашла в себе смелости противостоять ему. Дети Грейс подтверждали, что ее жизнь действительно была очень нелегкой. И они, и я бесконечно ей сочувствовали. «Никогда никому не позволяй мешать тебе делать то, что хочешь, Бронни, – говорила мне она. – Прошу тебя, пообещай это умирающей старухе». Я пообещала, а также рассказала Грейс, что мне повезло иметь мать, которая на личном примере научила меня независимости. «Только посмотри на меня, – говорила Грейс. – Я умираю. Умираю! Как это возможно, что я столько лет ждала свободы и независимости, а теперь для них слишком поздно!» Это была настоящая трагедия. Я знала, что никогда не забуду этого напоминания жить только так, как мне хочется. В первые недели нашего знакомства мы часами болтали в спальне Грейс, уставленной памятными безделушками и увешанной портретами родных. Но состояние ее здоровья быстро ухудшалось. Грейс объясняла мне, что вовсе не против брака. Она считала, что брак может быть прекрасной возможностью вместе расти и развиваться. Но она была против убеждения, распространенного среди людей ее поколения, что брак нужно сохранять любой ценой. Именно так и поступила сама Грейс, отказавшись от собственного счастья. Она посвятила жизнь мужу, который считал ее любовь и заботу чем-то само собой разумеющимся. Теперь, на пороге смерти, Грейс стало все равно, что о ней подумают, и она ужасно мучилась оттого, что это осознание не пришло к ней раньше. Много лет она притворялась счастливой и жила так, как от нее требовало общество. Только теперь она поняла, что у нее всегда был выбор и она могла жить иначе, но побоялась принять это решение. Хотя я и пыталась ее успокоить, убеждая, что ей нужно простить себя, она была безутешна. За те годы, что я работала сиделкой, большинство моих пациентов были долгосрочными: я ухаживала за ними месяцами, до самой смерти. От многих из них я впоследствии слышала те же слова, которые сказала мне Грейс – слова, полные страдания, отчаяния и безысходности. Из всех сожалений, которые я выслушала, сидя у постелей умирающих, это было самым частым:«Жаль, что мне не хватало смелости жить так, как хотелось мне, а не так, как от меня ожидали другие».Именно эта мысль огорчала их сильнее всего, потому что осознание истины пришло к ним слишком поздно, чтобы исправить положение. «И я ведь вовсе не желала прожить какую-то выдающуюся жизнь, – объясняла мне Грейс во время одного из множества наших разговоров. – Я хороший человек, я никому не хотела зла». Грейс была добрейшей женщиной и при всем желании не смогла бы никому навредить. Это было просто не в ее характере. «Но я хотела пожить и для себя тоже, и так и не набралась смелости». Теперь Грейс понимала: всем было бы только лучше, если бы ей хватило смелости исполнить свое желание. «То есть всем, кроме моего мужа, – говорила она с отвращением к самой себе. – Я была бы куда счастливей и спасла бы свою семью от этого несчастья. Почему я его терпела? Почему, Бронни?» Она рыдала, сотрясаясь всем телом, а я обнимала ее, пытаясь утешить. Успокоившись, Грейс поднимала на меня глаза, полные решимости. «Я серьезно. Пообещай мне, умирающей женщине, что ты всегда будешь верна себе, что ты будешь жить только так, как тебе хочется, и пусть люди говорят,что хотят». Тюлевая занавеска мягко колыхалась, впуская в спальню дневной свет, а мы смотрели друг на друга с любовью, ясностью и решимостью. «Обещаю, Грейс. Я уже пытаюсь так жить. Но обещаю вам, что всегда буду пытаться жить только так», – искренне отвечала я. Держа меня за руку, она улыбалась, зная, что ее опыт пригодился хотя бы кому-то. Когда я объяснила Грейс, что больше десяти лет безо всякого удовольствия проработала в банковском секторе, она стала лучше меня понимать и слушать с бóльшим интересом. Первые пару лет после учебы мне было там даже весело. В офисе проходили обучение интерны, и работу я воспринимала как прежде всего место общения. Всем интернам былопо семнадцать-восемнадцать лет, так что на работе мы в основном болтали с друзьями да зарабатывали деньги на выходные. Сама работа давалась мне легко, и так могло бы продолжаться и дальше, будь она мне по душе. Но это было не так. После недолгого начального этапа мне быстро стало скучно, и я начала задаваться вопросами о будущем.Однако я еще десять лет продолжала жить так, как мне полагалось. Хотя я и знала, что мне нужен какой-то другой образ жизни, мне не хватало смелости отправиться на егопоиски. Сильнее всего меня удерживал на месте страх перед теми насмешками, которые посыпались бы на меня со стороны родных, если бы я отказалась от предназначенной мне роли. Я жила не своей жизнью, и ничего хорошего из этого выйти не могло. Однако я продолжала тянуть лямку, переходя из банка в банк, регулярно меняя офисы и должности. В результате я стремительно росла по службе, потому что поработала почти во всех возможных банках и к тому же перепробовала куда больше должностей, чем любой другой нормальный человек моего возраста. Внезапно я оказалась успешной. Совершенно несчастная, я продолжала посвящать пять дней в неделю делу, которое ничего не давало моей душе Многие люди с удовольствием работают в банковской сфере, и я за них рада. Такие люди нужны. Кроме того, сегодня там появились должности, связанные с социальным сектором, и другие благородные возможности. Но я, как и Грейс, жила той жизнью, которую навязали мне другие, а не той, которой хотела жить. Кое-кто в семье никогда не бывал мной доволен, поэтому, борясь за право оставаться собой, я долго не бросала «хорошую работу», надеясь, что хотя бы эта сфера моей жизни не вызовет нареканий. Я боялась, что уход с работы вызовет новую волну осуждения со стороны родных. Быть белой вороной в собственной семье нелегко. Паршивая овца играет свою роль в семейной динамике, но это трудная роль. Когда одни члены семьи укрепляют свое положение в иерархии за счет других, наверх пробиться сложно. Однако работая сиделкой и наблюдая вблизи множество разных семей, я убедилась, что семей совсем без конфликтов нет и везде есть чему поучиться. Было чему поучиться и в моей семье, хотя в то время мне от этого не становилось легче. С самого детства я служила любимой мишенью для семейных шуток и издевок. Все мои родные увлекались верховой ездой, а я – плаванием, семейным бизнесом было разводить скот, а я была вегетарианкой, моя семья вела оседлый образ жизни, а я кочевой, и так далее, и тому подобное. Часто мои родные отпускали шутки, искренне не понимая, чтообижают меня, хотя любая шутка перестает быть смешной, если повторять ее несколько десятков лет подряд. Нередко, впрочем, мне преднамеренно говорились и обидные, и просто жестокие вещи. Даже самый сильный человек в мире устал бы годами это выслушивать. Я не помнила такого периода в жизни, когда родные не орали бы на меня, не высмеивали и не говорили, что я безнадежна. Тогда мне проще всего было продолжать притворяться такой, какой меня хотели видеть другие. Постепенно в кругу семьи я замкнулась в себе – это стало моим способом справляться с ситуацией. Творческие люди часто сталкиваются с непониманием, а я была творческим человеком, хотя и не понимала этого. Я понимала только, что навязывать страховку людям, которые пришли в банк обналичить зарплатные чеки, мне не по душе. Мне хотелось лишь приветливо и сердечно обслуживать клиентов, и это у меня получалось очень хорошо. Но этого было мало: растущая банковская индустрия требовала от сотрудников продавать, продавать и еще раз продавать. Говорят, что в жизни мы больше делаем, чтобы избежать боли, чем чтобы получить удовольствие. Только когда боль становится невыносимой, мы, наконец, набираемся смелости что-то изменить. Я терпела, сколько могла, но наконец сломалась. Когда я бросила очередную «хорошую работу», чтобы отправиться жить на остров, в семье воцарилось смятение: «Зачем она это сделала? Куда она опять собралась?» Я же все это время радостно думала: «Я буду жить на острове!» Чем дальше от родных, тем лучше – вдали от них я была сама себе хозяйкой, и мне нравилась моя жизнь. Связь с континентом я поддерживала только ради мамы, которая всегда была мне поддержкой и бесценным другом. Как раз в годы жизни на острове я впервые попробовала медитировать, и постепенно мне удалось найти внутри себя источник бесконечной доброты и сострадания. Оказалось, что сострадание обладает невероятной и прекрасной силой. Та боль, которую мне причиняли родные, была всего лишь отражением их собственных страданий. Счастливые люди не осуждают других за то, что те живут иначе, чем они сами. Они уважают чужой выбор. Увидев, что я унаследовала страдания предыдущих поколений своей семьи, я приняла решение освободиться от них. Я решила, что никогда не стану контролировать других людей – да у меня и не было такого желания. Люди меняются, только если сами этого хотят, и только тогда, когда становятся к этому готовы. Научившись смотреть на жизнь с состраданием, я приняла тот факт, что, возможно, у меня никогда не будет настоящей любви и взаимопонимания с родственниками. Это наполнило меня ощущением свободы. Пройдя долгий и нелегкий путь к исцелению, я осознала, что не каждому хватает силы посмотреть в лицо своему прошлому – во всяком случае, пока боль не станет невыносимой. Отношение ко мне в семье еще несколько лет оставалось прежним, но теперь оно все меньше меня задевало. Со временем я увидела, что дело было вовсе не во мне, а в тех, кто пытался меня критиковать и осуждать. Есть буддийская притча о том, как к Будде пришел рассерженный человек и начал кричать и оскорблять его, но тот оставался невозмутимым. Когда Будду спросили, как емуудалось сохранить полное спокойствие, он ответил вопросом: «Если вам хотят подарить подарок, а вы отказываетесь его принять, то кому принадлежит этот подарок?» Разумеется, он остается у дарящего. Так же было и с обидными словами, которые до сих пор иногда звучали в мой адрес. Я перестала их принимать; теперь я чувствовала к обидчикам только сострадание. В конце концов, они говорили мне гадости не от хорошей жизни. Самое важное, чему я научилась в жизни, – самое-самое важное – это то, чтосострадание к другим начинается с сострадания к себе.Научившись сочувствовать другим людям, я вступила на путь исцеления. Теперь, услышав обидный комментарий, я успевала дистанцироваться от ситуации. Я понимала, что мой обидчик страдает, а я просто попалась под горячую руку. Разумеется, это касалось не только отношений в семье, но и всех моих отношений с людьми: личных, общественных и рабочих. Мы все страдаем. Каждый человек без исключения носит в себе боль. Но научиться сострадать себе самой оказалось гораздо сложнее, чем другим. На это ушли годы. Мы все относимся к себе невероятно требовательно и жестко – и притом совершенно незаслуженно. Было очень сложно начать относиться к себе с теми же добротой и любовью, что и к другим, признать, что я тоже страдала и заслуживаю сочувствия.Временами мне былопочтипроще выслушать и принять несправедливое чужое мнение – в конце концов, к этому я давно уже привыкла. Ушло немало времени и усилий, прежде чем я научилась сострадать себе самой. Но только после этого началось мое исцеление. Когда я твердо решила, что буду любить и уважать себя и относиться к себе с состраданием, положение дел в семье начало меняться. Я нашла в себе силы отвечать обидчикам, высказывать свое мнение, а не отмалчиваться, замыкаясь в себе. Теперь пришла моя очередь выражать свои чувства и высвобождать всю ту боль, которая копилась во мне годами. Сломать шаблоны, строившиеся десятилетиями, было нелегко. Но я черпала силы и смелость в своих страданиях: мне было нечего терять, а молчать сделалось невыносимым. В конечном итоге и я, и мои родные хотели одного и того же: любви, принятия и понимания, так что единственным выходом из ситуации было сострадание и терпение. Несмотря ни на что, нас все еще связывала любовь, пусть и хрупкая. Однако сколько я ни пыталась наладить отношения, ничего не получалось. Я как будто раз за разом плыла по одной и той же реке, каждый раз упиралась в громадный камень, который не пускал меня дальше. Однажды я поняла, что возможно, этот каменьникогдане исчезнет. Тогда я решила: чем раз за разом терпеть неудачу, лучше попробую плыть в другом направлении, куда-то, где смогу двигаться свободно и естественно. Нет никакой нужды бесконечно биться в одну и ту же стену, которая мешает идти дальше и причиняет постоянную боль. Пришло время выбрать новый путь, открыть рот и сказать: «Хватит». У меня исчерпалось желание терпеть поведение родных. Я решила, что даже если останусь одна, хотя быпопробую обрести душевный покой. Дома покой был невозможен. После того как я перестала отмалчиваться и начала высказывать свое мнение, во мне что-то сдвинулось с места. Мое уважение к себе росло, и мне проще давалось самовыражение. Наконец мне удалось посеять в своей душе новые, более здоровые семена. Я еще не умела за ними ухаживать, но во всяком случае, они были посажены. Пришло время начинать жить своей собственной жизнью – понемногу, шаг за шагом. После того как я рассказала Грейс свою историю, мы очень сблизились. Она согласилась, что в каждой семье свои сложности. Она не знала ни одной семьи, где не было бы проблем, и считала, что именно в семье большинство людей получают бесценные жизненные уроки. Мы обсудили с ней, что единственный способ любить – это принимать людей такими, какие они есть, и ничего от них не ждать. Конечно, это легко сказать и очень трудно сделать, но именно это и есть настоящая любовь. Грейс много рассказывала мне о своей жизни, о детях, о районе, в котором жила, но почти неизменно возвращалась к своим сожалениям. Она жалела, что ей не хватило смелости жить так, как подсказывало ей сердце, а не так, как нужно было другим. Когда времени мало, его не остается на пустую болтовню, и общение становится предельно искренним. Мы с Грейс обсуждали самые важные и личные темы. Эти разговоры оказались целительными и для нее, и неожиданно для меня тоже. Постепенно мы дошли до разговоров о том, какие у меня планы на жизнь, о моих музыкальных амбициях и о том, как я начала писать и исполнять песни. За чашкой чая Грейс попросила, чтобы на следующий день я принесла гитару и спела ей что-нибудь. Я с удовольствием согласилась. Мое сердце радовалось, когда я пела для Грейс, а она улыбалась и тихонько подпевала, сидя в своей кровати. Она наслаждалась каждой моей песней так, как будто это была лучшая песня в мире. Ее родные тоже заглянули на наш импровизированный концерт и оказались не менее благодарными слушателями. Грейс особенно полюбилась песня под названием «Под небом Австралии», потому что сама она всегдамечтала о путешествиях. После этого она регулярно просила меня спеть ей. Можно и без гитары, говорила она, и вот я сидела в ее спальне и пела, а она улыбалась, закрыв глаза, впитывая мои песни. Она просила меня спеть еще и еще, и я никогда ей не отказывала. Каждый день здоровье Грейс слабело. И без того крошечная, она как будто еще уменьшилась в размерах. Старые друзья заходили с ней проститься. Родственники сидели у постели, болтая и стараясь сдерживать слезы. Семья Грейс была очень дружной, так что ее навещали каждый день. Мне это нравилось, как и нежность, с которой все члены семьи обращались друг с другом. Но когда все уходили, мы с Грейс оставались вдвоем, и она снова просила меня спеть. Это были необыкновенные дни. Теперь Грейс передвигалась с большим трудом. Иногда она соглашалась воспользоваться переносным туалетом, чтобы помочиться, однако, когда ей нужно было опорожнитькишечник, она неизменно шла в уборную, чтобы мне не пришлось мыть за ней горшок. Переубедить ее не представлялось возможным, хотя я и убеждала ее, что мне это совершенно не трудно. Поэтому каждый раз мы бесконечно долго ползли с ней в туалет, который, к счастью, был прямо рядом со спальней. Грейс была очень слаба. Я помогала ей встать с унитаза, одной рукой придерживала, а второй натягивала на нее трусы – это была весьма непростая задача. Затем мы отправлялись в обратный путь к постели: Грейс впереди, опираясь на свои ходунки, а я позади, придерживая ее. Однажды, следуя за ней, я заметила, что в спешке заправила краешек ночной рубашки ей в трусы. Я улыбнулась ей, крошечной женщине на самом исходе жизни, ковыляющей к кровати, и вдруг она на ходу запела «Под небом Австралии». Мое сердце чуть не выскочило из груди от радости. Некоторые слова она перепутала, но от этого песня звучала только трогательней. В тот момент я поняла, что моя музыкальная карьера достигла своей высшей точки. Я знала, что никакой успех в будущем не принесет мне больше радости, чем этот бесценный момент. Даже если бы я в жизни не написала больше ни одной новой песни, мне было бы все равно. Знать, что я порадовала мою дорогую Грейс своей музыкой, слышать, как она в свои последние дни поет мою песню, – мне больше нечего было желать от своего творчества. Через пару дней, придя на работу, я увидела, что сегодняшний день станет для Грейс последним. Я объяснила, что позвоню ее родным, но она отрицательно помотала головой. Слабая и измученная, она протянула ко мне руки и обняла. Чтобы сберечь ее силы, я легла с ней рядом на кровать и тоже обняла ее. Мы полежали так некоторое время, негромко разговаривая, ее пальцы поглаживали мою руку. Я спросила, почему она не хочет видеть родных, и она сказала, что не хочет причинять им боль. Она слишком сильно их любила. Но им нужно попрощаться, сказала я, и, если не дать им такой возможности, это не только причинит им боль, но и вызовет чувство вины на всю оставшуюся жизнь. Грейс поняла меня и согласилась, что не хочет этого. Я взялась за телефон, и вскоре приехали ее родные. Но перед этим она успела меня спросить, превозмогая слабость: – Ты помнишь, что ты мне обещала, Бронни? Кивнув ей сквозь слезы, я ответила: – Да. – Живи так, как велит тебе сердце. Не беспокойся о том, что думают другие. Обещай мне это, Бронни, – прошептала она еле слышно. – Обещаю, Грейс, – тихо сказала я. Сжав мою руку, она задремала. После этого она уже почти не просыпалась, хотя открывала глаза и видела свою семью, сидевшую у ее постели до самого конца. В течение нескольких часов ее не стало. Ее время пришло. Сидя на кухне в тот день, я думала о своем обещании: я дала его не только Грейс, но и себе самой. Через несколько месяцев, стоя на сцене во время концерта, посвященного выходу моего нового альбома, я посвятила Грейс ее любимую песню. Ее родные были в зале. Из-за прожекторов я не различала ничьих лиц, но мне и не нужно было их видеть. Я чувствовала их любовь и вспоминала маленькую Грейс, которая не сумела прожить жизнь так, как ей хотелось, но зато вдохновила на это меня. Мы все – продукты своего окружения В то субботнее утро, когда мы познакомились с Энтони, ему еще не исполнилось сорока лет. У него были светлые кудрявые волосы, и, несмотря на болезнь, в нем сквозило какое-то озорство. Я совсем не привыкла работать с такими молодыми пациентами. Мы сразу же подружились, и, несмотря на обстоятельства, в нашем общении всегда находилось место юмору. Энтони был старшим сыном в семье бизнесменов-миллиардеров и всю жизнь наслаждался роскошью. Стоило ему чего-то захотеть, он тут же это получал, и в молодости это работало ему на руку. Однако на Энтони также лежала огромная ответственность как на будущем наследнике семейной бизнес-империи. Это сильно давило на него, и, несмотря на несомненный ум, хорошее образование и прекрасные перспективы, Энтони страдал от низкой самооценки. Он пытался скрыть это за юмором и тягой к веселым выходкам. Энтони, у которого был младший брат и четыре младшие сестры, не мог быть тем, кем его хотела видеть семья, и это лежало на нем тяжелым грузом. Юные годы Энтони провел, гоняя за рулем спортивных машин с полицией на хвосте, нанимая самых дорогих девушек по вызову и сравнивая с землей всех, кто становился на его пути. Между молодыми людьми из богатых пригородов шла фактически война за территорию. Некоторые из поступков Энтони никак не вызывали уважения. Из-за своей низкой самооценки Энтони часто вел себя необдуманно, даже рисковал жизнью. Одна из таких опасных выходок привела его в больницу, где он оказался с повреждением внутренних органов и конечностей, с угрозой навсегда лишиться и здоровья – и той свободы, которую несет с собой здоровье. Врачи приложили все усилия, чтобы вернуть ему свободу, но надежды на исцеление было мало. Энтони, надо сказать, отнесся к этому мужественно. Понимая, что он, вероятно, уже нанес себе непоправимый ущерб, он попросил врачей поторопиться со следующей операцией, чтобы ситуация скорей разрешилась в любую сторону. Ему провели несколько операций, а затем целую неделю он проспал на обезболивающих препаратах, пока я сидела у его постели в больничной палате. После этого оставалось только ждать и надеяться, что он постепенно поправится. Энтони любил, чтобы я читала ему вслух. Эта традиция родилась однажды вечером, когда он спросил меня, что я читаю. Я читала о Ближнем Востоке – после поездки туда меня постоянно тянуло обратно. Автор книги писал об истории и укладе в этом регионе умно и без предубеждения. Хотя я прекрасно знала и о подчиненном положении женщин во многих странах Ближнего Востока, и об экстремистах, совершающих ужасные поступки во имя своей религии, я также видела другую сторону ближневосточной культуры, которую, к сожалению, никогда не освещают средства массовой информации. На Ближнем Востоке живут добросердечные, потрясающе гостеприимные люди, которые превыше всего ценят семью. Меня всюду принимали без малейшего колебания, и мне навстречу раскрывались прекрасные сердца. То же самое относится и к людям с Ближнего Востока, с которыми я познакомилась уже в Австралии. На Западе семейные связи очень сильно ослабли, особенно связи со старшим поколением. В этом я лично убедилась, глядя на количество одиноких стариков в домах престарелых, где иногда подрабатывала. Меня всегда завораживали другие культуры и то, насколько разный образ жизни мы выбираем. Я также обожаю те кулинарные приключения, которые несет с собой знакомство с чужой культурой. Однако на глубинном уровне мы все похожи, поэтому я никогда не могла понять расизм. Большинство людей совершенно одинаковы: мы просто хотим бытьсчастливыми. И у каждого из нас есть сердце, способное страдать. Энтони захотел поподробней узнать, о чем книга, так что я заварила нам чайничек ароматного травяного чая и пересказала ему прочитанные страницы. После этого я продолжила читать уже вслух. Так мы стали проводить час или два ежедневно, и нам обоим это приносило большое удовольствие. Шла неделя за неделей, и я знакомила Энтони с книгами, которые иначе никогда бы не попались ему на глаза. Я предлагала ему разные темы на выбор, но он неизменно настаивал, чтобы я читала то, что мне самой интересно. Так я познакомила его с некоторыми классическими книгами для духовного роста. Я читала ему о жизни, философии, о нетрадиционном мышлении. Мы обсуждали прочитанное,пока я ухаживала за ним: поднимала неработающую руку, потом вторую, затянутую в гипс, меняла повязку на неработающей ноге, потом кормила его, причесывала и так далее. Через какое-то время пришлось признать, что операции прошли не вполне успешно. Что-то врачам удалось исправить, но некоторые органы и части тела Энтони были повреждены навсегда. Он не мог вернуться домой: ему нужен был круглосуточный уход до конца жизни. Было принято решение отправить его в частный интернат – один из лучших в городе, судя по цене услуг и рекламному буклету. Так Энтони, еще совсем молодой человек, оказался заперт в четырех стенах блеклого цвета, в окружении умирающих стариков. Мне это место казалось ужасным, я мечтала взять краску поярче и перекрасить стены. Но Энтони поначалу казался почти счастливым. Его успокаивало, что семья перестала о нем волноваться – они знали, что он под присмотром. Он также веселил и подбадривал пожилых пациентов, быстро став общим любимчиком. Однако со временем жизнерадостность Энтони померкла, а отсутствие внешних стимулов притупило когда-то острый ум. Он начал превращаться в продукт своего окружения. Мы все очень податливые, изменчивые существа. Хотя мы вполне способны думать самостоятельно и у нас есть свобода воли, чтобы жить так, как подсказывает сердце, окружение оказывает на нас огромное воздействие – особенно пока мы не начнем осознанно принимать решения о своей жизни. Например, бывает, что после повышения по службе вполне практичные и уже и без того счастливые люди резко меняются. Им перестает хватать того, что у них есть; в попытках угнаться за новыми друзьями с новым уровнем достатка они меняются изнутри, мимикрируя под свое окружение. Например, район, которым они раньше были довольны, теперь их не устраивает, и они переезжают в более подходящее место. Иногда это приносит им счастье, но не всегда. Многие деревенские жители, перебравшиеся в город, адаптируются, переключаются на городскую моду и активный образ жизни. Другие люди, выросшие в городе, адаптируются к сельской жизни и замедляются, отказавшись от брендовых вещей, переодеваются в джинсы и резиновые сапоги и счастливо копаются в земле. Где бы мы ни оказались, со временем наше окружение непременно начинает на нас влиять. Моя молодость прошла достаточно бурно, хотя и началась с задержкой: к девятнадцати годам я была обручена и вела совершенно взрослый образ жизни, у меня даже была ипотека. Наши отношения с женихом были нездоровыми, и сейчас я даже не представляю, как мне вообще удалось пережить это время. Я постоянно терпела с его стороны оскорбления и унижения, психологические игры и злость, доходящую до ярости; моя уверенность в себе таяла на глазах. Чаша моего терпения переполнилась примерно тогда же, когда я в очередной раз сменила работу. Новые коллеги оказались потрясающими людьми, и я опять почувствовала вкус к жизни. Стабильная работа дала мне возможность спастись из ситуации: я перевелась в офис на северном побережье и начала все сначала. Это был счастливый, беззаботный период, я получила полную свободу наслаждаться танцами и встречаться с мальчиками. Многие в нашей компании увлекались наркотиками. К тому моменту я уже знала, что не люблю алкоголь, и, хотя окончательно я бросила пить уже позже, даже тогда алкоголь занимал в моей жизни мало места. Впрочем, вокругхватало и других соблазнов, и в течение года я экспериментировала с разными веществами. В то время еще не появились современные синтетические наркотики, названий которых я даже не знаю. Мои друзья баловались доморощенной травкой, а однажды мне предложили попробовать опиум, и я согласилась. В тот момент я считала, что вполне могу попробовать что-то новое, и при этом мне хватит ума ограничиться одним разом – к счастью, я никогда не проверяла эту теорию на героине. От него я всегда держалась подальше. Я по одному разу экспериментировала с опиумом, грибами, ЛСД и кокаином – все в течение этих двенадцати месяцев, – после чего никогда их больше не употребляла. Думаю, что в результате тех ограничений, которые я терпела в родительском доме и со своим женихом, во мне накопилось желание совершать безрассудные поступки. Но, кроме этого, на бессознательном уровне я чувствовала себя абсолютно никчемной. Впрочем, я очень быстро поняла, что наркотики не для меня, и, хотя мне было интересно кое-что попробовать, я говорила себе, что делаю это ради нового опыта, а не чтобы «упороться». На сознательном уровне я быстро сообразила, что мне нравится вести здоровый образ жизни. На бессознательном уровне мне предстояло еще долго освобождаться от влияния на меня чужих мнений. Мое счастье по-прежнему очень сильно зависело от окружающих. Несколько лет спустя, уже уехав с острова, я жила в Англии и работала в деревенском пабе. Вокруг было много спидов[1].Местные парни, занюхав пару дорог, приходили в паб с расширенными зрачками, скрипя зубами. Их жизнь была абсолютно монотонной изо дня в день, из года в год. Поэтому, когда им удавалось раздобыть спиды, это достаточно изменяло их реальность, чтобы они могли по-новому посмотреть на привычное окружение. Они всего лишь пытались спастись от скуки, и, глядя, как на следующий день они страдают от хандры и усталости, я спрашивала себя, а стоила ли игра свеч. Пару раз мы с Дином к ним присоединялись, но очень быстро нам это разонравилось. Отходняк от спидов был чудовищным, и я просто не могла так жестоко обращаться с собственным телом. Однако в тот же период я пережила опыт, который изменил меня навсегда – и вновь это случилось, потому что я поддалась своему окружению, вместо того чтобы сознательно принять решение повести себя правильно. В те выходные Дин был занят на работе, поэтому я вместе с другими деревенскими парнями поехала на электричке в Лондон. Хотя мне уже было под тридцать, я раньше никогда не была на рейве, просто потому, что мне не нравилась такая музыка. Но мои деревенские друзья никак не хотели, чтобы я сидела одна дома. Они убеждали меня, что это будет лучший вечер в нашей жизни, и я согласилась поехать. Мне уже доводилось один раз пробовать экстази, и ничего страшного не случилось. Я забавно провела вечер и пережила отходняк, хотя он мне определенно не понравился. Несколько дней у меня болел живот и совершенно не было сил. Этого опыта мне вполне хватило, и с тех пор я всегда вежливо отказывалась от экстази. Кроме прочего, каждый раз, принимая наркотики, я потом мучилась угрызениями совести, а я и без того была склонна к самобичеванию. Однако в электричке по пути в Лондон друзья убедили меняпроглотить таблетку экстази. Настоящие тусовщики принимают по несколько таблеток каждую неделю, так что почему бы мне не съесть всего одну? Впрочем, я ни в чем не виню своих друзей. Они всего лишь хотели поделиться со мной тем, что нравилось им самим. Выбор оставался за мной, и я проглотила таблетку, как раз когда поезд подходил к вокзалу Виктория. Была середина зимы, и на улице стоял дикий холод, как всегда в это время в Лондоне. Как только мы вошли в клуб, я поняла, что ночь будет долгой. Мне сразу же не понравилась музыка: насколько я люблю акустическую музыку, настолько же не люблю электронную. Из динамиков неслось техно. Зная, что мне никуда не деться до самого утра, я решила принять ситуацию, расслабилась и присоединилась к друзьям на танцполе. Они прекрасно проводили время, а я с трудом терпела происходящее. Затем таблетка подействовала в полную силу, и я поняла, что мне нужно выбраться из толпы. С меня градом лил пот. Любое прикосновение вызывало приступ клаустрофобии.Я с трудом пробиралась через переполненный танцпол, чтобы глотнуть свежего воздуха. Пол вибрировал от басов, которые отдавались у меня во всем теле. Улыбающиеся лица людей вокруг начали сливаться. Я стремительно теряла контроль над собой, и мне нужно было спрятаться в безопасном месте. Шум, смеющиеся лица и свет искажались все сильнее, пока я отчаянно пробиралась к женскому туалету. Я заперлась в кабинке, но, как мне ни хотелось остаться там всю ночь, это было невозможно. В дверь начали барабанить, и я неохотно покинула свое убежище. На улице было слишком холодно, а поезда в сторону дома начинали ходить только в шесть утра. От шума и смеха в женском туалете у меня кружилась голова. Подняв голову, я заметила подоконник. Вот оно, мое убежище, решила я. Забравшись на раковину, я сумела перебраться на подоконник, достаточно широкий, чтобы на нем можно было сидеть без риска свалиться вниз. Я незаметно устроилась в уголке над раковинами. Хаос и суета остались внизу, и я смогла немного отдышаться. С меня продолжал градом лить пот, так что я с облегчением прижалась к ледяному окну. Теперь я чувствовала себя в безопасности и мне проще было справиться с ситуацией. Мое бедное сердце колотилось с нездоровой скоростью, и я молилась о том, чтобы пережить эту ночь. Мне почему-то не пришло в голову обратиться за медицинской помощью. Может быть, подсознательно я боялась проблем с полицией из-за наркотиков. Не знаю. Но в тот момент мне казалось, что самое лучшее – это сидеть, прислонившись головой к холодному стеклу. – Эй, ты в порядке? – спросила незнакомая женщина, дернув меня за штанину, которая болталась у нее примерно на уровне глаз. Я слышала ее, но продолжала сидеть с открытым ртом, откинув голову назад и глядя в потолок. У меня не было сил ей ответить. Сердце стучало как бешеное, и я не могла пошевелиться. – Ты в порядке? – повторила она настойчиво. Я собрала все силы, опустила на нее глаза и кивнула. – Вода у тебя есть? – спросила она. Я пожала плечами, и тогда она исчезла, но вскоре вернулась с бутылкой воды. – Пей, – велела она. Я послушно выпила, и она вновь наполнила бутылку водой из-под крана. – Спасибо, – выдавила я. Разговаривать было тяжело, но полезно, потому что разговор вынуждал меня сосредоточиться на реальности, а не теряться в трипе. Нам удалось немного поболтать. Эта женщина оказалась моим ангелом-хранителем. Всю ночь я просидела на подоконнике, не в силах сдвинуться с места, с бьющимся сердцем. Она регулярно заходила меня проведать, каждый раз наполняла бутылку водой и разговаривала со мной. По сей день я не знаю ее имени, но мне страшно подумать, что бы со мной было, если бы не она. Примерно за полчаса до закрытия клуба она помогла мне спуститься с подоконника. Я все еще была не в себе, но теперь хотя бы могла разговаривать. Мы немного поболтали. Хотя мы и шутили над ситуацией, мы обе понимали, через что я прошла, и я с благодарностью обняла свою спасительницу. Она вывела меня из туалета, и вместе мы нашли моих друзей, которые всю ночь меня разыскивали и были страшно счастливы, что я нашлась живой и невредимой. «Приглядывайте за ней», – сказала им женщина, вложила мою руку в руку одного из них и ушла. По пути домой мои друзья смеялись и повторяли, что ночь была просто супер и как жаль, что наркотики выветрились. Я прислонилась лбом к стеклу и делала вид, что сплю, хотя знала, что заснуть мне удастся еще нескоро. Сердце у меня по-прежнему так и рвалось из груди, а в голове была одна-единственная мысль: поскорей бы это все закончилось. С этого дня я больше никогда не травила свой бесценный организм ядовитыми веществами. Проспав двое суток подряд, я проснулась новым человеком, благодарная за полученный урок. Лежа в постели, глядя в потолок, все еще без сил после этого безумного приключения, я была счастлива, что жива. Как никогда раньше я чувствовала, что здоровье – это великий дар, что нужно его ценить и обращаться с собой с уважением. Несколько лет спустя на концерте мне предложили таблетку экстази, и я отказалась от нее вежливо, но без малейших колебаний. Наркотики стали чем-то совершенно чуждым моему миру. В тот момент я поняла, что снова стала продуктом своего окружения – на этот раз, к счастью, совершенно другого. Теперь я вела здоровый образ жизни. В моей новой компании было принято проводить время за долгими прогулками, вылазками на природу, здоровой пищей и чаем у костра. Такое окружение подходило мне куда лучше прежнего, и я была совсем не против стать его продуктом. Энтони сделался продуктом своего окружения в самом худшем смысле слова. Когда я навещала его в интернате в первый год, он с удовольствием обсуждал политику и новости, за которыми следил по радио и телевидению. Он был весьма проницателен, не лез в карман за остроумным мнением или саркастическим замечанием. Кроме того, он расспрашивал, как у меня дела, и слушал с искренним интересом. Я выкатывала его кресло на улицу, и мы гуляли, радуясь солнцу и болтая с прохожими, а иногда просто сидели в садике во дворе интерната, наблюдая за птицами и разговаривая. Однако со временем его запал угас до такой степени, что он отказался от этих прогулок. Когда друзья или родные предлагали ему поучиться чему-нибудь новому и изменить свою жизнь к лучшему, он не хотел их слушать. – Не вижу смысла, – говорил он мне раз за разом. – Мне и здесь нормально, я принял свою судьбу. Энтони считал, что заслужил все, что с ним случилось, потому что в прошлом сам причинил другим немало вреда. – Ты уже заплатил по счету, Энтони, – говорила я. – Ты усвоил урок, и это главное. Но он отказывался себя простить. К тому же он не хотел напрягаться, чтобы менять что-то. Энтони привык к ритму жизни, принятому в интернате, и не собирался возвращаться к обычной действительности. В некотором смысле инвалидность сняла с него тяжелый груз ответственности, потому что теперь он был ничего никому не должен. Ему было неважно, что в мире полно людей с инвалидностью, которые живут полной жизнью и служат источником вдохновения для других. На самом деле, Энтони использовал свое состояние здоровья как оправдание, чтобы ничего не делать и не рисковать потерпеть еще одну неудачу. Он признался мне, что у него просто не осталось смелости на новые попытки. Лишившись остатков мотивации, он принял решение доживать свою жизнь в полусне, пока за стенами интерната всходило и садилось солнце. Я еще год продолжала иногда навещать его, несмотря на гнетущую обстановку в интернате. Но наши отношения на глазах становились односторонними. Энтони перестал звонить друзьям, в том числе и мне, а раньше мы часто разговаривали по телефону. Когда я приходила, наши разговоры вращались вокруг работы его кишечника и грубости персонала. Было трудно закрывать глаза и на то, что он полностью потерял интерес к своему внешнему виду. Энтони состарился раньше своего срока, и, хотя он по-прежнему был лет на тридцать моложе остальных обитателей интерната, теперь он казался одним из них. Он превратился в продукт своего окружения. Глядя, как он угасает, я не могла не думать о мужестве, без которого невозможно следовать зову своего сердца. К несчастью, жизнь Энтони стала наглядным примером того, чего сама я всеми силами старалась избежать. Через несколько лет мне позвонил его младший брат, чтобы сообщить, что Энтони умер. До самого конца его жизнь оставалась неизменной, и он наотрез отказывался покидать стены интерната, даже ради семейных праздников. Я невольно задумалась: о чем он думал перед смертью, окидывая мысленным взглядом прожитую жизнь? Страх Энтони потерпеть неудачу подтолкнул меня двигаться вперед. Отказавшись от любой борьбы, он лишил себя возможности меняться и расти. Он зря боялся неудачи: рискни он предпринять хоть что-то, сама попытка уже была бы успехом. Настоящим провалом Энтони было то, что он превратился в продукт своего окружения и потерял желаниеприкладывать усилия, а значит, улучшать свою жизнь. Мне было безумно жаль, что этот добрый и умный человек умер, так и не воспользовавшись всеми замечательными качествами, с которыми был рожден. Тогда я приняла решение: если мы все становимся продуктами своего окружения, то лучшее, что можно сделать, это внимательно выбирать свое окружение. Оно должно помогать, а не мешать нам идти к намеченным целям. Чтобы жить так, как я хочу, мне по-прежнему требовалась смелость. Но сознавая, как на меня влияет окружение, я могла немного облегчить себе путь. Этот урок придал мне смелости, чтобы осознанно творить свою жизнь, и напомнил о том, какую силу имеет свобода выбора. Ловушки Не всегда отношения с пациентами сразу складывались удачно. Я работала преимущественно с умирающими, но отдельные мои пациенты нуждались в уходе из-за психического расстройства. Поскольку на некоторых таких эпизодических клиентов мое присутствие оказало успокаивающий эффект, мне начали предлагать более сложные случаи. Так в очередной раз подтвердилось, что в жизни не бывает бесполезного опыта: в прошлом я не раз сталкивалась с иррациональным поведением, и теперь это помогало мне справляться со сложными пациентами. Как правило, меня не слишком обескураживало поведение проблематичных больных. Я нарочно пишу «как правило», потому что бывали и исключения. Иногда при всем моем спокойствии я никакими усилиями не могла умиротворить пациента. Как раз таким случаем была Флоренс, жившая в роскошном особняке – одном из красивейших домов в городе. В первый раз стоя перед ее дверью, я вспомнила предупреждения начальства. Флоренс решительно отказывалась от ухода, настаивая, что ей он не нужен. В этом не было ничего нового – многие пожилые люди неохотно признают, что уже не столь независимы, как раньше. Но я никак не ожидала, что моя новая пациентка выскочит из дома с метлой в руках и с визгом погонится за мной. Она выглядела совершенно безумной: волосы давно не чесанные, под ногтями земля или еще что похуже. Скача за мной в одном тапке, она ничем не напоминала Золушку. Платье, похоже, она не меняла уже год. «Убирайся! Убирайся с моей территории! – кричала она. – Я тебя убью. Убирайся! Ты такая же, как все они! Выметайся, или я убью тебя!» Швабра просвистела совсем рядом с моей головой. Я, конечно, со многим могу справиться, но я не идиотка и не мученица. Я все же попыталась успокоить Флоренс, но она меня не слушала, угрожая разбить мне стекло в машине. Это было уже слишком. «Хорошо, хорошо, – сказала я. – Я уезжаю, Флоренс. Все в порядке». Дикая и неукрощенная, она стояла перед крыльцом, защищая свою территорию, крепко сжимая в костлявых руках швабру. Уезжая, я видела ее отражение в зеркале заднего вида. Она не шевельнулась, пока я не скрылась из виду. Наверное, стороннему наблюдателю эта сценка могла бы показаться забавной, но я не могла не посочувствовать Флоренс. Невольно я гадала, кем она была раньше, какую вела жизнь и как оказалась в такой ситуации. Месяц спустя я получила ответы на свои вопросы, вновь приехав по тому же адресу. За прошедшее время Флоренс принудительно увезли в больницу с применением успокоительного. Вероятно, это была чудовищная сцена, и она ужасно испугалась. Но несколько недель в психиатрической клинике пошли ей на пользу, и теперь ей стало лучше. Врачи были довольны тем, как она реагирует на лекарства, и согласились отпустить ее домой, порекомендовав круглосуточный уход. Когда я вошла в дом, меня ждала участковая медсестра. «Она спит, но скоро должна проснуться. Я подожду вместе с вами», – объяснила она. Войдя в особняк через двустворчатые двери, я увидела громадную мраморную лестницу, роскошные люстры и великолепную старинную мебель. Все это сопровождалось невыносимой вонью. «Мы как раз закончили с прихожей. Давайте я покажу вам дом», – сказала медсестра, кивнув на команду уборщиков в соседней комнате. Флоренс уже десять лет жила буквально в свинарнике, и никто об этом не догадывался, пока недавно сосед не пожаловался медсестре на ее странное поведение. Та зашла навестить Флоренс и узнала о ее бедственном положении – не от самой Флоренс, разумеется, которая никого к себе не подпускала, а заглянув в окно дома. Питалась она одними консервами, и в кладовке у нее хватило бы запасов еще на год. Никаких других продуктов я не увидела – ничего свежего, ничего, что требовало готовки. Кухонный пол почти целиком скрывался под завалами мусора, а тот клочок, который было видно, покрылся толстенным слоем грязи. Ванная комната выглядела не лучше: повсюду сваленные в кучу грязные полотенца и высохшие куски мыла. Было также очевидно, что ни душем, ни ванной никто давно уже не пользовался. Медсестра провела меня вниз, где мы увидели еще где-то шесть спален и пару ванных комнат в таком же запущенном состоянии. Чтобы убраться в доме, были наняты профессиональные уборщики, и ожидалось, что это займет не меньше нескольких недель. Мы вышли к грязному бассейну, в котором, наверное, не смогли бы выжить даже лягушки. Стоя во дворе и глядя на этот великолепный дом, я гадала, что за печальную историю скрывают его стены. В больнице Флоренс отмыли, и она лежала в кровати в чистой нарядной ночной рубашке. Ей расчесали и подстригли волосы, а также вычистили ногти. Она совершенно преобразилась. Вместо старой кровати Флоренс в комнате стояла специальная больничная койка. Мне дали строжайшие указания: пока мы дома одни, пациентка постоянно должна оставаться в кровати с поднятыми бортиками. Вставать с кровати ей разрешалось только на два часа утром и еще на два часа днем, когда к нам присоединялась вторая сиделка. Утром она помогала с душем, завтраком и походом в туалет. Днем мы выводили Флоренс в сад или на балкон, чтобы она подышала воздухом. Кроме того, она все время должна была принимать мощные успокоительные препараты, благодаря которым стала более управляемой, чем раньше. Прошел месяц, и теперь мы с Флоренс проводили время в сияющем чистотой доме. Уборщики, наконец, закончили работу, и теперь приходили раз в неделю. У Флоренс иногда прояснялось в голове, и она стала понемногу рассказывать о себе. Она прожила замечательную жизнь, полную приключений. Она путешествовала по миру на роскошных яхтах ипобывала во многих удивительных странах. Я протягивала ей фотографии, на которые она указывала, и она рассказывала мне про каждую из них. С большим трудом я узнавала ее в красивой молодой женщине, смеявшейся с этих карточек. Я не сказала бы, что мы сильно сблизились, но мы достаточно свыклись друг с другом, чтобы мирно сосуществовать. Иногда во Флоренс по-прежнему проскальзывала та безумная, дикая женщина, которая когда-то грозила мне шваброй. Безусловно, помощь второй сиделки была нам совершенно необходима. Флоренс послушно принимала лекарства, но сопротивлялась, как бешеная, когда доходило до принятия душа. А того дня, когда мы мыли ей голову, я каждый раз ждала с ужасом. Впрочем, после душа она всегда приходила в хорошее настроение и прихорашивалась перед зеркалом, как роскошная светская дама, какой когда-то была. Флоренс была единственной наследницей очень богатой и аристократической семьи. Семья ее мужа тоже была богатой, но он все равно был ей не пара. В результате какой-то сомнительной деловой сделки он на несколько лет попал в тюрьму. Единственный родственник, с которым Флоренс поддерживала отношения, рассказал мне, что примерно в это же время она начала относиться ко всем окружающим с подозрением. Выйдя из тюрьмы, муж Флоренс скоропостижно умер, так что у нее не было возможности излечить или смягчить свою паранойю. Ее состояние ухудшалось. Она бесконечно доверяла мужу и считала, что все остальные охотятся за ее деньгами, а он оказался в тюрьме из-за чужих козней. Мне было неважно, почему ее муж попал в тюрьму, так что я об этом не задумывалась. Большую часть времени Флоренс не возражала лежать в постели. Она радовалась тому, что находится у себя дома, и иногда признавалась мне и другим сиделкам, что ей приятна наша компания. Однако каждый день, за несколько часов до дневного прихода второй сиделки, Флоренс совершенно преображалась. Это случалось почти в одно и то же время по часам. «Выпустите меня! Выпустите меня из этой чертовой кровати! Помогите. Помогите! Помогите!!!» – кричала она изо всех сил, и ее голос отражался от мраморных полов и раздавался по всему особняку. Я входила в комнату, и иногда мне удавалось ее ненадолго успокоить, но всего на несколько секунд. Не больше, чем на три. Затем она снова начинала кричать. «Помогите! Помогите! Помогиииииитеееееее!» Если бы мы с Флоренс не были в таком дорогом доме, с толстыми стенами и огромной территорией, соседи бы наверняка каждый день звонили в полицию. Ей было неважно, одна она в комнате или нет: она звала на помощь и умоляла выпустить ее из кровати, пока не приходила вторая сиделка. Вместе мы освобождали ее. Успокоить Флоренс во время приступов было невозможно, и мне было так жаль ее, что иногда хотелось ей уступить. Однако я уже видела ее в приступе паранойи и не готовабыла рисковать своей безопасностью. Я так и не забыла, как она гналась за мной со шваброй в руках и бешеной решимостью в глазах. Каждый день на время приступа Флоренс вновь превращалась в эту фурию, и я понимала, что лучше довериться мнению профессионалов, назначивших ей определенный уход и лечение. И тем не менее я не могла ей не сочувствовать. Наверное, это ужасно— оказаться пленницей в собственном доме. Бортики на кровати, требования закона и решения врачей – все это удерживало Флоренс на месте. Но задолго до всех этих факторов она оказалась в ловушке собственной паранойи. Болезнь Флоренс давно лишила ее возможности выходить из дома, заставляя подозревать, что ее могут обокрасть. Хотя большинство людей не заперты в своих домах в прямом смысле слова, нередко мы сами создаем ограничения, которые мешают нам жить. В детстве старший брат как-то запер меня в ящике. Это был большой деревянный ящик в саду, в стороне от дома. Брат убедил меня залезть внутрь и запер дверь. Но я не чувствовала, что попала в ловушку – я сидела в темноте довольная, ощущая себя в полной безопасности. Уже в три года я любила одиночество и спокойствие. Через некоторое время я услышала голос мамы, которая в панике меня разыскивала. Она выпустила меня на свободу, и я вернулась к хаосу семейной жизни. Став взрослой, я столкнулась с совсем другими ловушками. Пока я пыталась найти в себе смелость шаг за шагом двигаться по жизни туда, куда мне хочется, мне ужасно мешали прежние шаблоны мышления. Пытаясь высвободиться из этих мной же созданных ловушек, я обнаружила, что особенно нелегко будет побороть страх перед сценой. Если бы кто-то мне сказал, что фотография и писательство со временем приведут меня на сцену, я бы рассмеялась над абсурдностью этой мысли. Все началось с того, что я стала продавать свои снимки на рынках, а потом в галереях. Их продавалось не так много, чтобы на эти деньги можно было жить, но достаточно, чтобы не бросать фотографию. Вдохновившись своим скромным успехом, я решила поработать в сфере фотографии и устроилась в профессиональную лабораторию в Мельбурне. К сожалению, это оказалась офисная работа, и, год проскучав в помещении без окон, я признала, что она ничем не лучше моей прежней работы в банке. Мне не представилось ни одной возможности вникнуть в творческую сторону фотографического бизнеса, и я потеряла интерес к этой работе до такой степени, что начала делать глупые ошибки. Помню, что в то время я частовздыхала; поставив локти на стол и положив подбородок на руки, я пыталась придумать, как мне найти удовлетворение в работе, – и снова вздыхала. Впрочем, из лаборатории я вынесла понимание, что совершенно необязательно работать в сфере фотографии, чтобы хорошо снимать. С помощью новых друзей, которые хорошо разбирались в цифровых технологиях, я создала небольшую книжку о фотографии и вдохновении. И вновь качество моей работы вызвало много похвал, но недостаточно, чтобы книжку напечатали. Существенным фактором отказа была цена цветной печати, о чем мне и писали издатели, хотя некоторые добавляли, что книга получилась очень красивой. Несколько лет я безуспешно пыталась найти издателя, отдавая этому предприятию все свои силы. Но мне продолжали приходить письма с отказами, хотя иногда к ним добавлялись слова поощрения. Именно тогда, донельзя расстроенная и разочарованная провалом своих попыток, я взяла в руки гитару. Играть я почти не умела, но все равно сочинила половину своей первой песни. В тот момент я даже не представляла, что он окажется судьбоносным. Зная о том, как важно принимать настоящее, не сопротивляясь ему, я постепенно признала, что моя книга может так и не увидеть свет. Я решила, что это неважно – в своих глазах я уже преуспела, хотя бы потому, что мне хватило смелости попытаться. Успех не связан с тем, что кто-то согласится или не согласится опубликовать твою книгу. Он связан только с тем, хватит ли тебе смелости быть собой независимо ни от чего. Придя к выводу, что попытки издать книгу преподали мне ценный жизненный урок, я, наконец, сумела отказаться от этой затеи. Возможно, идея этой книги пришла мне только для того, чтобы я могла чему-то научиться. А может быть, для ее выхода еще не наступиловремя. Как бы там ни было, мне пришлось отказаться от идеи издать книгу. Я и так уже вложила в это предприятие слишком много сил и теперь чувствовала себя полностью опустошенной. Пришло время вернуться к настоящей жизни и бросить попытки контролировать реальность. Пока я приходила в себя и искала ответы на вопросы, все глубже уходя в медитацию, недописанная песня тоже лежала забытая. Но однажды, приехав домой с очередной практики молчания и медитации, я почувствовала непреодолимое желание вернуться к ней. С этого момента я знала, что писать песни – часть моего предназначения, и в тот же день не только закончила первую песню, но написала вторую. Стоило только начать, и я уже не могла остановиться. Песни так и лились из меня. В детстве мы с братьями и сестрами устраивали концерты для родных и друзей. Любовь к музыке передалась мне по наследству: позже у моих родителей были другие, более «нормальные» профессии, но, когда они познакомились, он был гитаристом, а она певицей. При всем при этом меня никогда не тянуло на сцену. Даже начав писать песни, я ужасалась при одной мысли о живом выступлении. Многие авторы песен сами их не исполняют, и именно этот вариант меня устраивал. Но чтобы быть услышанной, для начала нужно было выйти на сцену самой. Долгое время эта мысль пугала меня и тревожила. После длительных поисков работы, которая была бы мне по сердцу, я наконец нашла любимое дело, но оно требовало публичности, а я всегда так любила и берегла свое личное пространство! Я мечтала затеряться в толпе и продолжать жить тихо и незаметно. Жизнь автора и исполнителя песен, как она мне представлялась, была совершенно не для меня. Иногда нам выпадают уроки, которые можно назвать скорее полезными, чем приятными. Меня раздирали внутренние противоречия. Не помогало и то, что вовсе не все близкие одобрили мое новое поприще. В тот период я часто приходила на реку и подолгу купалась, пытаясь принять новое направление своей жизни. Прохладная вода очищала меня с каждым взмахом рук. Когда яныряла и плыла под водой, весь остальной мир исчезал. У реки не было слышно ничего, кроме пения птиц и шума ветерка в кронах деревьев. Этот покой был целителен, и я впитывала его всей кожей. Однажды я даже видела утконоса – очень робкое животное, которое почти никогда не выходит к людям. Как-то раз, сидя на берегу, чувствуя, как природа магически исцеляет мою усталую душу, я вынуждена была признаться себе в очевидном. В глубине души я всегда знала, что моя жизнь будет до какой-то степени на виду. Все равно я смогу выбирать, что оставить на виду, а что утаить. Моя жизнь принадлежит мне, и я сама буду решать, как ей распоряжаться. Если мне суждено писать песни, если я смогу этим помочь другим людям, то со временем сумею привыкнуть к этой роли. Это решение меня успокоило. Мне помогла также мысль о том, что этот путь непременно поспособствует моему личному росту, независимо от того, кто услышит мою музыку. Вспоминая свои первые выступления, я глубоко сочувствую не только себе, но и слушателям. Хотя сама музыка была неплохой, люди в зале не могли не видеть, что выступления даются мне с большим трудом. У меня дрожали руки, гитара дергалась, пальцы не попадали по струнам, а голос срывался. Это было мучительно, и часто я так нервничала, что мне становилось физически плохо. Выручала только медитация, а также постоянная практика. Упорная практика обязательно ведет к прогрессу в любом деле. Что-то не давало мне свернуть с пути, несмотря на постоянный ужас и нервы: это было принятие своего места в жизни и стремление быть полезной другим. Это также было желание быть услышанной – наконец-то у меня появилась возможность поделиться с людьми мыслями, которые я так долго держала в себе! Мне было уже хорошо за тридцать, когда я написала свою первую песню, и прошел еще год или два, прежде чем я вышла на сцену. К этому времени я совсем отказалась от алкоголя, так что приходилось смотреть в лицо своим страхам на трезвую голову. В конечном итоге сцена пошла мне на пользу и помогла раскрыться. В тот период, когда я ухаживала за Флоренс, я выступала в разных барах города, причем в основном через силу. В то время я была очень одинока, потому что из-за своих эмоциональных ран полностью замкнулась в себе. Мне удавалось выходить на сцену и петь свои песни, но долгое время это не приносило мне ни малейшего удовольствия. Однако это действительно способствовало моему развитию. Делясь своими мыслями с целым залом незнакомых людей, я вынуждена была вновь и вновь раскрываться, вылезать из своей раковины. Кроме того, мои песни и мысли встречали теплый отклик, и это поощряло меня как автора. Надо признать, что особенно тяжело было выступать в местах, не подходивших мне ни по стилю, ни по характеру. За несколько лет концерты в шумных барах и пабах надоелимне настолько, что я завязала с ними навсегда. Период обучения был завершен. Возможно, это решение ограничило круг доступных мне площадок, но я все равно не стремилась к популярности и выступлениям, так что это меня мало беспокоило. Я уже побывала на нескольких фолк-фестивалях и ощутила, какое это счастье, когда аудитория принимает тебя с уважением и не только слушает твои песни, но и понимает их. Эта связь со слушателями дает просто потрясающее чувство. Так что с этого момента я выступала либо на прекрасных площадках, либо на тематических фестивалях. Вспоминая те первые выступления, я с трудом узнаю себя. Сегодня на сцене я полностью уверена в себе, потому что играю в правильных местах перед правильными людьми. Мои песни наполнены смыслом, и, как правило, я пою их негромко, ведь мне больше не нужно перекрикивать разговоры выпивших посетителей бара и бояться потерять внимание публики, потому что по телевизору начался бокс. Если мне случается ошибиться, я просто смеюсь над собой и продолжаю играть. В конце концов, музыканты тоже люди. Приятно также, что мне больше не досаждает главный местный красавчик – посетитель бара, который выпил больше остальных и внезапно решил, что он двойник Джонни Деппа. Он стоит перед самой сценой и пожирает меня глазами, пошатываясь и только чудом не проливая восемнадцатый стакан пива. Он уверен, что сам Бог создал его на радость всем женщинам, и вот он кивает мне и подмигивает, покачивая бедрами. Если мне повезет, после концерта он будет ждать меня возле сцены, чтобы стать ответом на все моимолитвы. Таких мне встречалось немало. Бог с ними. Помимо работы над своим страхом выступлений, я каждый день шаг за шагом продвигалась по выбранному пути. Решив побольше узнать о музыкальной индустрии, я подучила музыкальную теорию и сдала вступительные экзамены в колледж. На одном экзамене мне пришлось дрожащим голосом исполнить одну из своих песен, но в конечном итоге я поступила, и вот в возрасте тридцати с лишним лет я оказалась студенткой. Каждая минута учебы была для меня счастьем. Чтобы побороть страх, мне приходилось использовать разные инструменты. Одним из них, безусловно, была практика. Регулярно выходя на сцену, я росла как музыкант и исполнитель, росла и моя уверенность. Но больше всего мне помогали методы, позволявшие высвободиться из плена ума. Они применимы к любой сфере жизни, не только к выступлениям, и до сих пор помогают мне во всем. Если во время выступления я начинала паниковать или у меня возникали упаднические мысли, вроде «да как мне вообще в голову пришло подняться на сцену», я принималась медитировать прямо посреди песни. Нет, я не переставала петь и играть, а также не усаживалась в позу лотоса. Я просто сосредотачивалась на дыхании, внимательно наблюдая каждый вдох и выдох. При этом мне приходилось довериться мышечной памяти и надеяться, что пальцы сами будут брать правильные аккорды, а голос не перестанет звучать. Этот метод работал просто замечательно: я быстро успокаивалась и возвращалась к песне с новыми силами и чувством. Второй метод, который помог мне навсегда распрощаться со страхом сцены, был еще проще: я стала обращать на себя меньше внимания, решив, что выступление – это время,которое я дарю аудитории. Перед выходом на сцену я про себя произносила простую молитву, благодаря музыку за то, что она идет сквозь меня и доставляет людям радость. Затем я просто убиралась у себя с дороги и наслаждалась концертом вместе со слушателями. Сцена научила меня многим полезным вещам. Я благодарна, что даже когда мне очень хотелось все бросить, жизнь вынуждала меня продолжать выступать. Как мы узнаем, чтоза дары ожидают нас в конце жизненного урока, если откажемся его проходить? Только прожив его, мы сможем это выяснить. Сегодня мне уже неважно, продолжу ли я выступать. Если да, то да, и я буду получать от этого громадное удовольствие. Если нет, то нет, и я буду получать громадное удовольствие от чего-то другого. Это совершенно неважно. Я просто буду идти туда, куда ведет меня сердце. Совладав со страхом сцены, я научилась обуздывать свой ум и в других сферах. Я понемногу высвобождалась из тех ловушек, которых немало создала за целую жизнь благодаря своим нездоровым шаблонам мышления. У каждого из нас есть ловушки, из которых нужно высвободиться. Большинство из них не физического свойства, и даже те, которые имеют физическую природу, с большой вероятностью имеют нефизическое происхождение – например, нездоровое мышление и негативные убеждения. К несчастью для Флоренс, она так и оставалась в ловушке своей кровати, во всяком случае, до прихода второй сиделки. Поскольку мое присутствие никак не влияло на ее приступы паники, я начала пережидать их в другой комнате. Иногда я заглядывала в дверь. Увидев меня, Флоренс на две секунды замолкала, затем отворачивалась и снова начинала звать на помощь. Жаль, что она не стала певицей – дыхалка у нее была превосходная. По Сиднейской гавани проплывали яхты. Глядя на них, я вспоминала прежних друзей, ходивших под парусом, и гадала, где они теперь. Мои размышления прерывал звонок в дверь. Как только мы со второй сиделкой опускали бортики кровати, крики прекращались, как по волшебству. Флоренс лучезарно нам улыбалась. – Здравствуйте, дамы. Как у вас сегодня дела? – спрашивала она. Мы с улыбкой переглядывались, помогая ей встать. Хотя второй сиделке не надо было ежедневно по несколько часов переносить крики Флоренс, она все равно слышала их каждый день. – Все замечательно, Флоренс, спасибо, а как ваши? – спрашивала я. – Неплохо, милочка. Я как раз любовалась лодками в гавани. Вы знаете, у них по средам соревнования. – Да, действительно, – соглашалась я. Вместе гуляя по саду, мы восторгались цветами. Сад тоже много лет стоял заброшенным, но недавно родственник Флоренс, уполномоченный распоряжаться ее деньгами, настоял, чтобы его привели в порядок. Он хотел, чтобы в дни хорошего самочувствия Флоренс могла радоваться саду. Поэтому теперь в саду регулярно трудились садовники, а бассейн вновь сверкал чистой водой. «Посмотрите, какой у меня великолепный сад, – говорила нам Флоренс. – Как он прекрасен в это время года». Мы искренне соглашались. Несмотря на долгое отсутствие ухода, сад сохранил свою красоту и теперь расцветал на глазах. «Я буквально на днях посадила эти цветы. В садоводстве нужно всегда быть начеку, особенно со всеми этими сорняками». Улыбаясь, мы вновь соглашались. Учитывая, что всего месяц-другой назад сад был похож на настоящие джунгли, было занятно слушать, каким его видела Флоренс. Выдергивая из клумбы вьюнок, она продолжала: «Садоводу нельзя лениться. Саду постоянно нужны любовь и забота». Мы расспрашивали ее о цветах, и она отвечала с поразительной ясностью, демонстрируя глубокие познания в ботанике. «Этот вьюнок задушит цветы, и они погибнут, как в ловушке, – объясняла Флоренс, выпутывая цветок из объятий сорняка. – Я никому и ничему не позволю загнать меня в ловушку, и цветы свои тоже не дам в обиду». Пока Флоренс освобождала свой прекрасный сад от всего, что мешало ему процветать, я про себя произнесла благодарственную молитву. Я благодарила за смелость, которая позволила мне заняться освобождением своей жизни от ненужных ограничений. Теперь я тоже могла расти и распускаться, как цветок. Второе сожаление Жаль, что я так много работал Вытирая посуду, я слышала, как мой пациент Джон в своем кабинете хихикает, словно школьник. «Да, и возраста она как раз подходящего», – сказал он в трубку. Речь шла обо мне. Джону было под девяносто, а мне еще не было сорока. Я покачала головой и улыбнулась, вспомнив слова одного семидесятилетнего знакомого: все мужчины – мальчишки. Выйдя из кабинета через пару минут, Джон выглядел точно так же, как всегда: дипломатичный джентльмен без малейшего признака игривости. Очень вежливо он предложил мне сходить в ресторан пообедать, и кстати, есть ли у меня розовое платье? Если нет, он с удовольствием мне его купит. Я рассмеялась и вежливо отказалась от подарка, потому что розовое платье у меня как раз было. Хотя в мои профессиональные обязанности не входило наряжаться для клиентов или ходить с ними по ресторанам, мне было приятно доставить умирающему старику удовольствие. Он был на седьмом небе от счастья. Джон забронировал для нас столик в дорогущем ресторане. Это был самый лучший столик, у окна, с видом на парк и гавань. Джон в своем темно-синем пиджаке с золотой отделкой выглядел настоящим франтом и благоухал дорогим одеколоном. Положив руку мне на талию, он подвел меня к нашему столику. Полюбовавшись видом, я перевела взгляд на своего спутника и заметила, что он подмигнул четырем мужчинам за соседним столом. Они хихикали и разглядывали нас, но, перехватив мой взгляд, тут же сделали серьезные лица. «Это ваши друзья, Джон?» – спросила я с улыбкой. Смутившись, он признался, что хотел похвастаться перед друзьями, какая красивая ему досталась сиделка. Я расхохоталась. «Любая женщина моего возраста покажется красивой, если вокруг всем под девяносто!» Манеры у Джона были безупречные, и я невольно пожалела, что мои ровесники так редко обладают старомодным обаянием и знанием этикета. Обед прошел просто замечательно. Джон заранее позвонил в ресторан и предупредил, что я веганка, так что меня ждал специально испеченный вкуснейший овощной рулет. Друзьям Джона было запрещено вмешиваться в наш обед и даже подходить к столу. Он обещал представить меня им после еды, поэтому они терпеливо сидели и ждали, пока мы закончим есть и разговаривать. Затем Джон, вновь положив руку мне на талию, подвел меня к их столику, где я идеально сыграла роль его подруги, обаяв всех, но продолжаяуделять основную часть внимания своему спутнику. Он напоминал мне петуха, распушившего перья от гордости. Выход в свет удался. Все это время я оставалась сиделкой умирающего. Что плохого было в том, чтобы невинной игрой порадовать Джона, которому осталось не так-то много походов в ресторан?Вернувшись домой и, к разочарованию Джона, переодевшись из розового платья в рабочую одежду, я помогла ему лечь в постель. Наше маленькое приключение доставило емуморе удовольствия, но совершенно лишило сил. Умирающие люди так слабы, что ненадолго выйти в свет им так же тяжело, как неделю отработать грузчиком. Любящие родные и друзья часто не понимают, насколько их визиты утомляют больных. В последнюю неделю или две жизни любые посещения, которые длятся более пяти – десяти минут, становятся для пациентов тяжелым трудом, но как раз в это время их начинают особенно активно навещать. Впрочем, в тот день мы с Джоном были дома одни, и он уснул глубоким сном. Складывая розовое платье в сумку, я радовалась, что мне удалось доставить ему удовольствие. Мне наш обед тоже очень понравился. Моя молодость выручала Джона и в других областях. Я лучше него понимала в компьютерах, и вот уже месяц пыталась навести порядок в его файлах. Для своего возраста Джон справлялся с компьютером просто отлично, не пасуя перед новыми технологиями. Но все его документы были в страшном беспорядке, потому что он ничего не знал о папках и организации файлов. Пока он спал, я отправлялась в кабинет и разбирала по категориям и папкам сотни документов, одновременно создавая алфавитный указатель, чтобы каждый легко было найти. На следующей неделе Джону стало заметно хуже, и я порадовалась, что мы сходили на тот обед. Было очевидно, что больше Джон из дома не выйдет. Он мог прожить еще несколько недель, но силы покидали его на глазах. В тот день мы сидели на балконе, глядя, как солнце заходит за Сиднейский мост и здание оперного театра. Джон был в халате итапочках, он пытался есть, но безуспешно. «Ничего, Джон, если вам не хочется, не ешьте», – сказала я, и мы оба знали, что это значит. Джон умирал, и времени оставалось уже немного. Кивнув, он положил вилку на тарелку и отдал их мне. Я отставила поднос в сторону, и мы продолжили любоваться закатом. Прервав наше мирное молчание, Джон вдруг произнес: «Жаль, что я так много работал,Бронни. Каким же я был идиотом». Не дожидаясь поощрения, он продолжил: «Я убивался на работе, и теперь я одинокий умирающий старик. А самое страшное – я остался один с тех самых пор, как вышел в отставку, а ведь этого можно было избежать». Я слушала, не перебивая, а он рассказывал мне свою историю. Джон и Маргарет вырастили пятерых детей. Четверо из них сами уже стали родителями, а пятый умер в тридцать с небольшим. Когда все дети выросли и уехали из дома, Маргарет попросила Джона уйти с работы. Они оба были в хорошей физической форме, и им хватало денег на безбедную старость, но Джон всегда считал, что нужно подзаработать еще. Маргарет говорила, что в крайнем случае они продадут свой громадный, теперь полупустой дом и купят что-то небольшое. Так они препирались целых пятнадцать лет, а он все продолжал работать. Маргарет было одиноко. Она мечтала, что они с Джоном снова будут вдвоем, без детей и работы. Годами она изучала туристические буклеты, предлагая Джону съездить то в одну страну, то в другую. Он тоже хотел путешествовать и охотно соглашался на любые предложения. К несчастью, он никак не мог расстаться с тем статусом, который давала ему работа. Сама работа ему даже не особенно нравилось, но зато очень нравилась роль, которую он играл в обществе и среди друзей. К тому же он пристрастился к тому адреналину, который получал во время гонки за сделками. Однажды вечером, когда Маргарет в очередной раз в слезах попросила Джона уйти в отставку, он посмотрел на нее и вдруг заметил, что они оба успели состариться. Его жена так терпеливо ждала, пока он выйдет на пенсию. Она казалась ему такой же красивой, как и в день их знакомства. Но именно в тот день Джон впервые задумался о том, что они не будут жить вечно. Испугавшись, он согласился уйти с работы. Маргарет вскочила и обняла его, заливаясь уже слезами радости, а не горя. Но ее улыбка тут же погасла, потому что он добавил: «Через год». В компании шли переговоры о важной сделке, и Джон хотел дождаться ее конца. Маргарет ждала его увольнения пятнадцать лет – конечно, она могла подождать еще год. Она пошла на этот компромисс, хотя и неохотно. Солнце исчезло за горизонтом, а Джон объяснил мне, что уже тогда чувствовал себя эгоистом из-за этого решения, но никак не мог отказаться от последней сделки. Его жена мечтала об этом моменте годами, и вот он наконец приближался. Маргарет начала планировать первую поездку, активно советуясь с туристическим агентством. Каждый вечер, когда Джон возвращался домой, она ждала его ужинать. Сидя за столом, вокруг которого раньше собиралась вся их семья, Маргарет с энтузиазмом делилась с Джоном своими мыслями и идеями. Он тоже понемногу начал смиряться с идеей выхода на пенсию, хотя и настаивал, что дождется окончания года. Прошло четыре месяца с тех пор, как Джон согласился уйти с работы. Оставалось подождать еще восемь, когда Маргарет впервые почувствовала себя неважно. Сначала ее просто немного тошнило, но шли дни, а ей не становилось лучше. «Завтра я иду к врачу», – сказала она Джону, когда он пришел с работы. На улице было уже темно. Вдали был слышен шум машин – люди ехали домой с работы. «Наверняка это какая-нибудь ерунда», – добавила она с деланым оптимизмом. Джон, конечно, переживал, что Маргарет плохо себя чувствует, но не слишком тревожился до следующего вечера, когда выяснилось, что врач попросил ее сдать анализы. За семь дней, что они ждали результатов, состояние Маргарет ухудшилось настолько, что серьезность ситуации стала очевидной. Впрочем, им и в голову не приходило, насколько все серьезно: Маргарет оставалось жить несколько месяцев. Мы столько времени проводим, строя планы на будущее, откладывая счастье на потом, как будто у нас в запасе целая вечность. На самом деле у нас нет ничего, кроме сегодняшнего дня. Нетрудно было понять, почему Джона терзает глубокое раскаяние. Любить свою работу нормально, в этом нет ничего плохого. Я и сама любила свою работу, хотясиделке нередко приходится грустить. Но когда я спросила Джона, насколько его радовала бы работа, не имей он поддержки семьи, он только покачал головой. «Ну, моя работа мне скорее нравилась. И определенно нравился статус, но какой сейчас от него прок? Я не уделял времени тому, что было в моей жизни самым важным: семье и Маргарет, моей милой Маргарет. Она всегда дариламне любовь и поддержку. А я всегда был на работе. И ведь нам с ней было так весело. Мы бы с ней отлично проводили время вдвоем». Маргарет умерла за четыре месяца до намеченной даты увольнения Джона, хотя к этому времени он уже бросил работу, чтобы ухаживать за женой. С тех пор жизнь Джона была отравлена чувством вины. Даже если ему удавалось договориться с собой об относительном принятии своей «ошибки», как он ее называл, он тосковал о том, что мог бы сейчас путешествовать и смеяться с Маргарет. «Думаю, что я боялся. Да. Я был просто в ужасе. Работа определяла мое место в жизни. Конечно, теперь, на исходе жизни, я понимаю, что просто быть хорошим человеком более чем достаточно. Почему мы так зависимы от материального подтверждения своего успеха?» – рассуждал Джон вслух. В его словах звучала грусть за всех людей, которые оценивают себя не за то, какие у них сердца, а за то, чем они владели и что сделали в жизни. «Нет ничего плохого в том, чтобы стремиться к комфортной жизни. Пойми меня правильно, Бронни, – сказал Джон. – Но постоянная гонка за деньгами и успехом, постоянная потребность получать признание за свои достижения часто заслоняет от нас самые важные вещи в жизни – время, которое мы проводим с любимыми людьми и за любимыми занятиями, а также баланс. Если как следует подумать, то все дело в балансе, верно?» Я молча кивнула, соглашаясь с ним. Над нами загорелось несколько звезд, разноцветные огни города отражались в темной воде. У меня тоже в жизни бывали проблемы с балансом. Слишком
