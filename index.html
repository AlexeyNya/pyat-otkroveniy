часто я следовала принципу «всё или ничего», даже в работе сиделкой. Мой обычный рабочий день длился двенадцать часов, и чем меньше оставалось жить пациентам, тем меньше они сами и их семьи хотели менять сиделок. Поэтому в последний месяц жизни пациента я нередко работала по шесть дней в неделю, иногда оставаясь и на ночную смену, то есть проводя с пациентом тридцать шесть часов подряд. Работать по восемьдесят четыре часа в неделю вредно, даже если очень любишь свою работу. Иногда я не могла никуда отлучиться, несмотря на накопившиеся дела, даже если мои пациенты спали. В такие моменты мне казалось, что моя собственная жизнь поставлена на паузу, хотя теперь, конечно, мне понятно, что работа была такой же частью моей жизни, как и все остальное. Когда очередной пациент умирал, я оставалась совершеннобез сил. Обычно новый регулярный пациент появлялся не сразу, поэтому я с радостью отдыхала от работы, встречалась с друзьями, возвращалась к музыке и текстам, а потом весь цикл повторялся с начала. «Каникулы» между пациентами обычно длились достаточно долго, прерываясь на одну-другую случайную смену, и я любила это время. Однако вместе с работой прекращался и заработок, поэтому с финансовой точки зрения каникулы были тяжелым бременем. Примерно в это же время мне предложили раз в неделю работать офис-менеджером в перинатальном центре. Это оказалась стабильная и очень приятная работа. В центре проводились курсы и занятия для беременных и мамочек с маленькими детьми. Нередко в один день я ухаживала за умирающим человеком, а на следующий работала в окружении едва начавших ходить карапузов, забиравшихся мне на колени и целовавших мои щеки. Для меня это было здоровое напоминание о радости и о полном жизненном цикле. Один из моих пожилых пациентов умирал, и одновременно в центре появлялся новый малыш, хрупкий и прекрасный. Моя начальница, Мари, была потрясающей женщиной с огромным добрым сердцем. Я полюбила ее сразу же и люблю по сей день. В мои обязанности среди прочего входило обновлять учебные материалы к занятиям для беременных, поэтому я много читала о подходе к беременности и родам в разных культурах мира. Я узнала, насколько естественно относятся к этому процессу во многих культурах – его считают от начала и до конца радостным, прекрасным торжеством. Это укрепило меня во мнении, что в нас, западных людях, с детства воспитывается ненужный страх перед многими естественными сторонами жизни. Мне было очень полезно оказаться так близко к жизни и рождению. Из-за того, что я много времени проводила с умирающими и сильно сопереживала пациентам и их семьям, ярегулярно чувствовала упадок сил. В мире множество людей, посвятивших жизнь работе с умирающими. Возможно, они лучше меня научились отстраняться от этого занятия и находить баланс в жизни – я не знаю, но безмерно уважаю их. Однако, когда я стала всего один день в неделю посвящать началу жизненного цикла, а не его концу, мне удалось вернуть в свою жизнь такую легкость, о которой я давно уже забыла и думать. Как будто кто-то открыл окна и впустил в помещение чистый воздух, наполнивший меня свежей энергией. Постоянно наблюдая как смерть, так и рождение, я начала видеть в своих умирающих пациентах младенцев, какими они когда-то были. А когда мамочки гордо показывали мненоворожденных, я думала о том, как эти дети вырастут и проживут долгую, наполненную впечатлениями жизнь. Затем однажды и они достигнут конца своего пути, как мои пациенты. Это было захватывающее время – так близко видеть обе противоположности. Это был бесценный дар. Именно с того времени я с новым состраданием начала смотреть на окружающих людей. Я вдруг поняла, что когда-то все они были хрупкими детьми и что однажды они все умрут, как и я сама. В родителях, братьях, сестрах, друзьях и даже совсем чужих мне людях я начала видеть беззащитных детей, когда-то смотревших на мир бесконечно доверчиво, с невинностью и надеждой. Я представляла, какими они были до того, как их ранили другие люди – семья, друзья или общество, – лишив их открытости, с которой они были рождены. Мне стало ясно, что каждый человек рождается с добрым сердцем, и я начала любить всех людей без разбору, как нежная и заботливая мать. Я стала понимать, что все те обидные слова, которые годами говорили мне родные и близкие, происходили на самом деле не от них. Это говорили нанесенные им раны, а не те прекрасные, чистые создания, которыми они родились на этот свет много лет назад. В каждом из них все еще жил невинный малыш. И однажды каждый из них сможет увидеть свою жизнь новыми глазами – с той мудростью, которая приходит ко многим на смертном одре. Да, порой мне казалось, что я не люблю каких-то людей в своей жизни. Но теперь я поняла, что не любила на самом деле не их самих, а их поведение и слова. Зато я искренне любила их невинные сердца – тех детей, которые когда-то верили, что мир позаботится о них и подарит им счастье. Когда этого не случилось, боль и разочарование стали толкать их на недостойные поступки. Я и сама не была исключением. Я тоже причиняла боль другим из-за собственных страданий, разочарованная, что жизнь не оправдала моих надежд. В сердцах моих родных, как и всех людей в мире, еще жила изначальная чистота. Ее лишь нужно было уметь разглядеть за болью. Я не была уверена, что смогу восстановить гармоничные и счастливые отношения с некоторыми близкими, но это уже было не так важно. Я знала, что когда-то они тоже были крошечными и прекрасными малышами, доверчивыми и невинными, как все дети. Их злые слова были лишь следствием страданий – страданий ребенка, который заблудился точно так же, как и я сама. Этого было достаточно, чтобы я смогла всем сердцем полюбить их. Сидя на балконе рядом с Джоном, я и в нем видела хрупкого ребенка: маленького мальчика, который почему-то решил, что будет счастливее, самоутверждаясь за счет работы, чем путешествуя с женой. Теперь он стал глубоким стариком, но я совершенно отчетливо видела в нем невинного малыша. Он глубоко вздыхал, а по щекам его медленно катились слезы. Оставив его наедине со своими мыслями, я унесла в дом тарелки и прибралась на кухне. Вернувшись, я укрыла Джону колени пледом, поцеловала его в щеку, а затем снова села рядом. – Если я что-то и понял о жизни, Бронни, то только одно. Не живи так, чтобы потом пожалеть, что слишком много работала. Я не знал, что мне придется об этом пожалеть, пока не оказался одной ногой в могиле. Но в глубине души я знал, что слишком много работаю, и не только по мнению Маргарет. Зря я волновался, что обо мне подумают другие, – теперь мне это совершенно все равно. И почему только я не смог сообразить этого раньше. Покачав головой, Джон продолжил: – Нет ничего плохого в том, чтобы любить свою работу и отдавать ей много сил и времени. Но в жизни есть еще столько всего кроме работы. Баланс, вот что важно – поддерживать правильный баланс. – Я с вами согласна, Джон. Жизнь уже преподала мне несколько уроков на эту тему, но я продолжаю над ней работать, так что не волнуйтесь, – призналась я. Он знал, что я имею в виду. Мы уже достаточно рассказали друг другу о себе, чтобы он меня понял. Вдруг Джон рассмеялся, и я попросила его поделиться шуткой. – Ну, я сказал, что дам тебе только один совет – не работать слишком много. Но мне только что пришел в голову другой совет, не менее важный. – Что за совет? – улыбнулась я. Он посмотрел на меня с озорным блеском в глазах и произнес: – Не вздумай выбросить то розовое платье! Смеясь, Джон жестом предложил мне пододвинуть стул поближе. Я придвинулась к нему, тоже смеясь, и мы еще пару часов сидели рядом, глядя на гавань, кутаясь в пледы. Разговор то и дело прерывался долгими паузами, в которых не было никакой неловкости. Иногда Джон глубоко вздыхал. Я брала его за руку, и он в ответ пожимал мои пальцы. Повернувшись ко мне с печальной улыбкой, он сказал: – Если мне суждено оставить на земле что-то хорошее, кроме своей семьи, пусть это будут такие слова: не работай слишком много. Старайся сохранять баланс. Пусть работа не становится всей твоей жизнью. Ласково ему улыбнувшись, я поднесла его руку к губам и поцеловала. Через несколько дней Джон умер. Мне еще не раз предстояло услышать его совет от других пациентов. Но он сумел донести до меня эту мысль, и я никогда ее не забывала. Предназначение и сила намерения Прошло много времени с тех пор, как я присматривала за домом Рут в ожидании его продажи. Но ее семья рассказала обо мне своим знакомым, и вот уже другие люди стали регулярно предлагать мне пожить у них дома, приглядывая за хозяйством, пока сами они в отъезде. Переезжать каждые несколько недель или месяцев было нелегко, зато мне довелось пожить во многих прекрасных домах. Один из них даже стоял рядом с домом самого богатого человека во всей Австралии, так что жаловаться на условия мне определенно не приходилось. Во многих домах были приходящие уборщики и садовники, а порой даже мойщики окон. Мне оставалось только жить в доме и наслаждаться им, как своим собственным. Это, разумеется, было совсем несложно. Мои клиенты часто оказывались не только обеспеченными, но и творческими людьми, и их дома были яркими, разноцветными и уютными. Через владельца одного из этих домов я познакомилась с Перл. Ее дом был жизнерадостным, как и она сама – насколько это вообще возможно для умирающего человека. Мы сразу друг другу понравились. У Перл было три собаки, одна из которых обычно боялась незнакомых людей, но ко мне сразу забралась на колени – животные чувствуют тех, кто их любит. Симпатия этой маленькой черной собачки сразу помогла нам с Перл наладить контакт. За несколько месяцев до этого, незадолго до шестидесятитрехлетия, Перл узнала о своей смертельной болезни. Она так любила свой дом и собак, что была твердо намерена умереть дома. Друзья Перл уже пообещали взять к себе всех троих собак, когда придет время, поэтому она не беспокоилась, что их разлучат. Она также с принятием относилась к своему приближавшемуся концу. Многие из моих пациентов поначалу отвергали мысль о том, что скоро умрут. Перед тем как принять неизбежное, они проходили целую гамму эмоций. Другие пациенты, узнаво своей болезни, впадали в шок, потому что новость сообщалась им слишком неосторожно – небрежно, без глубокого понимания тяжести ситуации. Иногда такую неосторожность проявлял кто-то из родных, иногда врач. В таких случаях всегда необходима искренняя доброта. Перл без возражений принимала мысль о том, что ее время пришло. Она рассказала мне, что ей было чуть проще смириться с болезнью, потому что она потеряла и мужа, и дочь более тридцати лет назад. Теперь она надеялась наконец увидеться с ними вновь. Муж Перл погиб в результате несчастного случая на работе, хотя ей и не нравилось выражение «несчастный случай»: она считала, что случайностей не бывает. «Так было предназначено, – сказала она мне. – Мне это было невыносимо больно, но прожив еще тридцать лет, я поняла, что эта потеря помогла мне стать тем человеком, которым я стала, и помогать другим. Я никогда не стала бы собой, не пережив его уход». Она философски относилась и к смерти дочери. Тоня умерла в возрасте всего восьми лет, от лейкемии, спустя меньше года после смерти своего отца. «Потерять ребенка действительно чудовищно. Родители не должны хоронить детей. И тем не менее это происходит ежедневно, по всему миру. Я лишь одна из многих таких матерей». Я слушала и восхищалась покоем, исходившим от Перл, когда она говорила о дочери. «Счастье, что она не слишком долго страдала. Я верю, что она пришла в мою жизнь, чтобы научить меня безусловной любви. С тех пор я способна дарить ее другим, даже если они мне не родственники. Милая Тоня, мой маленький ангел». Воспоминания потеряли былую четкость в мыслях Перл, но сохранили прежнюю яркость в ее сердце. Она любила дочь так же сильно, как и раньше; любовь не умирает. После смерти Тони, рассказала Перл, ей было бесконечно тяжело, прошло немало лет, прежде чем она пришла в себя. Но она никогда не считала себя жертвой. Хотя Перл довелось узнать, как больно потерять ребенка, – и она не желала этого злейшему врагу, – ей также выпала радость иметь ребенка, а ведь это, заметила она, дается далеко не всем. Мы согласились, что любые трудности несут в себе какой-то скрытый дар. «Люди годами притворяются жертвой ситуации, – сказала Перл. – Но кого они пытаются обмануть? Они обманывают лишь сами себя. Жизнь нам ничего не должна. Нам никто ничего не должен,кроме нас самих.Так что лучший способ прожить жизнь – это ценить ее дары и принять решение не быть жертвой». Я рассказала Перл, что встречала многих жертв, но настоящим потрясением было однажды увидеть жертву в себе самой. Внезапно осознать: я так погрузилась в свои травмы, что больше ни о чем не могу думать, кроме своих былых страданий. Она согласилась со мной безо всякого осуждения. «Это иногда случается со всеми. Между состраданием и ощущением себя жертвой проходит тонкая грань. Сострадание – это целительная сила, которая рождается из доброты к себе. Разыгрывать жертву – токсичная и напрасная трата времени, это не только отталкивает других людей, но и лишает возможности истинного счастья. Никто нам ничего не должен, – повторила она. – Только мы должны самим себе: встать с пятой точки, поблагодарить судьбу за все хорошее и отправляться решать свои проблемы. Когда смотришь на жизнь с такой позиции, она начинает осыпать тебя дарами». В тот день я буквально влюбилась в свою новую пациентку. Перл говорила о том, как трудно приходится многим людям, с какими они сталкиваются огромными сложностями, но несмотря ни на что ухитряются выстоять и найти радостьв мелочах жизни. Другие, наоборот, непрестанно жалуются на свою жизнь, даже не представляя, что по сравнению с другими у них все просто замечательно. Я охотно согласилась с ней: как бы мне ни было плохо, я всегда помнила, что мне во многом повезло – большинству людей живется гораздо тяжелее. Когда Перл удалось восстановить относительно нормальное течение жизни после потери мужа и дочери, она на несколько лет с головой ушла с работу. Работа ей нравилась: она любила коллег и клиентов, считала одной из своих главных задач поддерживать и воодушевлять их, и это ей неизменно удавалось. Но при этом она всегда ощущала внутри пустоту. Почти двадцать лет она объясняла такое ощущение болью утраты семьи. Ее жизнь изменилась совершенно случайно: однажды она согласилась после работы помочь одному из клиентов, который разрабатывал новую программу поддержки бедных семей. Даже не замечая этого, Перл постепенно все больше втягивалась в проект, потому что ей нравилась его идея и цели. «Впервые за двадцать с лишним лет я вновь ощутила, что живу. И знаете почему? – спросила она. – У меня появилось предназначение, смысл жизни. Вот причина той внутренней пустоты: я не видела смысла в своей работе». Это было мне очень понятно. Я рассказала Перл про свою работу в банке, про то, как мне было сложно, пока я не нашла себя в паллиативном уходе за больными и в музыке – занятиях, которые приносили мне все большее удовлетворение. Она согласилась, что моя новая работа гораздо осмысленней предыдущих. Впрочем, Перл, как и я, считала, что в совершенно любой работе можно найти свое истинное предназначение, главное – найти правильную область. Все дело в точке зрения. В доме Перл была красивейшая застекленная терраса, где зимнее солнце грело нас через прозрачную крышу. В эту светлую и уютную комнату я выкатывала кресло Перл каждое утро – обычно у нее на коленях лежала хотя бы одна собака, а чаще все три. Мы литрами пили свежие травяные чаи и радовались каждому новому дню. Однажды я сказала Перл, что это времяпрепровождение совершенно не кажется мне работой. Она просияла и ответила: «Конечно, так и должно быть. Когда занимаешься любимым делом, это кажетсяне работой, а естественным продолжением тебя». Социальный проект рос и превратился для Перл в дело всей жизни. Через год она ушла с прежней работы и полностью посвятила себя новой роли. Вначале она получала меньше денег, чем раньше, но ей было все равно. Со временем ее зарплата выросла. «Иногда перед прыжком нужно сделать несколько шагов назад, чтобы разогнаться, – смеяласьПерл. – Люди совершенно не понимают, что такое деньги. Из-за денег они торчат на неподходящей работе, потому что боятся, что не смогут заработать любимым делом. На самом деле все наоборот. Если ты любишь свое дело, то лучше открываешься потоку денег, потому что сильнее погружен в свою работу и к тому же счастлив. Конечно, понадобится время, чтобы изменить свое мышление и придумать, как заработать побольше». Одна моя подруга как-то удачно высказалась на эту тему, и я поспешила поделиться ее мыслью с Перл. Мы слишком много значения придаем деньгам. На самом деле нам надо понять, что мы хотим делать, каким проектом заниматься, и работать над ним сосредоточенно, решительно, не теряя веры. Деньги не должны быть целью. Целью должен быть сам проект. Тогда деньги придут к вам естественным образом, зачастую самыми невообразимыми путями. Я уже убедилась в этом на собственном примере. Когда мне переставало хватать денег, это происходило обычно потому, что я сосредотачивалась на своем страхе остаться без денег, и этот страх воплощался в реальность. Когда я сосредотачивалась на хорошем, помня, как мне повезло, и работала над достижением той цели, к которой меня подталкивала жизнь, все плыло мне прямо в руки. Одной из величайших наград за то, что я смело шла своим путем, стала для меня запись первого альбома. В то время я жила в доме, за которым присматривала чаще других и который особенно любила. Там-то мы и записывали альбом – в великолепном темно-розовом доме, выходившем окнами на лес. Мы выбрали время, которое подходило всем – и моему звукорежиссеру, очень занятому человеку, и другим музыкантам. Не хватало только одного: денег! У меня были сбережения, но их не хватало. Внутренний голос велел мне готовиться к записи, как будто она была решенным делом, и я так и поступила. Музыканты поставили запись в свои графики, а я много времени проводила за репетициями, шлифуя песни. Но чем ближе подходил назначенный срок, тем слабее становилась моя вера. В глубине души я знала: жизнь не подтолкнула бы меня к записи альбома, будь это невозможно. Поэтому в хорошие дни я была уверена, что все завершится успешно – в конце концов, мне уже случалось рисковать. Я верила в себя и свою способность притягивать все необходимое. Но страх все равно бурлил во мне, понемногу поднимаясь на поверхность, так что моя вера уже не справлялась с ним. Начало записи назначили на понедельник. Наступила пятница, а деньги я так и не нашла. Страх сделался невыносимым. Звукорежиссер не мог позволить себе неоплачиваемые выходные. Музыканты тоже были очень занятыми людьми. В панике я села медитировать, и по моим щекам хлынули слезы. Они копились месяцами, пока я пыталась оставаться сильной, и вот теперь выплеснулись наружу. Всхлипывая, я выпустила из себя все отчаяние, признавая, что у меня больше не осталось сил. Я делала все так, как подсказывала мне жизнь, но продолжать я ужене могла.Это было слишком тяжело. Затем, наконец, наступил момент полного принятия. Я больше ничего не могла сделать. Мне оставалось только передать ситуацию в руки высших сил. Перепуганная и опустошенная, я решила выбраться из дома и послушать музыку, чтобы отвлечься. В этот момент мне позвонила подруга по имени Габриэла, ничего не знавшая о моей ситуации, и позвала в кафе/книжный магазинчик с ней и еще одной знакомой. Эта мысль понравилась мне больше, чем идти на концерт в одиночестве, и я согласилась. Пообещав себе хорошо провести время и ненадолго забыть о своем бедственном положении, я вышла из дома. Завтра будет новый день, и я займусь проблемами с новыми силами. Сегодня мне просто нужно выкинуть их из головы. Габриэла листала книги, а мы с ее подругой Лианн сидели на диванчике и болтали. До этого мы с Лианн виделись только раз, несколько лет назад и ненадолго. Она спросила, где я живу, и я объяснила, что своего жилья у меня нет, я переезжаю из дома в дом. Это ее заинтриговало, но также оказалось полезным, потому что она как раз собиралась покупать дом, и ей очень кстати пришлось мое знание разных районов города. Я рассказала ей, что веду такой образ жизни, чтобы не платить за жилье и одновременно продолжать работать над творчеством, особенно над своей музыкальной карьерой. Сама Лианн находилась в процессе затяжного развода и раздела имущества с бывшим мужем, поэтому ей не меньше хотелось отвлечься от своей жизни, чем мне от моей. Мы продолжали непринужденно болтать, но, когда она спросила меня об альбоме, это вернуло меня к реальности. Сожалея, что дала разговору зайти в эту сторону, я честно рассказала ей обо всем, в том числе поделилась, что мне осталось надеяться только на чудо. Она подробно расспросила меня об альбоме, о других музыкантах, о том, какие планируются инструменты, что заставило меня начать писать музыку, – я обо всем ей рассказала. Затем без малейших сомнений она объявила, что всегда мечтала поддерживать искусство, но не знала, с чего начать, что в ее жизни наступил ужасно противный период и ей срочно нужно сделать что-то позитивное, поэтому она будет у меня дома в понедельник утром с необходимой суммой денег. У меня из глаз брызнули слезы облегчения и радости. Ни о чем не думая, я обняла Лианн, борясь с собой, чтобы не разрыдаться по-настоящему. Проблема решена. Все уладилось. Альбом будет записан. Деньги сами приплыли ко мне в руки. Лианн присутствовала на некоторых сессиях записи. Она лежала на ковре, слушая через наушники, как мы играем и поем. Она не вмешивалась в процесс – ей довольно было того, что запись происходит. Что за чудесная, щедрая женщина. Каждый раз, оказываясь на распутье, я вспоминала этот случай, и он придавал мне сил. Помощь всегда приходит. Нужно только не загораживать ей путь. Перл была в восторге от этой истории, потому что она подтверждала ее собственные мысли. «Да, именно так. Страх блокирует поток благополучия. Деньги – это всего лишьвид энергии, которая хочет принести нам добро и счастье. Но мы неверно с ними обращаемся: наделяем их особой силой, преследуем их, боимся их, теряем баланс в жизни в погоне за ними, – сказала она. – Деньги так же доступны нам, как воздух. Мы же не тратим время, беспокоясь, что нам не хватит воздуха, не нужно волноваться и по поводуденег. Эти мысли блокируют естественный поток этой любящей, творческой энергии». Я согласилась. Когда Перл только начинала работать в социальном проекте, ее коллеги постоянно беспокоились о деньгах. Вся их энергия уходила на мысли о том, как и где найти денег, а незачемэто делать. К счастью, они с интересом отнеслись к философии Перл. Хотя они не сразу поверили, что смогут привлечь необходимые средства для каждой стадии проекта, уверенность Перл оказалась заразительной. Было решено продолжать работать над проектом, верить, что деньги появятся, и прикладывать все возможные усилия для их поиска. Сделав все возможное, они принимали ситуацию и продолжали работать так, как будто деньги вот-вот найдутся. Перл, впрочем, не сомневалась в успехе предприятия и служила огромным источником вдохновения для всей команды. Вскоре, к великой радости сотрудников, деньги потекли в проект из самых неожиданных источников. Программа расширялась, помогая все новым и новым людям. Через несколько лет Перл и остальные зарабатывали уже вполне приличные деньги, продолжая расти, помогать все большему количеству нуждающихся людей и наслаждаться своей работой, как лучшим в мире отдыхом. Солнце ушло за дом, и мы вернулись в гостиную, где я уже разожгла камин. Перл была без сил, но ложиться в постель до наступления вечера было против ее правил, поэтому днем она только отдыхала на кушетке у огня. Я поправила подушки, чтобы ей удобней было сидеть, и накрыла ее большим пледом. Как и все в доме Перл, включая саму хозяйку,плед был разноцветным и ярким. Огонь уютно освещал комнату. Как только Перл устроилась на кушетке, к ней под бок запрыгнули собаки и тоже улеглись. Эта прекрасная картина – Перл, собаки, огонь в камине, яркие краски того дома – так и стоит у меня перед глазами спустя годы. «С деньгами все дело в намерении», – вдруг произнесла Перл. Пододвинув стул поближе к ней, я приготовилась слушать. «Деньги текут нам в руки особенно свободно, если намерение благородное. Мы нашли финансирование для своего проекта, потому что он был задуман на благо других людей. Конечно, мы тоже были в выигрыше, потому что заработали, занимаясь любимой работой, и к тому же обрели свое предназначение». Если мы находим в работе свое предназначение, считала Перл, то естественным путем подходим к ней с правильными намерениями. Любая работа, наделенная предназначением, каким-то образом приносит благо другим людям. Тогда на поддержку нашего намерения деньги придут сами, при условии, конечно, что мы сделаем все от нас зависящее и не позволим страху преградить путь потоку благополучия. Люди среднего и старшего возраста особенно часто задаются вопросами о смысле жизни и стремятся установить связь с миром через работу. Именно об этом естественном стремлении к предназначению Перл и говорила. Она была образованной и мудрой женщиной и охотно делилась своими мыслями. Я думаю, что, даже если бы она не умирала, мы бы общались точно так же непринужденно и откровенно. Перл продолжила развивать свою мысль, заметив, что не все родители, например, уважают свою работу, а ведь намерение вырастить счастливых детей – это огромный вклад в общество. Благодаря ему в мире появляются хорошие взрослые. Ей больно слышать, сказала Перл, как матери говорят о себе «я просто мама», ведь материнство – важнейшая работа, наполненная глубочайшим смыслом. По мнению Перл, даже люди, возделывающие свой сад, занимаются значительной и осмысленной работой: они прославляюткрасоту планеты. Я тут же вспомнила одну замечательную женщину из Перта, чей сад наполнял мое сердце радостью каждое утро по пути на станцию. Мне настолько приятно было любоваться ее цветами и кустарниками, что однажды я кинула в ее почтовый ящик открытку со словами благодарности. Этот сад повышал мне настроение каждый день. Красочные цветы и экзотические растения в нем удивительно сочетались, причем каждый день взгляду открывалось что-то новое. Люди не всегда знают, что приносят другим радость. Однажды я все же встретила саму хозяйку сада, женщину лет восьмидесяти, и призналась, что обожаю ее произведение. Ивонн сразу же поняла, что это я оставила ей открытку, и между нами завязалась теплая дружба. Теперь я с удовольствием рассказала об этом Перл. «Да, это и было ее предназначение и призвание – сад. Найти в жизни призвание – одна из самых важных задач, – продолжила Перл. – Я немного жалею, что потратила столько лет на работу, которая не имела никакого отношения к делу всей моей жизни, к социальной работе. Впрочем, эта работа привела меня именно туда, куда мне нужно было попасть, ведь это клиент с работы подтолкнул меня к переменам. Иногда уходят годы, чтобы выяснить свое предназначение, у меня так и вышло. Но удовлетворение, которое приносит найденное предназначение, стоит усилий, затраченных на его поиски». Подумав о том, как долго я сама разыскивала подходящую работу, я согласилась, что оно того стоило. Сидя у камина с Перл и тремя добрейшими собаками, я чувствовала огромную благодарность за свою работу. Я рассказала об этом Перл, и она согласно улыбнулась. «Если бы я о чем-то жалела, Бронни, так только о том, что слишком много лет потратила на работу, которая мне нравилась, но не была моим предназначением. Жизнь так быстро заканчивается. Я поняла это, когда потеряла свою семью. Но иногда мы не торопимся действовать, даже когда уже точно знаем, что это неизбежно. Так что я могла бы об этом жалеть, но не стану. Я предпочитаю простить себя за то, что мне не удалось раньше уйти с той работы». Я согласилась, что простить себя гораздо лучше, чем жалеть об упущенных возможностях, и рассказала Перл, как многому учусь у своих пациентов. Она рассмеялась. «Все верно. Когда ты будешь умирать, у тебя не будет шанса сказать, что ты поздно поняла свои ошибки – слишком многому ты научилась на чужих ошибках!» Рассмеявшись в ответ, я согласилась с Перл, но заметила, что разговор ее утомил. Поэтому я устроила Перл поудобнее и задернула занавески, оставив отдыхать ее при свете камина. У двери я задержалась, глядя на нее и собак, чувствуя, как по щеке медленно катится слеза. Меня переполняла благодарность за то, что мне наконец удалось найти себе работу по сердцу. Отправившись на кухню, я налила себе чашку чая, а потом села ждать пробуждения Перл в другой комнате. На улице понемногу вечерело, хотя внутри дома это никак не сказывалось – там всегда царили покой и умиротворение. Мы провели с Перл еще несколько недель, но с каждым днем она все слабела, пока наконец ей не стало слишком тяжело вставать с кровати. Признав, что она больше не сможет перемещаться по дому, Перл попросила меня продолжать любоваться им за нее. Я с улыбкой обещала выполнить ее просьбу. Но на самом деле я больше любовалась самой Перл, чем ее (безусловно замечательным) домом. В последние недели нас часто навещали друзья Перл, чтобы проститься с ней, в том числе коллеги по социальной работе. Они говорили о том, как она изменила их жизнь и помогла множеству людей, как ее работа оставила в мире неизгладимый след. Впрочем, чтобы считаться истинным предназначением, работе необязательно иметь большой размах. Кто-то за свою жизнь поможет тысячам, а кто-то всего двум или трем людям. Нельзя сказать, что чья-то работа менее важна. У каждого из нас есть предназначение, и егопоиски способствуют благу всех людей – включая нас самих. Когда предназначение найдено, работа перестает быть работой и превращается в приятное и естественное продолжение нас самих. В день смерти Перл я в последний раз вышла из дома и закрыла за собой дверь. На улице стоял солнечный зимний день. Задержавшись на крыльце, я глубоко вдохнула воздухи подставила лицо солнцу. Думая о Перл, о том, каким она была прекрасным человеком, я улыбнулась. Долгие годы работая то в одном банке, то в другом, я безуспешно пыталась найти свое предназначение. Теперь я наконец обрела его, и меня переполняла благодарность. Размышляя о благодарности и посылая Перл любовь, я еще долго не могла сдвинуться с места. Но это было неважно: я улыбалась, и причиной тому была моя работа. Простота Последние недели моих пациентов были тяжелыми не только для них самих, но и для их детей. Их средний возраст составлял от сорока до шестидесяти лет, и, как правило, уних давно уже были собственные дети. Страх потерять мать или отца, как и страх предстоящей боли, многих толкал на необдуманные поступки. Поведение родственников моих пациентов постоянно напоминало мне, как вредно жить в обществе, где смерть замалчивается. Перед лицом смерти оказывается, что люди не просто не готовы справляться со своими чувствами – они испытывают отчаянный ужас, причем в большей степени даже не сами умирающие, а их родные. Мои пациенты перед смертью всегда обретали покой; их дети часто так и оставались во власти бушующих эмоций, охваченные паникой. Работая в разных домах, я вблизи наблюдала образ жизни и отношения в большом количестве семей. Этот опыт убедил меня, что почти в любой семье есть свои сложности: есть травмы, требующие исцеления, и уроки, которые люди преподают друг другу. Порой люди совершенно не осознавали, что вызывают у родных острую реакцию, но мне она былахорошо заметна. В случае ссор я с уважением к чужим чувствам оставалась в стороне, стараясь сохранять глубокое сострадание. Во многих семьях смерть обостряла вопросы контроля. Когда умирает член семьи, право быть рядом и помогать есть у каждого, особенно учитывая, что времени остается мало. Но нередко я видела, что один из детей пытается контролировать все безраздельно: хозяйство, список покупок, работу сиделок, будущие похороны и так далее. Если другие дети пытались помочь или высказать свое мнение, возникали споры, и властный член семьи только крепче вцеплялся в вожжи. Смотреть на эту демонстрацию силы было больно, потому что в основе ее лежал лишь страх. Моим первейшим приоритетом всегда было благополучие пациента. Поэтому, услышав, что в комнате Чарли начался спор на повышенных тонах, быстро перешедший в крики, я бегом бросилась в комнату. По разные стороны кровати моего пациента стояли его взрослые дети, Грег и Марианна, и орали друг на друга через голову отца. – Пожалуйста, хватит, – сказала я вежливо, но решительно. – Если вы еще не закончили, отправляйтесь в другую комнату. Посмотрите на своего отца! Он же умирает. Марианна, разразившись слезами, стала извиняться перед отцом – кротким и спокойным человеком. – Просто он меня все время доводит, – сказала Марианна, кивнув на брата. У нее были прекрасные голубые глаза и длинные черные волосы, и, будь я художником, мне непременно хотелось бы написать ее портрет. Но сейчас глаза у нее покраснели иопухли от слез. Грег отреагировал молниеносно: – А я не вижу, с какой стати ты должна получить по завещанию столько же, сколько и я. Ты уехала. Ты ему не помогала. Это я взял на себя все заботы, я был с ним после смерти мамы. Слова Грега отзывались во мне болью. За его рассуждениями скрывался хрупкий раненый мальчик. В обоих детях были заметны черты отца, но Грег, видимо, был похож еще и на мать. Волосы у него были русые, а кожа светлее, чем у сестры. Он не плакал. Он буквально плавился от ярости. Я повернулась к Чарли, взглядом спрашивая, что мне сделать, но он лишь пожал плечами и грустно посмотрел на меня своими большими голубыми глазами. Подталкивая Грега и Марианну к дверям, я сказала: – Я думаю, вам обоим лучше сейчас выйти. Этот спор никому не на пользу, особенно вашему отцу. Втроем мы сели за стол на кухне; я заварила чай, а они продолжали выяснять отношения. Марианна почти ничего не говорила, и когда я спросила ее, почему, она ответила, что это бесполезно. Но в тех обидных словах, которыми обменивались брат и сестра, я все равно слышала любовь. Вспомнив, что честность когда-то помогла мне исправить ситуацию в своей собственной семье, я не давала им замолчать, задавая все новые вопросы. Мои отношения с отцом раньше тоже были сложными, и это принесло мне немало страданий. Но честность, сострадание и время все исправили, и теперь нас связывали нежнаядружба и глубокое уважение. Когда-то я и помыслить не могла, что это возможно, но на самом деле любую семейную ссору можно разрешить – главное, чтобы между людьми еще оставалась любовь, и чтобы оба хотели помириться. Было очевидно, что Грег и Марианна любят друг друга. Просто сейчас их чувства искажала боль. После того как каждый из них высказал свои претензии, я спросила, а есть ли что-то, что им друг в друге нравится. «Нету», – угрюмо ответил Грег. Мне удалось разрядитьобстановку шуткой, и Грег все же вспомнил пару хороших качеств сестры. Марианна тоже назвала несколько хороших черт брата. Их эго сопротивлялись этому разговору –особенно сложно было Грегу, который хотел и дальше ненавидеть сестру. Но я предложила им это упражнение, потому что на собственном опыте знала, что оно работает. В те годы, когда мои отношения с родными были крайне напряженными, я старалась почаще думать о том, что мне в них нравится. Вначале я, точно так же как сейчас Грег, ничегохорошего придумать не могла. Но это боль застила мне глаза, мешая видеть хорошее. Со временем я поняла, что все мои родственники – хорошие и добрые люди, даже если мы с ними ведем кардинально разный образ жизни и, возможно, никогда не будем особенно близки. Я вспоминала все добрые поступки своих родных, а также все поступки, совершенные из добрых намерений, даже если их последствия были неоднозначными. Мне удалось осознать, что иногда родные пытались показать мне свою любовь, но я отталкивала их, ослепленная собственной болью. Несмотря на наши многочисленные претензии друг к другу, все они были прекрасными людьми, ведь любой человек по своей природе прекрасен. Так что сегодня пришел черед Грега и Марианны разобраться со своими претензиями друг к другу. Оказалось, что Грег уже давно обижен на сестру лишь за то, что ей хватило смелости жить по-своему, а ему нет. Но ведь Марианна не мешала Грегу жить по велению сердца – он сам связал себе руки. В тот день брат и сестра многое высказали друг другу, и, хотя о примирении говорить было рано, им удалось существенно продвинуться. Перед уходом каждый из них по очереди немного посидел с Чарли. Затем мы с ним остались вдвоем. Я вошла в его комнату, и он поднял на меня глаза, посмеиваясь и качая головой: «Ну что же, моя милая. Этот конфликт назревал уже лет двадцать. Я все ждал, когда плотинунаконец прорвет. Хорошо, что это случилось до моего ухода, может быть, мне еще доведется увидеть их друзьями». За окном в ветвях деревьев пели птицы, мимо пролетела оранжевая бабочка. Мы оба проследили глазами за ее полетом, улыбаясь, а потом продолжили болтать. Чарли рассказал мне, что когда-то его дети были неразлучны. Маленький Грег защищал младшую сестру, а она его боготворила. Но когда она стала независимым подростком, они начали ссориться, и с тех пор их дружба закончилась. «Впрочем, за Марианну я не волнуюсь. Она относительно счастлива. А вот Грег меня беспокоит. Он постоянно пытается показать мне, на что способен. Когда он говорит, что всегда больше для меня делал, чем Марианна, он в общем-то прав. Она тоже мне помогала, хотя и менее очевидным образом. Но Грегу необязательно было так напрягаться – в основном он помогал с тем, с чем я с удовольствием справился бы сам». Вздохнув, Чарли продолжил: «Он с утра до ночи занят на ненавистной работе, дети его почти не видят, и я не знаю, зачем он все это делает». – А он знает, что вы его любите, Чарли? – спросила я отважно. Он посмотрел на меня озадаченно. – Наверное. Я всегда хвалю его, если он что-то сделал хорошо. Он знает, что я им горжусь. – Откуда? Вы говорите ему прямо, что гордитесь им как человеком, а не только его достижениями или поступками? – спросила я. Он на секунду задумался. – Прямо не говорю. Но он знает. – Откуда? – настаивала я. Чарли рассмеялся. «Вот вы, женщины. Обязательно вам надо докопаться до самой сути всего, да?» Улыбнувшись, я поделилась с Чарли своими мыслями. Он слушал внимательно и с уважением. Я предложила ему подумать, не связаны ли попытки Грега «показать, на что он способен», с потребностью заслужить любовь и одобрение отца. Мы продолжали разговаривать, пока я мыла Чарли и катила его кресло в спальню. Вообще-то он предпочитал принимать душ днем, но ему уже не хватало на это сил. У Чарли начались проблемы с легкими, и вернувшись в кровать, он некоторое время восстанавливал дыхание. Он слабел с каждым днем. Я оставила его немного отдохнуть. Когда через пару часов я заглянула к нему в комнату, он повернулся ко мне и улыбнулся. Я села у кровати, дала ему воды и спросила, не нужно ли что-нибудь еще. Он отрицательно покачал головой и вновь заговорил о своих детях. «Я всего лишь хочу, чтобы они были счастливы. Это все, чего любой родитель хочет от своих детей. Я мечтаю, чтобы Грег перестал так много работать и зажил бы попроще. Он хороший человек, но он не счастлив, – сказал Чарли. – Простой образ жизни гораздо счастливей: такой, какой вели мы с их матерью. Правда, у нас не было выбора. Времена тогда были тяжелые. Но просто жить можно и сегодня, и это хорошее решение». На самом видном месте комнаты на каминной полке стояла фотография, запечатлевшая нарядного молодого Чарли рядом с невестой. Я представила себе, как они с женой растили маленьких Грега и Марианну. Чарли всегда говорил то, что думает, и мне это нравилось. В его честности было что-то старомодное. Он делился со мной всем, что приходило ему в голову: – Знаешь, мне кажется, он действительно не знает, что я люблю его. Я никогда не говорил ему об этом напрямую. – Мы все такие разные, Чарли, – сказала я. – Некоторые люди обо всем догадываются по поступкам, но большинству нужно обо всем говорить прямо. Может быть, Грег как раз такой. Да и кому повредит такое признание в любви? Он кивнул. «Да, мне нужно сказать ему об этом. В каком жутком мире мы живем, если семидесятивосьмилетний старик боится сказать сыну, что любит его. Видишь ли, у меня было не так много практики в этой области», – он рассмеялся, но быстро посерьезнел. На его лице появилась решимость. «Как думаешь, я смогу убедить его сделать свою жизнь проще, если ему больше не нужно будет завоевывать мое одобрение, если он будет знать, что я люблю его? Ведь я на самом деле его люблю». Я ответила, что невозможно предсказать реакцию Грега. Нет никаких гарантий, что он захочет изменить свой образ жизни. Но зато, если он точно будет знать, что отец любит его и во всем одобряет, ему куда легче будет жить в мире с собой. Тема простого образа жизни становилась все важнее для Чарли по мере того, как его дни подходили к концу. Он считал, что люди слишком много работают – по самым разным причинам. Часто им кажется, что у них нет выбора, потому что каждый месяц им нужно где-то брать деньги на регулярные платежи и бесконечные семейные траты. Чарли это было знакомо. Он соглашался, что многие люди с трудом сводят концы с концами, но настаивал, что всегда можно что-то изменить. «Иногда нужно посмотреть на ситуацию подновым углом. Действительно ли нам нужен такой большой дом? А что, если взять машину подешевле?» – говорил он. Иногда, по мнению Чарли, нужно изменить свой образ мыслей и найти новое решение, как следует задуматься о своих приоритетах и всей семьей работать над поиском равновесия. Помогать друг другу – вот еще один способ жить проще, объяснял Чарли. Если мы чаще будем объединять усилия с другими людьми, хотя бы с соседями, нам понадобится меньше ресурсов. Мы меньше будем тратить зря и научимся помогать друг другу. Эго и гордость мешают людям объединяться в сообщества, говорил он. Но если мы хотим жить проще и мудрее распоряжаться ресурсами, то должны осознать необходимость объединяться с окружающими людьми. Его печалило, что в наше быстрое и неуравновешенное время об этом забыли. Чарли признавал, что с финансовой стороны жизнь стала очень сложной. Он говорил, что общество потеряло из виду истинные приоритеты и что ему нужен урок простоты. Ноэто возможно только в том случае, если вначале изменятся отдельные люди. Тогда постепенно общество последует за большинством, как это всегда бывает. Он также считал, что люди у власти нуждаются в хорошем пинке под зад. В мировой политической системе, говорил Чарли, изредка попадаются приличные люди, но им не дает действовать бюрократия, а также те, у кого больше денег и власти. Поэтому для заметных изменений потребуются усилия каждого из нас. Упростить свою жизнь – прекрасное начало. Чарли и сам был главой семейства, так что ему было отлично известно, какое это нелегкое дело – выжить и обеспечить семью всем необходимым. Но сейчас, на смертном одре, жизнь виделась ему под новым углом, и он вслух жалел, что не понял этого раньше и не успел иначе воспитать Грега. «Дети станут счастливей не от того, что у них больше игрушек, а от того, что больше времени проводят с родителями. Да, сначала они будут жаловаться. Но самые счастливые дети – это те, что с удовольствием проводят время с родителями, желательно с обоими. Мальчикам необходимо мужское влияние. Откуда его взять моим внукам, если их отец все время работает, стараясь доказать миру свою ценность?» Чарли сидел в задумчивости, и я видела, что он осмысливает новые идеи. «Я ведь очень люблю его. Мне нужно сказать ему об этом, да?» Я с радостью кивнула. Затем внезапно он спросил: – А ты ведешь простой образ жизни? – Да, с материальной точки зрения моя жизнь довольно проста, Чарли. И я понемногу пытаюсь упростить и свою внутреннюю жизнь тоже, – честно ответила я, мысленно перебирая все перипетии своей эмоциональной жизни за последние годы. От простоты она была довольно далека. – Медитация очень помогла мне упростить мышление. Благодаря ей постепенно улучшаются все сферы моей жизни. Она меня буквально преобразила и позволила преодолетьвсе то, что раньше мешало двигаться вперед. Так что сегодня мой образ мышления стал намного проще, чем был раньше. Ну а моя материальная жизнь уже и так довольно проста. Чарли принадлежал к другому поколению и вел совсем не похожий на мой образ жизни, так что при слове «медитация» он представлял себе, как где-то в экзотических странах, закрыв глаза, сидят люди, одетые в оранжевые одежды. Он с любопытством стал меня расспрашивать, и я объяснила ему эту практику максимально просто: когда мы учимсяфокусировать внимание, у нас лучше получается наблюдать за собственным мышлением. Благодаря этому мы начинаем понимать: наша жизнь во многом сформирована беспорядочным движением ума, которое порождает никому не нужные страдания и страхи. По мере того как эти нездоровые шаблоны мышления растут и крепнут, мы начинаем отождествлять себя с ними и строить вокруг них всю свою жизнь. Но на самом деле мы не равны своему мышлению, мы гораздо больше него. Мы мудрые, интуитивные создания, но нас ослепляют страхи и заблуждения, которые наш ум создавал много лет, рефлекторно реагируя на окружающую среду. Так что когда во время медитации мы учимся фокусировать внимание, – например, на дыхании, – то возвращаем себе контроль за собственным мышлением. Мы можем осознанно выбирать хорошие мысли, а значит, строить более счастливую жизнь. Чарли сидел, уставившись на меня, лишившись дара речи. – Вот это да, – наконец произнес он. – Почему ты мне не встретилась пятьдесят лет назад? Я рассмеялась, встала и поднесла ему к губам стакан. – Почему я сама себе не встретилась раньше? Я бы избежала стольких страданий! Разговор свернул в сторону моей жизни, и Чарли спросил, что я имела в виду, говоря, что моя материальная жизнь проста. Я объяснила, что вот уже много лет регулярно переезжаю с места на место, и этот опыт заставил меня усомниться в необходимости имущества. У меня была мебель, но она не всегда переезжала со мной из дома в дом— нередко она оставалась меня дожидаться либо на ферме у родных, либо в хранилище. Живя без собственной мебели, я вспоминала, что для счастья она мне вовсе не нужна. Мне начало казаться странным, что у меня вообще есть мебель. Так что я ее распродала, и из имущества у меня осталась только домашняя утварь – с ней я могла быстро обосноваться где угодно, когда придет время «бросить якорь». Я знала, что оно придет, потому что мне всегда хотелось иметь собственную кухню. Жить в свободном плавании мне нравилось, но у всего есть цена, даже у свободы. Больше всего в кочевой жизни мне не хватало именно собственной кухни, причем иногда настолько, что я решала на время вновь пустить корни. Однако через год-полтора оседлой жизни мне неизменно становилось скучно, начинало тянуть все бросить и в очередной раз отправиться навстречу неизвестности и, желательно, налегке. Поэтому, сознавая особенности своего характера, я решила принять то, что пока мне лучше ограничиться самыми необходимыми вещами. Каждый раз на новом месте я начинала с нуля. Мебель я находила легко: по объявлениям, в комиссионных магазинах и через знакомых. Мне это нравилось. К тому же, покупая не новые, а бывшиев употреблении вещи, я радовалась, что берегу планету, экономя ее и без того убывающие ресурсы. Наше общество слишком охотно выбрасывает старые вещи и покупает новые, забывая, что все новое должно откуда-то взяться, а все старое – куда-то деться. Как правило, и о том, и о другом приходится заботиться именно планете. Эта нагрузка дорого обходится Земле, угрожая ее благополучию и выживанию всех ее обитателей, в том числе и нас, людей. В конечном итоге я всегда обставляла свое новое жилище уникальными вещами. Мне никогда не приходило в голову, что мебель может не найтись, поэтому она всегда находилась сама собой. За годы скитаний в моих руках побывали потрясающие вещи. Как-то раз, целый год продержав свои вещи в платном хранилище, я решила, что это бесполезная трата денег и ненужная мне обуза. Так что с помощью верного друга я устроила распродажу вещей у него дома. Столовые приборы, книги, ковры, постельное белье, украшения, картины – я продала все. Мне радостно было смотреть, как радуются люди тому, что мои любимые вещи становятся их удачными находками. Все, что не удалось продать сразу, я в тот же день отдала в ближайший благотворительный магазин. В то время я водила крошечную машину: размером примерно с коробку для обуви. Джип уже год как приказал долго жить, причем весьма зрелищно, прямо посередине шестиполосного шоссе. Моя новая машина, безумно экономная и удобная для города, была крошечного размера. Я ласково называла ее «воздушная рисинка». Моей целью было оставить себе не больше вещей, чем можно было уместить в «рисинку». У меня осталось всего пять коробок с пожитками – две из них с любимыми книгами. Я взяла себе только те, которые собиралась перечитывать сама или давать читать другим. Все остальные книги перешли в чужие руки. В оставшихся коробках были диски с музыкой, журналы и фотоальбомы, несколько памятных мелочей, лоскутное одеяло, сшитоемоей мамой, и одежда. Под завязку набив «рисинку» и включив музыку погромче, я отправилась навстречу новой главе своей жизни. В пути я слушала песни таких групп и авторов, как Гай Кларк, The Waifs, Бен Ли, Дэвид Хоскинг, Синди Бост, Шон Маллинз, Мэри Чапин Карпентер, Фред Иглсмит, ABBA, The Waterboys, Джей Джей Кейл, Сара Тиндли, Карл Броуди, Джон Прайн, Хезер Нова, Дэвид Фрэнси, Люсинда Уильямс, Юсуф и The Ozark Mountain Daredevils. Это потрясающая музыка, и каждая песня была мне верным другом в пути. Машина неслась вперед, а я подпевала своим любимым музыкантам, чувствуя себя легкой и свободной, зная, что все, чем я владею в этом мире, находится тут же, в рисинке. Примерно через тысячу километров я остановилась у дома родителей и выгрузила коробки. Дальше путешествовать отправились только я и моя одежда. Чарли слушал эту историю с восторгом, потирая старые загрубевшие ладони. Я рассказала, что после этой поездки некоторое время провела в свободном плавании, а потомобосновалась в Сиднее, присматривая за чужими домами и постоянно переезжая из одного в другой. Моя материальная жизнь, действительно, была проще некуда. Теперь Чарли убедился, что я понимаю его слова о важности простоты. Мы согласились, что не всем очевидно, как отягощает человека лишнее имущество, даже если он и не планирует переезжать. Избавившись от лишних вещей, мы всегда ощущаем свободное пространство не только снаружи, но и внутри себя. На следующий день приехал Грег и до вечера оставался с отцом. По просьбе Чарли я заранее позвонила Марианне и попросила ее в этот день не приходить. Ее черед провести весь день вдвоем с отцом был завтра. Чарли попросил меня время от времени тихонько заглядывать в комнату под разными предлогами, на случай, если между ними с Грегом возникнет неловкость и нужно будет разрядить обстановку. Но эта предосторожность оказалась излишней. В те пару раз, что я все же заглянула к ним, – принести чайник чая или передать телефонное сообщение – Грег и Чарли были с головой погружены в важный личный разговор. Незадолго до ухода Грега они позвали меня в комнату. Отец и сын держались за руки, у Грега были красные от слез глаза. – Бронни, я просто хотел, чтобы ты тоже знала, – объявил Чарли. – Я всем сердцем люблю этого человека. Он прекрасный сын и хороший человек. Теперь я и сама с трудом сдерживала слезы. – Моему сыну ничего не нужно доказывать, – продолжил Чарли. – Ему ничего не нужно делать или иметь, чтобы стать лучше, потому что для меня он уже и так хорош. Я люблю его всего целиком, и быть его отцом – моя величайшая радость в жизни. С улыбкой я ответила, что Грегу тоже невероятно повезло с отцом. Тот согласился, утирая слезы рукавом. – И еще папа считает, мне есть чему у вас поучиться насчет простоты, – сказал он. – У вашего папы еще есть достаточно времени, чтобы самому вам все рассказать, – рассмеялась я. – Ему совершенно не нужно поручать эту работу мне. Если я что-то могу сказатьот себя,так это лишь одно:будьте проще. Черед Марианны наступил на следующий день. Пока она разговаривала с отцом, я слышала из комнаты и смех, и слезы. В доме царила атмосфера любви, невольно охватывая и меня. В следующие несколько недель Чарли провел много времени с детьми, и все трое сильно сблизились. Чарли никогда не отпускал их, не сказав каждому по отдельности, что он любит их, и дети отвечали ему тем же. Они успели исцелить свои отношения до того, как Чарли умер. Когда Чарли умирал, Грег и Марианна сидели по обе стороны от отца, и каждый держал его за руку. Они попросили, чтобы я тоже посидела с ними в комнате, пока он мирно уходил – его дыхание постепенно становилось все реже, пока не остановилось совсем. Стояло ясное утро, и за окном, как всегда, пели птицы. Мне пришло в голову, что это придает происходящему особую красоту – птицы провожали Чарли пением. Оставив Грега и Марианну вдвоем, я вышла на веранду, вспоминая Чарли, молясь за него и желая ему хорошего пути, где бы он ни был. Когда я вернулась в комнату, брат с сестрой сидели рядом, держась за руки, и смотрели на отца, улыбаясь сквозь слезы. Где-то год спустя я получила от Грега имейл. Он продал большой дом и перевелся работать в другое отделение своей компании – теперь он с женой и детьми жил в маленьком провинциальном городке. Хотя офис был неблизко от дома, без пробок Грег тратил на дорогу до работы в два раза меньше времени, чем раньше, и у него освободилось полтора часа на общение с сыновьями. В маленьком городке все оказалось дешевле, и несмотря на то что жизнь всей семьи стала проще, качество этой жизни существенно возросло. Жена Грега тоже была счастлива, и все четверо были довольны новыми друзьями и новым образом жизни. Грег благодарил меня за заботу об отце и с любовью писал о Марианне, которая как раз недавно приезжала его навещать. Это письмо меня чрезвычайно порадовало. Я сразу вспомнила Чарли, его голубые глаза, добрую улыбку и наши разговоры. Было особенно приятно знать, что Грег не просто услышал слова отца, но претворил их в жизнь. Но больше всего меня обрадовала последняя строчка письма. Пожелав мне всего хорошего, Грег добавил два слова, и, прочтя их, я расплылась в улыбке:будьте проще.Золотые слова, Грег и Чарли. Золотые. Третье сожаление Жаль, что мне не хватало смелости говорить о своих чувствах Для девяностодвухлетнего человека на пороге смерти Йозеф выглядел на удивление хорошо – я отметила это при первом же знакомстве. Это был добрый мужчина с приятной улыбкой, которая превращала его в сущего мальчишку. Мне сразу полюбился и он сам, и его тонкое, безжалостное чувство юмора. Семья Йозефа приняла решение не рассказывать ему, что он умирает. Мне это было нелегко, но я старалась уважать их выбор. В течение нескольких недель его состояние ухудшилось настолько, что игнорировать болезнь стало невозможно. Йозеф больше не мог стоять без поддержки и с каждым днем все больше полагался на мою физическую силу. Его болезнь заявляла о себе каждый раз, как он пытался сесть или встать, и мы оба это замечали. Так что пока семья продолжала врать Йозефу, он постепенно прозревал: его болезнь действительно была очень серьезной. Йозефу были выписаны сильнодействующие лекарства, чтобы облегчать боль, насколько это возможно. Как это часто бывает, побочным эффектом обезболивающих был запор. От запора есть свои лекарства, но на Йозефа они не особо действовали, поэтому мне приходилось вводить ему специальные свечи в задний проход. Когда человек настолькоболен, он перестает стесняться. Не приходилось говорить о достоинстве, когда Йозеф перекатывался на бок, чтобы я ввела ему лекарство. Я, разумеется, старалась как могла разрядить обстановку словами, которые потом еще много раз повторяла другим пациентам. «Каждая жизнь начинается с еды и какашек, Йозеф, и заканчивается ими же», – шутила я. Работа с умирающими разложила жизненный цикл человека буквально по полочкам. В самом начале жизни комфорт ребенка зависит прежде всего от полноценного питания и опорожнения кишечника. В самом конце жизни эти же функции определяют состояние человека: мы всегда спрашиваем, как он ест и нормально ли работает его кишечник. Когда умирающему человеку, сидящему на сильных обезболивающих препаратах, удается опорожнить кишечник и тем самым улучшить свое состояние, близкие радуются. Йозеф не был исключением – когда он смог сходить в туалет, за него радовалась вся семья. И я, разумеется, тоже – не только потому, что пациенту стало легче, но и потому, что мои усилия увенчались успехом. Один из сыновей Йозефа жил неподалеку и каждый день заходил его проведать. Второй сын жил в другом штате, а дочь переехала за границу. Каждый день Йозеф с сыном болтали о всякой ерунде, в основном о бизнес-новостях из свежего номера газеты, пока Йозеф не уставал. Уставал он быстро, поскольку его здоровье таяло на глазах. Его сын мне нравился, хотя мы с ним и не подружились. Как-то раз я сказала Йозефу, что его сын приятный человек, а он ответил: «Его интересуют только мои деньги». Предпочитая верить собственной интуиции, я решила не давать этому комментарию влиять на мое сложившееся мнение. В следующие несколько недель Йозеф рассказал мне множество историй, в основном про любовь к работе. И он, и его жена Жизела пережили холокост; после освобождения излагеря они перебрались жить в Австралию. Иногда Йозеф что-то рассказывал о жизни в концентрационном лагере, но сама я никогда не расспрашивала его об этом. Если емухотелось поделиться, я всегда внимательно его слушала, но он сам решал, что и когда рассказывать. Мы с Йозефом быстро подружились и с удовольствием болтали обо всем на свете. Нас сблизило схожее чувство юмора, к тому же, мы оба были по натуре довольно тихими людьми. Разница в возрасте нам ничуть не мешала, и наше общение становилось все глубже с каждым днем. Весь день напролет Жизела то и дело заходила в комнату с новым блюдом, уговаривая Йозефа поесть. Кухарка она была замечательная, но ее муж уже почти совсем не мог есть, а она все еще готовила помногу – отчасти по привычке, а отчасти из-за отрицания очевидного. Семья каким-то образом убедила врача не говорить Йозефу о приближающейся смерти. Более того, родные не только скрывали от него, что он умирает, но даже пытались убедить его, что он поправляется. «Давай, Йозеф, поешь. Тебе скоро станет лучше», – повторяла Жизела. Я сострадала ей всем сердцем: ее страх перед истиной был невыносимым. Йозеф теперь съедал за целый день не больше баночки йогурта, и сил у него почти не оставалось – даже с моей помощью он уже не мог дойти до гостиной. Однако родные по-прежнему убеждали его, что он вот-вот поправится. Я молчала, пока Йозеф не задал мне прямой вопрос. Жизела как раз вышла из комнаты. Йозеф сидел в кровати, а я массировала ему ступни – до меня ему никто никогда не делал такого массажа, и в последние недели он к немупристрастился. Я же с удовольствием баловала своих пациентов всевозможными приятными процедурами, вероятно, поэтому мы с ними так сближались. Многие наши беседы происходили, пока я массировала ноги, причесывала волосы, чесала спины или полировала ногти. – Яведь умираю, Бронни, да? – сказал Йозеф, когда жена вышла из комнаты. Я кивнула. – Да, Йозеф. Он тоже кивнул, явно испытывая облегчение от истины. Я же после опыта с семьей Стеллы поклялась никогда не говорить своим пациентам ничего, кроме правды. Йозеф некоторое время смотрел в окно, пока я молча продолжала массировать ему ноги. – Спасибо. Спасибо за правду, – произнес он наконец со своим сильным акцентом. Я улыбнулась и снова кивнула. Мы еще чуть помолчали, затем он заговорил: – Они просто не могут этого выдержать. Жизеле слишком больно говорить со мной об этом. У нее все будет хорошо. Но обсуждать это она не может. Йозефу стало легче от того, что он наконец узнал истинное положение дел, а мне – от того, что мне не нужно было больше врать. Он спросил: – Мне уже недолго осталось, да? – Думаю, что недолго, Йозеф. – Недели, месяцы? – настаивал он. – Я правда не знаю. Но я бы думала, что скорее недели или дни. Мне так кажется, но точно я не знаю, – честно ответила я. Он кивнул и вновь уставился в окно. Очень немногие люди способны предсказатьточно,сколько времени осталось человеку, если только он не находится очевидно на последнем издыхании. Но именно этот вопрос и пациенты, и их родные задавали мне регулярно, иногда по многу раз. Опыт уже позволял мне оценивать положение дел, и я знала, что ситуация может меняться очень быстро. Например, нередко перед финальным ухудшением пациентам ненадолго становилось существенно лучше. Успех моей работы сиделкой напрямую зависел от интуиции. Опираясь на интуицию, я и ответила на вопрос Йозефа. Мне не хотелось этого делать, но еще больше не хотелось лгать, говоря, что ему остались месяцы, когда это было очевидно не так. Массаж был закончен, и теперь мы оба смотрели в окно. Через некоторое время Йозеф прервал молчание. – Как же я жалею, что так много работал. Я молча ждала продолжения. – Я очень любил свою работу, по-настоящему любил. Потому я так много и работал – ну и еще чтобы обеспечить своих родных и их родных. – Но это же замечательно, раз так. О чем же тут жалеть? Йозеф жалел, что родные так мало видели его с момента переезда в Австралию. Но больше всего он жалел о том, что не дал им шанса по-настоящему узнать себя: – Жаль, что мне не хватало смелости говорить о своих чувствах.Поэтому я все работал и работал, а семью держал на расстоянии. Они не заслуживали такого обращения. Теперь я жалею, что мы с ними так по-настоящему и не узнали друг друга. Йозеф признался, что и сам по-настоящему узнал себя только в последние годы, так что у его родных почти не было такого шанса. Его добрые глаза наполнились грустью, когда мы заговорили о привычных шаблонах в отношениях и о том, как трудно бывает через них переступить. Мы также обсудили, что это необходимо, если люди действительнохотят развивать отношения. Йозефу казалось, что он упустил возможность построить любящие и теплые отношения с детьми. Единственное, чему он за всю жизнь научил их на своем примере – как зарабатывать и ценить деньги. – И какой теперь в этом прок, – вздыхал он. – Ну, зато вы сделали то, что хотели, – утешала его я. – Благодаря вам у них комфортная жизнь. Вы обеспечили их всем, как и собирались. По его щеке скатилась одинокая слеза. – Но они меня не знают. Они не знают меня. А я хочу, чтобы они меня знали, – произнес Йозеф, и слезы потекли из его глаз рекой. Я молча сидела рядом, пока он плакал. Через некоторое время я предположила, что, возможно, еще не все потеряно, но Йозеф был со мной не согласен. Ему уже не хватало сил, чтобы долго разговаривать – одно это затрудняло положение. Но кроме того, он признался, что не знает, как говорить с родными о своих тайных чувствах. Я предложила позвать его жену и сына, чтобы они смогли поучаствовать в нашей беседе – возможно, в моем присутствии разговор пойдет проще. Но Йозеф помотал головой и вытер слезы. «Нет. Слишком поздно. Давай не говорить им, что я все знаю. Им проще думать, что я им верю. Я знаю, что умираю. Все нормально». Йозефу исполнилось примерно столько же лет, сколько было моей любимой бабушке, когда она умерла. Хотя они прожили совсем разные жизни, мне почему-то все равно было очень приятно находиться рядом с человеком этого возраста. С бабушкой мы говорили о смерти легко и непринужденно. Она утверждала, что со мной обсуждать смерть даже проще, чем с некоторыми из ее собственных детей. Бабушка и ее брат-близнец были старшими из одиннадцати детей. Их мать умерла, когда им было всего по тринадцать, так что бабушка сама вырастила всех младших братьеви сестер. Отец ее был «жестким человеком», как она выражалась. Он обеспечивал детей едой, но больше практически ничего не мог им дать –особенно любви. Примерно через год после смерти матери умерла самая младшая сестричка, Шарлотт. Вырастив всех остальных братьев и сестер, бабушка родила и воспитала семерых собственных детей, в том числе мою маму. Когда родилась я, в моих темных кудряшках и больших любопытных глазах бабушка узнала дорогие ей черты Шарлотты, поэтому с первого же моего дня мы с ней были особенно близки. Приезд бабушки в наш дом всегда был праздником. Все дети обожают гостей, и мы не были исключением. В бабушке было никак не больше полутора метров росту, но она была сильной и подвижной. Она любила меня и принимала любой. Однажды мама отправилась в заслуженный отпуск вдвоем с сестрой, а бабушка приехала за нами приглядеть, потому что папа несколько дней в неделю работал в другом городе. Мне было двенадцать, почти тринадцать, и я училась в католической школе. Школа стояла за трехметровой кирпичной стеной, и руководили ею монахини. Некоторые из них были замечательными женщинами, но директриса славилась своей жесткостью, за которую ее прозвали «железное лицо». Старшеклассники с первого дня в школе предупреждали нас не попадаться ей на глаза. Сегодня, когда я сама уже взрослая женщина и не верю слухам, я думаю, что за ее маской строгости скрывалось доброе сердце. Но школой она руководила железной рукой, и за все годы учебы я ни разу не видела, чтобы она улыбнулась. Я была послушной девочкой, и директриса меня не замечала, что меня совершенно устраивало. Но в тот год я как раз подружилась с двумя самыми хулиганистыми девчонками в классе. Однажды во время большой перемены мы забрались на дерево, перелезли через забор и отправились в город. Там мы прокрались в магазин, и каждая украла по паре сережек со своими инициалами. Успех нас опьянил, и мы зашли в другой магазин, где стащили губную помаду. Я как раз накрасила губы и радостно удивлялась тому, какие они сладкие, когда мне на плечо легла чья-то большая рука. «Дай-ка это сюда». Почти парализованная от страха, я прошла за хозяином магазина в его кабинет вместе с одной из своих подруг – вторая успела сбежать. Он позвонил в школу, и директриса уже дожидалась нас в дверях, когда мы, понурые, брели к зданию. В руках у нее была линейка. – Ступайте ко мне в кабинет, – сказала она. – Да, сестра, – ответили мы хором. Если бы у нас были хвосты, мы бы их поджали. Директриса договорилась с магазином, что о происшествии не будут сообщать в полицию, но мы должны были пойти домой и рассказать родителям обо всем, что случилось. Затем наши родители должны были позвонить директрисе и подтвердить, что они в курсе. Кроме того, нам было запрещено ходить на физкультуру в течение целой четверти – мы обе обожали спорт, так что это было весьма суровое наказание. Наконец, директриса отвесила каждой из нас дюжину ударов линейкой по попе. Жесткой ее называли вполне заслуженно. Мама находилась в отъезде, но папа должен был вернуться домой на выходные, и я заранее пребывала в ужасе. Я была мягким, чувствительным ребенком и боялась даже разговора на повышенных тонах. Дома была только бабушка, и я отвела ее в сторону. Дрожащими губами я рассказала ей о своем проступке. Она слушала меня, не перебивая и никак не реагируя. К концу рассказа я уже рыдала в три ручья. – Ну что, ты еще будешь так делать? – спросила она. – Нет, бабушка. Обещаю, – заверила я с чувством. – Ты все поняла? – Да, бабушка, – повторила я. – Я больше так не буду. – Хорошо, – сказала она наконец. – Папе мы об этом не расскажем, а в школу я завтра позвоню. Вот и все. Инцидент был исчерпан. Но я натерпелась такого страху, что не только никогда больше не пыталась ничего украсть, но ни разу в жизни не вернулась в тот злополучный магазин. Спустя несколько лет я закончила школу и уехала из городка, в котором выросла. Мне не терпелось расправить крылья и начать самостоятельную жизнь, и я согласилась на первую предложенную мне работу – в отделении банка в городе, где жила бабушка, в пяти часах езды от дома родителей. Поселиться с бабушкой и тетей было самым практичным выходом из ситуации. Мне исполнилось восемнадцать, и после детства на ферме и учебы в католической школе я была открыта любым новым впечатлениям. Когда через несколько месяцев моя мама догадалась, что я больше не девственница, она была шокирована и почти что готова отказаться от меня. Она поверить не могла, что я, приличная девушка, так легко дала сбить себя с пути истинного. И снова бабушка спасла ситуацию, твердо сказав маме, что времена изменились, и я по-своему все еще приличная девушка. Наши отношения с мамой после этого стали только крепче. Когда я открыла для себя алкоголь и заявилась домой к бабушке пьяной, она на всякий случай поставила у кровати ведерко. Она была мудрой и снисходительной женщиной, оказавшей на мою жизнь глубочайшее и очень благотворное влияние. Когда я довольно рано объявила, что алкоголь не для меня, она вздохнула с облегчением. Бабушка пережила всех своих братьев и сестер, что было для нее невыносимо, потому что она относилась к ним как к собственным детям. Где бы я ни жила, мы с ней постоянно переписывались и все друг другу рассказывали без утайки. Я вместе с ней тосковала, когда она потеряла последнюю сестру, и печалилась, видя, как она стареет. Смотреть, как с годами она теряет былую живость и самостоятельность, было больно, потому что приходилось признать, что бабушка рано или поздно меня покинет. Я с трудом сдерживала слезы каждый раз, как мы с ней разговаривали, поэтому однажды откровенно сказала ей, что очень люблю ее и буду безумно скучать, когда придет еесрок уйти из жизни. После этого мы стали разговаривать с ней о смерти открыто и честно, чему я радуюсь до сих пор. Не отрицая неминуемого, мы наслаждались каждым разговором, и бабушка делилась со мной своими мыслями об уходе из жизни. Она была готова к нему за несколько лет до срока. Вернувшись на родину после нескольких лет за границей, я сразу же помчалась к бабушке. Она очень изменилась. Волосы ее полностью поседели, она ходила с палочкой и, казалось, уменьшилась в размерах. Моя обожаемая бабушка превратилась в старушку. Ей было уже за девяносто, но ум оставался совершенно ясным, и мы еще год или два регулярно и с удовольствием общались. Однажды в понедельник мне позвонили на работу. Бабушка умерла накануне, ночью, во сне. Мой мир рухнул в момент. Закрыв дверь своего кабинета, я уронила руки на стол, голову на руки и рыдала, прощаясь с любимой бабушкой и оплакивая свою потерю. Я ушла с работы пораньше, потому что из-за слез все равно ничего не видела и едва соображала. По пути домой я забрала почту. Машинально просматривая конверты, я замерла в изумлении: среди писем и счетов была открытка от бабушки! Она отправила ее в пятницу, а умерла в воскресенье ночью. По моим щекам хлынул поток слез одновременногоря и радости, и я прижала открытку к груди, всхлипывая и улыбаясь. Я чувствовала безумную благодарность за нашу близость и за то, что мы честно поговорили с бабушкой о смерти. Между нами не осталось никакой недосказанности. Она знала, что я люблю ее, а я знала, что она любит меня, и подтверждение этому я читала в ее открытке: «Я тебя очень люблю, моя милая, и постоянно о тебе думаю. Пусть тебе всегда светит солнце, Бронни. С любовью, бабушка». Мысли о ее предстоящем уходе не раз вызывали у меня слезы задолго до того, как она умерла. После того как это произошло, я тоже много плакала. Но при этом в глубине души я чувствовала покой, зная, что мы встретили то, от чего никому не суждено убежать, честно и открыто. Сознание этого утешает меня и сегодня. Бабушка улыбается мне с фотографии в рамке, которая стоит у меня на столе. Иногда я очень по ней скучаю, но знаю, что наша честность подарила нам совершенно особые отношения, которые и сегодня делают меня лучше. Моему пациенту, к сожалению, было куда тяжелей. Честность оказалась для Йозефа и его семьи слишком болезненной. Я всем сердцем сочувствовала его боли и бессилию. Этому человеку уже пришлось пережить невообразимые страдания, и вот теперь, на смертном одре, он не находил себе места. Жизела по-прежнему заходила в комнату с полнымитарелками еды, убеждая мужа поесть. Он ласково улыбался ей и отказывался. Вечерами меня сменяли другие сиделки, но днем за Йозефом ухаживала я. Мы очень сблизились, и ему было со мной удобно и легко, особенно теперь, когда он раскрыл мне душу. Поэтому я крайне удивилась и расстроилась, узнав, что мне нашли замену. Сын Йозефа счел, что мои услуги обходятся слишком дорого. Я объяснила, что его отцу осталось жить не больше недели или двух, но он считал, что Йозеф может прожить в таком состоянии еще несколько лет. Семья нашла нелегальную сиделку, готовую работать за копейки. Я умоляла Жизелу переубедить сына, но это ни к чему не привело. Они приняли решение. Меня ждали другие пациенты – работа для меня всегда находилась. Я расстроилась только из-за того, что Йозеф открылся мне и ему явно было со мной хорошо. Мне казалось, что для его родных его комфорт в последние пару недель жизни должен быть превыше всего. С ужасом я думала о том, что новая сиделка может оказаться равнодушной, особенно потому, что Йозеф уже почти не мог разговаривать от слабости и одышки. Одновременно я жалела и новую сиделку, представляя, какие им с Йозефом предстоят языковые сложности. Впрочем, сделать я ничего не могла, поэтому оставалось только поверить, что этот поворот событий – часть пути Йозефа. Разве нам дано знать, чему человек должен научиться в течение жизни? Нет. Так что мы с Йозефом обнялись, обменялись улыбками, которые говорили куда больше слов, и простились. В дверях спальни я задержалась, глядя на него в последний раз. Мы еще раз улыбнулись друг другу. Затем я ушла. Отъезжая от его дома, я подумала, как он сейчас смотрит в окно, думая о чем-то своем, и расплакалась. Работая сиделкой, я знакомилась с людьми, которых при других обстоятельствах ни за что бы не узнала. Мы многим делились и многому учились друг у друга, и, хотя иногда мне бывало тяжело, эта работа того стоила. Через неделю мне позвонила внучка Йозефа, сказать, что он умер. Я была рада за него. Болезнь уже не позволяла ему сохранять нормальное качество жизни, так что его уход был облегчением. Думая о нем, я испытывала только благодарность. Учиться у милых моему сердцу пациентов было великим даром. Мы все умрем, но у нас есть возможностьуправлять своей жизнью, и моя работа не давала мне забывать об этом. Мучения Йозефа, который не мог быть откровенным с близкими, наполнили меня решимостью всегда делиться своими чувствами с другими людьми. Я перестала понимать, почему мы так боимся быть открытыми и честными. Понятно, что мы хотим избежать боли, которой чревата откровенность. Но стена тайны, которой мы окружаем свои чувства, тоже может обернуться болью, ведь она мешает другим по-настоящему узнать нас. Глядя на слезы Йозефа, мечтавшего быть понятым и принятым, я поняла, что никогда не буду прежней. В тот день, когда мне сообщили о его уходе, я отправилась в парк возле пляжа и просто сидела, глядя по сторонам. Вокруг играли дети, и я наблюдала, как естественно ониделятся друг с другом своими чувствами. Если им кто-то нравится, они прямо говорят об этом. Если им грустно, они плачут, высвобождая свои эмоции, а затем снова радуются. Они не умеют подавлять свои чувства. Я сидела и любовалась тем, как искренне дети выражают себя, как они все вместе играют и что-то строят. Мы создали общество, в котором взрослые существуют по отдельности друг от друга, совершенно изолированно. Глядя на детей, я видела, как они естественны в своих проявлениях: они все вместе играли, свободно выражали свои чувства и радовались жизни. Я жалела, что, взрослея, мы утрачиваем искренность и открытость, но с другой стороны, эта картина вселяла в меня надежду. Если каждый из нас когда-то был таким, хотя бы в какой-то степени, то, возможно, мы еще не утратили это состояние. В том парке возле пляжа я приняла решение. Мне никогда не придется жалеть о том, о чем пришлось пожалеть милому Йозефу. Пора набраться смелости и начать искренне говорить о своих чувствах. Стены, которыми я окружила свое сердце, больше не нужны. Наконец я готова их снести. Никакого чувства вины Прозвенел звонок, разбудив меня от крепкого сна в новом доме. Сунув ноги в тапки и завернувшись в халат, я отправилась наверх, проведать Джуд. Она промычала нечто невнятное – посторонний человек ни за что не понял бы, чего она хочет, но я легко разобрала просьбу перевернуть ее, потому что у нее болит нога. Устроив Джуд поудобней, я погасила свет, вновь пожелала ей спокойной ночи и вернулась вниз, в свою удобную и красивую кровать. Мы с Джуд нашли друг друга через общих знакомых. Кто-то из моих друзей-музыкантов знал, что я работаю сиделкой, и передал мой номер ее семье. До сих пор большинство моих паллиативных пациентов были пожилыми людьми; многие умирали от рака и связанных с ним заболеваний, но не все. Джуд было всего сорок четыре, и она страдала от заболевания двигательных нейронов. Она жила с мужем и чудесной девятилетней дочкой с каштановыми кудрями и лучезарной улыбкой. Это были любящие и светлые люди – как и сама Джуд. Семья Джуд решила больше не связываться с агентствами, которые постоянно присылали им новых сиделок. У Джуд было немало потребностей, причем весьма конкретных. Из-за болезни ее речь постепенно становилась все менее понятной, поэтому ей нужна была постоянная сиделка, знакомая с ее нуждами. В мои выходные за Джуд присматривали другие сиделки – теперь у меня было достаточно опыта, чтобы обучить их всему необходимому. Поскольку Джуд уже не могла передвигаться сама, мы использовали гидравлический подъемник, чтобы перемещать ее в кресло или кровать. Ее болезнь прогрессировала каждый день. Я радовалась, что познакомилась с ней, пока она еще разговаривала относительно нормально, потому что теперь это позволяло мне намного лучше понимать ее мычание. Джуд родилась в очень богатой семье. От нее всегда ждали, что она удачно выйдет замуж и будет жить так, как полагается женщине ее круга. Ее первая машина стоила куда больше, чем большинство людей зарабатывают за год. В обычном магазине одежды она впервые побывала лет в двадцать пять – до этого она носила только дизайнерские вещи. Об этом позаботились ее родители. Однако при этом Джуд всегда привлекало искусство, и она вовсе не была рабой роскоши. Все, чего ей хотелось, – это жить простой жизнью, рассказывала она мне. Но родители настояли, чтобы она получила образование, и поставили ее перед выбором: изучать право или экономику. Хотя Джуд и говорила, что хотела бы заниматься искусством, такой вариант даже не рассматривался. Уступив родителям, она выбрала юриспруденцию. Она говорила себе, что однажды ее родители умрут, и тогда ей удастся применить себя в области, которая ее по-настоящему интересует: в искусстве или социальной сфере. Однако жизнь распорядилась иначе. Ее отец действительно умер, но матери сужденобыло ее пережить – впрочем, болезнь все равно лишила Джуд возможности работать. Зато благодаря своей любви к искусству она познакомилась с молодым художником Эдвардом. Они сразу же понравились друг другу, и, хотя вначале оба немного робели, сила взаимного притяжения придала им смелости. Очень скоро они влюбились друг в друга с головой, забыв обо всем остальном мире. Семья Джуд не одобрила ее выбор, потому что Эдвард вырос в бедной семье, занимался искусством и вполне довольствовался простым образом жизни. На своем поприще он достиг успеха, но родители Джуд считали любого представителя свободных профессий неприемлемой кандидатурой. К сожалению, ее поставили перед выбором: родители или Эдвард. Она выбрала Эдварда. Разумеется, тут даже думать было не о чем, рассмеялась Джуд. Она всем сердцем любила Эдварда, а он любил ее. Тогда семья Джуд разорвала с ней все отношения. У нее осталось несколько близких друзей из прежней жизни, но теперь она принадлежала к другому миру, более счастливому и открытому, поэтому у нее быстро появился новый круг общения. Через несколько лет у Джуд и Эдварда родилась дочь, Лайла. Джуд хотела, чтобы девочка общалась с бабушкой и дедушкой, поэтому приложила все усилия, чтобы помиритьсяс родителями. Ее отец со временем смягчился, и его последние годы были согреты любовью к обожаемой внучке. Отношения с дочерью у него тоже наладились. С Эдвардом онвсегда был вежлив, но так и не смог принять, что сердце его дочери завоевал художник. Дружбы между ними не сложилось. Зато отец Джуд, несмотря на протесты жены, купилдля молодой семьи дом недалеко от залива. Все шло хорошо, пока Джуд внезапно не сделалась странно неуклюжей – это стало настолько заметно, что они с Эдвардом обратились к врачу. Все это они рассказывали мне хором, и вовсе не потому, что болезнь Джуд мешала ей говорить самой, а просто
