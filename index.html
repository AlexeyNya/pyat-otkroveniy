<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пять откровений о жизни — Бронни Вэр</title><style>:root{--bg:#f5f1e8;--paper:#fffdf8;--text:#29251f;--muted:#777066;--accent:#7a5c3e;--line:#ddd4c6}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text)}body{font-family:Georgia,"Times New Roman",serif}header{position:sticky;top:0;z-index:20;background:rgba(255,253,248,.96);border-bottom:1px solid var(--line);padding:10px 14px}.top{max-width:980px;margin:auto;display:flex;align-items:center;gap:8px;justify-content:space-between}.title{font-family:system-ui,sans-serif;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;gap:6px;align-items:center}button{border:1px solid var(--line);background:var(--paper);color:var(--text);border-radius:9px;padding:8px 10px;cursor:pointer}.progress{height:3px;background:var(--line);margin-top:9px}.progress div{height:100%;width:0;background:var(--accent)}main{max-width:850px;margin:24px auto;padding:0 14px 60px}.book{background:var(--paper);box-shadow:0 8px 35px rgba(60,40,20,.08);border:1px solid var(--line)}.cover{min-height:72vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:50px 25px;border-bottom:1px solid var(--line)}.cover h1{font-size:clamp(32px,6vw,60px);line-height:1.08;margin:0 0 18px}.author{font-size:22px;color:var(--muted)}.reader{padding:clamp(24px,5vw,55px);font-size:20px;line-height:1.72}.reader p{margin:0 0 1.1em;text-indent:1.5em}.reader p:first-child{text-indent:0}.page{display:none;min-height:70vh;position:relative;padding:28px 42px 76px;box-sizing:border-box;overflow:hidden}.page.active{display:block}.page-no{position:absolute;bottom:5px;left:0;right:0;text-align:center;color:var(--muted);font:13px system-ui,sans-serif}.nav{display:flex;justify-content:center;gap:10px;margin:18px 0;font-family:system-ui,sans-serif}#bookmarkList{display:none;position:fixed;right:15px;top:70px;width:min(340px,calc(100% - 30px));max-height:70vh;overflow:auto;background:var(--paper);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.15);padding:12px;border-radius:12px;z-index:30}.mark{display:flex;gap:7px;align-items:center;padding:8px;border-bottom:1px solid var(--line);font:14px system-ui,sans-serif}.mark button{padding:5px 7px}.dark{--bg:#151515;--paper:#202020;--text:#eee9df;--muted:#aaa;--accent:#c6a77b;--line:#3a3a3a}@media(max-width:600px){.reader{font-size:18px}.page{min-height:76vh}button{padding:8px}}</style></head><body><header><div class="top"><div class="title">Пять откровений о жизни</div><div class="controls"><button onclick="font(-1)">A−</button><button onclick="font(1)">A+</button><button onclick="toggleDark()">◐</button><button onclick="addBookmark()">🔖</button><button onclick="toggleMarks()">Метки</button></div></div><div class="progress"><div id="bar"></div></div></header><div id="bookmarkList"></div><main><div class="book"><section class="cover"><h1>Пять откровений о жизни</h1><div class="author">Бронни Вэр</div></section><section class="reader" id="reader"></section></div><div class="nav"><button onclick="prev()">← Назад</button><button onclick="next()">Вперёд →</button></div></main><script>const source=["© Автономова Н., перевод на русский язык, 2019 © Оформление. ООО «Издательство «Эксмо», 2020 Введение Нежным летним вечером в одном маленьком провинциальном городке шел ничем не примечательный разговор – наверняка сотни точно таких же разговоров шли в это же время в разных уголках мира. Просто двое друзей сидели и болтали. Этот разговор отличало только то, что впоследствии он оказался одной из главных поворотных точек в чьей-то жизни – а именно, в моей. Сек – редактор прекрасного австралийского журнала о музыке в стиле фолк: Trad and Now. Его знают и любят в равной степени за поддержку фолк-музыки в Австралии и за широкую радостную улыбку. Мы болтали о том, как любим музыку (что было весьма уместно, поскольку мы были на фестивале фолк-музыки). Речь зашла о том, что мне никак не удается найти деньги для запуска своей музыкальной образовательной программы в женской тюрьме. «Если все получится, дай мне знать, мы напечатаем об этом материал», – сказал Сек ободряюще. Все действительно получилось, и некоторое время спустя я написала колонку об этом опыте. Закончив ее, я спросила себя, почему я так редко пишу. В конце концов, мне всегда это нравилось. Еще веснушчатой девчонкой я переписывалась с друзьями по всему миру. Это было в те древние времена, когда люди еще писали друг другу письма от руки, клали их в конверты и бросали в почтовые ящики. Повзрослев, я не только не перестала писать письма друзьям, но и полюбила вести дневник. К тому же я писала песни, так что мое писательство, в общем-то, не прекращалось, просто теперь к ручке добавилась еще и гитара. Но статья о тюрьме, которую я писала старомодным образом – за кухонным столом, ручкой на бумаге, – доставила мне такое удовольствие, что я вспомнила, как люблю писать. Так что я отправила Секу благодарственное письмо и вскоре после этого начала вести собственный блог. То, что случилось потом, изменило мою жизнь наилучшим образом. Блог «Вдохновение и чай» родился в деревенском домике в Голубых горах Австралии, разумеется, под чашку чая. В одном из первых текстов, который я туда написала, рассказывалось, о чем сожалели перед смертью мои пациенты. Перед тем как начать работать в тюрьме, я была паллиативной сиделкой, и воспоминания об этом опыте были еще совсем свежи. В следующие несколько месяцев пост про умирающих загадочным образом разлетелся по просторам интернета. Мне начали приходить имейлы от незнакомых людей, которые делились своими мыслями об этом и других текстах моего блога. Прошел почти год, я жила уже в другом домике, теперь в сельскохозяйственном районе. Как-то в понедельник я уселась с ноутбуком за стол на веранде и решила проверить статистику посещений своего сайта. Увиденное меня позабавило и заинтриговало одновременно. Во вторник я снова заглянула в статистику, а потом и в среду. Происходило что-то невероятное. Пост, который назывался «О чем сожалеют умирающие», вдруг взлетел в заоблачную высь. Мне на почту хлынули имейлы со всего мира, в том числе от авторов, просивших разрешения процитировать мою статью в своих блогах, и от желающих перевести ее на другие языки. Этот текст читали люди в электричках в Швеции, на автобусных остановках в Америке, в офисах в Индии, за завтраком в Ирландии и так далее, и тому подобное. Не все соглашались с его содержанием, но он вызывал достаточно горячих обсуждений, чтобы продолжать свое путешествие по миру. Тем, кто был со мной не согласен, я писала вответ (если писала): «Мопед не мой». Я всего лишь поделилась с читателями тем, что говорили мне люди на пороге смерти. Впрочем, как минимум девяносто пять процентов этих писем и комментариев были положительными. Поразительно, как много у людей общего, несмотря на их культурные различия. Пока все это происходило, я продолжала жить в деревне, наслаждаясь пением птиц и любуясь животными, которые приходили к ручью перед моим домом. Каждый день я сиделаза столом на своей веранде и работала, соглашаясь на новые предложения. В следующие несколько месяцев «О чем сожалеют умирающие» прочли более миллиона людей. В течение года эта цифра утроилась. Написать на эту тему подробней я решилась только потому, что множество людей сообщали мне, как их тронула моя статья и как они хотели бы прочесть продолжение. Вообще-то я всегда – как и многие другие – мечтала создать полноценную книгу. Но оказалось, что сформулировать уроки, вынесенные из работы с умирающими, я могу только через рассказ о себе самой. Книга, о которой я мечтала, созрела к написанию. Вы сейчас держите ее в руках. Как вы скоро узнаете из моей истории, я никогда не шла по проторенной дорожке. Я действую так, как мне подсказывает жизнь, и эту книгу я написала просто как женщина, которой есть что рассказать о себе. Имена почти всех персонажей в книге были изменены из уважения к их друзьям и родным. Впрочем, когда я вспоминала о своем первом инструкторе по йоге, о начальнице в перинатальном центре, о владельце автомобильной стоянки и о моей наставнице в тюрьме, я использовала их настоящие имена; имена всех музыкантов в книге тоже настоящие. Хронологический порядок также пришлось немного изменить, чтобы сгруппировать истории по темам, объединяющим разных людей. Я хочу поблагодарить всех, кто помогал мне на этом пути. За поддержку и положительное влияние на профессиональном поприще спасибо Мэри Берроуз, Элизабет Чэм, Вальде Лоу, Робу Конвэю, Ризе Райан, Барбаре Гилдер, папе, Пабло Акосте, Брюсу Рейду, Джоан Денниг, Зигфриду Кунце, Джилл Марр, Гаю Качелу, Майклу Блеме, Ане Гонкальвес, Кейт и Колу Бейкер, Ингрид Клифф, Марку Паттерсону, Джейн Даргавиль, Джо Уоллису, Бернадетт и всем, кто поддерживает мои литературные и музыкальные усилия. Спасибо всем, кто в разное время давал мне крышу над головой, в том числе Марку Авеллино, тете Джо, Сю Крейг, Хелен Аткинс, дяде Фреду, Ди и Грегу Бернс, Дасти Каттелл, Марти МакЭлвенни, и тем замечательным людям, за чьими домами я присматривала. Спасибо также всем добрым людям, которым случалось меня кормить. За личную поддержку на моем непростом пути спасибо всем друзьям, бывшим и настоящим, близким и далеким. Спасибо за то, что сделали мою жизнь настолько богаче и интересней. Отдельное спасибо Марку Невену, Шэрон Рошфор, Джули Скеретт, Мелу Джаллонго, Анджелин Раттанси, Кейти Макфарлейн, Брэду Антониу, Энджи Бидвелл, Терезе Клэнси, Барбаре Сквайр, всем работникам и волонтерам медитационного центра в горах, который помог мне обрести мир, и моему мужу. Когда мне больше всего нужен был отдых, вы были моими носилками. Спасибо, конечно же, моей маме Джой. «Джой» значит «радость», и невозможно придумать для нее более подходящего имени. Своим примером ты преподала мне священный урок любви, бесконечное спасибо тебе за это. Спасибо всем тем чудесным людям, которых уже нет в живых, чьи слова и истории не только вошли в эту книгу, но и изменили мою жизнь. Эта книга написана в память о вас. Спасибо также семьям моих покойных пациентов за пережитые вместе моменты, полные любви. Наконец, спасибо сороке, которая поет в ветвях дерева у ручья, пока я пишу эти строки. Ты вместе с другими птицами составляла мне компанию, пока я писала свою книгу. Спасибо Богу за мою жизнь и за всю ту красоту, которую он мне посылает. Иногда мы не сразу понимаем, что какой-то момент в нашей жизни был судьбоносным. Очень многие из описанных в этой книге моментов изменили мою жизнь. Спасибо тебе, Сек, что разбудил во мне писателя. И спасибо вам, мои читатели, за ваши добрые сердца и за ваш отклик.", "С любовью и добротой, Бронни Закатная веранда Вечер вторника Из тропиков в снег «Где мои зубы? Где мои зубы?» – знакомые причитания донеслись до комнаты, где я отдыхала в свой законный обеденный перерыв. Отложив книгу, я отправилась в гостиную. Как я и думала, Агнес стояла посреди комнаты с выражением невинного замешательства на лице, улыбаясь во весь свой беззубый рот. Мы обе расхохотались. Шутка должна была давно нам приесться, потому что Агнес стабильно теряла свои зубы каждые несколько дней. Но почему-то не приедалась. «Вы это делаете специально, чтобы выманить меня из комнаты», – смеясь, я приступила к поиску во всех уже хорошо знакомых мне местах. На улице все падал и падал снег,и от этого внутри домика было еще теплее и уютнее. Агнес решительно помотала головой: «Вовсе нет, дорогуша! Я сняла их перед тем, как лечь поспать, а потом проснулась, и их нигде нет». Не считая провалов в памяти, голова у нее была совершенно ясная. Наше соседство с Агнес началось четырьмя месяцами раньше, когда я откликнулась на объявление о поиске компаньонки для пожилой женщины. До этого я работала и жила впабе, куда устроилась, чтобы не оказаться на улице после переезда в Англию из Австралии. Это был занятный опыт, и у меня завелись добрые друзья среди сотрудников и завсегдатаев заведения. Я была благодарна и за работу, и за крышу над головой, но пришло время сменить обстановку. Последние два года перед отъездом в Англию я прожила на тропическом острове, живописном, как открытка. Я почувствовала, что мне просто необходимо вырваться из банковского офиса, где я в течение десяти лет с понедельника по пятницу вкалывала от звонка до звонка. Как-то мы с сестрой отправились в отпуск на остров в Северный Квинсленд, отдохнуть и научиться нырять с аквалангом. Пока она флиртовала с инструктором, – что оченьнам пригодилось во время экзамена, – я решила подняться на ближайшую гору. Я сидела на громадном булыжнике, окруженная небом, улыбалась, и тут меня осенило. Я поняла, что хочу жить на острове. Четыре недели спустя работа в банке осталась в прошлом; все мои вещи были либо распроданы, либо отправлены храниться в сарай на ферме моих родителей. Посмотрев на карту, я выбрала два острова чисто по географическому принципу. Я ничего не знала об этих островах, кроме того, что мне понравилось их расположение и на каждом был курорт. Все это происходило еще до появления интернета, то есть до возможности в секунду получить всю необходимую мне информацию. Бросив в почтовый ящик свое резюме, я взяла рюкзак и отправилась на север безо всяких определенных планов. Был 1991 год, так что у большинства людей в Австралии еще не было мобильных телефонов – они появились через несколько лет. В пути я была неосторожна, за что тут же поплатилась: я попыталась путешествовать автостопом, но одного неприятного происшествия хватило, чтобы я навсегда отказалась от этой идеи. Водитель сказал, что хочет показать мне, где живет. Но пока мы ехали, дома перестали нам попадаться, по обочинам был лишь плотный кустарник, а дорога из асфальтированной превратилась в грунтовую, причем совершенно заброшенную. К счастью, я не потеряла присутствия духа, и мне удалось его заболтать. Отделавшись несколькими слюнявыми поцелуями, яторопливовыскочила из машины в нужном мне городе. Так закончились мои попытки путешествовать автостопом. С тех пор я пользовалась только общественным транспортом, и, не считая мутного эпизода с автостопом, это было замечательное приключение. Особенно мне нравилось не знать, где я окажусь завтра. Кроме того, постепенно продвигаясь на автобусах и поездах в сторону более теплого климата, я нередко знакомилась с замечательными людьми. Через несколько недель я позвонила маме. Оказалось, мне пришло письмо: на одном из выбранных мной островов меня ждала работа. Правда, я так торопилась сбежать из банка, что совершила глупейшую ошибку: написала, что согласна взяться за любую работу. И вот я оказалась на прекраснейшем острове… по локоть в грязных кастрюлях и сковородках. Впрочем, жизнь на острове была прямо сказкой – я не просто вырвалась из офисной рутины, а обычно даже не знала, какой сегодня день недели. Это было счастье. Год проработав в неромантичной должности посудомойки, я постепенно доросла до повышения и перешла в бар. На кухне мне работалось вполне весело, к тому же я массу нового узнала о творческом подходе к готовке. Но все равно это была тяжелая, жаркая и потная работа в тропическом климате и без кондиционера. Зато все выходные я проводила, бродя по невероятным джунглям, плавая на лодке на соседние острова, ныряя с аквалангом или просто расслабляясь в этом райском саду. Вначале я вызвалась помогать в баре бесплатно, а со временем насовсем перебралась из кухни за вожделенную барную стойку. Работать там было несложно, а из окон открывался потрясающий вид на идеально спокойный синий океан, белый песок и качающиеся пальмы. Я обслуживала довольных посетителей, наслаждавшихся отпуском, и научилась профессионально смешивать роскошные тропические коктейли, которые украсили бы любой туристический буклет. Эта жизнь ничем не напоминала мое офисное существование. За стойкой я познакомилась с европейцем, который предложил мне поработать в своей типографии. Мне всегда хотелось посмотреть мир, и после двух лет на острове я чувствовала, что уже готова к переменам. К тому же я всегда хотела вернуть себе некоторую анонимность. Когда день за днем живешь и работаешь в одном и том же небольшом коллективе, начинаешь особенно ценить личное пространство. Я собрала вещи и отправилась в Европу. Культурный шок – естественная реакция для любого, кто вернулся на материк после пары лет жизни на острове. Но оказаться к тому же сразу в чужой стране, даже не зная местного языка, было, мягко говоря, непросто. В течение этих месяцев мне встретилось какое-то количество приятных людей, и в целом я благодарна жизни за этот опыт. Но мне нужны были друзья, которые больше походили бы на меня, поэтому очень скоро я решила перебраться в Англию. Когда я ступила на английскую землю, денег у меня хватало только на билет до единственного знакомого в этой стране – так началась новая глава в моей жизни. У Нева была широкая улыбка и редеющие седые кудри. Будучи большим любителем и ценителем вин, он работал в винном отделе универмага «Харродс». В тот день в магазине как раз началась летняя распродажа, и я, явившаяся туда с ночного парома через Ла-Манш, определенно смотрелась в этом дорогом элегантном заведении как бродяжка. – Нев, привет! Я Бронни, подруга Фионы, вы несколько лет назад ночевали у меня на диване, – сообщила я через стойку, радостно улыбаясь. – Бронни, ну конечно, – услышала я с облегчением. – Что новенького? – Мне очень нужно где-то переночевать сегодня, – сказала я с надеждой в голосе. Нев сунул руку в карман и протянул мне ключ: – Не вопрос. Вот, возьми. Так я получила место для ночлега и инструкции, как туда добраться. – А можете еще одолжить мне десять фунтов, пожалуйста? – спросила я оптимистично. Без тени сомнения он выдал мне десять фунтов. Я тепло поблагодарила его в ответ – все мои вопросы были решены. Мне было где спать и что есть. Я купила свежий номер журнала о путешествиях, при помощи которого планировала устроиться на работу, пришла домой к Неву и позвонила по трем объявлениям. На следующее утро я уже ехала на собеседование в паб в графстве Суррей, где требовалась помощница с проживанием. К середине дня мы обо всем договорились, и я поселилась в пабе. Прекрасно. Пару лет жизнь шла своим чередом, я была занята в основном дружбой и романами. Это было хорошее время. Мне нравилась деревенская жизнь: порой она напоминала жизнь на острове, к тому же я жила среди людей, которых успела узнать и полюбить. До Лондона было не слишком далеко, и я регулярно и с удовольствием ездила туда на электричке. Но прошло время, и дорога снова начала манить меня. Мне ужасно хотелось увидеть Ближний Восток. Пришло время принять решение, уезжать или оставаться, и я решила задержаться в Англии на третью зиму, чтобы подкопить денег на поездку. Для этого нужно было съехать из паба, чтобы не поддаваться искушению каждый вечер веселиться с друзьями. Надо сказать, я никогда много не пила, а позже и вовсе отказалась от алкоголя, но все равно каждый вечер вне дома стоил мне денег, которые можно было бы отложить на путешествие. Приняв решение остаться, я почти сразу увидела объявление о поиске компаньонки для Агнес. Оно привлекло мое внимание, потому что адрес был в соседнем графстве. На работу меня взяли почти мгновенно – как только фермер Билл понял, что я тоже выросла на ферме. Его матери, Агнес, было под девяносто, у нее были седые волосы по плечи, жизнерадостный голос и большой круглый живот, почти ежедневно прикрытый одной и той же вязаной красно-серой кофтой. Ферма находилась в получасе езды от паба, так что по выходным я ездила навещать друзей. Но при этом я жила как будто в другой вселенной. Круглые сутки с вечера воскресенья по вечер пятницы я проводила с Агнес, в полной изоляции от остального мира. Каждый день мне полагались два часа отдыха в середине дня, но мне редко удавалось скем-то увидеться, хотя иногда в это время я встречалась со своим парнем. Дин был чудесным человеком. С самого начала, с первой же минуты нас сблизило чувство юмора. Нас также связывала любовь к музыке. Мы познакомились на следующий день после моего приезда в страну, сразу после собеседования насчет работы в пабе. Очень скоро стало очевидно, что это знакомство делает наши жизни богаче и веселее. К сожалению, львиную долю своего времени я была вынуждена проводить вовсе не с Дином. В основном я была заперта в домике с Агнес, занимаясь поиском ее вставной челюсти. Просто поразительно, как она ухитрялась находить все новые места для своих потерянных зубов в таком небольшом пространстве. У Агнес была собака по имени Принцесса: десятилетняя немецкая овчарка, которая непрерывно линяла. Это была добрая собака, но из-за артрита у нее ослабли задние лапы– кажется, распространенное заболевание для этой породы. Я приподняла Принцессину задницу и поискала под ней зубы Агнес, но безуспешно. Иногда Принцессе случалось усесться на них, так что проверить все равно стоило. Собака вильнула своим большим хвостом и вновь уснула перед камином, сразу же забыв обо мне. Продолжая поиски, мы с Агнес постоянно сталкивались лбами. «Здесь их нет», – кричала она из спальни. «Здесь тоже!» – отвечала я из кухни. Рано или поздно мы менялись местами: я начинала искать в спальне, а Агнес на кухне. В малюсеньком домике было не так уж много места для поисков, так что мы на всякий случай дважды обыскивали все комнаты. В тот конкретный день зубы нашлись в корзинке с вязанием, стоявшей возле кресла. «Дорогуша, ты просто сокровище, – сказала Агнес, засовывая челюсть в рот. – Раз уж ты все равно вышла из своей комнаты, садись смотреть со мной телевизор». Она часто пользовалась этой маленькой уловкой, и я, улыбнувшись, села с ней рядом. Агнес долгое время жила в одиночестве и теперь бесконечно радовалась моему обществу. Книжка подождет, решила я. Мою работу никак нельзя было назвать тяжелой или напряженной. Агнес требовалась прежде всего не помощь, а компания, и мне было нетрудно провести с ней лишнее время. Мне случалось находить ее зубы под подушкой, в ящике в ванной комнате, в чайной чашке в кухонном шкафу, в сумочке Агнес и во множестве других мест, где они еще хоть как-то могли оказаться. Но я также находила их за телевизором, в камине, в мусорном ведре, на холодильнике и в ботинке. И конечно же, под большой Принцессиной попой. Многих людей устраивает однообразная жизнь. Лично я предпочитаю перемены. Но у рутины есть свои преимущества, и она подходит многим людям, особенно если они уже в возрасте. У нас с Агнес был строгий распорядок дня и всей недели. Каждый понедельник, в одно и то же время, мы ездили к врачу, потому что Агнес нужно было регулярно сдавать кровь на анализы. Одного события в день было достаточно, иначе нарушился бы привычный дневной график Агнес, состоявший из отдыха и вязания. Старушка Принцесса неизменно сопровождала нас повсюду, в любую погоду. Сначала я откидывала задний бортик нашего пикапа. Огромная собака терпеливо ждала, не переставая вилять хвостом. Затем я ставила ее передние лапы на бортик и спешила скорее подхватить ее за заднюю часть, чтобы у Принцессы не успели подкоситься лапы и нам не пришлось бы начинать с начала. После этого упражнения я на всю поездку была покрыта ровным слоем рыжей собачьей шерсти. Спрыгивать вниз ей было проще, хотя помощь все равно требовалась. Принцесса наполовину сползала вниз, так что ее передние лапы стояли на земле, а затем ждала, пока яспущу ее задние лапы на землю. Если в процессе мне нужно было отвлечься и помочь Агнес, Принцесса так и дожидалась меня, задрав хвост в небо и не двигаясь с места. Оказавшись на земле, она передвигалась самостоятельно, неизменно виляя огромным хвостом. По вторникам мы ездили за продуктами в соседнюю деревню. Многие пожилые люди, с которыми я работала, были очень бережливы. С Агнес все обстояло наоборот. Она постоянно пыталась мне что-нибудь купить, особенно что-нибудь ненужное. У каждой полки повторялось одно и то же: две женщины, пожилая и молодая, ругались друг с другом, улыбаясь и даже иногда смеясь, но не уступая. В конечном итоге Агнес покупала мне половину того, что хотела. Это бывали самые разные вещи, от вегетарианских вкусностей и импортных манго до новой расчески, майки или какой-нибудь жуткой на вкус зубной пасты. По средам мы снова ездили в деревню, на этот раз играть в бинго. Видела Агнес плохо, поэтому я выступала ее глазами. Она сама читала цифры и достаточно хорошо слышала, но сверялась со мной каждый раз перед тем, как вычеркнуть очередную цифру. Я обожала всех стариков, с которыми мы играли. Мне еще не стукнуло тридцать, так что я была в этой компании самой молодой, чем Агнес очень гордилась. Она называла меня «моя подружка». «Вчера мы с моей подружкой ездили за покупками, и я купила ей новых трусов», – серьезно и с гордостью сообщала она другим пожилым игрокам. Все кивали и улыбались мне, а я сидела и думала: «Начинается». Агнес продолжала: «На этой неделе ей пришло письмо от мамы, из Австралии. Знаете, там сейчас очень жарко. И у нее родился новый племянник». И снова все кивали и улыбались. Я быстро научилась ограничивать информацию, которой делилась с Агнес. Иначе страшно подумать, что узнали бы обо мне все ее знакомые – особенно в те дни, когда мама присылала мне красивое нижнее белье и другие подарки, чтобы побаловать. Но Агнес любила меня и никогда не имела в виду ничего плохого, так что я терпела, даже если от ее слов мне приходилось краснеть. По четвергам мы обедали в городе. Это был большой выход в свет для всех троих, включая Принцессу, разумеется. Мы ездили в небольшой городок в Кенте и обедали там с дочерью Агнес. По английским меркам пятьдесят километров это далеко, но для австралийца это рукой подать. Мы совершенно по-разному воспринимаем расстояния. В Англии можно проехать всего три километра и оказаться в другой деревне. В ней будет принципиально другой акцент, и вы можете не знать там ни единого человека, даже если всю жизнь прожили в соседней деревне. В Австралии легко можно прокатиться восемьдесят километров за батоном хлеба. Ближайшие соседи иногда живут так далеко, что поговорить или поздороваться вам удается только по телефону или по рации, но при этом они все равно считают себя вашими соседями. Однажды я работала в Северной территории в такой глуши, что до ближайшего паба нужно было лететь на самолете. Ранним вечером маленькая посадочная полоса была полностью забита одноместными и двухместными самолетиками и пустела только к утру, когда посетители, напившись грога, разлетались по домам, каждый на свою ферму. Так что наши поездки в город по четвергам были для Агнес большим выходом в свет, а для меня – легкой и приятной прогулкой. Ее дочь оказалась милой и доброй женщиной,и обед проходил в приятной обстановке. Они обе всегда заказывали «обед пахаря»: большой бутерброд с говядиной, сыром и маринованными овощами. Я часто поражалась любви англичан к маринованным овощам. Впрочем, для вегетарианцев Англия – хорошая страна, у меня всегда был выбор, что поесть. Зимой я постоянно мерзла, так что обычно заказывала большую тарелку горячего супа или сытной пасты. Пятницы мы проводили ближе к дому. Мы жили на скотоводческой ферме со своей собственной мясной лавкой, которой заправляли сыновья Агнес. Хотя Агнес настаивала, чтоей нужно самой подробно рассмотреть, что она покупает, каждую неделю она неизменно брала в лавке одно и то же. Мясник даже предлагал ей привозить заказ на дом, но нет. «Большое спасибо, но я должна приходить и сама все выбирать», – отвечала она очень вежливо. В то время я была вегетарианкой (теперь я веганка). При этом я жила на скотоводческой ферме, очень похожей на ту, где выросла. Не поддерживая мясоедство, я прекрасно понимала и этот бизнес, и образ жизни. В конце концов, он был мне хорошо знаком. Из лавки мы шли пешком и по пути проходили через хлев, останавливаясь поболтать с работниками и коровами. Агнес медленно переставляла ноги, опираясь на свою палку, я шла рядом, а Принцесса позади. Холодная погода нас не смущала – мы просто одевались потеплее. Так мы проводили каждую пятницу, сначала заходя в лавку, а потом в хлев к коровам. Я удивлялась тому, как англичане обращаются со своими коровами: у них был теплый хлев, и каждая получала отдельное внимание и заботу. В Австралии все устроено иначе, но, с другой стороны, австралийским коровам не приходится терпеть долгие и холодные английские зимы. Несмотря на хороший уход, мне было ужасно грустно знакомиться с каждой коровой, зная, что вскоре мы отправимся покупать ее мясо в лавке. С этим трудно было примириться, и до конца мне это так и не удалось. Дома тема моего вегетарианства всплывала очень часто, хотя я пыталась отмалчиваться и всегда уважала выбранный моей семьей образ жизни. Я никогда не была из тех вегетарианцев или веганов, которые не переставая рассказывают всем о своем выборе. Впрочем, я росла на скотоводческой ферме и многое видела, а школьницей еще и побывала на экскурсии на скотобойне, которую мне не забыть никогда. Поэтому я понимаю, почему некоторые люди с такой страстью говорят об отказе от мяса. Тот, кто найдет в себе силы поинтересоваться, что происходит за стенами скотопромышленных комплексов, увидит душераздирающее зрелище. Но сама я предпочитала жить тихо, подавая другим пример своими поступками и уважая право каждого человека жить так, как он хочет. О своих убеждениях я рассказывала,только если меня о них спрашивали, и с радостью отвечала на любые вопросы. Интересно, что на протяжении многих лет едва знакомые со мной люди не раз пытались провоцировать меня на споры и конфликты из-за моего решения не есть животных. Возможно, поэтому я и не хотела говорить о своем вегетарианстве. Мне просто хотелось мирной жизни. Поэтому, когда Агнес начала расспрашивать меня, почему я не ем мясо, я заколебалась. Она жила на те доходы, которые приносило ее семье животноводческое хозяйство. Если подумать, то и сама я жила на эти же доходы, хотя в тот момент это не приходило мне в голову. Я взялась за эту работу, просто чтобы подкопить денег и скрасить жизнь одинокой старушке. Но она продолжала меня расспрашивать. Тогда я рассказала ей, что чувствовала в детстве, видя, как забивают коров и овец, и как сильно это на меня повлияло. Как я всегда любила животных и как заметила, что коровы мычат иначе, когда знают, что скоро умрут. Эти звуки, полные ужаса и паники, преследуют меня до сих пор. Этого оказалось достаточно. Агнес немедленно заявила, что становится вегетарианкой. «Приплыли, – подумала я. – Как я объясню это ее родным?» Вскоре у меня состоялся разговор на эту тему с Биллом, а потом он провел беседу и с Агнес. Он хотел, чтобы Агнес продолжала есть мясо, но она не отступалась. Наконец, она согласилась раз в неделю есть красное мясо, раз в неделю – рыбу и еще раз – курицу. Когда у меня были выходные, ее кормила семья, так что в эти дни она тоже ела мясо. Со временем я только укрепилась в своих взглядах на мясоедство, и теперь я бы даже не рассматривала такую работу, которая требовала бы от меня готовить мясо. Но тогда я была моложе и мягче, хотя эта часть моих обязанностей была мне ненавистна. Каждый раз, готовя мясо, я грустила, что когда-то оно было прекрасным живым существом, наделенным чувствами и правом на жизнь. Так что новая договоренность мне сразу понравилась, хоть я и считала, что рыба и курица – тоже животные. Впрочем, оказалось, что Агнес согласилась с Биллом только для вида. Она вовсе не собиралась есть мясо в течение недели. Так что оставшиеся зимние и весенние месяцы я готовила нам вкуснейшую вегетарианскую еду – кексы с орехами, чу́дные супы, разноцветные рагу и так далее. Если бы я этого не делала, думаю, Агнес с удовольствием питалась бы одними яйцами и консервированной фасолью. В конце концов, она была англичанкой, а англичане обожают фасоль. Снег растаял, и цветущие нарциссы объявили о приходе весны. Дни становились длиннее, небо из серого вновь стало голубым. Ферма ожила: вокруг на своих шатких тонких ножках бегали новорожденные телята. С зимовки вернулись птицы и каждый день приветствовали нас пением. Принцесса линяла еще сильнее обычного. Мы с Агнес убрали свои зимние пальто и шапки и еще пару месяцев продолжали следовать привычному графику, наслаждаясь весенним солнышком. Мы были просто две женщины из разных поколений, которые гуляют под ручку, болтают и смеются. Но зов дальних стран становился все сильнее. Мы с Агнес с самого начала знали, что я не останусь с ней надолго. Кроме того, я скучала по Дину. Нам не хватало выходных, и мы с нетерпением ждали возможности вместе отправиться в путь. Мне начали искать замену; наше время с Агнес подходило к концу. Эти месяцы подарили мне прекрасный, ни на что не похожий опыт. Хотя изначально я согласилась на эту работу ради денег, она принесла мне немало радости. Быть компаньонкой понравилось мне куда больше, чем разливать пиво. Было намного приятней подставлять плечо человеку, который стар и немощен, а не тому, который молод и пьян – или даже стар и пьян. Пока я работала в английском пабе на острове, мне регулярно приходилось подставлять плечо нетрезвым посетителям. Разыскивать старушкины зубы было куда приятней, чем убирать грязные пепельницы и пивные стаканы. Мы с Дином отправились на Ближний Восток, знакомиться с поразительной культурой, совершенно не похожей на нашу (и объедаться вкуснейшей едой). Через год странствийя вернулась навестить Агнес. Мое место заняла другая австралийка, и мы с ней долго болтали после того, как Агнес уснула в своем кресле. Среди прочего она рассказала,что ее откровенно удивил первый вопрос, заданный Биллом на собеседовании. Узнав, что это был за вопрос, я расхохоталась. Первым вопросом Билла было: «Скажи сразу,тыже не вегетарианка?» Неожиданный карьерный путь Проведя несколько лет в Англии и на Ближнем Востоке, я наконец вернулась домой, в любимую Австралию. Путешествия совершенно изменили меня, как это часто бывает. Я попробовала вернуться на работу в банк, но скоро стало очевидно, что эта сфера мне совершенно не подходит. Единственной более-менее приятной частью моей профессиональной деятельности было обслуживание клиентов, и, хотя найти такую работу было легко в любом городе, я чувствовала себя несчастной и не на своем месте. Мое творчество тоже пошло на спад. Теперь я жила в Западной Австралии, в городе Перт. Однажды, сидя на берегу реки Суон, я составила два списка. В одном я перечислила все, что умею делать. Во втором – все, что я люблю делать. Исходя из этих списков, пришлось признать, что во мне должен скрываться человек искусства, потому что единственные пересекающиеся пункты были связаны с творчеством. «Но разве я решусь податься в искусство?» – подумала я. Хотя я выросла среди музыкантов, мне внушали, что очень важно иметь «приличную работу», поэтому никто не могпонять, почему я так маюсь, несмотря на стабильную работу в банке. Да, это была «приличная работа»; приличная работа, которая медленно, но верно меня убивала. Мне пришлось как следует покопаться в себе в поисках дела, которое мне хорошо удается и в то же время приносит радость. Это было непростое время, потому что внутри меня происходили большие перемены. Наконец, я пришла к выводу, что рано или поздно мне придется начать работать сердцем: работа одним умом принесла мне только неудовлетворенность и пустоту. Так я начала развивать свои творческие навыки – вначале литературные и фотографические, но постепенно, по кривой и длинной траектории, этот путь привел меня на сцену с гитарой в руках. Все это время я продолжала работать в банке, хотя и не на полную ставку. Выдержать полноценный рабочий день в офисе у меня уже просто не получалось. Перт был довольно далеко от моих родных мест, и, хотя мне нравился этот город, желание быть ближе к друзьям и семье победило. Я отправилась назад – через величественную равнину Налларбор и хребет Флиндерс, по шоссе Грейт-Оушен, а потом по Нью-Ингленд, пока не добралась до Квинсленда. Там я решила задержаться и некоторое время работала в колл-центре для людей, желающих подписаться на телеканал для взрослых. Это было куда увлекательней, чем перекладывать бумажки в банке. – Э-э-э… Пауза. – Я звоню по просьбе мужа. – Вы, наверное, хотели бы подписаться на ночной канал? – отвечала я как можно дружелюбней, стараясь успокоить собеседницу. Или же звонили мужчины и спрашивали: – Ну а как там вообще? В смысле,всевидно? – Извините, я сама не смотрела, но могу предложить вам одну ночь на пробу за шесть долларов девяносто пять центов. Если вам понравится, вы сможете перезвонить и подписаться на весь месяц. И конечно, бывали предсказуемые звонки с вопросами типа: «Какого цвета на тебе трусики?» На этом месте я всегда вешала трубку. Впрочем, если не считать щекотливых и комичных ситуаций, это была всего лишь очередная офисная работа. Я подружилась с другими сотрудниками, и это скрашивало мне будни, но неудовлетворенность никак не проходила. Мы переехали в мой родной штат, Новый Южный Уэльс. Дин, с которым мы встречались в Англии, а потом путешествовали по Ближнему Востоку, прилетел со мной в Австралию. Вскоре после переезда в Новый Южный Уэльс наши отношения закончились. Мы нежно любили друг друга несколько лет и почти все это время были лучшими друзьями. Было горько смотреть, как эта дружба рушится, но нам больше не удавалось игнорировать многочисленные несовпадения в образе жизни. Я была вегетарианкой. Дин ел мясо. Я всю неделю работала в четырех стенах и на выходных мечтала выбраться на природу. Он всю неделю работал на улице и по выходным хотел сидеть дома. Список был длинным, и с каждой неделей, казалось, только увеличивался. Все, что нравилось одному из нас, больше не нравилось другому. Нас все еще объединяла любовь к музыке, но в конечном итоге наша связь утратила силу. Каждый справлялся с этой потерей как мог. Это было тяжелое и грустное время: отношения закончились, оставив после себя лишь горечь утраты. Но даже плача над своим разбитым сердцем, я знала, что исправить ничего нельзя. Жизнь звала нас в разные стороны, и наши отношения уже не помогали, а мешали каждому идти своим путем. После расставания с Дином я еще активней начала искать свое предназначение, возлагая большие надежды на профессиональную сферу. Оказалось, что человеку искусствавыжить очень непросто, пока он не раскрутится и не наработает репутацию; мне срочно нужно было найти новую работу. Я твердо знала, что со временем у меня получится зарабатывать на жизнь искусством. В конце концов, несбыточных мечтаний не бывает. Но пока что мне нужно было снова начать зарабатывать деньги, причем в такой области, где я могла бы быть собой и вкладывать в работу душу. В банковский мир я больше не вписывалась – если я вообще тудакогда-то вписывалась. Чтобы не бросать творчество, я приняла решение снова пойти работать компаньонкой с проживанием. Как минимум у меня не будет болеть голова об ипотеке или арендной плате, к тому же я буду свободна от жесткого монотонного графика. Хотя этому решению предшествовали годы поисков себя, я приняла его почти небрежно, с легкостью. Все просто: я найду работу компаньонкой, чтобы продолжать работать над своей творческой карьерой, буду вкладывать в работу душу и к тому же мне не придется платить за жилье. Я понятия не имела в тот момент, что мои поиски по-настоящему душевной работы увенчались сокрушительным успехом и что следующие годы станут важнейшей частью моей жизни и дела всей моей жизни. Уже через две недели я переехала в дом в одном из самых дорогих районов Сиднея. Мою новую подопечную, Рут, нашли лежащей без сознания на кухонном полу. После месяца в больнице ее отпустили домой при условии, что за ней будет круглосуточный присмотр. У меня был ограниченный опыт в этой области – только с Агнес несколько лет назад. Я никогда не ухаживала за больными людьми и честно сказала об этом в агентстве, но там не возражали. Сиделки с проживанием были редкой ценностью, поэтому сотрудники агентства не хотели меня упустить. «Просто веди себя уверенно, а если понадобится помощь, звони нам». Вот так в одно мгновение я превратилась в сиделку. Развитая эмпатия помогала мне достаточно успешно – для новичка – справляться с этой работой. Я просто обращалась с Рут как с собственной бабушкой, которую безумно любила. Заботясь о ее нуждах, я на ходу соображала, что и как делать. Каждые несколько дней к нам заглядывала районная медсестра и задавала вопросы, на которые я понятия не имела как отвечать. Поскольку я этого не скрывала, она стала мне помогать, рассказывая про лекарства, уход за больными и знакомя с профессиональным жаргоном. Мои работодатели тоже заходили нас проведать. Увидев, что Рут всем довольна, они уходили, полностью удовлетворенные. Они и представить себе не могли, что я на полных парах лечу к эмоциональному и физическому истощению. Я, наверное, тогда и сама этого не понимала. Семья была довольна, потому что я баловала Рут как могла. Массаж ног, маникюр, маски для лица и бесконечные разговоры за чаем. Как я уже говорила, я обращалась с ней как с любимой бабушкой. Никто не учил меня вести себя иначе. Рут звонила в свой колокольчик и по ночам, и я сломя голову бежала вниз по лестнице, чтобы помочь ей пересесть на кресло-туалет возле кровати. «Какая ты шикарная!» – говорила она, когда я входила в комнату. Мой шик заключался в том, что я иногда ложилась в постель, не распуская волосы, потому что у меня не было сил расчесаться. Другой «шикарной» частью моего образа была ночная рубашка, которую навязала мне мама. «Ты не можешь поселиться в этом доме и спать голой или в обносках, – умоляла мама. – Пожалуйста, обещай мне, что будешь носить мой подарок». Так что из уважения к маминым желаниям я спала в шелковой ночнушке. Шикарней меня просто не было, когда я в полусне заходила в спальню Рут четвертый или пятый раз за ночь, с трудом удерживаяглаза открытыми, мечтая выспаться хоть одну ночь. В течение дня Рут тоже не отпускала меня от себя, так что шанса прилечь подремать не было. Когда сама Рут днем ложилась отдыхать, я спешила закончить работу по дому. Даже сидя на горшке, она хотела общаться. После многих лет жизни в одиночестве Рут буквально купалась в моем внимании. Я тоже получала удовольствие от нашей дружбы,не считая необходимости в три часа утра слушать как Рут, восседая на горшке, рассказывает, какие чашки и блюдца были у нее на каком-то званом ужине тридцать лет назад. Рут рассказывала мне о годах, прожитых у залива, и о том, как девочкой играла у гавани вместе с другими детьми. Лошади таскали повозки по тихим улочкам, развозя молоко и хлеб. По воскресеньям в церковь все надевали свою самую нарядную одежду. Рут рассказывала о том, как ее дети были маленькими, и о своем давно покойном муже. Ее дочь Хезер, которая мне очень нравилась, заглядывала к нам каждые пару дней, и ее визит всегда был как глоток свежего воздуха. Сын Рут со своей семьей жил за городом, и, если бы Хезер о нем не упоминала, легко было бы забыть о его существовании. Он не принимал большого участия в жизни своей матери. Хезер больше всех поддерживала Рут после смерти мужа. Пожилой брат Рут, Джеймс, тоже помогал. Он жил в паре километров от нас и каждый день приходил в гости, всегда водно и то же время и в одном и том же свитере. По нему можно было проверять часы. Джеймсу было уже восемьдесят восемь лет, он никогда не был женат. Голова у него была идеально ясной, а характер – мягким и приятным, и я с удовольствием общалась с ним и любовалась простотой его жизни. Время шло, Рут все не становилось лучше, и спустя месяц она по-прежнему лежала в кровати. После очередных анализов мне сообщили, что она умирает. Я шла к гавани со слезами на глазах, как во сне. На мелководье плескались дети. Пешеходный мостик над заливом покачивался под ногами счастливых людей. Мимо шли паромы, двигаясь к Круглому причалу. Смеялись люди, устроившие пикник на берегу. Все казалось мне нереальным. Я села почти у самой воды, прислонившись спиной к скале из песчаника, и посмотрела на безупречно синее небо. Стоял прекрасный зимний день, светило ласковое теплое солнце. Зима в Сиднее не похожа на европейские зимы, там никогда не бывает по-настоящему холодно, так что на мне была только легкая куртка. Я очень привязалась к Рут, и от мысли о ее смерти и о том, как больно мне будет ее потерять, хотелось плакать. Моей первой реакцией был шок от предстоящего расставания. Слезы текли по щекам, а мимо проплывала яхта, полная счастливых и здоровых людей. В этот момент до меня наконец дошло, что я буду ухаживать за Рут до самого конца. Я выросла на животноводческой ферме и видела много умирающих и мертвых животных. Ничего нового в этом зрелище не было, хотя оно каждый раз меня расстраивало. Но общество, в котором я жила, современное западное общество, старалось по возможности оберегать нас от лицезрения мертвых тел. В некоторых культурах человеческая смерть – очевидная и привычная составляющая жизни. Но наше общество за семью замками держит смерть, практически отрицая ее. Вот почему умирающий человек, его семья и друзья оказываются совершенно не подготовленными к неизбежному. Мы все умрем, но вместо того чтобы признать смерть, стремимся скрыть ее. Как будто убеждаем себя, что поговорка «с глаз долой – из сердца вон» действительно сработает. Но она не срабатывает. Мы лишь все сильнее утверждаемся в жизни через материальную сферу и загоняем страх в глубину себя. Если бы мы честно и заблаговременно приняли неизбежное, то сумели бы изменить приоритеты, пока не поздно, направить усилия на то, что в жизни действительно ценно. Признав, что наше время на земле не бесконечно – даже если мы не уверены, сколько нам осталось: годы, недели или часы, – мы меньше волновались бы о том, что подумают о нас другие, и реже поддавались бы на провокации своего эго. Мы чаще прислушивались бы к сердцу: чего на самом деле оно хочет. Признание своей неминуемой смерти дает нам куда больше возможностей обрести смысл жизни и счастье в оставшийся срок. Со временем я осознала, сколько вреда причиняет нашему обществу отрицание смерти. Но в тот солнечный зимний день оно просто застало меня врасплох: я совсем не думала о том, что мне, сиделке Рут, предстоит пережить ее. Прислонившись затылком к скале, я молилась, чтобы мне хватило сил. И в детстве, и во взрослой жизни я уже испыталанемало трудностей и верила, что не оказалась бы в этой ситуации, если бы не была для нее достаточно сильной. Но мою личную печаль и боль это не облегчало. Так я сидела на солнышке, роняя слезы, и знала, что мне предстоит довести свою работу до конца и сделать последние недели Рут как можно более счастливыми и удобными.Я просидела у воды довольно долго, размышляя о жизни и о том, что близкая смерть Рут застала меня врасплох. Но я чувствовала, что мне есть чем с ней поделиться и что ядолжна это сделать. По пути домой я окончательно укрепилась в своем мнении: я сделаю для Рут абсолютно все, что в моих силах, а отсыпаться буду потом. Позже в тот день к нам заглянул мой начальник. Я объяснила, что никогда не видела мертвого человека и тем более не ухаживала за умирающими, но мои слова влетели ему в одно ухо и вылетели из другого. «Семья тебя обожает. У тебя все получится». Мне ничего не оставалось, кроме как согласиться, что у меня все получится. С этого момента состояние Рут начало быстро ухудшаться. В выходные меня подменяли другие сиделки, и по мере того как потребности Рут росли, меня освободили и от ночных дежурств. Другие сиделки все равно постоянно мне звонили, но, во всяком случае, теперь я смогла спать по ночам. Дни все еще проходили хорошо. Как правило, мы с Рут проводили их вдвоем. Район, где стоял дом, был тихим, лишь изредка до нас доносился смех из ближайшего парка. Нас навещала Хезер, а также Джеймс и разные медицинские работники. Я научилась у них очень многому и стремительно росла профессионально, даже не осознавая этого. Я просто делала все, что от меня требовалось, и в процессе задавала множество вопросов. Однажды утром я собиралась уезжать на выходные в город, повидать двоюродного брата и немного отвлечься от тяжести происходящего. Меня остановил запах из спальни. Ночная сиделка его либо не заметила, либо не захотела замечать, оставив уборку дневной сиделке, которая вот-вот должна была прийти. В следующие годы я часто такое видела. Ни за что на свете я не оставила бы свою любимую подругу лежать в грязи ни минуты. Ее кишечник полностью опорожнился. Рут лежала в кровати обмякшая и только тихо постанывала. Ее внутренние органы понемногу отказывали. Ночная сиделка неохотно оторвалась от глянцевого журнала и помогла мне помыть Рут и поменять грязное постельное белье. Большим облегчением стало появление дневной сиделки, которая все бросила и энергично стала нам помогать. Мы устроили обессилевшую Рут в чистой постели, и очень скоро она уже глубоко спала. Позже я сидела и болтала с братом, но сердце мое было дома, с Рут. Я была благодарна брату за легкую, веселую обстановку, в какой всегда проходили наши с ним встречи, но понимала, что остаться у него не смогу. Я думала только о Рут и вовсе не была уверена, что она протянет до конца выходных. Я провела в гостях всего несколько часов, когда мне позвонил начальник: сообщил, что Рут перешла в последнюю стадию, и попросил меня приехать. Домой я вернулась уже затемно. Мрачное настроение, царившее в доме, ощущалось еще с улицы. При Рут были Хезер с мужем и новая ночная сиделка, которая только что приехала, – приятная ирландка. Хезер спросила, не буду ли я против, если она уедет. Я мягко ответила, что пусть поступает так, как для нее будет лучше. Она отправилась домой. После ее отъезда мне сначала было сложно справиться с собой и не осуждать ее. Если бы умирала моя мама, я бы горы сдвинула, чтобы быть с ней рядом. Говорят, что в основе любого действия, любой эмоции или мысли лежит либо страх, либо любовь. Я решила, что Хезер поддалась страху, и почувствовала к ней сострадание и любовь. С самого начала нашего знакомства она казалась мне очень практичным и довольно сдержанным человеком. Но сейчас я оказалась в незнакомой ситуации. Я не хотела, чтобы мои собственные убеждения встали между мной и человеком, который стал мне дорог, только потому, что он ведет себя иначе, чем я. Сидя в полутемной комнате с Эрин, второй сиделкой, я сумела внутренне принять поступок Хезер и отнестись к нему с уважением. Она сделала то, что должна была сделать,и ей не в чем было себя упрекнуть. Десятилетиями она ухаживала за матерью с той же отдачей, что и за собственной семьей. Она была полностью опустошена – физически и эмоционально. Сделав все возможное, она хотела запомнить свою маму мирно спящей. Я улыбнулась, решив, что поняла Хезер. Однако в следующие несколько дней в разговоре с Хезер я выяснила, что все было не так. Рут дала ей понять, что ей нужно уйти – Хезер знала свою мать достаточно хорошо, чтобы считывать ее желания. Так что она ушла из любви, а вовсе не из страха. В следующие несколько лет подобные ситуации мне встречались еще не раз. Не каждый умирающий человек хотел, чтобы семья была рядом до последнего. Многие прощались с родными, пока были в сознании, и предпочитали, чтобы в последний путь их проводили сиделки. Мы с Эрин негромко болтали в комнате Рут; в воздухе ощущалось присутствие смерти. Эрин рассказывала, что у нее дома принято было собираться у постели умирающего всей семьей. Дяди, тети, двоюродные братья и сестры, дети и даже соседи – все приходили проститься и проводить человека в последний путь. Наша беседа то и дело прерывалась долгими паузами. Мы обе смотрели на Рут и ждали. Ночь была невероятно тихой. Я молча посылала Рут всю любовь, какая была у меня в сердце. Мне повезло, что рядом была именно Эрин, потому что ей было не все равно. Она от природы была неравнодушным человеком. – Она открыла глаза, – вдруг сказала Эрин удивленно. До этого Рут пребывала в полукоматозном состоянии. – Она смотрит на тебя. Я пододвинулась к кровати и взяла Рут за руку. – Я здесь, милая. Все хорошо. Она посмотрела мне прямо в глаза, и через секунду ее дух начал покидать тело. Оно некоторое время тряслось, затем успокоилось. У меня по щекам градом полились слезы. Про себя я от всего сердца поблагодарила Рут за наше время вместе, сказала ей, что я люблю ее, и пожелала ей хорошего путешествия. Это был трепетный момент, полный тишины и любви. Стоя в полутемной комнате, я думала о том, каким благословением было время, проведенное с Рут. И вдруг ее тело сделало еще один глубокий вдох. У меня чуть сердце не выпрыгнуло из груди. – Ничего себе! – сказала я Эрин. Она засмеялась: – Бронни, это совершенно нормально. Так часто бывает. – Ну спасибо, что предупредила, – ответила я, уже улыбаясь, но все еще в шоке. Сердце колотилось, как безумное, и вся благоговейность момента улетучилась. С опаскойя вновь приблизилась к кровати. – Это еще повторится? – шепотом спросила я. – Может. Мы еще минуту-другую молча подождали, почти не дыша. – Она умерла, Эрин. Я чувствую, что она умерла, – сказала я наконец. – Господи, благослови, – пробормотали мы хором. Пододвинув стулья к кровати, мы еще немного посидели около Рут в благоговейном молчании, полном любви и уважения. Мне нужно было успокоиться после пережитого испуга. Хезер и мой начальник просили позвонить им, когда все случится. Я позвонила. Было около полтретьего утра. Накануне мне также объяснили, что нужно делать дальше, поэтому я вызвала врача, чтобы тот выписал свидетельство о смерти. После этого я позвонила в похоронное агентство. Мы с Эрин сидели на кухне, пока тело Рут не увезли – как раз начало светать. За эти часы мы обе не раз заходили проверить, как она там. Хотя она покинула свое тело, мы все еще чувствовали обязанность заботиться о нем. Мне было неприятно, что она лежит в комнате совсем одна. В этой странной, темной ночи ее смерти было что-то особенное. В доме воцарилась ощутимая пустота. На следующий день семья Рут предложила мне остаться пожить в ее доме. До вступления в наследство могут пройти месяцы, сказала Хезер, и она предпочла бы, чтобы дом непустовал. Так что я еще некоторое время пожила в доме Рут, что в тот момент для меня было настоящим подарком. Я поняла, что круглосуточная работа сиделкой с проживанием мне не подходит. Я никогда ничего не делаю вполсилы, и теперь мне стало ясно, что от будущих пациентов мне каждый вечер нужно будет уходить домой, отдыхать и восстанавливаться между сменами. Работать сиделкой оказалось куда изнурительней, чем компаньонкой. В следующие несколько месяцев я наблюдала за тем, как Хезер освобождает дом от вещей, и сама помогала ей. Физический мир Рут разбирался на части по одной вещи за раз– как случается с любым человеком. Я так долго вела кочевой образ жизни, что все еще не хотела обрастать вещами, поэтому отказалась от многих вещей, которые от чистого сердца предлагала мне Хезер. Это были всего лишь вещи, и, хотя они принадлежали моей подруге, я знала, что память о Рут и без них будет жить в моем сердце. В итоге мне все же полюбились две антикварные лампы, которые я бережно храню и сегодня. Новые владельцы снесли старый дом и построили на его месте новое, современное здание из бетона. Старая плюмерия, которая десятилетиями наполняла дом сладким ароматом «Франжипани», была в мгновение ока уничтожена, а на ее месте появился бассейн. Мне пришло приглашение на новоселье. Новым хозяевам не нравилось, что в саду живут пауки и все оплетено паутиной. Я и Рут любили сидеть на террасе, любуясь, как паук-золотопряд прядет такую прочную паутину, что ее можно приподнять, чтобы пройти под ней, и она не рвется. Нам обеим это казалось настоящим чудом. Стоя возле бассейна, глядя на новые модные растения, заменившие старый любимый сад, я с радостью заметила, что на одном из новых кустов прядет свою паутину паук-золотопряд. Я мысленно послала Рут любовь, зная, что в этот день она по-своему передала мне привет. Ее дома больше не было, но дух ее был со мной. Я поблагодарила новых владельцевза приглашение, немного поболтала с ними и пошла к гавани. Усевшись там же, где я сидела в тот день, когда получила печальную новость о болезни Рут, я поблагодарила ее за все, что мы с ней пережили вместе, и за все, чему я научилась за наше знакомство. Взявшись за эту работу, я получила куда больше, чем бесплатную крышу над головой. Передо мной разворачивался новый счастливый день, и я благодарно улыбалась. А Рут, направив мой взгляд в сторону паука в своем саду, тоже как будто улыбнулась мне в ответ. Честность и принятие После смерти Рут у меня некоторое время не было постоянных пациентов, и я подменяла других сиделок. Пересменка была единственной возможностью с кем-то познакомиться и пообщаться. Во время долгих двенадцатичасовых смен единственным моим кругом общения были пациенты, их семья и приходящие на дом медицинские работники. От этого любые отношения становились особенно личными. Такой график также позволял мне время от времени читать, писать, заниматься медитацией или йогой. Многие сиделки лезли на стену от количества времени, проводимого наедине с собой. Нередко, приходя в дом еще до завтрака, я заставала там включенный телевизор. Но самой мне нравилось одиночество, и долгие часы молчания меня не раздражали. Даже если вокруг находились люди, присутствие в доме умирающего человека обычно создавало тихую, спокойную обстановку. Так было и в доме Стеллы, утопающем в зелени. Дело заключалось не только в том, что Стелла находилась при смерти: они с мужем вообще были мягкими, спокойными людьми. У Стеллы оказались длинные седые волосы. Впервые увидев ее, я подумала, что она очень элегантна, хотя она и лежала в постели больная. Ее муж Джордж, красивый пожилой мужчина, отнесся ко мне с сердечным гостеприимством. Необходимость принять, что член семьи умирает, – само по себе огромное жизненное испытание. Но когда этот человек достигает стадии, на которой ему нужен круглосуточный уход, от привычной жизни семьи не остается и следа. Личная жизнь Стеллы и Джорджа, времена, когда в доме не было никого, кроме них, – все это ушло навсегда. Сиделки приходили и уходили, сменяя друг друга утром и вечером. Одни появлялись регулярно, а другие только раз-другой между собственными постоянными пациентами. Поэтому семье беспрестанно приходилось иметь дело с новыми лицами, новыми характерами и разными методами работы. Очень скоро, впрочем, я стала для Стеллы постоянной дневной сиделкой. К нам также заглядывали дежурная медсестра и врач, специалист по паллиативному уходу. После Рут начальница осталась мной очень довольна и предложила мне обучение паллиативному уходу, если мне нравится эта область. Я согласилась, потому что чувствовала, что в данный момент жизнь подталкивает меня в этом направлении. Все, чему я научилась благодаря Рут, оказало на меня глубокое воздействие, вызвав желание расти и развиваться в этой области. Мое обучение свелось к двум семинарам. На одном нам объясняли, как правильно мыть руки. На втором очень коротко показали разные техники для подъема клиентов. Примерно на этом и закончилось мое формальное обучение. Затем меня отправили к Стелле, предупредив не рассказывать ей, что до нее у меня была только одна паллиативная клиентка. Начальница считала, что я справлюсь, и я была с ней согласна. Я никогда не умела врать. Но когда семья Стеллы стала задавать вопросы о моем опыте, я соврала, потому что мне очень нужна была работа. Вот-вот должны были принять новый закон об обязательных квалификациях для сиделок, а у меня этих квалификаций не было. Впрочем, хотя я ничем не могла доказать свои умения, я знала, что справлюсь с этой работой, потому что у меня были главные необходимые качества: доброта и интуиция. Так что на прямой вопрос я соврала, сказав, что у меня было больше клиентов, чемна самом деле. Эта ложь далась мне с таким трудом, что больше я никогда не врала про свой опыт. Стелла очень ценила чистоту, поэтому ей каждый день требовалось новое постельное белье. У нее также было развито чувство стиля, поэтому ночная рубашка на ней должна была цветом или узором сочетаться с постельным бельем. Джордж однажды признался мне, смеясь, что получил выговор за постельное белье, которое не сочеталось с выбранной Стеллой рубашкой. Я ответила ему то же, что потом много раз повторяла семьям своих пациентов: «Что угодно, лишь бы она была счастлива». Лежа в своей тщательно подобранной ночной рубашке, эта высокая элегантная женщина решилась задать мне личный вопрос. – Вы медитируете? – спросила она. – Да, – ответила я охотно. Такого вопроса я не ожидала. – А йогой вы занимаетесь? – продолжила Стелла. – Занимаюсь, – сказала я, – но не так много, как хотелось бы. – А медитируете вы каждый день? – Да, дважды в день. Я не смогла сдержать улыбки, когда Стелла кротко произнесла: – Слава богу. Я сто лет вас ждала. Теперь я могу умереть. Стелла сорок лет проработала инструктором по йоге – она вступила на этот путь задолго до того, как йога стала популярна на западе. В те времена йога еще считалась какой-то восточной странностью. Стелла несколько раз была в Индии и строго придерживалась выбранного пути. В самом начале, когда йога еще считалась экзотическим занятием, Стелла называла себя инструктором по физкультуре, а не инструктором по йоге. Но по мере того как общество развивалось, она перестала скрываться и обучила многих людей искусству и мудрости этого пути. Муж Стеллы был на пенсии, но по-прежнему работал из дома. Мне нравилось, как он мирно копошится в своих бумагах. Их домашняя библиотека ломилась от духовной литературы. Многие из этих книг я уже читала, но многие только собиралась прочитать. Это была настоящая сокровищница знаний, особенно для человека, интересующегося философией, психологией и духовностью, как я. Я глотала книги одну за другой. Стелла время от времени просыпалась, спрашивала, какую книгу я читаю и на каком месте, и комментировала текст. Она прекрасно помнила каждую книгу. Когда ей хватало энергии поговорить со мной подольше, что, к сожалению, бывало редко, речь всегда шла о философии. Мы во многом с ней сходились, и образ мышления у нас был довольно близкий. Кроме того, я сильно выросла в йоге. Я больше не пряталась, чтобы позаниматься, и даже не уходила в другую комнату. Дверь в спальню Стеллы никогда не закрывалась, такчто в комнате всегда был свежий воздух. Заниматься там было очень приятно. Белый кот Стеллы по имени Йог лежал на краешке ее кровати и наблюдал за мной. После обеда весь район замирал, поэтому я чаще всего проводила это время за растяжкой и дыхательными упражнениями. Особенно меня радовало, когда Стелла просыпалась и перед тем,как снова уснуть, комментировала то, что я делаю, советовала, как улучшить позу, или предлагала попробовать другую, более сложную. К тому времени я занималась йогой около пяти лет. Моя практика началась во Фримантле, пригороде Перта, еще в Западной Австралии. Дважды в неделю я садилась на велосипед и ехала через пару соседних городков во Фримантл. Моего учителя звали Кейл, и он замечательно ввел меня в мир йоги. Сам он занялся йогой уже в очень зрелом возрасте, после того как повредил спину. Оказывается, у жизни были на него большие планы, и так он обрел свое призвание – к радости множества преданных учеников. Когда мы с Дином уехали из Перта, жизнь на некоторое время стала сумбурной, но йога не переставала меня манить. Где бы я ни жила, я находила занятия и пробовала их посещать. Правда, у меня никак не получалось найти инструктора, который заменил бы мне Кейла. Его просто не существовало в природе. Занимаясь в спальне у Стеллы, я начала понимать, что моя практика до сих пор была неполноценной, потому что я все время пыталась установить связь с учителем, а не с собой. Благодаря советам Стеллы я исправила эту ошибку навсегда. С тех пор я с удовольствием хожу к любому инструктору, потому что занятия в группе подталкивают меня выкладываться чуть сильнее, чем дома. К тому же это оказался превосходный способ знакомиться с близкими по духу людьми. Но как бы там ни было, я неизменно продолжаю заниматься дома: практика – это лучший учитель. Стелла по-настоящему изменила жизнь своей последней ученицы. Больше всего ее расстраивало, что она никак не может умереть, хотя давно готова к этому. Я приходила утром и спрашивала, как она себя чувствует. «А вы как думаете? – отвечала она. – Я все еще жива, хотя и не хочу этого». Она также больше не могла медитировать. После многих лет строгой умственной дисциплины Стелла думала, что перед смертью, перед возвращением домой, практика будет естественной и непринужденной. Она даже думала, что ее медитация станет глубже. Но глубже становилась только моя практика. Каждый день после обеда, когда она засыпала, я садилась медитировать. – Вам так повезло, – говорила мне Стелла. – А я в полной фрустрации. Не могу медитировать и не могу умереть. – Может быть, вы живы ради моего блага. Может быть, мне еще чему-то нужно у вас научиться, и поэтому ваше время пока не пришло, – предположила я однажды. Она обрадованно кивнула: – Это я могу принять. Как часто бывает при общении двух людей, мы обе учились друг у друга. После того как мы обсудили тему принятия, Стелле удалось обрести чуть больший душевный покой. Ясидела у ее кровати и говорила о прошлом, об умении отпускать и прощаться, а она с интересом слушала. На протяжении многих лет я жила от одного прыжка в неизвестность до другого. Я рассказала Стелле, как когда-то отправилась на юг, не имея за душой ничего, кроме полного бака бензина, пятидесяти долларов и намерения перебраться на зиму в место попрохладней. Я наметила себе в качестве цели городок на дальнем южном побережье Нового Южного Уэльса и поехала примерно в его направлении. По пути я останавливалась у друзей и иногда немного подрабатывала, чтобы иметь возможность продолжать путешествовать. Поскольку я всегда была склонна к перемене обстановки, у меня были друзья по всей стране, и было большой радостью вновь с ними увидеться – с некоторыми мы не встречались почти десять лет! Наконец, я добралась до городка, куда хотела попасть, но денег у меня почти не осталось. Лучший вид на город и на величественный Тихий океан открывался с платной стоянки для туристических автофургонов. Там-то я и остановилась на ночь. Заднего сиденья вмоем стареньком джипе не было: на его место я постелила матрас. Перед тем как отправиться в путь, я раздвигала занавески на окнах – больше ничего не требовалось, можно было ехать куда угодно. Я искала работу, и сначала мне ничего не попадалось. Но на улице стояла осень, мое любимое время года, поэтому пару дней я просто наслаждалась погодой и много гуляла. Вскоре я поняла, что больше не смогу оплачивать свое место на стоянке. Деньги заканчивались, да и стоянка мне нужна была, только чтобы мыться и как временная база, пока я не заведу знакомств в городе. Так что я запаслась едой и отправилась в буш, следуя указателям, которые вели к ближайшей речке. Мне уже приходилось действовать наудачу, и я знала, что мне снова придется встретиться со своими страхами лицом к лицу. Чтобы претворить задуманное в жизнь при помощи одной лишь веры, нужно не мешатьсебе негативными мыслями, а это всегда самое сложное. А нездоровые мысли у меня возникали – как результат воспитания и общественного неприятия моего образа жизни. Я вновь задумалась, как свести концы с концами, и мне стало не по себе. Единственное, что всегда выручало меня в подобной ситуации, – сосредоточиться на настоящем, и именно это спасло меня и сейчас. К тому же нет лучше места для борьбы со своими страхами, чем на природе, где можно вернуться к истинному ритму жизни. Когда страхи не тревожили меня, я превосходно проводила время, следуя здоровому и несложному графику дня: ела простую и питательную еду, плавала в кристально чистой реке, наблюдала за любопытными дикими животными, слушала пение птиц и читала. Мои дни были наполнены благоговением и красотой, и казалось, что время тянется бесконечно. Почти две недели я не видела ни одного человека. День, когда я столкнулась с людьми, выдался приятным. Это была семья, приехавшая к реке на пикник: целых три поколения. Так я поняла, что наступили выходные. Я оставила джип открытым и ушла на долгую прогулку в буш, предоставив гостям наслаждаться одиночеством. Ранним вечером я лежала в джипе – багажник и окна все еще были открыты настежь – и читала. Волшебный свет сумерек узорно просачивался сквозь ветви деревьев. Семейство уже собиралось уезжать, когда от группы оторвалась женщина примерно моего возраста, мать двоих детей, и тихо подошла ко мне. Ее муж, родители и дети в это время садились в машину. Она заглянула в окно джипа, застигнув меня врасплох. Я подняла голову от книги и улыбнулась. Она прошептала: «Завидую твоей свободе». Мы обе рассмеялись, и она ушла, ничего больше не сказав и не дав мне времени ответить. Той ночью я лежала в джипе с открытыми окнами, в компании поющих у реки лягушек и полного звезд неба, и улыбалась, думая об этой женщине. Она была права. Я была свободней некуда. Денег и еды у меня оставалось в обрез, но прямо сейчас я была так свободна, как только может быть человек. С тех пор меня часто спрашивали про мои вылазки в буш и про поездки по всей стране. Многие хотели знать, не было ли мне страшно путешествовать в одиночку. Я всегда отвечала, что нет, и как правило, я чувствовала себя в полной безопасности. Изредка случались потенциально неприятные ситуации, как когда-то во время поездки автостопом. Но я выходила из них невредимой и больше никогда не повторяла своих ошибок. Каждый мой шаг был интуитивным, и я старалась как можно чаще двигаться вперед с доверием в сердце, зная, что за мной присматривают высшие силы. Впрочем, люди – социальные существа, поэтому вскоре я вновь вернулась в город. Я позвонила маме, с которой у нас всегда была очень тесная и здоровая связь. Как мать она не могла не волноваться за мое благополучие, но сердцем понимала, что кочевой образ жизни присущ мне от природы. Она не осуждала меня, но всегда успокаивалась, услышав мой голос в трубке. Накануне она потратила два доллара на лотерейный билет, надеясь выиграть для меня денег. От природы моя мама настолько щедрый человек, что жизнь ее благословила, и она действительно выиграла. «Ты и без денег так много мне даешь, – сказала она. – Я настаиваю, чтобы ты взяла эти деньги. Все равно они мне достались только потому, что я задумала тебе помочь». С благодарностью я приняла мамин подарок – теперь мне было на что жить следующие пару недель. На следующее утро я проснулась в джипе на платной стоянке и отправилась к скалам, чтобы полюбоваться восходом солнца над океаном. Я обожаю момент, когда над горизонтом появляются первые солнечные лучи, над головой еще светят звезды, но новый день уже начинается. Небо порозовело, затем сделалось оранжевым, а я сидела на камнях и смотрела, как мимо плывут игривые дельфины, выпрыгивая из воды от чистой радости жизни. В тот момент я почувствовала, что все обязательно сложится наилучшим образом. Чуть позже я долго, с удовольствием болтала о жизни и путешествиях с хозяином стоянки. После этого разговора он ушел, но вскоре вернулся с ключом в руках. – Мне еще десять дней не понадобится фургон номер восемь. Он твой, и не вздумай предлагать мне деньги. Если бы моя дочь жила в машине, я надеюсь, ей бы тоже кто-нибудь помог, – объявил Тед. – Спасибо, Тед, благослови вас Бог, – сказала я, борясь со слезами благодарности. Так на следующие десять дней у меня появилась крыша над головой и возможность готовить себе еду. Но теперь я тревожилась уже всерьез. Мне срочно нужно было заработать денег. Запасы еды убывали на глазах. Каждый день я обивала пороги в городе и познакомилась со многими прекрасными людьми, но работы мне не предлагали. Возвращаясь на мыс, где располагалась стоянка, я глубоко дышала, стараясь не терять концентрации на настоящем, но лихорадочно пытаясь найти выход из положения. Я ненавидела эту сторону своей жизни – непреодолимое желание раз за разом бросать насиженное место и ставить себя в максимально сложное положение. Но одновременно с этим я не могла от нее отказаться: каждый раз, отправляясь в путь, я вступала в схватку со своими страхами, и каждый раз неизменно выходила сухой из воды. В некотором смысле каждый прыжок в неизвестность давался мне тяжелее предыдущего, потому что я продвигалась все ближе к самой сердцевине своих тайных страхов. Но каждый прыжок становился одновременно и легче. Многократно испытав свою веру на прочность, я стала намного мудрее и увереннее в себе. Кроме того, в такой жизни я видела гораздо больше смысла, даже если временами она была трудноватой. В традиционный образ жизни, принятый в обществе, я при всем желании не вписывалась. Наблюдая, как прилив понемногу превращается в отлив, я вспомнила, как важно принять происходящее и, отпустив вожжи, позволить природе творить свое волшебство. Та же сила, что безупречно уравновешивает приливы и отливы, что заведует сменой времен года и порождает все живое, обязательно даст мне выход из ситуации. Но сначала нужно расслабиться. Пытаться контролировать события – пустая трата сил. Я уже сформировала намерения и предприняла все возможные действия для их реализации. Теперь мне оставалось только не мешать событиям идти своим чередом. Я даже рассмеялась тому, что ухитрилась забыть об этом, ведь этот урок я усвоила давным-давно. Когда ты оказался на самом конце тонкой, гнущейся ветки, можно только расслабиться, разжать руки и смотреть, куда приземлишься. Настало время вновь разжать руки. Принять события такими, какие они есть, вовсе не означает сдаться – совсем наоборот. Чтобы принять настоящее, требуется бесконечное мужество. Часто нам удается это сделать только тогда, когда пытаться контролировать события становитсяневыносимо больно. Это неприятный, но в каком-то смысле освобождающий момент. Признав, что мы больше ничего не можем сделать, только довериться высшим силам, мы наконец впускаем эти силы в свою жизнь. Следующим утром на восходе я спустилась по камням к воде, где дельфины, играя, вновь приветствовали меня. После вечернего приступа страха, боли и сопротивления, который вынудил меня принять, что я больше ничего не могу сделать, я была выжата, как лимон, полностью опустошена эмоционально. Глядя на дельфинов, я впитывала в себя новый рассвет, медленно, осторожно позволяя надежде подзарядить мои батарейки. Несколько дней спустя в случайном разговоре с людьми на стоянке автофургонов мне предложили работу в Мельбурне – в еще семи или восьми часах езды на юг. «Почему быи нет?» – подумала я. Ничто не мешало мне ехать куда угодно, к тому же я как раз хотела перебраться в место попрохладнее. Вскоре Мельбурну предстояло навсегда превратиться в мой самый любимый город во всей Австралии. Но в тот момент я и не думала туда переезжать и даже не представляла, как полезно мне будет оказаться в таком творческом городе. Только после того как я приняла ситуацию, признав, что не могу больше ее контролировать, поступило предложение о работе. Я закончила рассказывать эту историю Стелле, и мы обе улыбнулись. Она медленно ела свою половину ягодки клубники, соглашаясь со мной. Она пыталась контролировать время своего ухода из жизни. Пришла пора отказаться от этого контроля и принять, что ей еще немного придется пожить, даже если ей это не по душе. На формирование тела уходит девять месяцев. На завершение его существования тоже иногда требуется какое-то время. Впрочем, Стелла уже совсем ослабла и почти ничего не ела. У нее не было сил, чтобы есть, но она клала в рот маленькие кусочки фруктов, просто чтобы ощутить их вкус. Вчера это были две виноградины. Сегодня полклубники. Болезнь Стеллы должна была причинять ей сильные боли, особенно с учетом того, как поздно ее диагностировали. Но боли, к удивлению врача, ее почти не беспокоили. По мере распространения болезни Стелла чувствовала в основном потерю сил. Многолетняя духовная работа помогла ей установить очень прочную связь со своим телом, и теперь она угасала почти безболезненно. Когда пришло время, эта связь также помогла ей с легкостью отойти в мир иной. Однажды я заметила, что руки Стеллы сильно распухли, и обручальное кольцо буквально впивается в палец. Я побоялась, что оно нарушит циркуляцию в тканях, и позвонилана работу. Мне порекомендовали его снять. Джордж лежал рядом со Стеллой на кровати, а я намыливала ей палец, пытаясь аккуратно снять кольцо. Мне долго это не удавалось, и пока я билась над кольцом, и Стелла, и Джордж расплакались. Я и сама плакала, когда, наконец, сняла с пальца Стеллы символ их более чем полувековой любви. Джордж, нежный, как всегда, назвал Стеллу особым домашним прозвищем, которым называл много лет. Я вышла из комнаты, чтобы они смогли провести немного времени наедине и обняться – возможно, в последний раз в жизни. Стоя в ванной, заливаясь слезами, я чувствовала, какое это благословение – встретиться с такой глубокой любовью. Никогда еще я не встречала подобной пары. Стелла и Джордж были лучшими друзьями и со всеми, особенно друг с другом, обращались с лаской и заботой. Было невероятно грустно смотреть, как они плакали, когда я навсегда снимала обручальное кольцо с пальца Стеллы. Их сын и дочери регулярно заходили в гости, особенно теперь, когда время Стеллы было на исходе. Все они мне нравились. Совсем не похожие друг на друга, все трое были очень честными и приятными людьми. Особенно я сблизилась с одной из дочерей. Однажды случились внезапные заморозки, и я оказалась на работе недостаточно тепло одетой. Джордж настоял, чтобы я надела одну из вязаных кофт Стеллы. Они оба согласились, что эта кофта мне очень идет. В магазине я бы прошла мимо, не обратив на нее внимания, потому что она не вписывалась в мой стиль. Но надев ее, я моментально в нее влюбилась. В тот день семья подарила мне эту кофту, и я все еще ношу ее много лет спустя. У нашей Стеллы было отменное чувство стиля. В ту ночь она впала в кóму, пока я спала у себя дома. На следующее утро я приехала на работу и обнаружила дом в торжественной тишине. Кроме Джорджа и Стеллы дома был Дэвид, их сын. Через открытую дверь спальни в комнату задувал легкий ветерок, а Джордж лежал на кровати рядом со своей красавицей-женой. Он держал в руках ее руку, которая быстро остывала. Стелла была еще жива, но с приближением смерти кровообращение в конечностях постепенно слабеет. Ее ноги тоже совсем остыли. Дэвид сидел рядом на стуле, держа Стеллу за вторую руку. Я села на стул у изножья кровати, положив руку ей на ногу. Мне просто хотелось тоже к ней прикоснуться. Более двенадцати часов пролежав в глубокой коме, Стелла открыла глаза и улыбнулась чему-то, глядя в потолок. Джордж сел. «Она улыбается! – воскликнул он удивленно. – Она чему-то улыбается». Стелла больше нас не видела и не слышала. Но эта улыбка, адресованная чему-то или кому-то невидимому, навсегда закрепила во мне веру в жизнь после смерти. Благодаря опыту медитации я уже попадала в полные блаженства миры, не принадлежащие обычному человеческому миру, так что и раньше не сомневалась в загробной жизни. Но глядя, скакой счастливой улыбкой Стелла улыбается потолку, я окончательно поняла, что никогда не откажусь от этого убеждения. После смерти мы все куда-то отправляемся – или возвращаемся. Улыбнувшись, Стелла чуть вздохнула, затем глаза ее закатились, и она затихла. Джордж и Дэвид вопросительно обернулись ко мне. До сих пор я видела только одну смерть и теперь ждала последнего вздоха, но он не приходил. «Она умерла?» – повторяли они с отчаянием. Я попыталась нащупать пульс на шее Стеллы, но мое собственное сердце билось так громко, что кроме него я ничего не чувствовала. Ответственность была громадной, а я понятия не имела, что делать. Джордж и Дэвид продолжали смотреть на меня. Я не хотела объявить, что Стелла мертва, а потом выяснить, что она будет жить еще день или два– или даже что она сделает еще один последний вдох. Я обратилась к Богу, чтобы он направил меня. Внезапно на меня снизошло спокойствие. Я посмотрела на Стеллу, зная, что ее больше нет. Смерть была такой мягкой и легкой, что ее трудно было заметить, но прокатившаяся по мне волна любви подтвердила, что Стелла умерла. Я кивнула, и Джордж с Дэвидом поспешно вышли из комнаты. Слышны были душераздирающие рыдания – это Джордж горевал о потере любимой жены. Я тихо сидела со Стеллой и тоже плакала. Через пару часов, когда в доме собралась вся семья и необходимые формальности были улажены, мы простились. Прохладное утро превратилось в очень жаркий день, и я раздумывала, чем бы себя занять – мне хотелось любой ценой отвлечься от случивш
