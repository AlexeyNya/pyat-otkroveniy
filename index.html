вошел Рой. Я хотела рассмеяться, зная, что Ленни оценил бы юмор ситуации, если бы не спал. Но он спал, и моя слабая улыбка и красные опухшие глаза мгновенно объяснили Рою, что происходит. Ленни мог уже не проснуться. По моим щекам снова покатились слезы. Но это были уже не слезы скорби, а слезы любви, и вскоре я успокоилась. Рой сел с другой стороны кровати. Он открыл Библию и вопросительно посмотрел на меня. Мое лицо говорило: «Поступай как хочешь, но мне кажется, он предпочел бы тишину». Рой кивнул. Открытая Библия осталась лежать у него на коленях, но читать он не стал. В тот момент я испытала к нему огромную любовь и благодарность за уважение к происходящему. Не то чтобы чтение Библии могло испортить момент, но происходящее в комнате уже было настолько священным, что можно было обойтись и без чтения. Ленни потянулся за моей рукой, не открывая глаз. Я встала и взяла его ладонь в свою. Его дыхание сделалось хриплым и неровным. Я ощутила запах, который был мне уже хорошо знаком, хотя его и невозможно описать. Это был запах смерти. Вдруг Ленни открыл глаза, посмотрел прямо на меня и улыбнулся. Но это был уже не мой друг Ленни, которого я узнала и полюбила. Это был Ленни во всем великолепии своейсияющей души. В его улыбке не было и следа болезни. Это была улыбка души, свободной от оков личности. Это была улыбка чистой любви, радостной и лучезарной. Я тоже улыбнулась ему, и мое сердце распахнулось ему навстречу. Мы оба радостно улыбались, зная, что в конце не остается ничего, кроме любви. Никогда в жизни я большене видела такой улыбки и не улыбалась так сама. Это было истинное, ничем не омраченное счастье. Мы улыбались друг другу, лучась от счастья, а время как будто остановилось. Через некоторое время Ленни закрыл глаза. Умиротворенная улыбка продолжала играть у него на губах. Я тоже продолжала улыбаться, переполненная чувствами, не в силах остановиться. Пару минут спустя Ленни не стало. Рой наблюдал эту сцену с другой стороны от Ленни, пораженный до глубины души. Закрыв Библию, он тихо сказал, что понял, как выглядит божья любовь, и что он пережил чудо, увидев покой Ленни перед смертью. Я согласилась, что пути Господни неисповедимы. Мы с Роем еще немного посидели в тишине. Я знала, что чуду придет конец, как только я сообщу о случившемся сотрудникам дома престарелых, и тянула время, но задерживаться было нельзя. Прощаясь, Рой долго держал мою руку в своих, пытаясь подобрать слова, не зная, что сказать или как описать произошедшее. Казалось, что ему не хочетсяменя отпускать, как будто лишившись свидетеля чуда, он лишится и самого чуда. – Нам выпало божие благословение, Рой. Вот все, что нам нужно знать, – сказала я мягко. Он порывисто и крепко обнял меня, как испуганный ребенок, который не хочет оставаться один. – Все будет хорошо, Рой. – Как я объясню людям, что произошло? – умоляюще спросил он. – Может быть, никак, – улыбнулась я. – А может быть, у вас и получится. Та же сила, которая подарила нам это чудо, будет с вами рядом, чтобы подсказать нужные слова. Покачав головой, он с улыбкой произнес: – Моя жизнь уже не будет прежней. Я с любовью улыбнулась ему, и мы вновь обнялись. Закончив с бумажными формальностями, я вышла из дома престарелых. Вокруг Ленни и так суетилась толпа народу, к тому же мы достаточно времени провели вместе. Пробки уже закончились, и мягкий вечерний свет струился сквозь деревья на бульвар, по которому я шла. Мое сердце было открытым и полным радости. Я любила всех и все. Да, у моей работы были свои плюсы и минусы. Но раз за разом она преподносила мне невероятные подарки. Все еще на седьмом небе от той любви, которая мне выпала, я шла по улице, широко улыбаясь, а по щекам текли слезы радости и благодарности. Да, Ленни. Жизнь хороша. Она действительно хороша. Время перемен Я так долго ухаживала за умирающими людьми, что чувствовала себя одновременно счастливой и измученной. Благодаря этой работе моя жизнь изменилась в лучшую сторону, но пришло время для перемен. Я стремилась воплотить в жизнь новый проект для заключенных в женской тюрьме: мне хотелось учить их играть на гитаре и писать песни. Мне предстояло разобраться в куче бюрократических тонкостей, а также в устройстве частного благотворительного сектора – какие фонды могли бы спонсировать мой проект и как правильно подавать заявки. В этом мне помогали несколько женщин, которые вели в тюрьмах театральный кружок. Оказалось, что в свой прошлый приезд в Мельбурн, почти десять лет назад, я жила с ними по соседству, дверь в дверь. Тогда я еще не написала ни одной песни и мне даже в голову не пришло бы преподавать песнетворчество. Но теперь, шагая по знакомой улице к их дому, я чувствовала странную радость, обдумывая, как сильно изменилась моя жизнь и сама я за прошедшее время. В тюрьмах штата Виктория мне не удалось ни о чем договориться, и я решила попытать счастья в Новом Южном Уэльсе. В это время у меня как раз завязались отношения на расстоянии с мужчиной из этого же штата. Мне не казалось, что из этого романа что-то получится, но дистанция в тысячу километров очевидно не помогала отношениям, так что я решила дать нам шанс познакомиться поближе. В Новом Южном Уэльсе также жила моя любимая двоюродная сестра, которая пригласила меня остановиться у нее на первоевремя после переезда. В разработке и осуществлении тюремной музыкальной программы мне больше всего помогала Лиз, взявшая меня под свое крыло. Она настаивала, что можно добиться чего угодно, используя связи и соединяя между собой правильных людей – этот подход помогал не терять мне надежды. Меня также поддерживали слова, которые я часто слышала отпациентов: ничего хорошего нельзя сделать в одиночку. Мы все должны работать вместе. Лиз объяснила, что мне понадобится покровительство благотворительного фонда. Большинство благотворителей хотели переводить мне деньги через уже существующие фонды, чтобы получать налоговые льготы, которыми государство поощряет официальные пожертвования на благотворительность. Они переводили бы деньги в фонд, а фонд уже оплачивал бы мою деятельность. Найти фонд, согласный выступить посредником, оказалось непростой задачей. Удивительным образом после сотен звонков и писем мне наконец удалось заручиться поддержкой христианской благотворительной организации, связанной с моей первой школой! Тридцать пять лет спустя я вновь оказалась в офисе наокраине Сиднея, из окна которого видно было детскую площадку, знакомую мне с первого класса. Пока я разыскивала финансирование, меня также очень сильно поддерживал энтузиазм женщины, отвечавшей за обучение и перевоспитание в выбранной мной тюрьме. Это была прогрессивная, полная энтузиазма женщина, безгранично верившая в мою затею. Вначале я вела переговоры еще с двумя тюрьмами. С одной мы сразу не сошлись – там мне сказали, что не смогут предоставить для занятий даже блокноты и ручки. В другой пообещали достать не только блокноты, но и гитары и вообще все, что я попрошу. Однако пока я работала над программой, стало очевидно, что одного класса и одной тюрьмы будет более чем достаточно. Разумеется, я выбрала ту тюрьму, где работала моя единомышленница. Долгое время проект не двигался с места, но, когда все наконец было готово, развитие пошло с молниеносной скоростью, и за пару дней я собралась и выдвинулась в путь. Примерно месяц я жила со своей двоюродной сестрой и ее большой семьей. После тишины, к которой я привыкла за последние годы, было непривычно и восхитительно вновь оказаться в окружении множества людей. В доме моей кузины уживались три поколения семьи, семь кошек и три собаки, так что обстановка в нем царила довольно безумная. Впрочем, я все еще мечтала о собственной кухне, поэтому съехала, как только мне попался подходящий коттедж. Мой новый домик стоял у подножия Голубых гор, через дорогу от речки и леса, и был хорошенький, как картинка. У меня не было ни мебели, ни кухонной утвари, но меня это не смущало. Коттедж нашелся так легко, что я верила: это судьба. Все необходимое придет ко мне само, решила я – и не ошиблась. На меня буквально повалились вещи. Владельцы хранилища предложили мне предметы, от которых их попросили избавиться: диванчик, постельное белье. Кузина поспрашивала многочисленных друзей, и вот у меня появилась стиральная машинка, холодильник, книжные полки, кухонная утварь, занавески и старинный письменный стол. Незнакомые люди с энтузиазмом делились со мной своими вещами – от чистого сердца, а также слегка заинтригованные моим положением. Это было чудесно. Переехав в Новый Южный Уэльс, я первым делом купила себе фургончик. Хотя план был бросить якорь, я собиралась часто ездить на фолк-фестивали и к тому же скучала по автомобилю, в котором можно с комфортом путешествовать. Я всегда предпочитала спать в машине, а не ставить палатку, кроме того, мне нравилось знать, что я в любой момент могу сорваться с места и отправиться куда угодно. Время для покупки фургона и переезда в коттедж я выбрала самое удачное: стоял месяц, когда в моем новом районе жители избавлялись от ненужных вещей. Люди выставляли ненужную мебель и вещи на улице перед домом, чтобы их могли забрать желающие, прежде чем за ними приедет мусорная машина. Я выискивала в чужих вещахвсе, что могло мне пригодиться, – корзинку для грязного белья, комод, уличный столик – а их прежние владельцы махали мне с террас, улыбаясь и поощряя мои поиски. Так у меня появилось немало стильной мебели. Бывало, что прежние владельцы даже помогали мне загрузить вещи в мой фургончик – в том числе старый, но в отличном состоянии диванчик для моей новой веранды. Я также с огромным удовольствием объездила множество «гаражных» домашних распродаж. Единственное, что мне важно было купить новым, это матрас. Я хотела выбрать комфортный для спины матрас, на котором никто не спал до меня. Одна знакомая, узнав, что я решила осесть после стольких лет скитаний, решила подарить мне деньги на обустройство нового дома. Этой суммы как раз хватило на новый матрас. Итак, три недели назад у меня было шесть коробок вещей, помещавшихся в маленькую машинку, а теперь появился полностью обставленный домик, который выглядел так, будто я живу в нем уже несколько лет. Это было чудесно. В первую ночь в своем новом доме я лежала на новом матрасе прямо на полу в гостиной и улыбалась в потолок. Собственный дом! Наконец-то у меня снова появилось свое пространство. Облегчение, благодарность и радость настолько переполняли меня, что целый месяц меня никто не видел. Я просто не в силах была выйти из дома никуда, кроме работы. Возвращаясь в коттедж, я осматривалась и начинала улыбаться. Хотя мне не удалось собрать всю сумму, я смогла запустить тюремную программу с теми деньгами, которые все же нашлись. Я решила, что по мере развития программы постепенно буду подавать заявки в другие фонды. В любом случае собрать хоть какие-то деньги, сделать свою идею осязаемой реальностью, было уже большим достижением. Поскольку моя работа оплачивалась частными благотворителями, тюремная система ничего мне не платила, и я считалась там волонтером. Руководство тюрьмы одобрило план моего курса. Я продемонстрировала, чему надеюсь научить людей на своих занятиях и чего добиться. Поскольку моя программа не была официально аккредитованной, от меня не требовалось специального образования. Отдел обучения и перевоспитания просто взял и поверил в мои идеи и способности, и мне удалось получить добро на свою программу с минимумом формальностей, что сейчас звучит довольно поразительно. Однако в тот момент мне это казалось само собой разумеющимся. Я просто двигалась к цели шаг за шагом, пока не оказалась, наконец, перед целой толпой преступниц, которых мне предстояло научить писать песни! Я никогда еще никого ничему не учила, и стоять перед целым классом учениц, многие из которых смотрели на меня довольно неприязненно, было любопытно и непривычно. Я могла бы даже занервничать, если бы остановилась и задумалась о происходящем, но я не останавливалась, а просто выполняла свою работу. Вначале мои ученицы просто молча рассматривали меня с каменными лицами, оценивая, но постепенно смягчились. Мы выполняли упражнения на поиск рифмы, и, вместо того, чтобы использовать заготовленные примеры, я начала импровизировать. На ходу сочиняя смешные стишки о нашем уроке, я иронизировала над собой вместе с ученицами.Сижу в душном классе, мне скучно и лень.Она что, так и будет болтать целый день?Но играть на гитаре так хочется мне,Что придется привыкнуть к ее болтовне. В классе послышались смешки, и понемногу некоторые ученицы тоже начали предлагать шутливые рифмы, пока, наконец, все не расслабились.Так давайте, учите нас делу скорей,Потому что стихи нам тут пофиг, ей-ей. Юмор разрядил обстановку, и, как только нам удалось нащупать общую тему, нас было уже не остановить.Понимаю, вы хотите на гитаре играть,Но нельзя упражнения мои пропускать.Очень скоро мы с вами сыграем и споем,И чем быстрее закончим, тем быстрее начнем. В ответ я получила следующее:Ладно, если без рифмы совсем никуда,Упражнения сделаем, ведь они ерунда! Мы продолжали перешучиваться в стихах, и к концу первого занятия в классе стоял веселый смех. Большинство учениц активно участвовали в занятии, и мы от души веселились. Все сотрудники отдела обучения и перевоспитания были добросердечными людьми, и я наслаждалась работой в команде после стольких лет работы один на один с пациентами. Новые коллеги предупредили меня не сближаться чрезмерно с заключенными, и я понимала, что это важно для моей безопасности. Но я все равно хотела быть собой, а в своих ученицах видела не заключенных, а просто женщин, которые учатся играть на гитаре и писать песни. Мне хватало жизненного опыта, чтобы не забывать, где я нахожусь, но я также хотела быть предельно честной. Благодаря моей искренности и вере в каждую ученицу, со временем между нами установилось крепкое доверие. Мы по-женски болтали на разные темы, и я поощряла их проявлять в песнях доброту и уязвимость, чтобы постепенно избавляться от тех эмоциональных барьеров, которые они выстроили вокруг себя для защиты от окружающего мира. Наши занятия стали очень личной и целительной практикой для моих учениц, и работая над развитием программы, я смотрела на нее именно как на психотерапию. При помощи разных писательских упражнений эти женщины учились понемногу высвобождать эмоции и творить с надеждой. Безусловно, на моих занятиях было создано немало песен о боли и страданиях. Но на них писались также и песни о надеждах и мечтах. Однажды я спросила учениц, что бы они сделали, если бы их ничто не ограничивало, если бы им ничто не мешало – ни отсутствие денег, ни расстояния, ни нехватка образования. Впервые за годы они начали прислушиваться к себе и мечтать. Одна хотела свободножить со своими детьми без постоянного контроля государственных служб. Другая сказала, что снялась бы в музыкальном клипе. Третья хотела сделать липосакцию, четвертая мечтала о жизни без побоев и оскорблений, пятая надеялась навсегда освободиться от наркотической зависимости, а шестая хотела отправиться на небо и сказать маме, что любит ее. Откровенность на наших занятиях зашкаливала, и редкий урок обходился без слез. Но мы договорились, что мой класс будет безопасной зоной, где все поддерживают и берегут друг друга, что бы ни происходило. Поэтому женщины, которые раньше не ладили друг с другом, постепенно научились терпеть, а затем и поддерживать друг друга. Однаженщина отказалась даже записываться на мои занятия, потому что их посещала другая. Но она все равно пришла в мой класс, и через четыре занятия они уже искренне хвалили песни друг друга и к тому же перестали конфликтовать за пределами класса. Это случилось благодаря природе наших занятий. Чтобы искренне выражать свои чувства перед остальными, требовалась огромная смелость, и женщины учились уважать эту смелость, сочувствуя друг другу и слушая чужие песни с неподдельным интересом. Другой серьезной сложностью была необходимость выступать перед всем классом. Заключенные старались поддерживать друг друга, чувствуя, какая боль скрывается за каждой песней. Одна из моих учениц, Сэнди, написала о том, как тяжело ей было расти в маленьком городке полукровкой – наполовину белой, наполовину аборигенкой, – которую никто не принимал за свою. Это чувство было хорошо знакомо и другим женщинам, которые поддерживали Сэнди, подтверждая, как важно вслух говорить о подобных вещах. Другая ученица, Дейзи, столько раз в жизни попадала в тюрьму, в основном за рукоприкладство, что даже не знала, какой ей сейчас дали срок. Она сказала, что в зале судакаждый раз как будто отключалась, подавленная обстановкой. Поэтому она написала песню о своих чувствах: ее жизнь настолько принадлежит системе, что сама она совершенно потеряла над ней контроль. Еще одна ученица, Лиза, написала песню своему сыну, в ней говорилось, как она гордится им. Она пела ее прерывающимся от эмоций голосом, но при этом гордилась и собой тоже. Исполняя свои песни перед другими, эти женщины переживали глубокое внутреннее очищение, потому что выражали свои чувства полностью, а не только на бумаге. Конечно,они очень сильно нервничали, но я на собственном опыте знала, что они чувствуют, и мягко поощряла их, пока страх понемногу не отступал. Несколько месяцев спустя, когда одна из моих самых стеснительных учениц сыграла свою новую песню перед сотней других заключенных и посетителей, пришел мой черед плакать – от радости. Народу на моих занятиях было не очень много, и это всех устраивало. Первые несколько уроков были перегружены, но постепенно у меня осталось около десяти постоянныхучениц. К нам регулярно присоединялись и другие, но быстро исчезали, как только им становилось понятно, что за один урок им не научиться играть на гитаре, как Эрик Клэптон, да и вообще, что на моих уроках приходится работать. Я была довольна тем, что учениц мало. Им требовалось много внимания, и мне удавалось уделить его каждой. Песни и истории жизни этих женщин были прекрасными, они вдохновляли и исцеляли. В классе царила атмосфера любви и заботы. За внешней грубостью скрывались обычные люди – люди, которые обожали своих детей, мечтали о любви и принятии, хотели чувствовать себя нужными и жить так, чтобы уважать себя. Очень немногие из них не испытывали вины за свое преступление. Большинство хотели стать лучше. Узнав их поближе, я убедилась, что их жизни сложились трагично, что все они страдали от крайне низкой самооценки и не могли вырваться из порочного круга, в который попали не по своей воле. В тюрьме они оказались за самые разные преступления, в том числе за нелегальную проституцию. Некоторые из них даже использовали тюремную систему в своих интересах. Зная, какой срок полагается за мелкие преступления, они попадались на чем-нибудь каждый год, чтобы оказаться в тюрьме на три зимних месяца – так в холодное время года у них были хотя бы крыша над головой, постель и еда. Другие попали в тюрьму за всевозможные преступления, от наркотиков и драк до мошенничества, воровства и регулярного вождения в нетрезвом виде. Каким бы ни было преступление, тюремная система занималась его последствиями, а не причинами, которые всегда были связаны со страданиями. Хотя официально тюрьма считается исправительным учреждением, в ней предлагается очень ограниченная помощь для тех, кто действительно хочет изменить свое мышление и поведение. Но именно на этом уровне заключенным больше всего нужно исцеление, чтобы вырваться из порочного цикла низкой самооценки, употребления наркотиков, домашнего насилия и, как следствие, криминальной жизни. Вероятно, кто-то из них снова пойдет на преступление, даже получив всю возможную помощь. Но те женщины, которых я узнала хорошо, навернякаизменились бы радикально, получи они достаточно поддержки в тюрьме и за ее пределами. Среди работников тюрьмы попадались замечательные люди. Кроме того, волонтерам из религиозных организаций удавалось достучаться до некоторых заключенных и помочь им изменить свою жизнь. Но, говоря откровенно, на безопасность и бюрократию уходило куда больше денег, чем на поддержку и исцеление осужденных. На триста человек приходилось всего два психолога, да и те часто бывали недоступны, потому что им катастрофически не хватало времени. Даже тот, кто, попав в тюрьму, не был о себе низкогомнения, терял всякую веру в себя за время заключения. Мне попался интересный документальный фильм об успехе медитации в тюрьмах, о том, как практика медитации меняет жизни людей. Школа медитации, к которой я принадлежала, успешно обучала осужденных своим техникам в других странах. Я попыталась обсудить эту тему с администрацией и предложила познакомить их со знающими людьми, но наткнулась на полное отсутствие понимания. Поэтому я решила просто продолжать работать со своими ученицами. Я хотела помочь им поверить в то, что они прекрасные и добрые люди. Для этого я учила их выражать себя в словах и музыке, писать песни, которые они могли бы потом исполнять для других людей. Многие из них никогда в жизни не слышали похвалы и жадно впитывали мои искренние слова поощрения. Даже критические замечания я старалась выражать в мягкой положительной форме. По мере того, как доверие моих учениц ко мне возрастало, они просвещали меня насчет устройства жизни в тюрьме. Однажды я услышала, как одна из них громко хвастается,что ухитрилась добыть лишнюю пару кроссовок. Заметив меня, она быстро смолкла, но по моей просьбе согласилась поделиться с нами своей мошеннической схемой. Я признала, что придумано действительно хитро, и услышала в ответ: «Ну так мы же преступники, мисс. Не забывайте, где вы находитесь». К тому времени я уже давно освоилась в тюрьме, так что эта реплика меня не испугала, а насмешила. Другая ученица как-то пришла на занятие явно на взводе. Я спросила, все ли в порядке, и она ответила: «Все нормально, мисс. Утро выдалось просто жуть. Эта девка меня уже давно доставала, ну и я сунула ее головой в сушилку для одежды. Теперь все нормально». Я не без удивления кивнула. «Все в порядке! Я пришла заниматься музыкой. Когда я тут, это все неважно. Если бы не занятие, я бы, может, убила ее. Но тогда меня не пустили бы на занятие, а это бы убило уже меня». С этими словами она уселась и продолжила работать над своей песней. Надо сказать, это была невероятно талантливая поэтесса с замечательным голосом. Если бы мы встретились при других обстоятельствах, я бы с наслаждением пела с ней песни у костра. К сожалению, в нашем случае это было невозможно. Понемногу, занятие за занятием, в моих ученицах происходили перемены к лучшему. Видеть это было огромной радостью. Сотрудники отдела обучения и перевоспитания тоже радовались успеху программы и ее влиянию на участниц. Уроки музыки скоро стали для них – как и для меня – любимым событием недели. Мой роман уже закончился, несмотря на то что теперь нас не разделяло расстояние. Оказалось, что у нас слишком разные ценности, и оставаясь с этим мужчиной, я не смогу следовать своему сердцу. Хотя это было тяжелое решение и я пролила над ним немало слез, я уже слишком далеко ушла по пути саморазвития, чтобы согласиться жить чужой жизнью. Жить в своем доме просто чудесно. Поскольку последние десять или даже двадцать лет я только и делала, что гостила у друзей, теперь я с наслаждением принимала друзейу себя. Долгий период странствий сделал меня чрезвычайно домашней: меня очень сложно было куда-то вытащить, и я даже решила, что в конечном итоге хочу больше работать из дома. Поэтому в свободное время на основании своей тюремной программы я разработала онлайн-курс для желающих научиться писать песни. Мои тексты тоже начали пользоваться популярностью – статьи публиковались в разных журналах, и к тому же я вела блог. У меня появилось много подписчиков, и я стала задумываться, стоит ли мне и дальше пытаться заработать на жизнь выступлениями. Пока я преподавала в тюрьме, моя собственная музыкальная карьера несколько замедлилась, хотя я время от времени давала концерты. Если аудитория была правильной и мне удавалось установить контакт со слушателями, я полностью погружалась в музыку и мне это безумно нравилось, но написание текстов и работа из дома понемногу начали приносить мне больше удовлетворения. Хотя я обожала свой коттедж и работу в тюрьме, кроме них в Сиднее меня ничего не удерживало. Мои прежние друзья разъехались, жизнь изменилась. Кроме того, в глубине души я всегда знала, что рано или поздно уеду из города и вернусь жить на ферму. За два с лишним десятка лет странствий я так и не перестала тосковать по деревенской жизни. Новых друзей у меня почти не появлялось, потому что я все свободное время проводила дома в одиночестве. Поэтому незаметно моими местными друзьями сделались ученицы. Со временем дистанция между учительницей и ученицами существенно сократилась, и на занятиях мы были просто женщинами, которые вместе играют и пишут музыку. Междунами было не так уж много различий, и порой, хотя и не всегда, я чувствовала, что легко могла бы оказаться на месте одной из них. Конечно, я не совершала никаких преступлений, но благодаря нашей честности и открытости между нами возникла дружеская связь. К тому же я хорошо помнила, какой болезненной и сложной была моя юность, и это тоже сближало меня с ученицами, чье прошлое было полно боли, насилия и отсутствия веры в себя. Впервые попав в тюрьму, я прошла инструктаж, и меня предупредили, чтобы я никогда не отвечала заключенным на вопросы о своей личной жизни. Я не говорила им, где живу,но, если они спрашивали, я не врала и не увиливала, а честно объясняла, что мне не полагается отвечать на такие вопросы. Доверяя мне, они уважали мое право молчать, ноя все равно старалась отвечать на их вопросы, как могла. Откровенно общаясь с умирающими пациентами, я привыкла ничего не скрывать. Истина объединяет людей, а скрытность только мешает быть добрее друг к другу. Заключенные расспрашивали меня о прошлом, и я честно отвечала на их вопросы, объясняя, что напрасно слишком долго терпела обиды от некоторых людей и верила тем, кому верить не стоило. Доброта этих женщин пробудила во мне чувства, которые очень давно находились в спячке. Говоря попросту, я не умела принимать чужую доброту. Я знала, как быть доброй к другим, но терялась, когда кто-то был добр ко мне. Поэтому, почувствовав, как эти женщины любят меня, как глубоко они понимают мою боль, я была просто ошеломлена. Это были добрейшие, прекраснейшие люди. Они много страдали, и большинство из них смертельно тосковали по детям и близким. Но их сердца были полны доброты. Да, они оступились и совершили ошибки, приведшие их в тюрьму. Но почти все они сожалели об этом, и у каждой в груди билось доброе, любящее сердце. Деньги, собранные на программу, понемногу заканчивались, кроме того, после года работы в тюрьме я была вынуждена признать, что выгорела не только от ухода за умирающими. Я выгорела от жизни вообще. Меня окружало слишком много горя. Примерно в это же время случилась трагедия в семье моих друзей, и я старалась их поддерживать, что только усугубило мою тоску. Уже зная, как тяжело искать финансирование, я сомневалась, что мне хватит энергии вновь заняться поиском денег. Однажды вечером, лежа в кровати, слушая, как орут друг на друга мои новые соседи, я приняла решение. Пришло время вернуться в деревню. Я сделала все, что могла. Большинство учениц, с которыми я начинала работать, уже вышли или вот-вот должны были выйти на свободу, и это развязывало мне руки. Я знала, что у меня не хватит задора начать все с начала с новой группой. Пришло время учиться заботиться о себе. Так что я предупредила начальство тюрьмы и владельца коттеджа, что скоро уеду, и принялась строить планы. Мои родители понемногу старели. С мамой мы были так же близки, как и прежде, а теперь у меня наладились отношения и с папой тоже, поэтому мне хотелось быть к ним ближе – хотя бы на расстоянии нескольких часов езды на машине. Для австралийцев это совсем близко. Я также хотела поселиться поближе к океану. Я выбрала подходящие два городка, определила свой бюджет и начала разыскивать в интернете объявления об аренде. В течение пары недель мне ничего не попадалось, и я дала объявление в газету, где четко говорилось, что я ищу. Мне пришла пара предложений, и, хотя ни одно мне не понравилось, у меня завязались новые контакты, и очень скоро я узнала, что сдается чудесный маленький домик. Он стоял точно там, где мне было нужно, и аренда была ровно такой, какую я могла себе позволить. Недолго думая, я собрала вещи и переехала на ферму площадью восемьсот гектаров. Тьма и рассвет Прямо перед моим домиком бежал ручей, радуя глаз и привлекая самых разных животных и птиц. Вокруг росли огромные величественные деревья. Весь день мне пели птицы, аночью их сменяли лягушки. Когда вечером я возвращалась домой, мне светили миллионы звезд, а не уличные фонари. Я жила как в сказке, особенно когда вечерами играла нагитаре, любуясь закатом с уютной веранды, или когда по жестяной крыше барабанил дождь. Я была в раю и каждый день многократно благодарила Бога за это счастье. Жизнь в деревне, безусловно, лишила меня легкого доступа к живым концертам и изобразительному искусству, но мне хватало и того, что было вокруг. С моим образом жизни я знала, что все равно буду время от времени куда-то ездить, так что это было неважно. Я вновь двигалась в ритме природы и наконец-то жила такой жизнью, которая была мне лучше всего понятна. На холмах и долинах огромной фермы расположились всего пять домиков, включая хозяйский. У меня не было выбора, кроме как наслаждаться свободным пространством. Мне сразу стало проще и легче на душе. Вновь поселиться в деревне было все равно что вернуться домой. После ухода за умирающими пациентами и работы в тюрьме я чувствовала себя выжатой, поэтому с удовольствием взяла паузу, решив пожить за счет сбережений. За это время я планировала изучить свое новое поле деятельности и решить, в каком направлении мне двигаться, когда я буду к этому готова. Пока же я не хотела торопить события и с каждым днем чувствовала себя все лучше, понемногу возрождаясь к жизни. У меня вновь появились энергия и позитивные мысли. Бродя по холмам и полям, любуясь простотой и сложностью природы, я постепенно исцелялась и восстанавливалась. Годы, которые я провела у постелей многих замечательных и мудрых людей, были для меня годами роста, и благодаря им многое в моей жизни изменилось. Я часто с нежностью улыбалась своим воспоминаниям. Хотя сейчас, в окружении холмов и долин, мне казалось, что эта жизнь осталась где-то в далеком прошлом, она сформировала меня как личность, и за это я была ей бесконечно благодарна. Я собиралась какое-то время провести дома, продолжая заниматься творчеством, но при этом я снова была на пороге неизвестности. Я верила: когда придет время, я пойму,что делать дальше. В конце концов, так случалось уже много раз. В окружении великолепной природы и тексты, и музыка полились из меня рекой. Вокруг домика и ручья обитало множество животных, птиц и насекомых, и это помогло мне быстро привыкнуть к очень простому укладу жизни. Однако где-то в глубине моего подсознания продолжали таиться прежние разрушительные мысли о том, что я ничего не стою. На сознательном уровне мое мышление полностью изменилось за прошедшие десять лет, и жизнь казалась простой и приятной. Каждый день я понемногу восстанавливалась, и меня переполняли покой и благодарность. Илимне так казалось. Внезапно все резко изменилось. Дела шли прекрасно, поэтому я совершенно не ожидала, что меня швырнет в такую темную глубину депрессии, в какой я еще не бывала. Но это случилось. Вся остававшаяся у меня энергия исчезла в одночасье, практически за одну ночь, словно кто-то выключил меня из розетки, и я осела на пол, как куча тряпья. Меня покинули все силы, до последней капли, и я оказалась к этомуабсолютно не готова. Прежние планы найти работу и завязать новые знакомства вылетели в трубу. Мысль об общении с людьми казалась невыносимой. Выйти на работу, даже ненадолго, представлялось нереальным – я была ни на что не способна. Мне пришлось принять эти перемены и заглянуть в самую глубину своего существа, и это было безумно тяжело, но выбора уменя не оставалось. Мрачные чувства и мысли накрыли меня с головой, и остановить их было невозможно. Мне нужно было исцелить их, полностью освободиться от прошлого,чтобы стать тем человеком, которым мне предназначалось стать. Эти месяцы получились самыми трудными в моей жизни. Я неожиданно рухнула в глубочайшую суицидальную депрессию. Близко знавшие меня люди просто не могли поверить, во что я превратилась. Имей я тогда возможность взглянуть на себя со стороны, то, наверное, почувствовала бы то же, что и они. Я много раз видела депрессию других людей, но никогда не думала, что сама могу пасть ее жертвой. В этом и заключается коварство депрессии, из-за которого многие люди долго не могут ее распознать: мы не готовы признать, что с нами происходит. Кто-то из друзей напрочь отказался этому верить. Не может быть, чтобы Бронни, которая всегда всех утешала и поддерживала, вдруг сама впала в депрессию! Другие просто не знали, как себя вести, видя меня в таком ранимом состоянии. Третьи, причем люди, хорошо меня знавшие, по телефону предлагали мне такие варианты выхода из ситуации, на которые я даже близко не была способна, и это заставляло меня только больше замыкаться в себе. Не будь я уже на самом дне, непонимание друзей могло бы еще больше расстроить меня, но теперь это было просто невозможно. Меньше всего меня волновало, что обо мне думают другие. Все силы уходили на то, чтобы позаботиться о себе, и даже с этим я справлялась плохо. На меня продолжали сыпаться советы, что мне делать, как изменить ситуацию. Но таким людям больше всего нужны не советы, а принятие. Депрессия – это заболевание, но оно способно дать толчок положительным изменениям, если только не подгонять этот процесс. По сути, это шанс на духовное преображение и пробуждение. Депрессия может закончиться провалом, но может и прорывом, если подходить к ней с верой, с твердыми намерениями и с готовностью принять настоящее. Разумеется, приятней она от этого не становится. Каждое утро я просыпалась в слезах и нуждалась в сострадании и терпении близких. Иногда я не успевала даже осознать свои мысли при пробуждении: стоило открыть глаза, и из них начинали катиться слезы. В другие дни я плакала от тоски – жизнь казаласьневозможнотяжелой. Зная, что мне не хватит силначатьвсе сначала, я понимала, чтовыходавсе равно нет: идеальная работа сама не постучится мне в дверь, особенно в местности, где меня никто не знает. Эта тревожная мысль усугубляла мое и без того плачевное состояние. В моем ближайшем кругу никто не знал, как справиться с такой глубокой грустью и отсутствием сил, поэтому близкие продолжали названивать и давать советы о том, как мне выбраться из дома и вновь встать на ноги. Но их предложения только больше давили на меня, потому что я определенно не была к ним готова. Если мне хватало сил пропылесосить дом, я считала это громадным достижением и хвалила себя: «Молодец, Бронни, ты сегодня совершила подвиг». В прежние времена я могла бы за то же время пропылесосить пять домов, прокатиться на обед с друзьями, прогуляться несколько километров и час проплавать в реке. Но так проявляется депрессия: она решает, на что мы способны, а на что нет. Лучшее, что могут сделать друзья и родные для человека, страдающего от депрессии, это принять его состояние. Он может выйти из него, а может и не выйти – но велики шансы, что человек справится, особенно если у него есть такое желание. Принятие со стороны любимых людей увеличивает шанс на исцеление, а давление только уничтожает. Сам человек также должен принять ситуацию, сложившуюся в его жизни, и не требовать от себя невозможного – это лишь ухудшает симптомы заболевания. Мне понадобилось время, чтобы прийти к такому принятию: я долго пыталась бороться со своей неспособностью нормально функционировать. Возвращение в деревню воскресило давно и глубоко похороненные страдания моей юности из тех времен, когда я жила в похожей местности. Как будто замедлившись и вернувшись к корням, а также перестав отдавать все силы уходу за другими людьми, я нечаянно приоткрыла ящик Пандоры, и оттуда вырвалась вся боль, которую я прятала там несколько десятилетий. В последние годы она по чуть-чуть просачивалась наружу, пока я занималась исцелением и высвобождением тех чувств, которые сознавала. Но теперь на поверхность поднялась вся тяжелая и болезненная печаль, обитавшая в темных уголках моего подсознания. Я и не знала, что во мне скопилось столько боли – от того, что в юности меня так много критиковали и отвергали, от крика и насмешек. Я плакала и плакала без конца. Чтобы по-настоящему исцелиться, необходимо встретиться лицом к лицу со своей болью. Нужно признать свои страдания, увидеть в них возможность для роста и принять необходимость стать больше своей боли. Никто не может пройти наши жизненные уроки за нас. Любовь близких, конечно, помогает, и меня очень поддерживала любовь мамы и нескольких старых друзей. Но исцелить себя я должна была сама. Пришло время заглянуть в себя и очиститься на самом глубинном уровне. Высвобождение чувств шло через разные каналы. Разумеется, я много плакала. Я записывала свои чувства и мысли на бумагу. Впервые в жизни я пробовала визжать – не кричать, а именно визжать в голос, как дикое животное. К счастью, мой домик стоял далеко от остальных, и я могла делать все, что заблагорассудится. Я визжала все то, что хотела бы бросить в лицо людям, обижавшим меня в детстве и в юности. Я просто визжала, как от боли, безо всяких слов. Я визжала от отчаяния, переполнявшего меня, от злости на сложившуюся ситуацию. Я громко рыдала. Потом я лежала без сил – и понемногу исцелялась. В более сентиментальные времена я часто говорила, что, проходя жизненные уроки и развиваясь, мы напоминаем раскрывающуюся розу. Мы разворачиваем лепесток за лепестком, пока не доберемся до самой сердцевины, до нежного, прекрасного бутона, который и есть наша суть. В том безнадежном, тоскливом состоянии, в которое я погрузилась, я признала эту теорию никуда не годной и отказалась от нее. Теперь мне казалось более уместным сравнить процесс роста с громадной луковицей, которую надо очистить. Развиваясь, мы снимаем с нее один слой за другим, и с каждым слоем нам все больнее, все сильнее хочется плакать. Именно так я себя и чувствовала. Я чистила громадную едкую луковицу. Каждая пролитая слезинка, каждое написанное предложение, каждая высказанная мысль помогала мне снять с этой луковицы новый слой. В те дни я даже не пыталась быть счастливой, а стремилась хотя бы быть достаточно сильной, чтобы принять свое состояние. Вначале мне не хватало сил ни на что, только лежать и плакать, а потом с веранды смотреть на природу. Я была совершенно измучена волнами эмоций, которые мне приходилось высвобождать почти ежедневно, но зато проживала каждый день в полном присутствии в настоящем. Временами думать о чем-то, кроме текущего момента, было просто не по силам. Выживать под грузом тяжелейших эмоций – сама по себе достаточная задача. Я впала в оцепенение, эмоционально истощилась и очень сильно устала от жизни. Несмотря ни на что, я напоминала себе, что быть счастливой – это сознательное решение. Пытаясь двигаться в этом направлении, я сознательно принимала решение встать с кровати, а не валяться в ней весь день, или обратить внимание на что-то красивое в промежутке между приступами плача. Мои крошечные решения и успехи, казавшиеся другим людям незначительными, в то время стали для меня колоссальными достижениями. То, что раньше давалось безо всякого труда, – подняться с кровати, ответить на телефонный звонок, расчесать волосы, надеть чистую одежду, приготовить поесть, – все это теперь было огромным достижением. Мне хотелось только лежать и есть консервированную фасоль прямо из банки. Я перестала быть прежней Бронни, и, чтобы стать тем человеком, которым мне было предназначено стать, нужно было не отвергать свои чувства, а принять их: позволить имподняться на поверхность и высвободить их раз и навсегда. Каждый из нас лечится так, как считает нужным. Антидепрессанты для меня были не вариантом, хотя я никого не отговариваю их пить. Мне нужно было пройти через депрессию самой. Каждый день был разным. Некоторые дни были полны мрачных мыслей, слез и горьких сожалений. В другие я была более дееспособной и, двигаясь как в тумане, старалась впрок приготовить себе еды и сунуть ее в морозилку, чтобы не питаться одними консервами в дни потяжелее. Порой я даже находила в себе достаточно сил, чтобы отправиться гулять за холмы, подальше от людей, и просто вдыхать звуки и запахи природы. Медитация оставалась в моей повседневности. Страшно даже подумать, что бы я делала без нее. Благодаря ей я уже знала, что страдания – это продукт ума. Годы практики помогли мне избавиться от наплыва нездоровых мыслей. Вот и теперь именно медитация стала бесценным инструментом моего исцеления, и я не представляю, как людям удается справиться с депрессией без нее. Она учит нас наблюдать за своими мыслями и осознавать, что мысли – это еще не вы сами. Это порождение ума, который является частью вас, но не вами. К тому же не все мысли в голове – ваши: многие принадлежат другим людям. Это знание служило мне неоценимым подспорьем, когда я садилась медитировать, – как минимум дважды в день – с твердым намерением по-настоящему овладеть своими мыслями и умом. Было невероятно тяжело продолжать концентрироваться на практике, когда в голове возникали миллионы грустных мыслей и пытались меня отвлекать. Но в основном я справлялась. Наблюдая за своими мыслями, но не концентрируясь на них, я возвращалась в состояние покоя, любви и уверенности. Я знала, что этот хаос рано или поздно закончится, и ощущала, что мирная, спокойная часть меня никуда не делась. Мне нужно было лишь больше усилий, чтобы добраться до нее, – намного больше. Дисциплина, которой требовала от меня медитация, тоже шла мне на пользу. Несмотря на смену настроений, я взяла на себя обязательство и должна была придерживаться его: каждый день садиться и медитировать, как бы мне ни было паршиво. Кого-то в депрессии выручает необходимость ходить на работу или выполнять еще какие-то регулярные действия. Меня спасала практика медитации. Я старалась не забывать о той прекрасной жизни, которая ожидает меня, если я сумею прорваться через свою боль и исцелиться. Это помогало держаться за надежду, пока хватало сил. Когда боль из прошлого затмевает настоящее, только надежда на будущее дарит нам хоть какую-то радость. Поэтому надежда играла в моем исцелении большую роль. В моменты частичного затишья я представляла, как вновь буду жить полноценной жизнью, использовать дарованные мне таланты, зарабатывать на хлеб любимой работой, смеяться с друзьями, наслаждаться покоем у реки. Как осмелюсь вновь полюбить и рожу ребенка. Но в основном я мечтала просто о том, чтобы опять ощутить себя счастливой, просыпаться по утрам и радоваться тому, что жива. Я хотела быть счастливой и с усилием пыталась вспомнить это ощущение. Да, я надеялась на счастье. Единственное, что у меня получалось хорошо, – это как можно осознанней присутствовать в настоящем моменте и стараться в меру сил справляться с этим. Мне очень помогала красота окружающей природы, потому что вокруг домика постоянно что-то происходило, и я полностью погружалась в момент, наблюдая за насекомыми и птицами, слушая птичий щебет, любуясь непрерывно меняющимся небом. Меня также поддерживала замечательная соцработница, к которой я обратилась за помощью. Она не только практиковала те же техники медитации, что и я сама, но и послужила для меня в некотором смысле зеркалом. Благодаря ее помощи я начала смотреть на себя иначе, чем раньше, куда более добрым взглядом, отдавая должное своему прекрасному сердцу. Я также начала понимать, сколько сил вкладывала в заботу обо всех, кроме себя, в глубине души не веря, что я ее заслуживаю. Во многом это происходило потому, что я когда-то поверила словам других людей, уверявших, что знают меня, но на самом деле нет. Их мнения, как оказалось, все еще на меня влияли. Я исполнилась решимостинавсегдапорвать с вредными шаблонами мышления. Я также поняла, что беру на себя слишком много чужой боли, стараясь всех спасти, даже когда мне самой очень плохо. Нельзя спасти утопающего, если утонешь раньше, чем до него доплывешь. Мне нужно было научиться немного дистанцироваться от тех, кому я сочувствую и помогаю. Мудрая соцработница напомнила мне, что я сама нуждаюсь в собственном сочувствии, и мне было важно это услышать. Она также помогла заметить мои ошибки: как многое я спускала людям с рук когда-то, чтобы избежать ссоры, а в последнее время – из сострадания к их слабостям. Ее консультации отличались радикальной прямотой и честностью, и этот стиль подходил мне идеально. Ее слова били прямо в цель, особенно когда она спрашивала: «Ты что, пыталась получить золотую медаль на олимпийских играх для сиделок?» Я слишком часто забывала проявлять сострадание к себе самой, как в мыслях, так и в поступках. Впрочем, годы развития и высвобождения эмоций не прошли даром. Я добралась до самого источника своих душевных ран, обнаружила, откуда многие из них родом, и начала избавляться от них навсегда. Мне понадобилось разрешить себе быть очень смелой, чтобы признать свою боль и последствия десятилетий критики со стороны близких людей и чтобы перестать оправдывать чужие некрасивые поступки. Проговорив все это вслух, я, наконец, была готова навсегда освободиться от прежних шаблонов мышления и поведения. Для этого нужно было научиться двум вещам: быть к себе добрей иприниматьэту доброту. Язаслуживаласчастья. Даже если кто-то считал иначе, многого обо мне он не знал, да и было это уже неважно. Теперь я, наконец,понялана самом глубинном уровне: я заслуживаю всего самого замечательного и прекрасного в жизни. Благодаря этому важнейшему осознанию я смогла позволить себепринятьсобственную доброту. Происходила переориентация на самых глубинных уровнях моей личности. Пришло время впустить в свое сердце доброту – ведь язаслуживалаее ничуть не меньше других. Однако привычные шаблоны мышления, особенно моя вечная убежденность, что яничегоне стою, не собирались сдаваться без боя. Порой борьба с болью совершенно лишала меня сил. С каждой маленькой победой я ощущала накатывающие волны эйфории, это вдохновляло и освежало. Любая мелочь – например, игра света на листьях – могла вдруг настолько поразить меня красотой, что я ощущала настоящее блаженство. Я начала понемногу привыкать к своим новым чертам, которые зрели в глубине моего подсознания много лет. Мне удалось осуществить несколько необратимых изменений и навсегда оставить в прошлом некоторые вредные шаблоны мышления. Понимая, что мнеудалосьизбавиться от нескольких тяжелых комплексов, я с благодарностью принимала свои достижения. С остальной болью еще предстояло разобраться, но меня ежедневно подпитывала красота природы, не давая отвлекаться от настоящего момента. По мере того как боль покидала меня, я все острее воспринимала окружающее, мне даже казалось, что я настраиваюсь на живую волну природы. Это бесконечно меня поддерживало, хотя тяжелых моментов по-прежнему хватало. Иногда я злилась на себя за то, что недостаточно быстро выхожу из депрессии. Но гнев – это лишь разочарование от несбывшихся надежд. Я отказывалась от них и возвращалась в настоящий момент: любовалась чем-то красивым, ставила музыку и подпевала, а то и просто концентрировалась на дыхании или окружающих звуках. Тогда мне вновь удавалось принять свою ситуацию, зная, что я проживаю ее с правильной скоростью, соответствующей моему росту. Одна старая подруга постоянно присылала мне потрясающие, экологически чистые продукты для ухода за кожей. Я много времени проводила, тщательно втирая в кожу кремыи лосьоны. Это простое действие помогало мне восполнить годы недостаточно доброго отношения к себе. Мне всегда становилось чуть легче на душе, к тому же кожа пахла просто чудесно. Втирая крем, я вспоминала,какухаживала за своими умирающими пациентами. Теперь я училась дарить себе ту же любовь и заботу, которую раньше дарила им. Быть сильнее своей боли очень сложно. Спустя месяцы депрессии у меня начали случаться дни просветов, но затем болезнь и сопутствующие ей тяжелые мысли, казалось, возвращались с удвоенной силой. В конце концов, их подпитывала почти сорокалетняя привычка самобичевания. Мой ум словно жил собственной жизнью и не хотел терять надо мной контроль. Понемногу я училась быть сама себе хозяйкой. Я по-настоящему осознала свою красоту, стала ценить себя и приняла сознательное решение направлять свой ум в сторону более положительных убеждений. Вместо того чтобы размышлять о прошлых ошибках, я обращалась с собой с любовью и уважением. Я слонялась по дому, сочиняя и напевая смешные песенки про то, какой я прекрасный человек. Проходя мимо зеркала, я каждый раз останавливалась и шутливо здоровалась со своим прекрасным отражением. Я чувствовала, как физическая забота о себе побуждает принимать долгие ванны, готовить полезную вкусную еду. Мало-помалу радость начала возвращаться. Моим старым привычкам это ужасно не понравилось, и депрессия, не желая отпускать, вцепилась в меня с отчаянной силой. Подготовка к полной перестройке моего мышления шла годами. Но теперь началась финальная схватка, в которой предстояло победить кому-то одному. И вот в разгаре событий – борьбы за право навсегда распроститься со своим прежним «я» – я, наконец, сдалась. У меня просто не осталось больше сил. Несмотря на явныеулучшения, эмоционально я была совершенно выпотрошена. Добиться этих улучшений было такимподвигом,что внезапно все остававшиеся силы покинули меня, и я стала задумываться о самоубийстве. У меня не было больше воли, чтобы принудить себя к внутренней дисциплине или надежде. Я боролась, как могла, и теперь ощущала толькобесконечную усталость.Я хотела умереть. Хотела, чтобы моя жизнь закончилась раз и навсегда. Один друг, с которым мы были знакомы уже больше двадцати лет, постоянно звонил мне, проявляя ангельскую доброту и терпение. К счастью, у него был собственный психологический подход к депрессии. «Возьми трубку. Я не шучу, лучше даже не думай,*#@#,наложить на себя руки. Возьми трубку. Прекрати меня игнорировать и возьми,*#@#,трубку», – повторял он, пока я, наконец, не брала трубку, смеясь сквозь слезы. Хотя подход у него был несколько нетрадиционный, сердце у него было золотое, и в прошлом мы уже спасали другу друга в тяжелые времена при помощи здорового юмора. Его подход срабатывал без осечек. Зная, что друг любит меня так же нежно, как и я его, я смеялась, и этот смех был целителен. Смех вообще крайне недооцененный способ лечения депрессии и других расстройств. Однажды он не позвонил, и я погрузилась в такие глубины отчаяния, в которых мне еще не доводилось бывать. Я окончательно решила сдаться и нацарапала прощальную записку, едва выводя кривые строчки. Говорят, что ночь темнее всего перед рассветом. Это был самый темный час моей жизни. Я просто не могла жить дальше. Не представляла себе ничего хуже своего состояния. Ненавидела себя за слабость и неспособность победить свой ум, несмотря на титанические усилия. За то, что вытерпела столько обид от других людей. За то, что так часто выбирала сложные пути. За то, что для создания жизни, которой заслуживаю, требуетсястолькомужества. Я ненавидела в себе почти все. Это действительно был самый темный час моей жизни. В ту самую секунду, как я закончила писать прощальную записку, зазвонил телефон. Я не хотела подходить, но все же взяла трубку. Звонил не друг, которого я ожидала услышать, и вообще не кто-то из знакомых. В трубке я услышала жизнерадостный голос девушки, продававшей по телефону страховку от несчастных случаев. «Просто прекрасно, – подумала я. – Я и убить-то себя наверняка не смогу нормально, так что эта чертова страховка может и пригодиться». Я заранее присмотрела расщелину в горах неподалеку. План был разогнаться и направить туда фургон, чтобы разбиться, и я продумала его до мелочей. Предложение купить страховку от несчастного случая (которое я отклонила) напомнило мне, что моя попытка может ине удаться.Я подумала обо всех замечательных врачах, с которыми была знакома, и поняла, как эгоистично с моей стороны было думать только о себе, забывая о чувствах тех, кто найдет мое тело, и тех, кто любит меня. Кроме того, в случае провала мне грозило доживать свою жизнь парализованной по собственной вине, чего мне уж никак не хотелось. Но дело было не только в символичности предложения купить страховку, хотя сложно представить себе более отрезвляющий звонок. Дело было в том, что телефон как будто разбудил меня от кошмарного сна, вытащил со дна пропасти. Этот звонок стал главным поворотным моментом во всей моей жизни. Я вовсе не хотела повредить свое тело, которое подарило мне столько свободы и движения, – прекрасное, здоровое тело, всегда верой и правдой служившее мне. Умирать я тоже не хотела. Почувствовав любовь к своим ногам за те мили, которые я прошла благодаря им, я вдруг осознала, что люблю всю себя целиком. Когда зазвонил телефон, у меня закололо в сердце. Именно тогда я поняла, что мое бедное нежное прекрасное сердце уже вынесло достаточно мучений. Оно не могло большетерпеть мои страдания и ненависть к себе. Ему нужны были любовь и исцеление, причем эту любовь не мог дать ему никто, кроме меня самой. Без сожалений После этого события начали меняться с феноменальной скоростью. Депрессия растворилась за одну ночь, забрав с собой все мрачные мысли. Она лишь ждала появления любви, и когда та, наконец, пришла, депрессия поняла, что выполнила свою задачу, и исчезла. Следующие несколько дней я провела, восстанавливая силы при помощи медитации, благодарности и любования собой. Они радовали мое сердце, а тело радовали теплые ванны. Я ходила на долгие расслабленные прогулки по холмам – не стараясь идти быстро, а просто гуляя и любуясь жизнью вокруг себя, как человек, рожденный заново. Мне казалось, будто я очнулась ото сна и оказалась в мире настолько прекрасном, что прежний не могла даже вспомнить. Чтобы отметить начало своей новой жизни, я решила провести формальную церемонию прощания со старым и приветствия нового. Я насобирала дров и зажгла великолепный костер. Мне нужно было навсегда проститься с прежними чертами моей личности, а также со всеми чувствами и обстоятельствами, возникшими благодаря им. Так что я написала два списка: всего, с чем я буду прощаться, и всего, что хочу поприветствовать. Затем, когда солнце село и на небе появились первые звезды, я встала у целительного горячего огня, чувствуя себя легкой и счастливой. Я поблагодарила прошлое, простилась с ним и бросила первый список в костер. Затем я поприветствовала все новое в своей жизни. Сидя под широко раскинувшимся небом, глядя в огонь, я испытывала ошеломляющую любовь к себе самой и к жизни. Я также чувствовала бесконечную благодарность. Костер продолжал гореть. Улыбаясь, я посмотрела на усеянное звездами небо и признала: благодаря всему, что мне пришлось вынести, действительно родился новый человек. Я много лет работала, чтобы стать им, и вот, наконец, это произошло. Ему наконец позволено было прорасти во мне. Я больше не нуждалась в той женщине, которая всегда прощала чужие ошибки, десятилетиями носила в себе боль и не понимала, что тоже заслуживает счастья. Эта женщина сыграла свою роль. Я ласково поблагодарила ее за участие в моей эволюции, и она исчезла. Каждый новый день приносил мне неожиданные радости. Я как будто открывала жизнь заново; никогда еще я не чувствовала себя такой свободной. Самым естественным состоянием для меня стало счастье – полное, ничем не сдерживаемое и свободное от чувства вины. Птицы садились на забор, чтобы спеть мне новую песню, и следовали за мной, когда я отправлялась гулять в состоянии полного блаженства. Я чувствовала все так остро, будто только что закончила несколько недель сидячей медитации, но до сих пор нахожусь в состоянии концентрации. Вокруг коттеджа я насчитала как минимум тридцать разных оттенков зеленого. Я ощущала внутренний простор и ясность, которые, как мне теперь казалось, всегда присутствовали во мне, но раньше я их не распознавала. Прошлое потеряло всякое значение. Мудрость, вынесенная из прожитых уроков, стала частью меня. Прошлое было отличным материалом для обучения, и ни один его урок не пропал зря. Но страдания, которые сформировали мою личность, сыграли свою роль и растворились. Мне нечего было доказывать, объяснять или оправдывать. Я так много улыбалась, что у меня ломило щеки. Практически за одну ночь моя жизнь совершенно изменилась. После многих лет практики жизнь в моменте стала единственно возможным способом существования. Передо мной тут же широко распахнулись все мыслимые и немыслимые возможности. Все усилия, вложенные в творческое развитие, вся концентрация, настойчивость, все принесенные жертвы начали окупаться. Мои тексты приобрели широкую популярность, и мне стали поступать заказы из самых невообразимых источников. Любовь к себе открыла передо мной все двери, и обстоятельства начали складываться наилучшим образом. И все это терпеливо, на протяжении многих лет, дожидалось, пока я стану готова. Время идет, и я вижу, что естественный поток добра и благополучия только усиливается. Вокруг меня сами собой выросли новые системы поддержки, как в профессиональной сфере, так и в личной. Конечно, мне всегда будет чему поучиться, но я никогда не принимаю даже самый крошечный дар жизни без благодарности. Долгие годы я сознательно создавала жизнь, о которой мечтала, постепенно избавляясь от всего, что мне мешало. Необходимым шагом в этом процессе было четкое понимание того, чего я хочу: какой жить жизнью и каким быть человеком. Теперь, если я вдруг сталкиваюсь с каким-то внутренним блоком, я работаю над собой с нескончаемым терпением и любовью. Самопознание – это радостный процесс, и я ласково улыбаюсь своим человеческим слабостям. После всего, что произошло, я почувствовала еще большую близость со своими дорогими пациентами. Новая жизнь, которая постепенно воплощалась вокруг меня, была именно такой, о какой они жалели и мечтали на смертном одре. В свои последние недели и дни, когда все лишнее отпадало, они видели, какую радость могла бы предложить им жизнь, если бы они только проживали ее иначе. Надо сказать, что не все пациенты делились со мной сожалениями. Некоторые говорили, что были бы не прочь кое-что изменить, но при этом ни о чем не жалели. Другие были просто довольны прожитой жизнью или хотя бы спокойно принимали ее такой, какой она была. К сожалению, многие мои пациенты сожалели о том, как прожили свою жизнь, и непременно хотели высказаться и быть услышанными. Поскольку мы много времени проводили вместе, наши отношения всегда становились очень честными и открытыми. За это время, проведенное с пациентами, я всегда буду бесконечно благодарна судьбе. Сожаления, которые я слышала от пациентов, придали мне решимости жить так, чтобы ни о чем не жалеть перед смертью, когда бы она ни пришла. Я просто не могла позволитьсебе принять этот урок мудрости и не сделать из него выводов. Пройдя через тяжелые испытания, я на собственном опыте узнала, какими серьезными бывают препятствия на пути к мечте. Я также узнала, как велико вознаграждение, если все же преодолеть эти препятствия. Возможность самореализации и счастья – то, что моим милым пациентам открылось только перед самым уходом, – доступна каждому из нас прямо сейчас, и не нужно ждать, пока придет последний час. С каждым днем я все больше влюбляюсь в естественный поток доброты и благодати. Этот поток сам хочет течь сквозь нас, и мы даем ему такую возможность, когда впускаем его в себя через веру и любовь к себе. Он ждет каждого из нас. Все, что от вас требуется, – это не мешать себе, а для этого придется поработать: научиться контролировать собственные мысли и избавиться от мусора, который преграждает течение. Вам всегда будет, чему поучиться. Вы никогда не достигнете такой стадии роста, на которой сможете сказать: «Супер, теперь я все знаю, так что можно навсегда расслабиться и плыть по течению – учиться мне больше нечему!» Даже Стелле, которая всю жизнь так усердно работала над своим внутренним развитием, пришлось в последние недели учиться принятию. Благодаря этому уроку ей удалось обрести покой и покинуть мир со счастливой улыбкой. Если процесс обучения не кончится никогда, то почему бы нам не перестать сопротивляться ему и не принять свои уроки? Не проходит и дня, чтобы я не узнала о себе чего-то нового. Но теперь я делаю это с любовью и добротой, без осуждения. Я ласково смеюсь над собой, и это тоже облегчает процесс обучения. Когда Грейс произнесла фразу «как жаль, что мне не хватило смелости жить так, как мне хотелось», ее переполняла печаль о том, как сложилась ее жизнь. Увы, для того, чтобы по-настоящему быть собой, действительно нужно большое мужество. Иногда простоогромное.Бывает, что нам даже мысленно не сразу удается сформулировать, кто же мы такие на самом деле. Мы лишь знаем, что внутри томится какое-то неясное желание и нас не удовлетворяет та жизнь, которую мы ведем. Попытки объяснить это другим людям, которые ничего похожего не ощущают, нередко лишь заставляют нас еще больше усомниться в себе. Но, как сказал мудрый Будда две с половиной тысячи лет назад, ум не знает ответов, а сердце не знает вопросов. К радости вас приведет только сердце, но не ум. Преодолев сопротивление ума и отринув чужие ожидания, вы сумеете услышать свое сердце. Если после этого вам хватит смелости следовать его зову, вы обретете истинное счастье. А пока продолжайте развивать сердце и контролировать ум. Чем больше ваше сердце, тем больше радости и покоя приносит вам жизнь. Счастливая жизнь ждет вас с таким же нетерпением, с каким вы ждете ее. Когда Энтони, лежа в интернате, признавался, что ему не хватает мужества пытаться жить иначе, он являл собой печальный пример того, как выглядит человек, поддавшийся своим страхам. Я не хочу сказать, что вы тоже окажетесь в интернате раньше своего срока. Но разве миллионы людей не страдают от отсутствия счастья и интереса к жизни точно так же, как Энтони? Каждый его день был лишь чередой повторяющихся, отупляющих мозг действий: его жизнь была безопасной, но совершенно неудовлетворительной. Нужна сила духа, чтобы всерьез изменить свою жизнь. Чем дольше вы остаетесь в угнетающей ситуации и в недружелюбном окружении, позволяя им влиять на вас, тем дольшеотказываете себе в возможности познать истинное счастье и удовлетворение. Жизнь слишком коротка, чтобы наблюдать, как она проходит мимо вас, и ничего не изменять только потому, что вы боитесь перемен. Как цветы в саду у Флоренс, увитые сорняками, мы тоже постоянно оказываемся в ловушке, причем нередко нами же созданной. К сожалению, зачастую нам освободиться гораздо сложнее, чем цветам. Большинство ловушек укреплялись десятилетиями и вовсе не хотят быть уничтоженными. Они цепляются за вас всеми силами и непременно задушат, если вы это позволите. На их создание ушло время, и на уничтожение их тоже оно понадобится. Это бережный процесс, требующий решимости, отваги и умения прощаться с прошлым. Это смелость прекратить нездоровые отношения и сказать «хватит». Это способность обращаться с собой с заслуженным уважением и добротой. Но прежде всего, чтобы вырваться из ловушки, куда вы сами себя загнали, начните наблюдать за собственными мыслями и привычками. Наблюдение даст вам осознанность, которая поможет найти выход из ситуации. Ваша жизнь принадлежит вам, а не кому-то еще. Если вам не хватает счастья в той жизни, которую вы для себя создали, и вы ничего не делаете, чтобы исправить положение, то вы зря тратите каждый бесценный новый день. Маленький шажок, небольшое решение – прекрасное начало пути, но прежде всего примите на себя ответственность за свое счастье. Помните, что счастливую жизнь можно обрести, никуда не переезжая и радикально ничего не меняя в своем физическом мире. Главное – изменить свое восприятие окружающей действительности и найти в себе решимость следовать своим желаниям. Без вашего позволения другие люди никогда не смогут сделать вас ни счастливыми, ни несчастными. Да, смелость быть собой, а не тем человеком, которого хотят видеть на вашем месте другие, может потребовать от вас немало сил и честности. Но ничуть не легче, лежа на смертном одре, сознавать, что вы жалеете, как прожили свою жизнь. За годы работы у меня было еще много пациентов кроме тех, о которых я поведала в книге. Среди всех сожалений, высказанных ими, чаще других звучало именно это: «Как жаль, что мне не хватало смелости жить так, как хотелось мне». Джон, сожалевший, что слишком много работал, тоже был не один: об этом говорили очень многие умирающие. В свои последние недели, сидя на балконе с видом на гавань, Джон мучился от чувства вины. Нет ничего плохого в том, чтобы любить свою работу, – это можно и нужно. Но в жизни дорог баланс, вот почему в ней должно быть еще что-то важное. Я до сих пор вспоминаю, как Джон тяжело вздыхает, думая о принятых им решениях. Слушая, как Чарли говорит о радостях простого образа жизни, я невольно соглашалась с его мудростью и опытом. По-настоящему важно только то, какой вы человек, а вовсене то, чем вы владеете. Умирающие это знают. Их имущество под конец жизни теряет всякий смысл. Что о них думают другие, чего они добились в материальном смысле – эти мысли им даже не приходят в голову. В итоге людям важно лишь то,подарили ли они счастье своим близким и проводили ли время с ними за любимыми занятиями.Многие также беспокоятся о своих родных и особенно о том, чтобы, когда пробьет час, они не испытали тех же сожалений. Будучи свидетелем многих исповедей умирающих, я никогда не слышала сожаления о том, что человек не купил каких-то вещей или не приобрел какую-то собственность – ни единого раза. Мысли умирающих заняты тем, как они прожили свою жизнь, чего добились и удалось ли им принести пользу другим, будь то родные, общество или кто-то еще. Вещи, которые кажутся вам необходимыми, иногда как раз удерживают в ловушке несчастья. Простота поможет изменить такую ситуацию – простота и отказ от желания самоутверждаться за счет вещей или оправданных ожиданий других людей. Риск требует отваги. Однако мы не можем контролировать все. Даже если будем оставаться в обстановке, безопасной на первый взгляд, она не гарантирует еще, что суровые жизненные уроки обойдут нас стороной. Они падают как гром среди ясного неба, когда их меньше всего ждешь. Но точно так же приходят и неожиданные подарки – к тем, у кого хватает смелости следовать своему сердцу. Часики уже тикают, отсчитывая срок каждого из нас. Только вы решаете, как вам провести оставшиеся дни. Как хорошо понимала Перл, течение жизни само приносит нам необходимое. Она верила: главное – найти свое предназначение, выполнять свою работу, какой бы она ни была,с положительными намерениями и никогда не браться за нелюбимое дело из страха остаться без денег. Нужно учиться не бояться жизни и не пытаться контролировать то, когда и каким образом вы получите желаемое. Годы летят слишком быстро, говорила Перл. Это действительно так. Кто-то из нас проживет долго, а кто-то нет. Но если в отпущенное вам короткое время вы успеете познать счастье и самореализацию, то в неизбежном конце ни в чем не придется раскаяться. К несчастью, многие взрослые лишены способности выражать свои чувства. Умирающие часто сожалеют о том, что так и не научились этому – например, Йозеф. Он хотел рассказать родным о своих чувствах, но не знал, как их выразить. Это изводило больше всего и стало его главным сожалением в жизни; в итоге он умер, понимая, что близкие так и не узнали его по-настоящему. У иных моих пациентов, которые тоже таили свои чувства, развились заболевания, вызванные невысказанной горечью, мучившей их. Чем больше вы практикуетесь в любом деле, тем лучше у вас получается. Так что наберитесь смелости и начните с небольших шагов. Постепенно вам станет легче выражать свои чувства; вы даже начнете получать удовольствие от честности. Вы никогда не сможете контролировать реакцию других людей на свои слова. Но помните: какой бы ни была первая реакция собеседника, в конечном итоге честность выведет ваши отношения на новый, куда более здоровый уровень. Если нет, то вы окончательно избавитесь от нездоровых отношений и выиграете в любом случае. Никому не дано знать, сколько времени отведено ему или его близким. Если не хотите до самой смерти мучиться горькими сожалениями, прямо сегодня расскажите всем, кого любите и цените, о своих чувствах. Как говорила милая Джуд, вина отравляет оставшиеся нам годы. Когда привыкнете высвобождать свои чувства, вам это понравится. На самом деле, ничто не мешает вам, кроме страха перед реакцией других людей. Так что пока не поздно, отбросьте его и осмельтесь открыть всю полноту и уязвимость вашего прекрасного сердца. Если вы уже страдаете от чувства вины, потому что не успели сказать о своей любви и уважении кому-то, кто умер, пришло время простить себя. Цепляясь за чувство вины, вы не уважаете собственную жизнь. Пришло время проявить к себе нежность и доброту. Да, вы совершили ошибку, но теперь изменились. Сострадание к человеку, которым вы были раньше, – вот первое зерно доброты и первый шаг к прощению. Если окружающие не реагируют очевидным образом на вашу откровенность, это не значит, что они вас не слышат или что вы зря высказались. Вспомните Нэнси, страдавшую от болезни Альцгеймера. В моей жизни было немало отношений, преобразившихся благодаря настойчивой политике доброты и честности. Мне долго казалось, что меня не слышат. Но по прошествии времени, когда люди созревали для разговора, становилось очевидно: они впитывали каждое мое слово. Впрочем, в итоге это было не главное. Я нашла всебе смелость честно делиться с другими своими эмоциями, и сознание этого наполняло меня умиротворением. Если бы кто-то из нас внезапно умер, мне не пришлось бы страдать от чувства вины. В моей жизни не осталось никого, кому я не сказала бы о своей любви, даже если они не могли ответить мне тем же. Откройте людям свои чувства. Жизнь коротка. Разыскав подругу Дорис, я исполнилась огромной радости и удовлетворения. Когда она рассказала мне о том, как жалеет, что растеряла друзей, я еще не знала, как часто мне придется слышать те же сетования от других пациентов. Сегодня, пережив все, что выпало мне на долю, я знаю, что ни за что бы не справилась с этим без своих старых и верных друзей. Сожаления Дорис мне теперь понятны еще глубже. Друзья есть почти у всех, но, когда доходит до дела, не все готовы поддержать нас в самые тяжелые времена – например, когда мы умираем. Друзья понимают нас и многое знают. Думая о прожитой жизни, мои пациенты скучали по друзьям, с которыми могли бы вместе вспомнить прошлое. Судьба бросает нас в водоворот событий, и друзья отходят на второй план. Люди появляются и исчезают. Но те, кто по-настоящему важен, те, кого вы больше всего любите, стóят того, чтобы уделить время и силы сохранению отношений. Именно они будут рядом в самый нужный момент, точно так же, как вы будете рядом с ними. Даже телефонный разговор с другом способен придать человеку силы в трудный момент, когда физически быть рядом невозможно. Элизабет смогла обрести покой перед смертью, потому что друзья простили и приняли ее после многих лет алкоголизма. В такие моменты важны только любовь и отношения – больше ничего. Но не всем удается найти перед смертью утраченных друзей, поэтому лучше не терять их вовсе. Никто не знает, что ждет впереди и когда вам вдруг понадобится чья-то рука, – так что пока это время не пришло, наслаждайтесь общением с друзьями в нынешней жизни. Глядя, как желающие поддержать Гарри записываются в очередь, чтобы повидаться с ним, я окончательно убедилась в том, как важны друзья под конец дней. Мрачны и печальны они для близких, но умирающий человек тянется получить как можно больше приятного в отведенное ему время. Друзья скрашивают его печаль, и это делает человека счастливым. Неважно, умираете вы или нет, – именно друзья вызовут у вас улыбку даже в худшие моменты. Искренне признавшись, что не позволяла себе быть счастливой, Розмари смогла куда радостней прожить остававшееся ей время. Она не верила, что заслуживает счастья, потому что думала: я не оправдала надежд семьи. Сделав сознательный выбор, она научилась впускать счастье в свою жизнь. В последние недели жизни ее улыбка сделалась просто сияющей. Чтобы быть счастливыми, нужно ценить каждый шаг на своем пути. Размышляя об оставшемся ей времени, Кэт жалела, что упустила много прекрасных моментов, потому что слишком сосредоточилась на результатах, забывая радоваться процессу. Мы постоянно ждем подходящих условий для счастья, но все обстоит ровно наоборот на самом деле: нужные условия возникают, когда счастье мы уже обрели. Хотя не всем и не всегда удается каждый день наполнять счастьем, мы все можем настроить ум на его волну. Даже когда грустно, попробуйте замечать и дорожить чем-то прекрасным – такое упражнение не раз помогало мне восстановить утраченное спокойствие. Ум причиняет глубокие страдания, но обуздав его и научившись использовать, можно с его помощью создать для себя замечательную жизнь. У каждого из нас есть причины жалеть себя. Каждому довелось страдать. Но жизнь ничего не должна нам. Единственный наш должник – это мы сами: по максимуму используйте дарованную жизнь, оставшееся время и не забывайте благодарить судьбу. Примите факт, что судьба всегда будет преподносить вам уроки, и что одни из них будут болезненными, а другие радостными – это позволит вам достичь внутреннего баланса. Такое восприятие мира сделает счастье сознательным выбором, и бушующие волны житейского океана перестанут казаться такими бурными. С опытом и мудростью приходит умение нестись на гребне даже тех волн, которые когда-то могли бы вас уничтожить. Кроме того, нет ничего плохого в том, чтобы дурачиться и шалить. Расслабьтесь. Ни алкоголь, ни наркотики не нужны для веселья. Нет такого закона, который обязует взрослых всегда быть серьезными и никогда не дурачиться. Если вы слишком строго относитесь к жизни или слишком беспокоитесь, что о вас подумают другие, и это мешает вашему счастью, то в конце дней вам придется о многом пожалеть. Разумеется, ваше счастье напрямую зависит от взгляда на саму жизнь, что и подтвердил мне Ленни. Несмотря на все выпавшие ему страдания, он сосредоточился на позитивном и считал, что прожил хорошую жизнь. Ваша жизнь способна полностью преобразиться точно так же, как привычный вид из окна, но если вы сосредоточитесь на ее положительных, а не плохих сторонах. Только вы решаете, как воспринимать свою жизнь. Лучший способ изменить взгляд – это благодарность, умение заметить и по достоинству оценить хорошее. Несмотря на то что умирающие пациенты делились со мной многочисленными сожалениями, в конце концов каждый из них обрел покой и умиротворение перед смертью. Кому-то не удавалось простить себя до самых последних дней, но перед тем как уйти, они все же справились с этой задачей. Многие перед смертью пережили целую гамму эмоций: отрицание, страх, гнев, сожаление и самое тяжелое – ненависть к себе. Но многие в свои последние недели, вспоминая прошлое, испытывали любовь и радость. Перед самым концом все мои пациенты сумели смириться с неизбежным и принять тот факт, что их время пришло. Они простили себя за все, что не успели сделать, и за все совершенные ошибки. Но многим из них было насущно необходимо, чтобы другие люди сделали выводы из их ошибок. Все они посвятили достаточно времени тому, чтобы поразмыслить над своим путем. Люди, которые уходят внезапно, такой роскоши не имеют – а ведь многие из нас попадут в их число. Очень важно прямо сейчас задуматься над тем, как вы живете, потому что перед смертью может и не хватить времени на то, чтобы все обдумать и обрести покой. Уйти, зная, что искал счастье не там, где надо: оно постоянно ускользало из рук, манило близостью, но не давалось, ведь для него всегда чего-то не хватало? Уйти, зная, чтоне изменил направление поисков в нужный момент? Умиротворение, которое мои любимые пациенты обрели перед смертью, доступно каждому из нас прямо сейчас, и нет никакой необходимости дожидаться последних дней. У вас есть возможность изменить свою жизнь, быть отважными и жить так, как подсказывает сердце, так, чтобы умереть без сожалений. Доброта и прощение – вот прекрасная отправная точка. Будьте добры не только к другим, но и к себе. Для этого вам понадобится простить себя, иначе вы лишь будете питать зерна сорняков в своей душе, как когда-то делала я, слишком жестко себя оценивая. Простив себя, относясь к себе с добротой, вы ослабите эти зерна. Их место займут полезные ростки, которые постепенно окрепнут, вытеснив сорняки. Смелость, необходимую вам для того, чтобы изменить жизнь, куда проще найти, если вы добры к себе. Перемены к лучшему потребуют времени, так что запаситесь терпением.Каждый из нас – потрясающая личность, чей потенциал не ограничен ничем, кроме собственных мыслей. Мы все удивительны и прекрасны. Задумайтесь о факторах, повлиявших на вас: и о генетике, и об окружении. Вы уникальны, ни на кого не похожи. Весь жизненный опыт, как хороший, так и болезненный, также отличает вас от остальных людей на этой планете. Вы уже уникальны. Вы уже необыкновенны. Пришло время осознать собственную ценность, равно как и ценность других людей. Отложите свои мнения в сторону, никого не осуждайте. Будьте добры к себе и окружающим. Никто из нас не был на месте другого человека, не жил его жизнью, не видел мир его глазами, так что мы не можем судить о том, кто сколько страдал. Проявите к людям немного сочувствия, и оно обязательно окупится. Когда вы милосердны к другим и никого не осуждаете, вы проявляете милосердие и к себе, потому что сеете в своем сердце зерна добра. Простите себя за то, что винили других в ваших несчастьях. Научитесь относиться к себе нежно, принимая свою хрупкость и человечность. Простите и тех, кто винил вас в своих несчастьях. Мы все люди. Многим случалось говорить и делать вещи, которые можно было сделать куда добрее. Жизнь очень коротка. И мы можем прожить ее до конца без сожалений. Но нужна смелость, чтобы прожить ее правильно, чтобы чтить тот путь, который вам предназначено пройти. Выбор за вами, и только вы будете пожинать его плоды. Цените то время, которое осталось, отдавайте должноевсемухорошему, что выпало вам в жизни, особенно себе самим – удивительным и прекрасным созданиям. Улыбайся и знай Глядя на свою жизнь сегодня, я все еще иногда поражаюсь. Та жизнь, о которой я мечтала, с каждым днем становится все ближе к реальности. Я стала той самой женщиной, которую себе воображала, и все это благодаря смелости, стойкости, дисциплине и желанию научиться любить свое собственное сердце. Жизнь действительноможетбыть простой и радостной. Она может течь легко и непринужденно. Более того, чем дольше я расту, принимая как должное все, что со мной происходит, тем проще и гармоничней становится моя жизнь. В самый темный период меня очень поддерживала одна коротенькая фраза: «Улыбайся и знай». Однажды у меня был особенно сложный день. Прежние шаблоны мышления пытались взять надо мной верх, убеждая, что я не заслуживаю того, о чем мечтаю. С ними сражался мой новый образ мыслей, успокаивая меня и говоря, что это не так. Я помолилась о том, чтобы получить простое и ясное наставление, которое легко было бы запомнить и использовать в трудный момент. Мне нужна была поддержка, чтобы не терять сил и надежды, и ко мне пришли два слова: «Улыбайся и знай». Я записала эти слова на листки бумаги и развесила их по всему дому. Каждый раз, проходя мимо одного из листков, я вспоминала о данном себе обещании, улыбалась и знала, что этот сложный период закончится. Когда человек улыбается, ему куда легче верить и быть сильным, так что каждый раз мое настроение автоматически улучшалось. Читать эти слова и не улыбаться было бессмысленно, потому что именно улыбка помогала мне знать: все будет хорошо. Поэтому я каждый раз улыбалась. Позже я добавила к этим словам еще два: «Благодари и знай». Это было напоминание благодарить жизнь за все хорошее заранее, с уверенностью, что оно придет ко мне. «Улыбайся и знай, благодари и знай» – эти слова стали моей мантрой, и каждый день я старалась улыбаться и знать. При этом я полностью доверялась своей вере, и меня сама собой переполняла благодарность. Мои молитвы, мечты и намерения уже были услышаны. Мне оставал
